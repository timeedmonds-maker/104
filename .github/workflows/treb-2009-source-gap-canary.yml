name: TREB 2009 source gap canary

on:
  push:
    branches: [treb-final-production-20260812]
    paths:
      - .github/workflows/treb-2009-source-gap-canary.yml
      - team_trb_all_players/fill_missing_2009_pbp_game.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - run: python -m pip install -r team_trb_all_players/requirements.txt
      - name: Download 2009 source trio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb2009gap
          python - <<'PY'
          from pathlib import Path
          import subprocess,tarfile,urllib.request
          raw=Path('/tmp/treb2009gap')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in ('nbastats_2009','pbpstats_2009','nbastatsv3_2009'):
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Fill missing game with audited adapter
        run: |
          python -u team_trb_all_players/fill_missing_2009_pbp_game.py \
            --nba /tmp/treb2009gap/nbastats_2009.csv \
            --pbp /tmp/treb2009gap/pbpstats_2009.csv \
            --v3 /tmp/treb2009gap/nbastatsv3_2009.csv \
            --audit /tmp/treb2009gap/source_gap_audit.json
      - name: Verify game now exists and audit is complete
        shell: bash
        run: |
          python - <<'PY'
          import json,pandas as pd
          audit=json.load(open('/tmp/treb2009gap/source_gap_audit.json'))
          pbp=pd.read_csv('/tmp/treb2009gap/pbpstats_2009.csv',low_memory=False)
          rows=pbp[pd.to_numeric(pbp.GAMEID,errors='coerce').eq(20900212)]
          assert len(rows)==audit['synthetic_pbp_rows']>0,(len(rows),audit)
          assert audit['v3_rebound_rows']==audit['legacy_rebound_rows']==audit['legacy_event_matches']==len(rows)
          assert audit['live_rebounds']+audit['dead_rebounds']==len(rows)
          print('TREB_2009_SOURCE_GAP_CANARY=PASS',len(rows),'rows')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-2009-source-gap-canary-${{ github.sha }}
          path: /tmp/treb2009gap/source_gap_audit.json
          retention-days: 90
          if-no-files-found: error
