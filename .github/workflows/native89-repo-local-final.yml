name: Native89 repo-local final packaging
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-repo-local-final.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - name: Diagnose Steven Adams OREB gap exactly
        run: |
          python - <<'PY'
          import pathlib,gzip,json,collections
          ROOT=pathlib.Path('team_trb_all_players/impact_database')
          rows=[]
          with gzip.open(ROOT/'corrected_off/tenure_segment_on_off.jsonl.gz','rt',encoding='utf-8') as f:
            for line in f:
              if line.strip(): rows.append(json.loads(line))
          # Resolve Adams by name from canonical rows, then print all 2021-22+ tenure keys and OReb% rows.
          adams=[r for r in rows if (r.get('player') or r.get('player_name'))=='Steven Adams' and r['season']>='2021-22']
          pids=sorted({str(r['player_id']) for r in adams}); print('ADAMS_PIDS',pids)
          byten={}
          for r in adams:
            k=(str(r['season']),str(r['team_id']),str(r['player_id']),str(r.get('query_start_date')),str(r.get('query_end_date')))
            byten.setdefault(k,[]).append(r)
          pts=collections.Counter((k[0],k[1],k[2]) for k in byten)
          print('ADAMS_TENURES',len(byten))
          # Build core maps exactly as production build.
          rebound={}; raw={}; derived={}
          for p in sorted((ROOT/'core_checkpoints').glob('*/*.json.gz')):
            with gzip.open(p,'rt',encoding='utf-8') as f:o=json.load(f)
            season=str(o.get('season') or p.parent.name); team=str(o.get('team_id') or p.stem.split('.')[0])
            name_to_pid={}
            for x in (o.get('player_totals') or []):
              if isinstance(x,dict):
                pid=x.get('EntityId') or x.get('RowId') or x.get('player_id') or x.get('PlayerId')
                if pid is not None:
                  pid=str(pid); name=x.get('Name') or x.get('ShortName');
                  if name:name_to_pid[name]=pid
                  raw[(season,team,pid)]=x
            rr=o.get('rebound_stat_results') or {}
            if isinstance(rr,dict):
              for metric,v in rr.items():
                if isinstance(v,list):
                  for x in v:
                    if isinstance(x,dict) and x.get('Name') in name_to_pid:
                      rebound[(season,team,name_to_pid[x['Name']],metric)]=x
            for x in (o.get('rebound_derived') or []):
              if isinstance(x,dict) and x.get('player_id') is not None:
                derived[(season,team,str(x['player_id']))]=x
          for k,rs in sorted(byten.items()):
            season,team,pid,qs,qe=k
            oreb=next((r for r in rs if r.get('metric')=='OReb%'),None)
            print('\nTENURE',k,'COUNT_SAME_TEAM_SEASON',pts[(season,team,pid)])
            print('MIN_ON',rs[0].get('minutes_on'),'MIN_OFF',rs[0].get('minutes_off'))
            print('NATIVE_OREB',oreb)
            print('RAW_PLAYER_TOTALS', {q:raw.get((season,team,pid),{}).get(q) for q in ['Name','Minutes','SecondsPlayed','OffRebounds','DefRebounds','OffPoss','DefPoss','Points','OpponentPoints']})
            print('REBOUND_OFFREB',rebound.get((season,team,pid,'OffRebounds')))
            print('REBOUND_OFFPCT',rebound.get((season,team,pid,'OffReboundPct')))
            print('DERIVED',derived.get((season,team,pid)))
          PY
