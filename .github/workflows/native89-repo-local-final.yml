name: Native89 repo-local final packaging
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-repo-local-final.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - name: Inspect actual player nesting in one core checkpoint
        run: |
          python - <<'PY'
          import gzip,json,pathlib
          p=pathlib.Path('team_trb_all_players/impact_database/core_checkpoints/2000-01/1610612737.json.gz')
          with gzip.open(p,'rt',encoding='utf-8') as f:o=json.load(f)
          def brief(name,x):
            print('\n===',name,'TYPE',type(x).__name__,'===')
            if isinstance(x,dict):
              print('DICT_KEYS',list(x.keys())[:20])
              for k,v in list(x.items())[:3]:
                print('KEY',repr(k),'VAL_TYPE',type(v).__name__)
                if isinstance(v,dict): print(' VAL_KEYS',list(v.keys())[:30]); print(' VAL_SAMPLE',json.dumps(v,default=str)[:3000])
                elif isinstance(v,list):
                  print(' LIST_LEN',len(v))
                  for i,y in enumerate(v[:2]):
                    print('  ITEM',i,'TYPE',type(y).__name__)
                    if isinstance(y,dict): print('  ITEM_KEYS',list(y.keys())[:40]); print('  ITEM_SAMPLE',json.dumps(y,default=str)[:3000])
            elif isinstance(x,list):
              print('LIST_LEN',len(x))
              for i,y in enumerate(x[:3]):
                print('ITEM',i,'TYPE',type(y).__name__)
                if isinstance(y,dict): print(' ITEM_KEYS',list(y.keys())[:40]); print(' ITEM_SAMPLE',json.dumps(y,default=str)[:3000])
          for name in ('player_totals','team_on_off_results','rebound_stat_results','rebound_derived','team_profiles'):
            brief(name,o.get(name))
          PY
