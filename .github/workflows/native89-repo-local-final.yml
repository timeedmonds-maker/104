name: Native89 repo-local final packaging
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-repo-local-final.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - name: Inspect Lance core sufficient stats and corrected exposure count
        run: |
          python - <<'PY'
          import gzip,json,pathlib,collections,math
          R=pathlib.Path('team_trb_all_players/impact_database')
          p=R/'core_checkpoints/2021-22/1610612754.json.gz'
          with gzip.open(p,'rt',encoding='utf-8') as f:o=json.load(f)
          def n(x):
            try:
              v=float(x);return v if math.isfinite(v) else None
            except:return None
          def pid(x):
            s=str(x or '');return s[:-2] if s.endswith('.0') else s
          lance_pt=[]
          for x in o.get('player_totals') or []:
            if pid(x.get('EntityId') or x.get('RowId') or x.get('player_id') or x.get('PlayerId'))=='202362' or str(x.get('Name') or '')=='Lance Stephenson': lance_pt.append(x)
          rr={}
          for k,v in (o.get('rebound_stat_results') or {}).items():
            hits=[x for x in v if isinstance(x,dict) and str(x.get('Name') or '')=='Lance Stephenson'] if isinstance(v,list) else []
            if hits: rr[k]=hits
          rd=o.get('rebound_derived')
          print('CORE_PATH',p)
          print('TOP_LEVEL_KEYS',list(o))
          print('LANCE_PLAYER_TOTALS',json.dumps(lance_pt,separators=(',',':')))
          print('LANCE_REBOUND_STAT_RESULTS',json.dumps(rr,separators=(',',':')))
          print('REBOUND_DERIVED_SCHEMA',json.dumps({'type':type(rd).__name__,'keys':list(rd) if isinstance(rd,dict) else None,'len':len(rd) if isinstance(rd,(list,dict)) else None},separators=(',',':')))
          # Correct qualifying population if each player-team-season statistical profile is counted once.
          rows=[]
          with gzip.open(R/'corrected_off/tenure_segment_on_off.jsonl.gz','rt',encoding='utf-8') as f:
            for line in f:
              if line.strip():rows.append(json.loads(line))
          seen={}; legacy=collections.Counter(); one=collections.Counter(); names={}
          for r in rows:
            if str(r.get('season')) not in {'2021-22','2022-23','2023-24','2024-25','2025-26'}:continue
            k=(str(r.get('season')),pid(r.get('team_id')),pid(r.get('player_id')),str(r.get('query_start_date')),str(r.get('query_end_date')))
            if k in seen:continue
            seen[k]=1
            m=n(r.get('minutes_on')) or 0.0; legacy[k[2]]+=m; names[k[2]]=r.get('player')
          # one statistical profile per season/team/player: every duplicate group has identical minutes/vector by run 31922357452
          gseen={}
          for r in rows:
            if str(r.get('season')) not in {'2021-22','2022-23','2023-24','2024-25','2025-26'}:continue
            g=(str(r.get('season')),pid(r.get('team_id')),pid(r.get('player_id')))
            if g in gseen:continue
            gseen[g]=1; one[g[2]]+=n(r.get('minutes_on')) or 0.0
          lq={x for x,m in legacy.items() if m>=2000}; oq={x for x,m in one.items() if m>=2000}
          print('LEGACY_QUALIFIERS',len(lq),'ONE_PROFILE_QUALIFIERS',len(oq))
          print('LEGACY_ONLY',json.dumps(sorted([{'player_id':x,'player':names.get(x),'legacy_minutes':legacy[x],'corrected_minutes':one[x]} for x in lq-oq],key=lambda z:-z['legacy_minutes']),separators=(',',':')))
          print('CORRECTED_ONLY',json.dumps(sorted([{'player_id':x,'player':names.get(x),'legacy_minutes':legacy[x],'corrected_minutes':one[x]} for x in oq-lq],key=lambda z:-z['corrected_minutes']),separators=(',',':')))
          pathlib.Path('native89_lance_core_check.json').write_text(json.dumps({'core_path':str(p),'lance_player_totals':lance_pt,'lance_rebound_stat_results':rr,'legacy_qualifiers':len(lq),'corrected_qualifiers':len(oq),'legacy_only':sorted(lq-oq),'corrected_only':sorted(oq-lq)},indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native89-lance-core-check-${{ github.run_id }}
          path: native89_lance_core_check.json
          if-no-files-found: error
