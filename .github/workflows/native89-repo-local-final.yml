name: Native89 repo-local final packaging
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-repo-local-final.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - name: Trace Lance cache retained source links
        run: |
          python - <<'PY'
          import gzip,json,pathlib,re
          p=pathlib.Path('team_trb_all_players/impact_database/corrected_off/cache/2021-22__1610612754__202362__2022-01-02__2022-01-10.json.gz')
          with gzip.open(p,'rt',encoding='utf-8') as f:o=json.load(f)
          def shape(x):
            if isinstance(x,dict): return {'type':'object','keys':list(x)}
            if isinstance(x,list): return {'type':'array','length':len(x),'first_item':shape(x[0]) if x else None}
            return {'type':type(x).__name__}
          metrics=o.get('metrics')
          wanted=('OReb%','OffRebounds','Pts per 100 Possessions','Pts per 100 Possessions - Defense','Seconds Per Possession - Offense','Seconds Per Possession - Defense')
          selected={}
          if isinstance(metrics,dict):
            for k,v in metrics.items():
              if any(w.lower() in str(k).lower() for w in wanted): selected[k]=v
          elif isinstance(metrics,list):
            for i,v in enumerate(metrics):
              s=json.dumps(v,separators=(',',':'))
              if any(w.lower() in s.lower() for w in wanted): selected[str(i)]=v
          linkrx=re.compile(r'source|path|file|cache|request|url|endpoint|response',re.I)
          links=[]
          def walk(x,path='',depth=0):
            if depth>8:return
            if isinstance(x,dict):
              for k,v in x.items():
                q=f'{path}.{k}' if path else str(k)
                if linkrx.search(str(k)):
                  if isinstance(v,(str,int,float,bool)) or v is None: links.append({'path':q,'value':v})
                  else: links.append({'path':q,'shape':shape(v)})
                if isinstance(v,(dict,list)):walk(v,q,depth+1)
            elif isinstance(x,list):
              for i,v in enumerate(x[:100]):
                if isinstance(v,(dict,list)):walk(v,f'{path}[{i}]',depth+1)
          walk(o)
          r={'file_path':str(p),'metrics_schema':shape(metrics),'selected_metrics':selected,'minute_source_row':o.get('minute_source_row'),'requests_schema':shape(o.get('requests')),'source_links':links}
          print(json.dumps(r,indent=2))
          pathlib.Path('lance_cache_source_trace.json').write_text(json.dumps(r,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native89-lance-cache-source-trace-${{ github.run_id }}
          path: lance_cache_source_trace.json
          if-no-files-found: error
