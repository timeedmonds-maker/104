name: Native89 repo-local final packaging
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-repo-local-final.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - name: Inspect core checkpoint sufficient-stat schema
        run: |
          python - <<'PY'
          import pathlib,gzip,json,collections
          root=pathlib.Path('team_trb_all_players/impact_database/core_checkpoints')
          files=sorted(root.glob('*/*.json.gz'))
          assert len(files)==780,len(files)
          leaf=collections.Counter(); keysets=collections.Counter(); top=collections.Counter(); samples=[]
          def walk(x):
            if isinstance(x,dict):
              keysets[tuple(sorted(map(str,x.keys())))]+=1
              for k,v in x.items(): leaf[str(k)]+=1; walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          for p in files[:30]:
            with gzip.open(p,'rt',encoding='utf-8') as f: obj=json.load(f)
            if isinstance(obj,dict):
              for k in obj: top[str(k)]+=1
            walk(obj)
            if len(samples)<3: samples.append({'file':str(p),'object':obj})
          wanted=sorted(k for k in leaf if any(t in k.lower() for t in ['rebound','oreb','poss','point','minute','second','fieldgoal','free','missed']))
          report={'status':'PASS','core_files':len(files),'candidate_fields':wanted,'top_level_keys':top.most_common(),'top_keysets':[{'keys':list(k),'count':v} for k,v in keysets.most_common(30)],'samples':samples}
          pathlib.Path('NATIVE89_CORE_SCHEMA_REPORT.json').write_text(json.dumps(report,indent=2,default=str)+'\n')
          print('CORE_FILES',len(files))
          print('CANDIDATE_FIELDS',wanted)
          print('TOP_KEYSETS',json.dumps(report['top_keysets'][:12],indent=2))
          for s in samples:
            print('SAMPLE_FILE',s['file'])
            if isinstance(s['object'],dict): print('SAMPLE_TOP_KEYS',sorted(s['object'].keys()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native89-core-schema-${{ github.run_id }}
          path: NATIVE89_CORE_SCHEMA_REPORT.json
          retention-days: 30
          if-no-files-found: error
