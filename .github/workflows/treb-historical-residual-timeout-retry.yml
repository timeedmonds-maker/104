name: TREB historical residual timeout retry

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-historical-residual-timeout-retry.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: treb-historical-residual-timeout-retry
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  RESIDUAL_RUN: "31866566295"
  TARGETS: team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz

jobs:
  retry:
    name: retry timed-out historical ${{ matrix.year }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix:
        year: [2000, 2001, 2003, 2004, 2005, 2009, 2010, 2012, 2015, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact-engine dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz
      - name: Acquire authoritative residual manifest
        uses: actions/download-artifact@v4
        with:
          name: TREB-residual-1751-manifest-31866566295
          path: /tmp/residual
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31866566295'
      - name: Materialize only this failed year's V2 residual targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out /tmp/src
          YEAR='${{ matrix.year }}' python - <<'PY'
          import csv,gzip,json,os,pathlib
          y=int(os.environ['YEAR']); season=f'{y}-{(y+1)%100:02d}'
          m=next(pathlib.Path('/tmp/residual').rglob('TREB_RESIDUAL_1751_MANIFEST.csv.gz'))
          with gzip.open(m,'rt',encoding='utf-8',newline='') as f:
              rr=[r for r in csv.DictReader(f) if str(r.get('season','')).replace('_','-')==season]
          ks={(season,int(float(r['team_id'])),str(r['player_id']).removesuffix('.0')) for r in rr}
          assert ks,season
          selected=[]; allrows=[]
          with gzip.open('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz','rt',encoding='utf-8') as f:
              for line in f:
                  if not line.strip(): continue
                  r=json.loads(line); allrows.append(r)
                  k=(str(r['season']),int(r['team_id']),str(r['player_id']).removesuffix('.0'))
                  if k in ks:
                      assert bool(r.get('full_core_reuse')),k
                      selected.append(r)
          # Authoritative V2 invariants must remain exact.
          assert len(allrows)==14524,len(allrows)
          full=sum(bool(r.get('full_core_reuse')) for r in allrows)
          partial=len(allrows)-full
          assert full==9647 and partial==4877,(full,partial)
          got={(str(r['season']),int(r['team_id']),str(r['player_id']).removesuffix('.0')) for r in selected}
          assert got==ks and len(selected)==len(ks),(season,len(selected),len(ks),len(ks-got))
          with gzip.open('/tmp/targets.jsonl.gz','wt',encoding='utf-8') as f:
              for r in selected: f.write(json.dumps(r,separators=(',',':'))+'\n')
          q={'status':'PASS','season':season,'target_keys':len(selected),'v2_rows':14524,'full_core':9647,'partial':4877,'exact_segments_contract':5199}
          pathlib.Path('/tmp/out/TARGET_GATE.json').write_text(json.dumps(q,indent=2)+'\n')
          print(json.dumps(q))
          PY
      - name: Resolve exact retained source trio
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          y='${{ matrix.year }}'
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 --output /tmp/list_data.txt https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          python - "$y" <<'PY' > /tmp/urls.tsv
          import sys
          y=sys.argv[1]; vals={}
          for line in open('/tmp/list_data.txt',encoding='utf-8'):
              if '=' in line:
                  k,v=line.split('=',1); vals[k.strip()]=v.strip()
          for prefix in ('nbastats','nbastatsv3','pbpstats'):
              k=f'{prefix}_{y}'
              if k not in vals: raise SystemExit('MISSING_SOURCE_KEY '+k)
              print(prefix,vals[k],sep='\t')
          PY
      - name: Download exact retained source trio
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r prefix url; do
            arc="/tmp/src/${prefix}_${{ matrix.year }}.tar.xz"
            curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 420 --output "$arc" "$url"
            tar -xJf "$arc" -C /tmp/src
          done < /tmp/urls.tsv
          for p in nbastats nbastatsv3 pbpstats; do test -s "/tmp/src/${p}_${{ matrix.year }}.csv"; done
      - name: Exact residual reconstruction only
        timeout-minutes: 70
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/rebuild_fullcore_treb_fanout.py \
            --year '${{ matrix.year }}' --targets /tmp/targets.jsonl.gz \
            --nba '/tmp/src/nbastats_${{ matrix.year }}.csv' \
            --v3 '/tmp/src/nbastatsv3_${{ matrix.year }}.csv' \
            --pbp '/tmp/src/pbpstats_${{ matrix.year }}.csv' \
            --output-dir /tmp/out \
            2>&1 | tee /tmp/out/ENGINE.log
      - name: Fail-closed season gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}' python - <<'PY'
          import json,os,pathlib,pandas as pd
          y=os.environ['YEAR']; p=pathlib.Path(f'/tmp/out/fresh_fullcore_{y}.csv')
          if not p.exists():
              q={'status':'FAIL_NO_RESULT','year':int(y)}
          else:
              d=pd.read_csv(p,low_memory=False)
              c={str(k):int(v) for k,v in d.status.astype(str).value_counts().to_dict().items()}
              q={'status':'PASS' if c.get('PASS',0)==len(d) else 'INCOMPLETE','year':int(y),'rows':len(d),'status_counts':c}
              if {'season','team_id','player_id'}.issubset(d.columns):
                  q['duplicate_keys']=int(d.duplicated(['season','team_id','player_id']).sum())
                  assert q['duplicate_keys']==0,q
          pathlib.Path('/tmp/out/SEASON_GATE.json').write_text(json.dumps(q,indent=2)+'\n')
          print(json.dumps(q,indent=2))
          if q['status']!='PASS': raise SystemExit(1)
          PY
      - name: Upload durable failed-year retry checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TREB-historical-residual-retry-${{ matrix.year }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
