name: TREB residual game-scope mapping v2

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-residual-game-scope-v2.yml]

permissions:
  contents: write

concurrency:
  group: treb-residual-game-scope-mapping-v2
  cancel-in-progress: false

jobs:
  map-game-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical assembly branch
        uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
          filter: blob:none

      - name: Fetch retained exact team-game source refs only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin \
            '+refs/heads/treb-game-facts-*:refs/remotes/origin/treb-game-facts-*' \
            '+refs/heads/treb-game-fact-repair-wave1:refs/remotes/origin/treb-game-fact-repair-wave1' \
            '+refs/heads/treb-fast-final-repair-wave:refs/remotes/origin/treb-fast-final-repair-wave'

      - name: Map 4,602 residual keys to deduplicated missing games
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/treb_residual_game_scope_v2
          mkdir -p /tmp/treb_residual_game_scope_v2
          python - <<'PY'
          import csv, gzip, io, json, re, subprocess
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT=Path('.')
          OUT=Path('/tmp/treb_residual_game_scope_v2')
          TARGET=ROOT/'team_trb_all_players/impact_database/roster_tenure_v3_hybrid/player_team_season_targets.jsonl.gz'
          SCHEDULE=ROOT/'team_trb_all_players/impact_database/roster_tenure/regular_season_games.jsonl.gz'
          RESIDUAL=ROOT/'team_trb_all_players/final_integrity_rebuild/final_exact_release/safe_lock_overlay/CANONICAL_UNRESOLVED_AFTER_SAFE_LOCK.csv'
          OVERLAY=ROOT/'team_trb_all_players/final_integrity_rebuild/final_exact_release/source_overlay_mapping/CANONICAL_EXACT_SOURCE_OVERLAY_MAPPING.csv'
          UNION=ROOT/'team_trb_all_players/final_integrity_rebuild/final_exact_release/EXACT_GAME_UNION_COVERAGE.json'
          for p in (TARGET,SCHEDULE,RESIDUAL,OVERLAY,UNION):
              if not p.exists(): raise SystemExit(f'missing required input: {p}')

          def norm(v):
              s=str(v).strip()
              if s.endswith('.0') and s[:-2].isdigit(): s=s[:-2]
              return str(int(s)) if s.isdigit() else s
          def ckey(s,p,t): return f'{norm(s)}|{norm(p)}|{norm(t)}'
          def read_jsonl_gz(p):
              rows=[]
              with gzip.open(p,'rt',encoding='utf-8') as f:
                  for line in f:
                      if line.strip(): rows.append(json.loads(line))
              return rows
          def write_csv(p,rows,fields):
              with open(p,'w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore'); w.writeheader(); w.writerows(rows)
          def write_csv_gz(p,rows,fields):
              with gzip.open(p,'wt',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore'); w.writeheader(); w.writerows(rows)
          def as_int(v):
              try: return int(float(v))
              except Exception: return None
          def git_show(ref,path):
              p=subprocess.run(['git','show',f'{ref}:{path}'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              return p.stdout if p.returncode==0 else None
          def read_team_pairs(ref,path):
              b=git_show(ref,path)
              if b is None: return None
              try:
                  raw=gzip.decompress(b).decode('utf-8-sig')
              except Exception as e:
                  raise SystemExit(f'cannot decode retained exact team fact {ref}:{path}: {e}')
              r=csv.DictReader(io.StringIO(raw))
              if not r.fieldnames or 'game_id' not in r.fieldnames or 'team_id' not in r.fieldnames:
                  raise SystemExit(f'missing game_id/team_id in retained exact team fact {ref}:{path}')
              rows=[]
              for x in r:
                  gid=norm(x.get('game_id','')); tid=norm(x.get('team_id',''))
                  if gid and tid: rows.append((gid,tid))
              return rows

          targets=read_jsonl_gz(TARGET)
          target_by={ckey(r['season'],r['player_id'],r['team_id']):r for r in targets}
          if len(targets)!=14524 or len(target_by)!=14524:
              raise SystemExit(f'canonical universe mismatch rows={len(targets)} unique={len(target_by)}')

          with open(RESIDUAL,newline='',encoding='utf-8-sig') as f: residual=list(csv.DictReader(f))
          residual_keys=[ckey(r['season'],r['player_id'],r['team_id']) for r in residual]
          if len(residual)!=4602 or len(set(residual_keys))!=4602:
              raise SystemExit(f'residual mismatch rows={len(residual)} unique={len(set(residual_keys))}')
          if set(residual_keys)-set(target_by): raise SystemExit('residual keys missing canonical target')
          residual_class={ckey(r['season'],r['player_id'],r['team_id']):r.get('canonical_classification','') for r in residual}

          with open(OVERLAY,newline='',encoding='utf-8-sig') as f: overlay=list(csv.DictReader(f))
          overlay_by={ckey(r['season'],r['player_id'],r['team_id']):r for r in overlay}
          if len(overlay_by)!=14524: raise SystemExit(f'overlay key mismatch: {len(overlay_by)}')

          games=read_jsonl_gz(SCHEDULE)
          team_games=defaultdict(list); game_meta={}; season_games=defaultdict(set)
          for g in games:
              s=norm(g['season']); gid=norm(g['game_id']); d=str(g['game_date']); h=norm(g['home_team_id']); a=norm(g['away_team_id'])
              ng={'season':s,'game_id':gid,'game_date':d,'home_team_id':h,'away_team_id':a}
              game_meta[(s,gid)]=ng; season_games[s].add(gid); team_games[(s,h)].append(ng); team_games[(s,a)].append(ng)
          for k in team_games: team_games[k].sort(key=lambda x:(x['game_date'],x['game_id']))
          seasons=sorted(season_games)
          if len(seasons)!=26 or seasons[0]!='2000-01' or seasons[-1]!='2025-26':
              raise SystemExit(f'schedule universe mismatch count={len(seasons)} first={seasons[:1]} last={seasons[-1:]}')

          # Historical union metadata is authoritative for its own source. Current V3 schedule is
          # authoritative for current scope. Positive exact presence is recovered ONLY from the
          # retained validated team_game_treb rows used by the historical union; it is never inferred
          # by subtracting historical missing_ids from the current schedule.
          union=json.loads(UNION.read_text(encoding='utf-8'))
          union_years=union.get('years') or {}
          expected_union_seasons={f'{y}-{(y+1)%100:02d}' for y in range(2002,2025)}
          absent=sorted(expected_union_seasons-set(union_years))
          if absent: raise SystemExit(f'exact union missing expected seasons: {absent}')

          refs=subprocess.check_output(['git','for-each-ref','--format=%(refname)','refs/remotes/origin']).decode().splitlines()
          batchrefs=defaultdict(list)
          for ref in refs:
              m=re.search(r'/treb-game-facts-(\d{4})-batch-(\d{3})$',ref)
              if m: batchrefs[int(m.group(1))].append(ref)

          validated_present={s:set() for s in seasons}
          hard_guard_failures=[]; pair_integrity_failures=[]; cross_snapshot_rows=[]; source_rows=[]
          total_source_files=0; total_recovered_pairs=0
          for s in sorted(union_years):
              y=int(s[:4]); info=union_years[s]; pairs=set(); season_source_files=0
              for ref in sorted(batchrefs.get(y,[])):
                  bi=int(ref.rsplit('-',1)[1]); base=f'team_trb_all_players/impact_database/exact_game_fact_batches/{s}/batch_{bi:03d}'
                  path=base+'/team_game_treb.csv.gz'; rows=read_team_pairs(ref,path)
                  if rows is not None:
                      season_source_files+=1; total_source_files+=1; pairs.update(rows)
                      source_rows.append({'season':s,'ref':ref,'path':path,'rows_read':len(rows)})
              for ref,base in [
                  ('refs/remotes/origin/treb-game-fact-repair-wave1',f'team_trb_all_players/final_integrity_rebuild/game_fact_repair_wave1/{y}'),
                  ('refs/remotes/origin/treb-fast-final-repair-wave',f'team_trb_all_players/final_integrity_rebuild/fast_final_repair_wave/{y}')]:
                  path=base+'/team_game_treb.csv.gz'; rows=read_team_pairs(ref,path)
                  if rows is not None:
                      season_source_files+=1; total_source_files+=1; pairs.update(rows)
                      source_rows.append({'season':s,'ref':ref,'path':path,'rows_read':len(rows)})

              actual_present={gid for gid,_ in pairs}; total_recovered_pairs+=len(pairs)
              teams_by_game=defaultdict(set)
              for gid,tid in pairs: teams_by_game[gid].add(tid)
              bad_pairs=[{'season':s,'game_id':gid,'team_count':len(tids),'team_ids':sorted(tids)} for gid,tids in teams_by_game.items() if len(tids)!=2]
              pair_integrity_failures.extend(bad_pairs)

              reported_expected=int(info.get('expected',0)); reported_present=int(info.get('present',0)); reported_team_rows=int(info.get('team_rows',0))
              if reported_team_rows!=2*reported_present:
                  hard_guard_failures.append({'season':s,'guard':'reported_team_rows_equals_2x_reported_present','reported_team_rows':reported_team_rows,'reported_present':reported_present})
              if len(pairs)!=reported_team_rows:
                  hard_guard_failures.append({'season':s,'guard':'recovered_team_pairs_equal_reported_team_rows','recovered_team_pairs':len(pairs),'reported_team_rows':reported_team_rows})
              if len(actual_present)!=reported_present:
                  hard_guard_failures.append({'season':s,'guard':'recovered_present_ids_equal_reported_present_count','recovered_present_ids':len(actual_present),'reported_present':reported_present})
              if bad_pairs:
                  hard_guard_failures.append({'season':s,'guard':'each_recovered_present_game_has_two_distinct_team_rows','failures':len(bad_pairs)})
              validated_present[s]=actual_present

              current=set(season_games.get(s,set())); old_missing={norm(x) for x in info.get('missing_ids',[])}
              overlap=actual_present & current
              if reported_present and current and not overlap:
                  hard_guard_failures.append({'season':s,'guard':'positive_present_ids_must_overlap_current_schedule','reported_present':reported_present,'current_schedule_games':len(current),'overlap':0})
              if reported_present==reported_expected==len(current) and actual_present!=current:
                  hard_guard_failures.append({'season':s,'guard':'complete_union_season_must_exactly_match_current_schedule_after_id_normalization','reported_expected':reported_expected,'reported_present':reported_present,'current_schedule_games':len(current),'overlap':len(overlap),'present_not_current':len(actual_present-current),'current_not_present':len(current-actual_present)})
              current_minus_old_missing=current-old_missing
              diag={
                  'season':s,
                  'current_v3_schedule_games':len(current),
                  'union_reported_expected_games':reported_expected,
                  'union_reported_present_games':reported_present,
                  'union_reported_missing_ids':len(old_missing),
                  'positively_recovered_present_ids':len(actual_present),
                  'positively_recovered_present_ids_in_current_v3_schedule':len(overlap),
                  'positively_recovered_present_ids_not_in_current_v3_schedule':len(actual_present-current),
                  'current_v3_schedule_ids_not_in_positive_union_present_set':len(current-actual_present),
                  'historical_missing_ids_in_current_v3_schedule':len(old_missing & current),
                  'historical_missing_ids_not_in_current_v3_schedule':len(old_missing-current),
                  'diagnostic_current_v3_minus_historical_missing_count':len(current_minus_old_missing),
                  'diagnostic_reported_present_minus_current_v3_minus_historical_missing':reported_present-len(current_minus_old_missing),
                  'union_expected_minus_current_v3_schedule':reported_expected-len(current),
                  'retained_team_fact_source_files_read':season_source_files,
              }
              diag['cross_snapshot_difference']=bool(
                  diag['union_expected_minus_current_v3_schedule'] or
                  diag['positively_recovered_present_ids_not_in_current_v3_schedule'] or
                  diag['historical_missing_ids_not_in_current_v3_schedule'] or
                  diag['diagnostic_reported_present_minus_current_v3_minus_historical_missing']
              )
              cross_snapshot_rows.append(diag)

          cross_snapshot_differences=[r for r in cross_snapshot_rows if r['cross_snapshot_difference']]
          diagnostic={
              'status':'FAIL' if hard_guard_failures else 'PASS',
              'policy':{
                  'historical_union_metadata_authoritative_for_its_source':True,
                  'current_v3_schedule_authoritative_for_current_scope':True,
                  'game_id_normalization':'integer_equivalent_string',
                  'positive_presence_source':'retained validated team_game_treb rows only',
                  'current_schedule_minus_historical_missing_used_to_establish_presence':False,
                  'cross_snapshot_identities_are_hard_gates':False,
                  'positive_present_current_schedule_nonzero_overlap_is_hard_gate':True,
                  'complete_union_season_exact_overlap_after_normalization_is_hard_gate':True,
                  'reported_team_rows_equals_2x_reported_present_is_hard_gate':True,
              },
              'source_recovery':{
                  'batch_ref_count_seen':sum(len(v) for v in batchrefs.values()),
                  'retained_team_fact_files_read':total_source_files,
                  'deduplicated_team_game_pairs_recovered':total_recovered_pairs,
                  'reported_union_present_games_total':sum(int(x.get('present',0)) for x in union_years.values()),
                  'reported_union_team_rows_total':sum(int(x.get('team_rows',0)) for x in union_years.values()),
              },
              'hard_guard_failures':hard_guard_failures,
              'two_team_pair_integrity_failures':pair_integrity_failures,
              'cross_snapshot_diagnostic_count':len(cross_snapshot_differences),
              'by_season':cross_snapshot_rows,
              'retained_source_files':source_rows,
          }
          (OUT/'EXACT_UNION_CROSS_SNAPSHOT_DIAGNOSTIC.json').write_text(json.dumps(diagnostic,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          if hard_guard_failures:
              (OUT/'STATUS.txt').write_text('FAIL\n',encoding='utf-8')
              raise SystemExit('exact union positive-ID recovery hard guard failed; see EXACT_UNION_CROSS_SNAPSHOT_DIAGNOSTIC.json')

          key_rows=[]; requirement_rows=[]; required_unique=set(); target_mismatches=[]
          missing_impacts=defaultdict(lambda:{'keys':set(),'teams':set(),'classes':Counter()})
          class_missing=Counter(); class_full=Counter()
          for k in residual_keys:
              t=target_by[k]; s=norm(t['season']); pid=norm(t['player_id']); tid=norm(t['team_id']); cls=residual_class.get(k,'')
              intervals=t.get('intervals') or []
              if not intervals: raise SystemExit(f'canonical target has no intervals: {k}')
              scoped=[]
              for g in team_games.get((s,tid),[]):
                  if any(str(iv['start'])<=g['game_date']<=str(iv['end']) for iv in intervals): scoped.append(g)
              scoped_by={g['game_id']:g for g in scoped}; scoped=list(scoped_by.values())
              required={g['game_id'] for g in scoped}; required_unique.update((s,gid) for gid in required)
              present=required & validated_present.get(s,set()); missing=required-present
              tg=as_int(t.get('team_games_in_tenure'))
              if tg is not None and tg!=len(required): target_mismatches.append({'canonical_key':k,'season':s,'player_id':pid,'team_id':tid,'target_team_games_in_tenure':tg,'interval_derived_team_games':len(required)})
              o=overlay_by[k]; ep=as_int(o.get('expected_player_games')); xp=as_int(o.get('exact_player_games')); deficit=(ep-xp) if ep is not None and xp is not None else None
              if missing: class_missing[cls]+=1
              else: class_full[cls]+=1
              ordered=sorted(missing,key=lambda gid:(game_meta[(s,gid)]['game_date'],gid))
              row={'canonical_key':k,'season':s,'player_id':pid,'player':t.get('player',''),'team_id':tid,'canonical_classification':cls,'interval_count':len(intervals),'intervals_json':json.dumps(intervals,separators=(',',':')),'required_team_games':len(required),'validated_exact_team_games_in_scope':len(present),'missing_exact_team_games':len(missing),'missing_game_ids':'|'.join(ordered),'expected_player_games':ep,'exact_player_games_current_union':xp,'player_game_deficit_current_union':deficit,'fully_team_game_covered':not bool(missing)}
              key_rows.append(row)
              for g in scoped:
                  ok=g['game_id'] in validated_present.get(s,set())
                  requirement_rows.append({'canonical_key':k,'season':s,'player_id':pid,'team_id':tid,'canonical_classification':cls,'game_id':g['game_id'],'game_date':g['game_date'],'home_team_id':g['home_team_id'],'away_team_id':g['away_team_id'],'validated_exact_team_game_present':ok,'needs_exact_game_recovery':not ok})
                  if not ok:
                      imp=missing_impacts[(s,g['game_id'])]; imp['keys'].add(k); imp['teams'].add(tid); imp['classes'][cls]+=1

          unique_missing=[]
          for (s,gid),imp in sorted(missing_impacts.items(),key=lambda x:(x[0][0],game_meta[x[0]]['game_date'],x[0][1])):
              g=game_meta[(s,gid)]
              unique_missing.append({'season':s,'game_id':gid,'game_date':g['game_date'],'home_team_id':g['home_team_id'],'away_team_id':g['away_team_id'],'affected_residual_keys':len(imp['keys']),'affected_team_ids':len(imp['teams']),'affected_full_core_keys':imp['classes'].get('full_core',0),'affected_partial_keys':imp['classes'].get('partial',0),'coverage_reason':('edge_season_no_validated_exact_game_union' if s in {'2000-01','2001-02','2025-26'} else 'missing_from_positively_recovered_exact_game_union')})

          fully=[r for r in key_rows if r['fully_team_game_covered']]; with_missing=[r for r in key_rows if not r['fully_team_game_covered']]
          player_deficit_fully=[r for r in fully if (r['player_game_deficit_current_union'] or 0)>0]
          by_season=[]
          for s in seasons:
              ks=[r for r in key_rows if r['season']==s]; us=[r for r in unique_missing if r['season']==s]; current_present=validated_present.get(s,set()) & season_games[s]
              by_season.append({'season':s,'residual_keys':len(ks),'residual_keys_with_missing_games':sum(not r['fully_team_game_covered'] for r in ks),'unique_missing_games':len(us),'schedule_games':len(season_games[s]),'validated_exact_games_available_in_current_schedule':len(current_present)})

          key_fields=['canonical_key','season','player_id','player','team_id','canonical_classification','interval_count','intervals_json','required_team_games','validated_exact_team_games_in_scope','missing_exact_team_games','missing_game_ids','expected_player_games','exact_player_games_current_union','player_game_deficit_current_union','fully_team_game_covered']
          req_fields=['canonical_key','season','player_id','team_id','canonical_classification','game_id','game_date','home_team_id','away_team_id','validated_exact_team_game_present','needs_exact_game_recovery']
          miss_fields=['season','game_id','game_date','home_team_id','away_team_id','affected_residual_keys','affected_team_ids','affected_full_core_keys','affected_partial_keys','coverage_reason']
          season_fields=['season','residual_keys','residual_keys_with_missing_games','unique_missing_games','schedule_games','validated_exact_games_available_in_current_schedule']
          write_csv(OUT/'RESIDUAL_KEY_GAME_COVERAGE.csv',key_rows,key_fields)
          write_csv_gz(OUT/'RESIDUAL_GAME_REQUIREMENT_MANIFEST.csv.gz',requirement_rows,req_fields)
          write_csv(OUT/'UNIQUE_MISSING_GAMES.csv',unique_missing,miss_fields)
          write_csv(OUT/'MISSING_GAMES_BY_SEASON.csv',by_season,season_fields)
          write_csv(OUT/'RESIDUAL_KEYS_FULLY_TEAM_GAME_COVERED_BUT_NOT_ASSEMBLED.csv',fully,key_fields)
          write_csv(OUT/'RESIDUAL_KEYS_FULLY_TEAM_GAME_COVERED_WITH_PLAYER_FACT_DEFICIT.csv',player_deficit_fully,key_fields)
          write_csv(OUT/'RESIDUAL_KEYS_WITH_MISSING_GAMES.csv',with_missing,key_fields)
          write_csv(OUT/'TARGET_INTERVAL_GAME_COUNT_MISMATCHES.csv',target_mismatches,['canonical_key','season','player_id','team_id','target_team_games_in_tenure','interval_derived_team_games'])

          summary={
              'status':'PASS',
              'operation':'residual_to_deduplicated_missing_game_scope_only_no_reconstruction',
              'canonical_residual_rows':len(key_rows),
              'canonical_residual_unique_keys':len({r['canonical_key'] for r in key_rows}),
              'residual_classification_counts':dict(Counter(r['canonical_classification'] for r in key_rows)),
              'residual_keys_with_missing_exact_team_games':len(with_missing),
              'residual_keys_fully_team_game_covered_but_not_assembled':len(fully),
              'fully_team_game_covered_rows_with_player_fact_deficit':len(player_deficit_fully),
              'unique_missing_games_global':len(unique_missing),
              'missing_team_game_pair_requirements_before_deduplication':sum(r['missing_exact_team_games'] for r in key_rows),
              'total_team_game_pair_requirements':sum(r['required_team_games'] for r in key_rows),
              'unique_required_games_global':len(required_unique),
              'rows_with_missing_games_by_classification':dict(class_missing),
              'fully_team_game_covered_by_classification':dict(class_full),
              'target_interval_game_count_mismatches':len(target_mismatches),
              'validated_union_middle_seasons':len(union_years),
              'cross_snapshot_diagnostic_count':len(cross_snapshot_differences),
              'two_team_pair_integrity_failures':len(pair_integrity_failures),
              'edge_seasons_without_validated_exact_game_union':['2000-01','2001-02','2025-26'],
              'guards':{
                  'game_reconstruction_run':False,
                  'rounded_percentage_backsolve_used':False,
                  'broad_historical_refetch_used':False,
                  'targeted_retained_exact_team_fact_fetch_used':True,
                  'player_game_fact_sources_refetched':False,
                  'scope_limited_to_current_4602_residual':True,
                  'game_ids_normalized_to_integer_equivalent_strings':True,
                  'positive_present_current_schedule_nonzero_overlap_hard_gate':True,
                  'complete_union_season_exact_overlap_after_normalization_hard_gate':True,
                  'historical_expected_schedule_count_is_diagnostic_only':True,
                  'historical_present_equals_current_schedule_minus_old_missing_is_not_a_gate':True,
                  'positive_present_ids_recovered_from_retained_exact_team_game_facts':True,
                  'reported_team_rows_equals_2x_reported_present_hard_gate':True,
              },
              'by_season':by_season,
          }
          (OUT/'RESIDUAL_GAME_SCOPE_SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (OUT/'STATUS.txt').write_text('PASS\n',encoding='utf-8')
          (OUT/'README.md').write_text(
              '# TREB residual game-scope mapping v2\n\n'
              'Status: **PASS**\n\n'
              'No reconstruction or rounded-percentage inference. Game IDs are normalized to integer-equivalent strings before cross-source comparison. Positive historical exact-game presence is established only from retained validated `team_game_treb` rows. Cross-snapshot schedule identities remain diagnostic, while zero-overlap and complete-union-season overlap checks are hard guards alongside union two-team integrity and exact source reproduction.\n\n'
              f'- Residual canonical keys: **{len(key_rows):,}**\n'
              f'- Keys with missing exact team games: **{len(with_missing):,}**\n'
              f'- Keys already fully team-game covered: **{len(fully):,}**\n'
              f'- Deduplicated unique missing games: **{len(unique_missing):,}**\n',
              encoding='utf-8')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload durable mapping artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treb-residual-game-scope-v2-${{ github.run_id }}
          path: /tmp/treb_residual_game_scope_v2
          if-no-files-found: warn
          retention-days: 90

      - name: Persist mapping checkpoint
        shell: bash
        run: |
          set -euo pipefail
          D=team_trb_all_players/final_integrity_rebuild/final_exact_release/residual_game_scope
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin agent/treb-final-exact-assembly
          git reset --hard origin/agent/treb-final-exact-assembly
          rm -rf "$D"; mkdir -p "$D"
          cp -a /tmp/treb_residual_game_scope_v2/. "$D/"
          git add -f "$D"
          git commit -m 'Persist TREB residual game-scope mapping v2 [skip ci]'
          git push origin HEAD:agent/treb-final-exact-assembly

      - name: Enforce PASS
        run: test "$(cat /tmp/treb_residual_game_scope_v2/STATUS.txt)" = PASS
