name: TREB period-local unique exact recovery

on:
  push:
    branches:
      - agent/treb-final-exact-assembly
    paths:
      - 'team_trb_all_players/production_rebound_period_unique_candidate.py'
      - 'team_trb_all_players/treb_static_period_unique_recovery.py'
      - '.github/workflows/treb-static-period-unique-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        season: ['2004-05','2009-10','2015-16','2017-18','2018-19','2019-20','2020-21','2021-22','2022-23','2023-24','2024-25']
    runs-on: ubuntu-24.04
    env:
      CURRENT_ARTIFACT_ID: 9275527991
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact reconstruction dependencies
        run: python -m pip install --disable-pip-version-check -q pandas numpy rapidfuzz
      - name: Download authoritative checkpoint with retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/out
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -f /tmp/current.zip
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CURRENT_ARTIFACT_ID}/zip" > /tmp/current.zip && unzip -tq /tmp/current.zip >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "checkpoint download attempt ${attempt} failed; retrying"
            sleep $((attempt * 8))
          done
          test "$ok" -eq 1
          unzip -q /tmp/current.zip -d /tmp/current
      - name: Reconcile current blockers with unique period-local assignments
        run: |
          python -u team_trb_all_players/treb_static_period_unique_recovery.py \
            --current-dir /tmp/current --out-dir /tmp/out --season '${{ matrix.season }}'
      - name: Upload season evidence
        uses: actions/upload-artifact@v4
        with:
          name: TREB-period-unique-${{ matrix.season }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error

  consolidate:
    needs: recover
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TREB-period-unique-*-${{ github.run_id }}
          path: /tmp/all
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q pandas
      - name: Apply global exact-control and conflict gate
        run: |
          set -euo pipefail
          mkdir -p /tmp/final
          python - <<'PY'
          import json,pathlib,pandas as pd
          root=pathlib.Path('/tmp/all'); out=pathlib.Path('/tmp/final')
          q=[]
          for f in root.rglob('QA.json'):
              try:q.append(json.loads(f.read_text()))
              except Exception:pass
          pfiles=list(root.rglob('PLAYER_CANDIDATES.csv.gz')); tfiles=list(root.rglob('TEAM_CANDIDATES.csv.gz'))
          ps=pd.concat([pd.read_csv(f,low_memory=False) for f in pfiles],ignore_index=True) if pfiles else pd.DataFrame()
          ts=pd.concat([pd.read_csv(f,low_memory=False) for f in tfiles],ignore_index=True) if tfiles else pd.DataFrame()
          conflicts=[]
          def dedup(df,keys,vals,kind):
              if not len(df): return df
              x=df.copy()
              for k in keys:x[k]=x[k].astype(str).str.replace(r'\.0$','',regex=True)
              for key,g in x.groupby(keys,dropna=False):
                  if len(g)>1:
                      sig={tuple(float(r[v]) for v in vals) for _,r in g.iterrows()}
                      if len(sig)>1:conflicts.append({'kind':kind,'key':list(key if isinstance(key,tuple) else (key,))})
              return x.drop_duplicates(keys,keep='first')
          ps=dedup(ps,['season','game_id','team_id','player_id'],['seconds_on','team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on'],'player')
          ts=dedup(ts,['season','game_id','team_id'],['team_oreb','team_dreb','opponent_oreb','opponent_dreb'],'team')
          mismatches=sum(int(x.get('control_mismatches',0)) for x in q)
          controls=sum(int(x.get('controls_checked',0)) for x in q)
          control_games=sum(int(x.get('control_games_reconstructed',0)) for x in q)
          control_seasons=sum(1 for x in q if int(x.get('controls_checked',0))>0)
          source_failures=sum(1 for x in q if x.get('status')=='SOURCE_FAILURE')
          repairs=sum(int(x.get('period_unique_repairs',0)) for x in q)
          target_games=sum(int(x.get('target_games_reconstructed',0)) for x in q)
          # This is a candidate-promotion gate, not a production promotion. Require broad retained exact
          # comparisons across multiple affected eras, zero wrong controls, and zero duplicate conflicts.
          promotion_ready=(source_failures==0 and mismatches==0 and not conflicts and controls>=100 and control_games>=8 and control_seasons>=3)
          if not promotion_ready:
              ps=ps.iloc[0:0] if len(ps) else ps; ts=ts.iloc[0:0] if len(ts) else ts
          if len(ps):ps.to_csv(out/'CANDIDATE_PLAYER_GAME_PRIMITIVES.csv.gz',index=False,compression='gzip')
          if len(ts):ts.to_csv(out/'CANDIDATE_TEAM_GAME_PRIMITIVES.csv.gz',index=False,compression='gzip')
          qa={'status':'PASS_PROMOTION_READY' if promotion_ready else 'FAIL_CLOSED','season_jobs':len(q),'source_failures':source_failures,'controls_checked':controls,'control_games_reconstructed':control_games,'control_seasons':control_seasons,'control_mismatches':mismatches,'duplicate_conflicts':conflicts,'period_unique_repairs':repairs,'target_games_reconstructed':target_games,'candidate_player_primitives':int(len(ps)),'candidate_team_primitives':int(len(ts)),'promotion_performed':False,'next':'if PASS_PROMOTION_READY, conflict-check union with authoritative cumulative exact primitives then exact reclose and rerun <=0.01pp materiality gate','integrity':{'period_local_only':True,'unique_order_preserving_injection_required':True,'event_reuse_forbidden':True,'nearest_neighbor_guess_used':False,'empirical_model_used':False,'rounded_percentage_backsolve_used':False,'opponent_rebound_inference_used':False,'partial_tenure_team_subtraction_used':False}}
          (out/'PERIOD_UNIQUE_CONSOLIDATED_QA.json').write_text(json.dumps(qa,indent=2)+'\n')
          print(json.dumps(qa,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-period-unique-consolidated-${{ github.run_id }}
          path: /tmp/final
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
