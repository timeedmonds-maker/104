name: TREB 2002 prior-lineup continuity control v2

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-2002-prior-continuity-control-v2.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz
      - name: Download 2002 NBA source layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trebraw-2002
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          raw=Path('/tmp/trebraw-2002')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in ('nbastats_2002','nbastatsv3_2002'):
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Audit continuity only where starter state is genuinely multi-solution-capable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb-continuity-audit-v2
          python - <<'PY'
          import json,sys
          from itertools import combinations
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import production_treb_engine_v3 as eng
          import production_treb_engine as legacy

          raw=Path('/tmp/trebraw-2002')
          nba=io.normalize_nba(pd.read_csv(raw/'nbastats_2002.csv',low_memory=False))
          v3=eng.normalize_v3(pd.read_csv(raw/'nbastatsv3_2002.csv',low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}
          vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}
          target_failures={20200169,20200200,20200261,20200344,20200359,20200373,20200464,20200619,20200839}
          controls=[]; targets=[]; skipped=[]
          evidence=eng._load_evidence_repairs()

          def zero_solutions(period,tid,pt,prior,candidates):
              pool=set(candidates)|set(prior or [])
              if len(pool)<5: return []
              if len(candidates)<5:
                  combos=(set(c) for c in combinations(sorted(pool),5) if set(candidates).issubset(c))
              elif len(candidates)>5:
                  combos=(set(c) for c in combinations(sorted(candidates),5))
              else:
                  return [set(candidates)]
              out=[]
              for combo in combos:
                  legal,viol=eng._simulate_team(period,tid,combo,pt)
                  if legal and not viol: out.append(combo)
              return out

          def advance(period,tid,starters,pt):
              lineup=set(starters)
              for _,row in period.iterrows():
                  if int(row.EVENTMSGTYPE)!=8: continue
                  if eng._sub_team(row,pt,{tid:lineup})!=tid: continue
                  outgoing=int(row.PLAYER1_ID or 0); incoming=int(row.PLAYER2_ID or 0)
                  if outgoing not in lineup or incoming in lineup:
                      raise ValueError(f'control substitution invalid event={int(row.EVENTNUM)}')
                  lineup.remove(outgoing); lineup.add(incoming)
              return lineup

          for n,(gid,game) in enumerate(ng.items(),1):
              if gid not in vg: continue
              prepared,_=legacy.prepare_nba_game(game)
              if prepared.empty: continue
              prepared=prepared.copy()
              prepared['DESCRIPTION_NORM']=legacy.core.nba_description(prepared)
              prepared['ELAPSED']=[legacy.core.elapsed_seconds(int(p),c) for p,c in zip(prepared.PERIOD,prepared.PCTIMESTRING)]
              order=eng._v3_action_map(vg[gid])
              prepared['V3_ORDER']=[order.get((int(p),int(ev)),10_000_000+int(ev)) for p,ev in zip(prepared.PERIOD,prepared.EVENTNUM)]
              pt=legacy.core._player_team(prepared); teams=sorted(set(int(x) for x in pt.values()))
              if len(teams)!=2: continue
              prior_by_team=None; failed=False
              for pn,p in prepared.groupby('PERIOD',sort=True):
                  pn=int(pn); p=p.sort_values(['ELAPSED','V3_ORDER','EVENTNUM'],kind='stable').copy(); current={}
                  for tid in teams:
                      prior=None if prior_by_team is None else prior_by_team.get(tid)
                      candidates=eng._candidate_starters(p,tid,pt)
                      need_alternatives=prior is not None and len(candidates)!=5
                      solutions=zero_solutions(p,tid,pt,prior,candidates) if need_alternatives else []
                      try:
                          chosen,_=eng._choose_starters(p,gid,pn,tid,pt,prior,evidence)
                      except Exception as exc:
                          if gid in target_failures and prior is not None:
                              if not solutions: solutions=zero_solutions(p,tid,pt,prior,candidates)
                              if solutions:
                                  overlaps=[len(s & prior) for s in solutions]; mx=max(overlaps)
                                  best=[sorted(s) for s,o in zip(solutions,overlaps) if o==mx]
                                  targets.append({'game_id':gid,'period':pn,'team_id':tid,'prior':sorted(prior),'candidates':sorted(candidates),'solution_count':len(solutions),'max_overlap':mx,'max_overlap_solutions':best,'error':str(exc)})
                          else: skipped.append({'game_id':gid,'period':pn,'team_id':tid,'reason':str(exc)})
                          failed=True; break
                      current[tid]=set(chosen)
                      if solutions and len(solutions)>1:
                          overlaps=[len(s & prior) for s in solutions]; mx=max(overlaps)
                          best=[s for s,o in zip(solutions,overlaps) if o==mx]
                          controls.append({'game_id':gid,'period':pn,'team_id':tid,'chosen':sorted(chosen),'solution_count':len(solutions),'max_overlap':mx,'max_overlap_solution_count':len(best),'max_overlap_unique':len(best)==1,'max_overlap_matches_chosen':len(best)==1 and best[0]==set(chosen)})
                  if failed: break
                  prior_by_team={tid:advance(p,tid,current[tid],pt) for tid in teams}
              if n%100==0: print('games',n,'controls',len(controls),'targets',len(targets),flush=True)

          cdf=pd.DataFrame(controls); tdf=pd.DataFrame(targets); sdf=pd.DataFrame(skipped)
          out=Path('/tmp/treb-continuity-audit-v2')
          cdf.to_csv(out/'controls.csv',index=False); tdf.to_csv(out/'target_ambiguities.csv',index=False); sdf.to_csv(out/'skipped.csv',index=False)
          applicable=len(cdf); unique=int(cdf.max_overlap_unique.sum()) if applicable else 0
          correct=int(cdf.max_overlap_matches_chosen.sum()) if applicable else 0
          wrong=int(((cdf.max_overlap_unique)&(~cdf.max_overlap_matches_chosen)).sum()) if applicable else 0
          target_unique=int(tdf.max_overlap_solutions.map(lambda x: len(x)==1).sum()) if not tdf.empty else 0
          qa={'status':'PASS' if applicable>=20 and wrong==0 else 'FAIL','season':'2002-03','control_multi_solution_period_team_cases':int(applicable),'control_unique_max_overlap_cases':unique,'control_unique_max_overlap_correct':correct,'control_unique_max_overlap_wrong':wrong,'target_ambiguity_records':int(len(tdf)),'target_unique_max_overlap_records':target_unique,'target_game_ids':sorted(set(tdf.game_id.astype(int))) if not tdf.empty else [],'rule_promoted':False,'production_code_mutated':False,'hard_gate':'zero wrong controls; at least 20 applicable controls'}
          (out/'qa.json').write_text(json.dumps(qa,indent=2)+'\n'); print(json.dumps(qa,indent=2))
          if qa['status']!='PASS': raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-2002-prior-continuity-control-v2-${{ github.run_id }}
          path: /tmp/treb-continuity-audit-v2/**
          retention-days: 90
          if-no-files-found: error
