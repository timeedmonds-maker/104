name: TREB game-fact repair wave 2 exact identity

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - team_trb_all_players/final_integrity_rebuild/GAME_FACT_REPAIR_WAVE2_CONTROL.json

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    outputs:
      patch_sha: ${{ steps.patch.outputs.patch_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: patch
        name: Promote validated two-pass exact-identity rebound fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('team_trb_all_players/production_treb_engine.py')
          text=p.read_text()
          start=text.index('def join_pbp_rebounds(')
          end=text.index('\n\nclassify_rebounds = core.classify_rebounds',start)
          new=r'''def join_pbp_rebounds(lineups: core.GameLineups, pbp_game: pd.DataFrame, alpha: int = 5) -> tuple[pd.DataFrame, dict]:
    """Join PBP Stats rebound-bearing rows to NBA events.

    The baseline historical matcher is preserved exactly as pass 1.  Pass 2 is
    deliberately narrower: an otherwise-unmatched row may use only an unused
    NBA EVENTMSGTYPE=4 event with either an exact normalized description or an
    exact player-name + cumulative (Off:N Def:M) rebound-counter identity.
    Reserving all baseline matches before pass 2 prevents an early fallback
    from stealing an NBA event that a later row already matches normally.
    """
    ordered_pbp = pbp_game.copy()
    ordered_pbp["PREV_PBP_DESCRIPTION"] = ordered_pbp.groupby(core.POSSESSION_ID, dropna=False).DESCRIPTION.shift(1)
    rebounds = ordered_pbp[ordered_pbp.DESCRIPTION.fillna("").str.contains("rebound", case=False)].copy()
    rebounds["DESCRIPTION_NORM"] = rebounds.DESCRIPTION.map(_norm)
    rebounds["START_ELAPSED"] = [core.elapsed_seconds(int(p), c) for p, c in zip(rebounds.PERIOD, rebounds.STARTTIME)]
    rebounds["END_ELAPSED"] = [core.elapsed_seconds(int(p), c) for p, c in zip(rebounds.PERIOD, rebounds.ENDTIME)]
    rows = list(rebounds.iterrows())
    nba = lineups.events
    game_id = int(pbp_game.GAMEID.iloc[0]) if not pbp_game.empty else 0

    matches: list[int | None] = []
    ambiguous = 0
    manual = 0
    exact_identity = 0

    # Pass 1: preserve every existing fuzzy/window and explicit manual match.
    for _, row in rows:
        candidates = nba[(nba.PERIOD.eq(row.PERIOD)) &
                         (nba.ELAPSED.gt(row.START_ELAPSED - alpha)) &
                         (nba.ELAPSED.lt(row.END_ELAPSED + alpha))]
        scored = [(core._distance(row.DESCRIPTION_NORM, desc), int(ev), int(pos))
                  for pos, (ev, desc) in zip(candidates.index, zip(candidates.EVENTNUM, candidates.DESCRIPTION_NORM))]
        acceptable = [item for item in scored if item[0] < .2]
        if len(acceptable) > 1:
            ambiguous += 1
        if acceptable:
            matches.append(min(acceptable)[2])
            continue
        repair_event = JOIN_REPAIRS.get((game_id, int(row.PERIOD), row.DESCRIPTION_NORM))
        if repair_event is not None:
            hit = nba[(nba.PERIOD.eq(row.PERIOD)) & nba.EVENTNUM.eq(repair_event)]
            if len(hit) == 1:
                matches.append(int(hit.index[0]))
                manual += 1
                continue
        matches.append(None)

    # Pass 2: exact identity only, and only among NBA rebound events not already
    # claimed anywhere by pass 1 (or by an earlier exact fallback).
    used = {int(index) for index in matches if index is not None}
    counter_re = re.compile(r"\(off:(\d+) def:(\d+)\)", re.I)

    def name_key(value: object) -> str:
        return _norm(value).split(" rebound", 1)[0].strip()

    for position, (_, row) in enumerate(rows):
        if matches[position] is not None:
            continue
        eligible = nba[(nba.PERIOD.eq(row.PERIOD)) &
                       nba.EVENTMSGTYPE.eq(4) &
                       ~nba.index.isin(used)]
        chosen: int | None = None
        exact = eligible[eligible.DESCRIPTION_NORM.eq(row.DESCRIPTION_NORM)]
        if len(exact) == 1:
            chosen = int(exact.index[0])
        else:
            counter = counter_re.search(row.DESCRIPTION_NORM)
            if counter:
                counter_key = f"(off:{counter.group(1)} def:{counter.group(2)})"
                player_key = name_key(row.DESCRIPTION_NORM)
                hits = eligible[
                    eligible.DESCRIPTION_NORM.str.contains(re.escape(counter_key), regex=True) &
                    eligible.DESCRIPTION_NORM.map(name_key).eq(player_key)
                ]
                if len(hits) == 1:
                    chosen = int(hits.index[0])
        if chosen is not None:
            matches[position] = chosen
            used.add(chosen)
            exact_identity += 1

    unmatched_rows: list[dict] = []
    for position, (_, row) in enumerate(rows):
        if matches[position] is None:
            unmatched_rows.append({"game_id": game_id, "period": int(row.PERIOD),
                                   "start_time": str(row.STARTTIME), "end_time": str(row.ENDTIME),
                                   "description": str(row.DESCRIPTION)})

    rebounds["NBA_INDEX"] = matches
    matched = rebounds[rebounds.NBA_INDEX.notna()].copy()
    matched["LINEUP"] = [nba.loc[int(i), "LINEUP"] for i in matched.NBA_INDEX]
    for column in ("EVENTMSGTYPE", "EVENTMSGACTIONTYPE", "PLAYER1_ID", "ELAPSED", "EVENTNUM"):
        matched["NBA_" + column] = [nba.loc[int(i), column] for i in matched.NBA_INDEX]
    matched["NBA_IS_REAL_REBOUND"] = [core._nba_real_rebound(nba, int(i)) for i in matched.NBA_INDEX]
    audit = {"total_pbp_rows": int(len(pbp_game)), "rebound_bearing_rows": int(len(rebounds)),
             "matched_rebound_bearing_rows": int(len(matched)),
             "unmatched_rebound_bearing_rows": int(len(unmatched_rows)),
             "ambiguous_matches": int(ambiguous), "manual_join_repairs": int(manual),
             "exact_identity_join_repairs": int(exact_identity),
             "unmatched_rows": unmatched_rows}
    return matched, audit
'''
          p.write_text(text[:start]+new+text[end:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team_trb_all_players/production_treb_engine.py
          git commit -m 'Add two-pass exact-identity rebound join fallback'
          git push origin HEAD:agent/treb-batched-game-facts-20260812
          echo "patch_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  repair:
    needs: apply-patch
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        year: [2008,2009,2010,2011,2015,2017,2018,2019,2021,2022,2023,2024]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-patch.outputs.patch_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Fetch Wave-1 unmatched target list
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin treb-game-fact-repair-wave1
          git show origin/treb-game-fact-repair-wave1:team_trb_all_players/final_integrity_rebuild/game_fact_repair_wave1/${{ matrix.year }}/residual_failures.json > /tmp/residual.json
      - name: Download season sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"; mkdir -p "$RAW"
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          y=int('${{ matrix.year }}'); raw=Path(f'/tmp/trebraw-{y}')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in [f'nbastats_{y}',f'nbastatsv3_{y}',f'pbpstats_{y}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Rebuild only Wave-1 unmatched-rebound residual games
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"; OUT="/tmp/wave2-${YEAR}"; mkdir -p "$OUT"
          NBA=$(find "$RAW" -name "nbastats_${YEAR}.csv" -print -quit)
          V3=$(find "$RAW" -name "nbastatsv3_${YEAR}.csv" -print -quit)
          PBP=$(find "$RAW" -name "pbpstats_${YEAR}.csv" -print -quit)
          NBA="$NBA" V3="$V3" PBP="$PBP" YEAR="$YEAR" OUT="$OUT" PATCH_SHA='${{ needs.apply-patch.outputs.patch_sha }}' python - <<'PY'
          import json,os,sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import production_treb_engine_v3 as engine
          import build_exact_game_fact_layer as base

          year=int(os.environ['YEAR']); season=f"{year}-{(year+1)%100:02d}"; out=Path(os.environ['OUT'])
          residual=json.loads(Path('/tmp/residual.json').read_text())
          target_ids=sorted({int(r['game_id']) for r in residual if 'unmatched PBP rebound rows' in str(r.get('error',''))})
          nba=io.normalize_nba(pd.read_csv(os.environ['NBA'],low_memory=False)); v3=engine.normalize_v3(pd.read_csv(os.environ['V3'],low_memory=False)); pbp=io.normalize_pbp(pd.read_csv(os.environ['PBP'],low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}; vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}; pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}
          team_rows=[]; player_rows=[]; audits=[]; failures=[]
          for i,gid in enumerate(target_ids,1):
              try:
                  tr,pr,a=base.build_game(gid,ng[gid],vg[gid],pg[gid]); team_rows.extend(tr); player_rows.extend(pr); audits.append(a)
              except Exception as exc: failures.append({'season':season,'game_id':gid,'error':f'{type(exc).__name__}: {exc}'})
              if i%10==0 or i==len(target_ids): print(f'WAVE2 season={season} {i}/{len(target_ids)} recovered={len(audits)} residual={len(failures)}',flush=True)
          pd.DataFrame(team_rows).to_csv(out/'team_game_treb.csv.gz',index=False,compression='gzip'); pd.DataFrame(player_rows).to_csv(out/'player_game_treb_on.csv.gz',index=False,compression='gzip')
          (out/'game_audit.json').write_text(json.dumps(audits,indent=2)+'\n'); (out/'residual_failures.json').write_text(json.dumps(failures,indent=2)+'\n')
          qa={'year':year,'season':season,'patch_sha':os.environ['PATCH_SHA'],'target_games':len(target_ids),'recovered_games':len(audits),'residual_failed_games':len(failures),'exact_identity_join_repairs':sum(int(a['join_audit'].get('exact_identity_join_repairs',0)) for a in audits),'recovered_team_rows':len(team_rows),'recovered_player_rows':len(player_rows)}
          qa['status']='PASS' if not failures else 'REPAIR_REQUIRED'; (out/'qa.json').write_text(json.dumps(qa,indent=2)+'\n'); print(json.dumps(qa,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-game-fact-repair-wave2-${{ matrix.year }}
          path: /tmp/wave2-${{ matrix.year }}
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: [apply-patch,repair]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-patch.outputs.patch_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-game-fact-repair-wave2-*
          path: /tmp/wave2
      - name: Aggregate and persist Wave 2
        shell: bash
        run: |
          set -euo pipefail
          PATCH_SHA='${{ needs.apply-patch.outputs.patch_sha }}' python - <<'PY'
          import json,os
          from pathlib import Path
          qas=[json.loads(p.read_text()) for p in sorted(Path('/tmp/wave2').glob('*/qa.json'))]; residual=[]
          for p in sorted(Path('/tmp/wave2').glob('*/residual_failures.json')): residual.extend(json.loads(p.read_text()))
          out={'patch_sha':os.environ['PATCH_SHA'],'seasons_found':len(qas),'target_games':sum(q['target_games'] for q in qas),'recovered_games':sum(q['recovered_games'] for q in qas),'residual_failed_games':sum(q['residual_failed_games'] for q in qas),'exact_identity_join_repairs':sum(q['exact_identity_join_repairs'] for q in qas),'recovered_team_rows':sum(q['recovered_team_rows'] for q in qas),'recovered_player_rows':sum(q['recovered_player_rows'] for q in qas),'residual_failures':residual,'season_qa':qas}
          out['status']='COMPLETE' if len(qas)==12 and out['target_games']==146 else 'INCOMPLETE_MATRIX'
          Path('/tmp/GAME_FACT_REPAIR_WAVE2_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps({k:v for k,v in out.items() if k not in {'residual_failures','season_qa'}},indent=2))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BR=treb-game-fact-repair-wave2-exact-identity; git checkout -B "$BR" '${{ needs.apply-patch.outputs.patch_sha }}'
          DEST=team_trb_all_players/final_integrity_rebuild/game_fact_repair_wave2_exact_identity; rm -rf "$DEST"; mkdir -p "$DEST"
          for d in /tmp/wave2/treb-game-fact-repair-wave2-*; do [ -d "$d" ] || continue; year="${d##*-}"; mkdir -p "$DEST/$year"; cp -a "$d"/. "$DEST/$year"/; done
          cp /tmp/GAME_FACT_REPAIR_WAVE2_SUMMARY.json "$DEST"/
          git add -f "$DEST"; git commit -m 'Persist TREB game-fact repair wave 2 exact identity'; git push --force origin HEAD:"$BR"
      - uses: actions/upload-artifact@v4
        with:
          name: treb-game-fact-repair-wave2-summary
          path: /tmp/GAME_FACT_REPAIR_WAVE2_SUMMARY.json
          retention-days: 90
