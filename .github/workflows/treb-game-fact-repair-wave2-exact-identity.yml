name: TREB game-fact repair wave 2 exact identity

on:
  push:
    branches:
      - agent/treb-batched-game-facts-20260812
    paths:
      - team_trb_all_players/final_integrity_rebuild/GAME_FACT_REPAIR_WAVE2_V2_CONTROL.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  repair:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        year: [2008, 2009, 2010, 2011, 2015, 2017, 2018, 2019, 2021, 2022, 2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Fetch Wave 1 residual list
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin treb-game-fact-repair-wave1
          git show origin/treb-game-fact-repair-wave1:team_trb_all_players/final_integrity_rebuild/game_fact_repair_wave1/${{ matrix.year }}/residual_failures.json > /tmp/residual.json
      - name: Download season source archives
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'
          RAW="/tmp/trebraw-${YEAR}"
          mkdir -p "$RAW"
          python - <<'PY'
          import subprocess
          import tarfile
          import urllib.request
          from pathlib import Path

          year = int('${{ matrix.year }}')
          raw = Path(f'/tmp/trebraw-{year}')
          text = urllib.request.urlopen(
              'https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',
              timeout=60,
          ).read().decode()
          urls = {
              line.split('=', 1)[0].strip(): line.split('=', 1)[1].strip()
              for line in text.splitlines()
              if '=' in line
          }
          for key in (f'nbastats_{year}', f'nbastatsv3_{year}', f'pbpstats_{year}'):
              url = urls[key]
              arc = raw / url.rsplit('/', 1)[-1]
              subprocess.run(
                  ['curl', '--fail', '--location', '--retry', '6', '--retry-all-errors', '--output', str(arc), url],
                  check=True,
              )
              with tarfile.open(arc, 'r:xz') as tf:
                  tf.extractall(raw)
          PY
      - name: Rebuild only unmatched-rebound residual games
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'
          RAW="/tmp/trebraw-${YEAR}"
          OUT="/tmp/wave2-${YEAR}"
          NBA=$(find "$RAW" -name "nbastats_${YEAR}.csv" -print -quit)
          V3=$(find "$RAW" -name "nbastatsv3_${YEAR}.csv" -print -quit)
          PBP=$(find "$RAW" -name "pbpstats_${YEAR}.csv" -print -quit)
          python -u team_trb_all_players/run_exact_identity_repair_wave.py \
            --year "$YEAR" \
            --nba "$NBA" \
            --v3 "$V3" \
            --pbp "$PBP" \
            --residual /tmp/residual.json \
            --output "$OUT" \
            --patch-sha '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-game-fact-repair-wave2-${{ matrix.year }}
          path: /tmp/wave2-${{ matrix.year }}
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: repair
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-game-fact-repair-wave2-*
          path: /tmp/wave2
      - name: Aggregate Wave 2 results
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/aggregate_exact_identity_repair_wave.py \
            --root /tmp/wave2 \
            --output /tmp/GAME_FACT_REPAIR_WAVE2_SUMMARY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-game-fact-repair-wave2-summary
          path: /tmp/GAME_FACT_REPAIR_WAVE2_SUMMARY.json
          retention-days: 90
          if-no-files-found: error
