name: TREB current 21 static schedule resolution
on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - 'team_trb_all_players/treb_current_21_static_schedule.py'
      - '.github/workflows/treb-current-21-static-schedule-resolution.yml'
permissions:
  contents: write
concurrency:
  group: treb-current-21-static-schedule-resolution
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact current-target schedules from pinned static archives
        run: |
          set -euo pipefail
          TARGETS='team_trb_all_players/treb_recovery_status/artifacts/treb-current-21-tenure-boundary/TREB-current-21-tenure-boundary-32211236671/TREB_CURRENT_21_TENURE_BOUNDARY_RESOLUTION.csv'
          test -f "$TARGETS"
          set +e
          python team_trb_all_players/treb_current_21_static_schedule.py --targets "$TARGETS" --out-dir schedule_out
          RC=$?
          set -e
          echo "SCHEDULE_RC=$RC" >> "$GITHUB_ENV"
          if [ -f schedule_out/TREB_CURRENT_21_STATIC_TEAM_SCHEDULE_SUMMARY.json ]; then
            cat schedule_out/TREB_CURRENT_21_STATIC_TEAM_SCHEDULE_SUMMARY.json
          fi
          # The builder is fail-closed per target: every emitted team-season schedule has already
          # passed its exact expected-game-count/date/team-ID gate. Preserve and use those exact
          # subsets even if other targets in the same 21-row batch remain unresolved.
          if [ -f schedule_out/TREB_CURRENT_21_STATIC_TEAM_SCHEDULE.csv ]; then
            mkdir -p team_trb_all_players/impact_database/static_exact_schedules
            cp schedule_out/TREB_CURRENT_21_STATIC_TEAM_SCHEDULE.csv team_trb_all_players/impact_database/static_exact_schedules/TREB_CURRENT_21_STATIC_TEAM_SCHEDULE.csv
          fi
          exit 0
      - name: Re-run exact transaction-state tenure resolution using every exact static schedule subset
        if: always()
        run: |
          set -euo pipefail
          TARGETS='team_trb_all_players/treb_recovery_status/artifacts/treb-current-21-tenure-boundary/TREB-current-21-tenure-boundary-32211236671/TREB_CURRENT_21_TENURE_BOUNDARY_RESOLUTION.csv'
          test -f team_trb_all_players/impact_database/static_exact_schedules/TREB_CURRENT_21_STATIC_TEAM_SCHEDULE.csv
          python team_trb_all_players/treb_current_tenure_transaction_resolver.py --repo-root . --targets "$TARGETS" --out-dir resolution_out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-current-21-static-schedule-resolution-${{ github.run_id }}
          path: |
            schedule_out/
            resolution_out/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist schedule and resolution evidence before final gate
        if: always()
        run: |
          set -euo pipefail
          DEST="team_trb_all_players/treb_recovery_status/artifacts/treb-current-21-static-schedule-resolution/TREB-current-21-static-schedule-resolution-${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          if [ -d schedule_out ]; then cp -a schedule_out/. "$DEST/"; fi
          if [ -d resolution_out ]; then cp -a resolution_out/. "$DEST/"; fi
          printf '%s\n' "${SCHEDULE_RC:-unknown}" > "$DEST/SCHEDULE_EXIT_CODE.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          if [ -f team_trb_all_players/impact_database/static_exact_schedules/TREB_CURRENT_21_STATIC_TEAM_SCHEDULE.csv ]; then
            git add team_trb_all_players/impact_database/static_exact_schedules/TREB_CURRENT_21_STATIC_TEAM_SCHEDULE.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Persist TREB current 21 static schedule resolution ${GITHUB_RUN_ID}"
            git pull --rebase origin agent/treb-final-exact-assembly
            git push origin HEAD:agent/treb-final-exact-assembly
          fi
      - name: Final fail-closed batch gate
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s=json.load(open('schedule_out/TREB_CURRENT_21_STATIC_TEAM_SCHEDULE_SUMMARY.json'))
          r=json.load(open('resolution_out/TREB_CURRENT_21_TRANSACTION_RESOLUTION_SUMMARY.json'))
          print('schedule',s)
          print('resolution',r)
          assert s['targets']==21
          # This remains diagnostic: partial exact resolution is retained for promotion/reclosure,
          # while unresolved targets remain fail-closed. Do not require all 21 schedules here.
          assert s['exact_target_schedules'] > 0
          PY
