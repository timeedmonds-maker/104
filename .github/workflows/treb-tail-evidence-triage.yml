name: TREB tail exact-evidence triage

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - 'team_trb_all_players/treb_tail_evidence_triage.py'
      - '.github/workflows/treb-tail-evidence-triage.yml'

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Triage retained exact minutes and tenure evidence
        run: python team_trb_all_players/treb_tail_evidence_triage.py . tail_evidence
      - name: Upload durable triage evidence
        uses: actions/upload-artifact@v4
        with:
          name: TREB-tail-exact-evidence-${{ github.run_id }}
          path: tail_evidence/
          if-no-files-found: error
          retention-days: 30
