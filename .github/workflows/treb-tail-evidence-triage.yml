name: TREB tail exact-evidence triage

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - '.github/workflows/treb-tail-evidence-triage.yml'

permissions:
  contents: read
  actions: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download current authoritative TREB checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf auth auth.zip
          mkdir -p auth

          python - <<'PY' > /tmp/artifact_ids.txt
          import json, os, subprocess
          repo=os.environ['GH_REPO']
          p=subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts?per_page=100'],text=True,capture_output=True,check=True)
          arts=json.loads(p.stdout).get('artifacts',[])
          arts=[a for a in arts if not a.get('expired')]
          # Prefer names that clearly look like the current authoritative/materiality checkpoint.
          preferred=[]; fallback=[]
          for a in arts:
              name=(a.get('name') or '').lower()
              rec=(a.get('created_at') or '', a.get('id'), a.get('name') or '')
              if any(k in name for k in ('materiality','authoritative','consolidated','reclosure','production')):
                  preferred.append(rec)
              else:
                  fallback.append(rec)
          ordered=sorted(preferred, reverse=True)+sorted(fallback, reverse=True)
          seen=set()
          for _, aid, name in ordered[:40]:
              if aid in seen: continue
              seen.add(aid)
              print(aid)
          PY

          found=0
          while read -r aid; do
            [ -n "$aid" ] || continue
            rm -rf /tmp/candidate /tmp/candidate.zip
            mkdir -p /tmp/candidate
            if gh api "repos/${GH_REPO}/actions/artifacts/${aid}/zip" > /tmp/candidate.zip 2>/dev/null \
               && test -s /tmp/candidate.zip \
               && unzip -tq /tmp/candidate.zip >/dev/null 2>&1; then
              unzip -q /tmp/candidate.zip -d /tmp/candidate
              hit=$(find /tmp/candidate -type f -name 'TREB_UNRESOLVED_AFTER_MATERIALITY.csv' -print -quit)
              if [ -n "$hit" ]; then
                cp -a /tmp/candidate/. auth/
                echo "authoritative_artifact_id=$aid"
                found=1
                break
              fi
            fi
          done < /tmp/artifact_ids.txt

          test "$found" -eq 1
          hit=$(find auth -type f -name 'TREB_UNRESOLVED_AFTER_MATERIALITY.csv' -print -quit)
          test -n "$hit"
          if [ "$hit" != "auth/TREB_UNRESOLVED_AFTER_MATERIALITY.csv" ]; then
            cp "$hit" auth/TREB_UNRESOLVED_AFTER_MATERIALITY.csv
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('auth/TREB_UNRESOLVED_AFTER_MATERIALITY.csv')
          print('authoritative residual manifest bytes', p.stat().st_size)
          PY
      - name: Triage retained exact minutes and tenure evidence
        run: |
          python team_trb_all_players/treb_tail_evidence_triage.py . auth tail_evidence
      - name: Upload durable triage evidence
        uses: actions/upload-artifact@v4
        with:
          name: TREB-tail-exact-evidence-${{ github.run_id }}
          path: tail_evidence/
          if-no-files-found: error
          retention-days: 30
