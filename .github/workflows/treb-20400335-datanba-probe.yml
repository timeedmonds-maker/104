name: TREB 20400335 data.nba transition probe

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-20400335-datanba-probe.yml
      - team_trb_all_players/probe_20400335_datanba_transition.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Download archived data.nba 2004
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d2004
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            -o /tmp/d2004/datanba_2004.tar.xz \
            'https://github.com/shufinskiy/nba_data/raw/main/datasets/datanba_2004.tar.xz'
          tar -xJf /tmp/d2004/datanba_2004.tar.xz -C /tmp/d2004
          test -s /tmp/d2004/datanba_2004.csv
      - name: Extract transition evidence
        run: |
          python -u team_trb_all_players/probe_20400335_datanba_transition.py \
            --csv /tmp/d2004/datanba_2004.csv \
            --output /tmp/GAME_20400335_DATANBA_TRANSITION.json
      - name: Commit evidence durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          mkdir -p team_trb_all_players/final_integrity_rebuild
          cp /tmp/GAME_20400335_DATANBA_TRANSITION.json team_trb_all_players/final_integrity_rebuild/GAME_20400335_DATANBA_TRANSITION.json
          git add team_trb_all_players/final_integrity_rebuild/GAME_20400335_DATANBA_TRANSITION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record independent data.nba evidence for game 20400335"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
