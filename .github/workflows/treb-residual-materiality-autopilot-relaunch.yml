name: TREB residual materiality autopilot relaunch

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-residual-materiality-autopilot-relaunch.yml

permissions:
  actions: write
  contents: read

jobs:
  relaunch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch corrected materiality autopilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/timeedmonds-maker/104/actions/workflows/treb-residual-materiality-autopilot.yml/dispatches \
            -d '{"ref":"agent/treb-final-exact-assembly"}'
