name: TREB tenure-corrected OFF

on:
  push:
    branches:
      - treb-stage1-automation
    paths:
      - team_trb_all_players/build_corrected_tenure_off.py
      - team_trb_all_players/run_corrected_off_batch.py
      - team_trb_all_players/finalize_corrected_off_package.py
      - team_trb_all_players/impact_database/roster_tenure/**
      - .github/workflows/treb-corrected-off.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrected-off:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests pandas numpy pyarrow duckdb

      - name: Run Stage 2 self-tests
        run: |
          python team_trb_all_players/build_corrected_tenure_off.py --self-test
          python team_trb_all_players/run_corrected_off_batch.py --self-test
          python team_trb_all_players/finalize_corrected_off_package.py --self-test

      - name: Check Stage 1 exact-ready gate
        id: gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/roster_tenure/tenure_review_queue_summary.json')
          ready=False
          if p.exists():
              d=json.loads(p.read_text())
              ready=d.get('stage1_exact_ready') is True and int(d.get('review_queue_windows') or 0)==0
          print('ready='+('true' if ready else 'false'))
          with open(__import__('os').environ['GITHUB_OUTPUT'],'a') as f: f.write('ready='+('true' if ready else 'false')+'\n')
          PY

      - name: Collect resumable tenure-scoped corrected OFF batch
        if: steps.gate.outputs.ready == 'true'
        run: python team_trb_all_players/run_corrected_off_batch.py --batch-size 175

      - name: Inspect collection status
        if: steps.gate.outputs.ready == 'true'
        id: status
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json')
          d=json.loads(p.read_text())
          print(json.dumps(d,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('complete='+('true' if d.get('all_complete') else 'false')+'\n')
          PY

      - name: Build and verify final corrected OFF package
        if: steps.gate.outputs.ready == 'true' && steps.status.outputs.complete == 'true'
        run: python team_trb_all_players/finalize_corrected_off_package.py

      - name: Commit durable Stage 2 cache and outputs
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team_trb_all_players/impact_database/corrected_off
          if git diff --cached --quiet; then
            echo 'No corrected OFF changes to commit'
          else
            git commit -m 'Advance tenure-corrected OFF build'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload final verified package
        if: steps.gate.outputs.ready == 'true' && steps.status.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TREB-corrected-OFF-${{ github.run_id }}
          path: |
            team_trb_all_players/impact_database/corrected_off/final_export/
            team_trb_all_players/impact_database/corrected_off/TREB_corrected_off_final.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
