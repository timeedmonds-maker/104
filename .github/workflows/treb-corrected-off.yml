name: TREB tenure-corrected OFF

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: treb-corrected-off-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  corrected-off:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests pandas numpy pyarrow duckdb

      - name: Run Stage 2 self-tests
        run: |
          python team_trb_all_players/build_corrected_tenure_off.py --self-test
          python team_trb_all_players/prepare_corrected_off_workset.py --self-test
          python team_trb_all_players/run_corrected_off_batch.py --self-test
          python team_trb_all_players/finalize_corrected_off_package.py --self-test

      - name: Check Stage 1 exact-ready gate
        id: gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/roster_tenure/tenure_review_queue_summary.json')
          ready=False
          if p.exists():
              d=json.loads(p.read_text())
              ready=d.get('stage1_exact_ready') is True and int(d.get('review_queue_windows') or 0)==0
          print('ready='+('true' if ready else 'false'))
          with open(__import__('os').environ['GITHUB_OUTPUT'],'a') as f:
              f.write('ready='+('true' if ready else 'false')+'\n')
          PY

      - name: Reuse completed core for full-season windows and publish exact workset
        if: steps.gate.outputs.ready == 'true'
        run: python team_trb_all_players/prepare_corrected_off_workset.py

      - name: Collect resumable partial-tenure corrected OFF batch
        id: batch
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        run: python team_trb_all_players/run_corrected_off_batch.py --batch-size 500 --workers 4

      - name: Inspect collection status
        if: steps.gate.outputs.ready == 'true' && always()
        id: status
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json')
          d=json.loads(p.read_text())
          print(json.dumps(d,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('complete='+('true' if d.get('all_complete') else 'false')+'\n')
              f.write('remaining='+str(int(d.get('remaining_windows') or 0))+'\n')
              f.write('batch_errors='+str(int(d.get('batch_errors') or 0))+'\n')
          PY

      - name: Add finalizer compatibility key
        if: steps.gate.outputs.ready == 'true' && steps.status.outputs.complete == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json')
          d=json.loads(p.read_text())
          if 'impact_windows_requested' not in d and 'impact_windows_total' in d:
              d['impact_windows_requested']=d['impact_windows_total']
          p.write_text(json.dumps(d,indent=2))
          PY

      - name: Build and verify final corrected OFF package
        if: steps.gate.outputs.ready == 'true' && steps.batch.outcome == 'success' && steps.status.outputs.complete == 'true'
        run: python team_trb_all_players/finalize_corrected_off_package.py

      - name: Commit durable Stage 2 cache and outputs
        if: steps.gate.outputs.ready == 'true' && always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team_trb_all_players/impact_database/corrected_off
          if git diff --cached --quiet; then
            echo 'No corrected OFF changes to commit'
          else
            git commit -m 'Advance tenure-corrected OFF build [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload final verified package
        if: steps.gate.outputs.ready == 'true' && steps.batch.outcome == 'success' && steps.status.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TREB-corrected-OFF-${{ github.run_id }}
          path: |
            team_trb_all_players/impact_database/corrected_off/final_export/
            team_trb_all_players/impact_database/corrected_off/TREB_corrected_off_final.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Dispatch next corrected OFF batch immediately
        if: steps.gate.outputs.ready == 'true' && steps.batch.outcome == 'success' && steps.status.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ steps.status.outputs.remaining }} tenure windows remain; dispatching the next batch now."
          gh workflow run treb-corrected-off.yml --ref "${GITHUB_REF_NAME}"

      - name: Surface batch failure after preserving completed cache
        if: steps.gate.outputs.ready == 'true' && steps.batch.outcome == 'failure'
        run: |
          echo "Corrected OFF batch failed after durable cache was committed; diagnose before continuation."
          exit 1
