name: TREB exact-game recovery canary

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-exact-game-recovery-canary.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  recover-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz

      - name: Download exact 2002 source layers
        shell: bash
        run: |
          set -euo pipefail
          RAW=/tmp/trebraw-2002
          mkdir -p "$RAW"
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          raw=Path('/tmp/trebraw-2002')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in ('nbastats_2002','nbastatsv3_2002','pbpstats_2002'):
              if key not in urls: raise SystemExit(f'missing source URL key {key}')
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY

      - name: Run isolated adjudicated 50-game canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb-canary
          python - <<'PY'
          import gzip,json,re,sys
          from pathlib import Path
          import pandas as pd

          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import production_treb_engine_v3 as lineup_engine
          import production_treb_engine as legacy
          import build_exact_game_fact_layer as base

          season='2002-03'
          expected_failures={
              20200169,20200200,20200261,20200344,20200359,
              20200373,20200464,20200619,20200839,
          }
          repair_key=(20200077,2,'richardson rebound (off:1 def:1)')
          if repair_key in legacy.JOIN_REPAIRS and int(legacy.JOIN_REPAIRS[repair_key]) != 110:
              raise SystemExit(f'pre-existing JOIN_REPAIRS conflict: {legacy.JOIN_REPAIRS[repair_key]}')
          legacy.JOIN_REPAIRS[repair_key]=110

          manifest=Path('team_trb_all_players/final_integrity_rebuild/final_exact_release/residual_game_scope/historical_gap_partition/HISTORICAL_STRICT_RECOVERY_GAMES.csv')
          schedule_path=Path('team_trb_all_players/impact_database/roster_tenure/regular_season_games_raw/2002-03.json.gz')
          m=pd.read_csv(manifest,dtype={'game_id':str})
          m=m[m['season'].astype(str).eq(season)].copy()
          if not m['partition_class'].astype(str).eq('strict_historical_recovery_required').all():
              raise SystemExit('partition class guard failed')
          if not m['production_recovery_required'].astype(str).str.lower().eq('true').all():
              raise SystemExit('production recovery guard failed')
          m['canonical_game_id']=m['game_id'].map(lambda x:int(str(x).strip().removesuffix('.0')))
          target_ids=m.sort_values('canonical_game_id',kind='stable').head(50)['canonical_game_id'].tolist()
          if len(target_ids)!=50 or len(set(target_ids))!=50 or 20200077 not in target_ids:
              raise SystemExit('pinned 50-game scope guard failed')
          if not expected_failures.issubset(set(target_ids)):
              raise SystemExit('known ambiguity set drifted outside pinned scope')

          with gzip.open(schedule_path,'rt',encoding='utf-8') as fh:
              sched_rows=json.load(fh)['results']
          schedule={int(str(g['GameId']).strip().removesuffix('.0')):g for g in sched_rows}
          if set(target_ids)-set(schedule):
              raise SystemExit('target IDs absent from authoritative schedule')

          raw=Path('/tmp/trebraw-2002')
          nba=io.normalize_nba(pd.read_csv(raw/'nbastats_2002.csv',low_memory=False))
          v3=lineup_engine.normalize_v3(pd.read_csv(raw/'nbastatsv3_2002.csv',low_memory=False))
          pbp=io.normalize_pbp(pd.read_csv(raw/'pbpstats_2002.csv',low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}
          vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}
          pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}

          def schedule_team_ids(rec):
              found=set()
              def walk(obj,ctx=False):
                  if isinstance(obj,dict):
                      for k,v in obj.items():
                          nctx=ctx or 'team' in str(k).lower()
                          if nctx and not isinstance(v,(dict,list)):
                              s=str(v).strip().removesuffix('.0')
                              if s.isdigit() and 1610612700 <= int(s) <= 1610612800: found.add(int(s))
                          walk(v,nctx)
                  elif isinstance(obj,list):
                      for v in obj: walk(v,ctx)
              walk(rec)
              return found

          team_rows=[]; player_rows=[]; audits=[]; failures=[]
          for gid in target_ids:
              try:
                  if gid not in ng or gid not in vg or gid not in pg:
                      raise ValueError('missing source layer')
                  tr,pr,a=base.build_game(gid,ng[gid],vg[gid],pg[gid])
                  tids={int(r['team_id']) for r in tr}
                  if len(tr)!=2 or len(tids)!=2: raise ValueError('two-team exact-row gate failed')
                  stids=schedule_team_ids(schedule[gid])
                  if len(stids)!=2 or tids!=stids: raise ValueError(f'schedule team mismatch recovered={sorted(tids)} scheduled={sorted(stids)}')
                  team_rows.extend(tr); player_rows.extend(pr); audits.append(a)
              except Exception as exc:
                  failures.append({'game_id':gid,'error':f'{type(exc).__name__}: {exc}'})

          success_ids={int(a['game_id']) for a in audits}
          failure_ids={int(f['game_id']) for f in failures}
          hard=[]
          if success_ids|failure_ids != set(target_ids): hard.append('terminal reconciliation failed')
          if success_ids&failure_ids: hard.append('PASS/FAIL overlap')
          if failure_ids != expected_failures: hard.append(f'failure-set drift observed={sorted(failure_ids)}')
          if len(success_ids)!=41: hard.append(f'expected 41 passes observed={len(success_ids)}')
          if 20200077 not in success_ids: hard.append('20200077 did not recover')
          for f in failures:
              if 'non-unique v3/team-local starter solution' not in f['error']:
                  hard.append(f"ambiguity class drift game={f['game_id']}: {f['error']}")

          tdf=pd.DataFrame(team_rows)
          pdf=pd.DataFrame(player_rows)
          if not tdf.empty and tdf.duplicated(['game_id','team_id']).any(): hard.append('duplicate team exact keys')
          if not pdf.empty and pdf.duplicated(['game_id','team_id','player_id']).any(): hard.append('duplicate player exact keys')
          if not tdf.empty and not tdf.groupby('game_id')['team_id'].nunique().eq(2).all(): hard.append('two-team global gate failed')
          for df,cols,label in [
              (tdf,['game_seconds','team_oreb','team_dreb','opponent_oreb','opponent_dreb'],'team'),
              (pdf,['seconds_on','team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on'],'player')]:
              for c in cols:
                  if df.empty: continue
                  v=pd.to_numeric(df[c],errors='coerce')
                  if v.isna().any() or (v<0).any() or ((v%1)!=0).any(): hard.append(f'{label} raw-integer gate failed {c}')

          repaired=[a for a in audits if int(a['game_id'])==20200077]
          if len(repaired)!=1: hard.append('missing unique 20200077 audit')
          elif int(repaired[0].get('join_audit',{}).get('manual_join_repairs',0)) < 1:
              hard.append('20200077 did not use explicit join repair')

          out=Path('/tmp/treb-canary')
          tdf.to_csv(out/'team_game_treb.csv.gz',index=False,compression='gzip')
          pdf.to_csv(out/'player_game_treb_on.csv.gz',index=False,compression='gzip')
          pd.DataFrame(failures).to_csv(out/'known_ambiguous_games.csv',index=False)
          (out/'game_audit.json').write_text(json.dumps(audits,indent=2,default=str)+'\n')
          qa={
              'status':'PASS' if not hard else 'FAIL',
              'season':season,
              'requested_games':50,
              'successful_games':len(success_ids),
              'known_ambiguous_games':len(failure_ids),
              'expected_known_ambiguous_games':sorted(expected_failures),
              'adjudicated_game':20200077,
              'adjudicated_join_repair_event':110,
              'candidate_only_not_production_promoted':True,
              'production_code_mutated':False,
              'rounded_percentage_backsolve':False,
              'hard_validation_errors':hard,
          }
          (out/'qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          print(json.dumps(qa,indent=2))
          if hard: raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-exact-game-recovery-canary-${{ github.run_id }}
          path: /tmp/treb-canary/**
          retention-days: 90
          if-no-files-found: error
