name: TREB exact-game recovery canary

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-exact-game-recovery-canary.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  recover-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz

      - name: Pin deterministic 50-game strict historical canary
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/treb-recovery-canary; mkdir -p "$OUT"
          python - <<'PY'
          import gzip,json,re
          from pathlib import Path
          import pandas as pd

          season='2002-03'; n=50
          manifest=Path('team_trb_all_players/final_integrity_rebuild/final_exact_release/residual_game_scope/historical_gap_partition/HISTORICAL_STRICT_RECOVERY_GAMES.csv')
          schedule=Path('team_trb_all_players/impact_database/roster_tenure/regular_season_games_raw/2002-03.json.gz')
          out=Path('/tmp/treb-recovery-canary')

          m=pd.read_csv(manifest,dtype={'game_id':str,'game_id_numeric':str})
          m=m[m['season'].astype(str).eq(season)].copy()
          if 'partition_bucket' not in m or not m['partition_bucket'].astype(str).eq('strict_recovery').all():
              raise SystemExit('strict manifest partition guard failed')
          if 'cross_snapshot_overlap' in m:
              bad=~m['cross_snapshot_overlap'].astype(str).str.lower().isin(['false','0','0.0','nan',''])
              if bad.any(): raise SystemExit('strict manifest unexpectedly contains cross-snapshot overlap')
          m['canonical_game_id']=m['game_id_numeric'].map(lambda x:str(int(str(x).strip().removesuffix('.0'))))
          m['canonical_sort']=m['canonical_game_id'].astype(int)
          m=m.sort_values('canonical_sort',kind='stable').head(n).drop(columns=['canonical_sort'])
          if len(m)!=n or m['canonical_game_id'].nunique()!=n:
              raise SystemExit(f'canary cardinality guard failed rows={len(m)} unique={m.canonical_game_id.nunique()}')

          with gzip.open(schedule,'rt',encoding='utf-8') as fh: d=json.load(fh)
          games=d['results']
          sched={int(str(g['GameId']).strip().removesuffix('.0')):g for g in games}
          ids=[int(x) for x in m['canonical_game_id']]
          absent=sorted(set(ids)-set(sched))
          if absent: raise SystemExit(f'canary IDs absent from authoritative V3 schedule: {absent[:20]}')
          subset=[sched[g] for g in ids]

          m.to_csv(out/'requested_games.csv',index=False)
          (out/'requested_game_ids.json').write_text(json.dumps(ids,indent=2)+'\n')
          (out/'schedule_records.json').write_text(json.dumps(subset,indent=2,default=str)+'\n')
          print(json.dumps({'season':season,'requested_games':len(ids),'first_game':ids[0],'last_game':ids[-1],'scope':'strict_recovery'},indent=2))
          PY

      - name: Download proven exact-game source layers
        shell: bash
        run: |
          set -euo pipefail
          YEAR=2002; RAW="/tmp/trebraw-${YEAR}"; mkdir -p "$RAW"
          python - <<'PY'
          import json,subprocess,tarfile,urllib.request
          from pathlib import Path
          year=2002; raw=Path(f'/tmp/trebraw-{year}'); out=Path('/tmp/treb-recovery-canary')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          resolved={}
          for key in [f'nbastats_{year}',f'nbastatsv3_{year}',f'pbpstats_{year}']:
              if key not in urls: raise SystemExit(f'missing source URL key {key}')
              url=urls[key]; resolved[key]=url; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          (out/'source_urls.json').write_text(json.dumps(resolved,indent=2)+'\n')
          PY
          find "$RAW" -maxdepth 1 -type f -name '*.xz' -print0 | sort -z | xargs -0 sha256sum > /tmp/treb-recovery-canary/SOURCE_ARCHIVE_SHA256.txt

      - name: Reconstruct only the pinned 50 games and apply hard gates
        shell: bash
        run: |
          set -uo pipefail
          YEAR=2002; RAW="/tmp/trebraw-${YEAR}"; OUT=/tmp/treb-recovery-canary
          NBA=$(find "$RAW" -name 'nbastats_2002.csv' -print -quit)
          V3=$(find "$RAW" -name 'nbastatsv3_2002.csv' -print -quit)
          PBP=$(find "$RAW" -name 'pbpstats_2002.csv' -print -quit)
          if [ -z "$NBA" ] || [ -z "$V3" ] || [ -z "$PBP" ]; then echo 'source extraction guard failed' >&2; exit 1; fi
          set +e
          NBA="$NBA" V3="$V3" PBP="$PBP" OUT="$OUT" ENGINE_SHA='${{ github.sha }}' python - <<'PY'
          import json,os,re,sys,traceback
          from pathlib import Path
          import pandas as pd

          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import production_treb_engine_v3 as lineup_engine
          import build_exact_game_fact_layer as base

          out=Path(os.environ['OUT']); season='2002-03'
          requested=pd.read_csv(out/'requested_games.csv',dtype={'game_id':str,'game_id_numeric':str,'canonical_game_id':str})
          target_ids=[int(x) for x in requested['canonical_game_id']]
          if len(target_ids)!=50 or len(set(target_ids))!=50:
              raise SystemExit('requested-game cardinality changed before build')
          schedule_records=json.loads((out/'schedule_records.json').read_text())
          schedule={int(str(g['GameId']).strip().removesuffix('.0')):g for g in schedule_records}

          nba=io.normalize_nba(pd.read_csv(os.environ['NBA'],low_memory=False))
          v3=lineup_engine.normalize_v3(pd.read_csv(os.environ['V3'],low_memory=False))
          pbp=io.normalize_pbp(pd.read_csv(os.environ['PBP'],low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}
          vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}
          pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}

          def schedule_team_ids(rec):
              found=set()
              def walk(obj,team_context=False):
                  if isinstance(obj,dict):
                      for k,v in obj.items():
                          ctx=team_context or 'team' in str(k).lower()
                          if ctx and not isinstance(v,(dict,list)):
                              s=str(v).strip().removesuffix('.0')
                              if s.isdigit():
                                  x=int(s)
                                  if 1610612700 <= x <= 1610612800: found.add(x)
                          walk(v,ctx)
                  elif isinstance(obj,list):
                      for v in obj: walk(v,team_context)
              walk(rec)
              return found

          def schedule_dates(rec):
              found=set()
              def walk(obj,key=''):
                  if isinstance(obj,dict):
                      for k,v in obj.items(): walk(v,str(k))
                  elif isinstance(obj,list):
                      for v in obj: walk(v,key)
                  elif any(t in key.lower() for t in ('date','time')):
                      m=re.search(r'(20\d\d-\d\d-\d\d)',str(obj))
                      if m: found.add(m.group(1))
              walk(rec)
              return found

          team_rows=[]; player_rows=[]; audits=[]; failures=[]
          for i,gid in enumerate(target_ids,1):
              try:
                  layers={'nba':gid in ng,'v3':gid in vg,'pbp':gid in pg}
                  if not all(layers.values()): raise ValueError(f'missing source layer {layers}')
                  tr,pr,a=base.build_game(gid,ng[gid],vg[gid],pg[gid])
                  tids={int(r['team_id']) for r in tr}
                  if len(tr)!=2 or len(tids)!=2: raise ValueError(f'two-team row gate failed rows={len(tr)} teams={sorted(tids)}')
                  scheduled=schedule_team_ids(schedule[gid])
                  if len(scheduled)!=2: raise ValueError(f'authoritative schedule team-id extraction gate failed teams={sorted(scheduled)}')
                  if tids!=scheduled: raise ValueError(f'schedule team mismatch recovered={sorted(tids)} scheduled={sorted(scheduled)}')
                  actual_dates={str(r.get('game_date',''))[:10] for r in tr if r.get('game_date')}
                  expected_dates=schedule_dates(schedule[gid])
                  if len(actual_dates)!=1: raise ValueError(f'recovered game-date gate failed dates={sorted(actual_dates)}')
                  if not expected_dates: raise ValueError('authoritative schedule date extraction gate failed')
                  if not actual_dates.issubset(expected_dates): raise ValueError(f'schedule date mismatch recovered={sorted(actual_dates)} scheduled={sorted(expected_dates)}')
                  team_rows.extend(tr); player_rows.extend(pr); audits.append(a)
              except Exception as exc:
                  failures.append({'season':season,'game_id':gid,'reason_code':type(exc).__name__,'error':str(exc)})
              if i%10==0 or i==len(target_ids):
                  print(f'CANARY_PROGRESS processed={i}/{len(target_ids)} pass={len(audits)} fail={len(failures)}',flush=True)

          team_cols=['game_id','game_date','team_id','team_abbr','game_seconds','team_oreb','team_dreb','opponent_oreb','opponent_dreb']
          player_cols=['game_id','game_date','team_id','team_abbr','player_id','player','seconds_on','team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on']
          team_df=pd.DataFrame(team_rows,columns=team_cols)
          player_df=pd.DataFrame(player_rows,columns=player_cols)
          hard_errors=[]

          success_ids=[int(a['game_id']) for a in audits]
          if len(success_ids)!=len(set(success_ids)): hard_errors.append('duplicate successful game IDs')
          terminal=set(success_ids)|{int(r['game_id']) for r in failures}
          if terminal!=set(target_ids): hard_errors.append('requested/terminal game reconciliation failed')
          if set(success_ids)&{int(r['game_id']) for r in failures}: hard_errors.append('game has both PASS and FAIL terminal states')
          if not team_df.empty and team_df.duplicated(['game_id','team_id']).any(): hard_errors.append('duplicate team exact keys')
          if not player_df.empty and player_df.duplicated(['game_id','team_id','player_id']).any(): hard_errors.append('duplicate player exact keys')
          if not team_df.empty:
              per=team_df.groupby('game_id')['team_id'].nunique()
              if not per.eq(2).all(): hard_errors.append('global two-team integrity failure')
          for df,cols,label in [
              (team_df,['game_seconds','team_oreb','team_dreb','opponent_oreb','opponent_dreb'],'team'),
              (player_df,['seconds_on','team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on'],'player')]:
              for c in cols:
                  if df.empty: continue
                  v=pd.to_numeric(df[c],errors='coerce')
                  if v.isna().any() or (v<0).any() or ((v%1)!=0).any(): hard_errors.append(f'{label} raw-integer gate failed column={c}')
          if not player_df.empty:
              if (pd.to_numeric(player_df['seconds_on'],errors='coerce')<=0).any(): hard_errors.append('non-positive player seconds')
              if not set(player_df['game_id'].astype(int)).issubset(set(success_ids)): hard_errors.append('player rows outside successful game scope')
          if not team_df.empty and not set(team_df['game_id'].astype(int)).issubset(set(target_ids)): hard_errors.append('team rows outside pinned manifest')

          team_df.to_csv(out/'team_game_treb.csv.gz',index=False,compression='gzip')
          player_df.to_csv(out/'player_game_treb_on.csv.gz',index=False,compression='gzip')
          pd.DataFrame([{'season':season,'game_id':g,'status':'PASS'} for g in success_ids],columns=['season','game_id','status']).to_csv(out/'successful_games.csv',index=False)
          pd.DataFrame(failures,columns=['season','game_id','reason_code','error']).to_csv(out/'failed_games.csv',index=False)
          pd.DataFrame(columns=['game_id','key_type','existing_value','recovered_value','reason']).to_csv(out/'conflicts.csv',index=False)
          (out/'game_audit.json').write_text(json.dumps(audits,indent=2,default=str)+'\n')
          provenance={
              'engine_commit':os.environ['ENGINE_SHA'],
              'season':season,'canary_size':50,'selection':'first 50 ascending canonical IDs from HISTORICAL_STRICT_RECOVERY_GAMES.csv',
              'collector':'team_trb_all_players/build_exact_game_fact_layer.py::build_game',
              'source_layers':['nbastats_2002','nbastatsv3_2002','pbpstats_2002'],
              'validated_union_policy':'strict-recovery targets only; no retained exact game replaced',
              'rounded_percentage_backsolve':False,
          }
          (out/'PROVENANCE.json').write_text(json.dumps(provenance,indent=2)+'\n')
          qa={
              'season':season,'requested_games':len(target_ids),'successful_games':len(success_ids),'failed_games':len(failures),
              'team_game_rows':int(len(team_df)),'player_game_rows':int(len(player_df)),'hard_validation_errors':hard_errors,
              'pinned_scope_only':True,'existing_validated_games_recomputed':0,'safe_lock_keys_touched':0,
              'status':'PASS' if not failures and not hard_errors and len(success_ids)==50 else 'REPAIR_REQUIRED'
          }
          (out/'qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          print(json.dumps(qa,indent=2))
          if hard_errors or failures or len(success_ids)!=50: raise SystemExit(1)
          PY
          rc=$?
          set -e
          find "$OUT" -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
          exit "$rc"

      - name: Persist canary durably on isolated recovery branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/treb-recovery-canary
          test -f "$OUT/qa.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BR=treb-exact-recovery-canary-2002-03-001
          git checkout -B "$BR" '${{ github.sha }}'
          DEST=team_trb_all_players/final_integrity_rebuild/final_exact_release/exact_game_recovery/canary/2002-03/batch_001
          rm -rf "$DEST"; mkdir -p "$DEST"; cp -a "$OUT"/. "$DEST"/
          git add -f "$DEST"
          if ! git diff --cached --quiet; then git commit -m 'Persist TREB exact-game recovery canary 2002-03 batch 001'; fi
          git push --force origin HEAD:"$BR"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-exact-game-recovery-canary-${{ github.run_id }}
          path: /tmp/treb-recovery-canary/**
          retention-days: 90
          if-no-files-found: error
