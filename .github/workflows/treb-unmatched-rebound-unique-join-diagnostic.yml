name: TREB unmatched rebound unique join diagnostic

on:
  push:
    branches: [treb-final-production-20260812]
    paths:
      - .github/workflows/treb-unmatched-rebound-unique-join-diagnostic.yml
      - team_trb_all_players/diagnose_unmatched_rebound_unique_join.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        year: [2017, 2022]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - run: python -m pip install -r team_trb_all_players/requirements.txt
      - name: Download season sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb-join-${{ matrix.year }}
          YEAR=${{ matrix.year }} python - <<'PY'
          import os,subprocess,tarfile,urllib.request
          from pathlib import Path
          y=int(os.environ['YEAR']); raw=Path(f'/tmp/treb-join-{y}')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in (f'nbastats_{y}',f'pbpstats_{y}'):
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Diagnose currently unmatched rows
        run: |
          python -u team_trb_all_players/diagnose_unmatched_rebound_unique_join.py \
            --nba /tmp/treb-join-${{ matrix.year }}/nbastats_${{ matrix.year }}.csv \
            --pbp /tmp/treb-join-${{ matrix.year }}/pbpstats_${{ matrix.year }}.csv \
            --output /tmp/treb-join-${{ matrix.year }}/unique_join_diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-unique-join-${{ matrix.year }}-${{ github.sha }}
          path: /tmp/treb-join-${{ matrix.year }}/unique_join_diagnostic.json
          retention-days: 90
          if-no-files-found: error
