name: Export missed3 contact sheet
on:
  push:
    paths:
      - 'trigger_missed3_contactsheet.txt'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Build compact official-headshot contact sheet
        run: |
          python - <<'PY'
          import os, io, base64, urllib.request
          from PIL import Image
          ids=[203500,1631106,1641708,1631200,1629111,1631095,1630549,1641739,1628449,1630578,1629006,1631222,1630692,1630703,1630202,1642377,1631117,1629048,1641764,1629020,1629630,1629012,1628988,1629723,1628436]
          cw,ch=300,225
          sheet=Image.new('RGB',(cw*5,ch*5),(0,0,0))
          for i,pid in enumerate(ids):
              req=urllib.request.Request(f'https://cdn.nba.com/headshots/nba/latest/1040x760/{pid}.png',headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read()
              im=Image.open(io.BytesIO(raw)).convert('RGBA')
              bg=Image.new('RGBA',im.size,(0,0,0,255)); bg.alpha_composite(im); im=bg.convert('RGB')
              # full official frame fit into cell
              im.thumbnail((cw,ch),Image.Resampling.LANCZOS)
              cell=Image.new('RGB',(cw,ch),(0,0,0)); cell.paste(im,((cw-im.width)//2,(ch-im.height)//2))
              sheet.paste(cell,((i%5)*cw,(i//5)*ch))
          os.makedirs('outputs',exist_ok=True)
          buf=io.BytesIO(); sheet.save(buf,'JPEG',quality=88,optimize=True,subsampling=0)
          open('outputs/missed3_contactsheet.b64','w').write(base64.b64encode(buf.getvalue()).decode('ascii'))
          PY
      - name: Commit contact sheet text
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add outputs/missed3_contactsheet.b64
          git commit -m 'Export missed3 contact sheet b64' || exit 0
          git push
