name: TREB V9 promotion regression
on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths: [.github/workflows/treb-v9-promotion-regression.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  MANIFEST: team_trb_all_players/final_integrity_rebuild/rebound_forensics/CHUNKED_REBOUND_MANIFEST.json
  SOURCE_RUN_ID: '31634201123'
  PYTHONUNBUFFERED: '1'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path(os.environ['MANIFEST']).read_text())
          assert len(m['chunks']) == 24 and m['target_games'] == 58
          x = {'include': [{'chunk_id': c['chunk_id'], 'year': int(c['year']), 'games': ','.join(map(str, c['game_ids']))} for c in m['chunks']]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps(x, separators=(',', ':')) + '\n')
          PY
  audit:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz
      - uses: actions/download-artifact@v4
        with:
          name: treb-residual-source-${{ matrix.year }}-${{ env.SOURCE_RUN_ID }}
          path: /tmp/source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - run: |
          python -u team_trb_all_players/rebound_v9_regression.py --year '${{ matrix.year }}' --games '${{ matrix.games }}' --chunk-id '${{ matrix.chunk_id }}' --nba '/tmp/source/nbastats_${{ matrix.year }}.csv' --v3 '/tmp/source/nbastatsv3_${{ matrix.year }}.csv' --pbp '/tmp/source/pbpstats_${{ matrix.year }}.csv' --output '/tmp/V9REG_${{ matrix.chunk_id }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: treb-v9-reg-${{ matrix.chunk_id }}-${{ github.run_id }}
          path: /tmp/V9REG_${{ matrix.chunk_id }}.json
          retention-days: 90
  aggregate:
    needs: [plan, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-v9-reg-*-${{ github.run_id }}
          path: /tmp/results
      - name: Enforce V9 promotion and zero-regression gates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          ps = sorted(Path('/tmp/results').rglob('V9REG_*.json'))
          assert len(ps) == 24, [str(p) for p in ps]
          xs = [json.loads(p.read_text()) for p in ps]
          def agg(sec, name):
              return {k: sum(int(x[sec][name][k]) for x in xs) for k in ('applicable', 'correct', 'wrong')}
          interval = agg('lineup_controls', 'interval_invariant')
          named = agg('live_controls', 'resolved_named_player')
          counter = agg('live_controls', 'counter_credited_player')
          assert interval == {'applicable': 4682, 'correct': 4682, 'wrong': 0}, interval
          assert named == {'applicable': 5034, 'correct': 5034, 'wrong': 0}, named
          assert counter == {'applicable': 5163, 'correct': 5163, 'wrong': 0}, counter
          d = Path('team_trb_all_players/final_integrity_rebuild/rebound_forensics')
          prior = json.loads((d / 'V8B_PROMOTION_REGRESSION.json').read_text())
          assert prior['status'] == 'PASS' and prior['v8b_residual_rows'] == 16
          prior_rows = prior['residual_rows']
          prior_keys = {(int(r['game_id']), int(r['pbp_index'])) for r in prior_rows}
          assert len(prior_rows) == 16 and len(prior_keys) == 16
          targets = {(21700032, 5033)}
          assert targets <= prior_keys, targets - prior_keys
          residual = [r for x in xs for r in x['residual_rows']]
          after_keys = {(int(r['game_id']), int(r['pbp_index'])) for r in residual}
          assert len(residual) == 15 and len(after_keys) == 15, len(residual)
          expected = prior_keys - targets
          assert after_keys == expected, {'unexpected_added': sorted(after_keys - expected), 'unexpected_removed': sorted(expected - after_keys)}
          out = {
              'status': 'PASS',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'engine': 'production_rebound_v9',
              'prior_v8b_residual_rows': 16,
              'promoted_v9_rows': 1,
              'v9_residual_rows': 15,
              'promoted_keys': [list(x) for x in sorted(targets)],
              'non_target_residual_delta_rows': 0,
              'lineup_interval_invariant_controls': interval,
              'named_player_live_controls': named,
              'counter_credited_player_live_controls': counter,
              'existing_control_regressions': 0,
              'residual_rows': residual,
          }
          Path('/tmp/V9_PROMOTION_REGRESSION.json').write_text(json.dumps(out, indent=2) + '\n')
          print(json.dumps({k: v for k, v in out.items() if k != 'residual_rows'}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: treb-v9-promotion-regression-${{ github.run_id }}
          path: /tmp/V9_PROMOTION_REGRESSION.json
          retention-days: 90
      - name: Persist durable result
        run: |
          set -euo pipefail
          D=team_trb_all_players/final_integrity_rebuild/rebound_forensics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/treb-batched-game-facts-20260812
            git reset --hard origin/agent/treb-batched-game-facts-20260812
            cp /tmp/V9_PROMOTION_REGRESSION.json "$D/"
            git add -f "$D/V9_PROMOTION_REGRESSION.json"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist V9 promotion regression proof'
            if git push origin HEAD:agent/treb-batched-game-facts-20260812; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
# Relaunch after correcting V9 regression import plumbing.
