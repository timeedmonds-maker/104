name: TREB issue trigger heartbeat

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  heartbeat:
    if: startsWith(github.event.issue.title, 'Run TREB rapid 30-game recovery')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm trigger delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "TREB trigger received. Event=${{ github.event.action }} run=${{ github.run_id }}"
