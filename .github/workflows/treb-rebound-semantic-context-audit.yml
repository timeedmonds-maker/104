name: TREB rebound semantic neighbouring-event audit

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - 'team_trb_all_players/treb_rebound_semantic_context_audit.py'
      - '.github/workflows/treb-rebound-semantic-context-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        season: ['2004-05','2019-20','2021-22','2022-23']
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q pandas numpy rapidfuzz
      - name: Audit neighbouring event semantics for persisted exact-control mismatches
        run: |
          mkdir -p /tmp/out
          python -u team_trb_all_players/treb_rebound_semantic_context_audit.py \
            --mismatch-path team_trb_all_players/treb_recovery_status/artifacts/treb-rebound-semantic-audit/TREB-rebound-semantic-consolidated-32101050783/ALL_MISMATCHES.csv.gz \
            --out-dir /tmp/out --season '${{ matrix.season }}'
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-rebound-semantic-context-${{ matrix.season }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error

  consolidate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TREB-rebound-semantic-context-*-${{ github.run_id }}
          path: /tmp/all
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q pandas
      - name: Consolidate context evidence
        run: |
          mkdir -p /tmp/final
          python - <<'PY'
          import json,pathlib,pandas as pd
          root=pathlib.Path('/tmp/all');out=pathlib.Path('/tmp/final');qs=[]
          for f in root.rglob('QA.json'):
              try: qs.append(json.loads(f.read_text()))
              except: pass
          mf=list(root.rglob('MISMATCHES.csv.gz'));ef=list(root.rglob('MISMATCH_COMPONENT_EVENTS.csv.gz'))
          m=pd.concat([pd.read_csv(f,low_memory=False) for f in mf],ignore_index=True) if mf else pd.DataFrame();e=pd.concat([pd.read_csv(f,low_memory=False) for f in ef],ignore_index=True) if ef else pd.DataFrame()
          if len(m):m.to_csv(out/'ALL_MISMATCHES.csv.gz',index=False,compression='gzip')
          if len(e):e.to_csv(out/'ALL_MISMATCH_COMPONENT_EVENTS.csv.gz',index=False,compression='gzip')
          qa={'status':'PASS_DIAGNOSTIC' if qs and not any(int(q.get('source_failures',0)) for q in qs) else 'PARTIAL_DIAGNOSTIC','season_jobs':len(qs),'source_failures':sum(int(q.get('source_failures',0)) for q in qs),'persisted_mismatches':sum(int(q.get('persisted_mismatches',0)) for q in qs),'mismatch_games':sum(int(q.get('mismatch_games',0)) for q in qs),'event_rows':len(e),'promotion_performed':False,'integrity':{'diagnostic_only':True,'uses_previously_proven_exact_control_mismatches':True,'fresh_zero_mismatch_gate_required_before_promotion':True}}
          (out/'CONTEXT_AUDIT_QA.json').write_text(json.dumps(qa,indent=2)+'\n');print(json.dumps(qa,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-rebound-semantic-context-consolidated-${{ github.run_id }}
          path: /tmp/final
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
