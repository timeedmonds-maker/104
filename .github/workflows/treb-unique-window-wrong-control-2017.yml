name: TREB trace lone unique-window control miss

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - .github/workflows/treb-unique-window-wrong-control-2017.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Download 2017 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw
          cp team_trb_all_players/final_integrity_rebuild/nonlive_unmatched_rebound/NONLIVE_UNMATCHED_REBOUND_SUMMARY.json /tmp/nonlive-summary.json
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          y=2017; raw=Path('/tmp/raw')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode(); urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in [f'nbastats_{y}',f'nbastatsv3_{y}',f'pbpstats_{y}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]; subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Trace the wrong control
        shell: bash
        run: |
          set -euo pipefail
          NBA=$(find /tmp/raw -name 'nbastats_2017.csv' -print -quit); V3=$(find /tmp/raw -name 'nbastatsv3_2017.csv' -print -quit); PBP=$(find /tmp/raw -name 'pbpstats_2017.csv' -print -quit)
          python -u team_trb_all_players/unique_window_wrong_control_2017.py --nba "$NBA" --v3 "$V3" --pbp "$PBP" --summary /tmp/nonlive-summary.json --output /tmp/WRONG_CONTROL_2017.json
      - name: Persist trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-batched-game-facts-20260812
          git reset --hard origin/agent/treb-batched-game-facts-20260812
          DEST=team_trb_all_players/final_integrity_rebuild/unique_window_rebound; mkdir -p "$DEST"; cp /tmp/WRONG_CONTROL_2017.json "$DEST"/
          git add -f "$DEST/WRONG_CONTROL_2017.json"; git commit -m 'Persist lone unique-window control trace'; git push origin HEAD:agent/treb-batched-game-facts-20260812
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-unique-window-wrong-control-2017
          path: /tmp/WRONG_CONTROL_2017.json
          retention-days: 90
