name: Export missed3 headshots zip
on:
  push:
    paths:
      - 'trigger_missed3_zip.txt'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official NBA headshots and split ZIP as text chunks
        run: |
          set -e
          rm -rf outputs/missed3_headshots outputs/missed3_b64_chunks
          mkdir -p outputs/missed3_headshots outputs/missed3_b64_chunks
          while IFS=',' read -r id name; do
            curl -L --fail --retry 3 -A 'Mozilla/5.0' "https://cdn.nba.com/headshots/nba/latest/1040x760/${id}.png" -o "outputs/missed3_headshots/${id}_${name}.png"
          done <<'EOF'
          203500,Steven_Adams
          1631106,Tari_Eason
          1641708,Amen_Thompson
          1631200,Kris_Murray
          1629111,Jock_Landale
          1631095,Jabari_Smith_Jr
          1630549,DayRon_Sharpe
          1641739,Toumani_Camara
          1628449,Chris_Boucher
          1630578,Alperen_Sengun
          1629006,Josh_Okogie
          1631222,Jake_LaRavia
          1630692,Jordan_Goodwin
          1630703,Scoot_Henderson
          1630202,Payton_Pritchard
          1642377,Jaylen_Wells
          1631117,Walker_Kessler
          1629048,Goga_Bitadze
          1641764,Brandin_Podziemski
          1629020,Jarred_Vanderbilt
          1629630,Ja_Morant
          1629012,Collin_Sexton
          1628988,Aaron_Holiday
          1629723,John_Konchar
          1628436,Luke_Kornet
          EOF
          cd outputs
          zip -r missed3_top25_headshots.zip missed3_headshots
          base64 -w0 missed3_top25_headshots.zip > missed3_zip.b64
          split -b 350000 -d -a 3 missed3_zip.b64 missed3_b64_chunks/chunk_
          ls missed3_b64_chunks | sort > missed3_b64_manifest.txt
      - name: Commit ZIP transfer chunks
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add outputs/missed3_b64_chunks outputs/missed3_b64_manifest.txt
          git commit -m 'Export missed3 ZIP as text chunks' || exit 0
          git push
