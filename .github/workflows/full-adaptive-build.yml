name: Team TREB impact database — manual fallback only

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  STATUS_COMMENT_ID: '5161464311'

jobs:
  impact_core_manual_fallback:
    runs-on: ubuntu-slim
    timeout-minutes: 14
    steps:
      - name: Explain fallback status
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            core.notice('Automatic Actions execution is disabled. The production Team TREB impact build runs through the proven two-worker Codespace supervisor.');
