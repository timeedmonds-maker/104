name: Full adaptive team rebound dataset

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  STATUS_ISSUE: '9'

jobs:
  runner_probe_announce:
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.number == 9 && contains(github.event.comment.body, '/probe-team-trb') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `Production-workflow runner probe started: run ${context.runId}.`
            });

  runner_probe_slim:
    needs: runner_probe_announce
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: uname -a && python3 --version
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `Runner probe ${context.runId}: ubuntu-slim executed successfully.`
            });

  runner_probe_x64:
    needs: runner_probe_announce
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: uname -a && python3 --version
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `Runner probe ${context.runId}: ubuntu-24.04 executed successfully.`
            });

  runner_probe_arm:
    needs: runner_probe_announce
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - run: uname -a && python3 --version
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `Runner probe ${context.runId}: ubuntu-24.04-arm executed successfully.`
            });

  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 9 && contains(github.event.comment.body, '/start-team-trb')) }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Announce live production run
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `Production extraction started: run ${context.runId}.`
            });
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        run: python team_trb_all_players/full_adaptive_plan.py
      - name: Confirm matrix expansion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python team_trb_all_players/workflow_status.py planned

  shards:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      PBPSTATS_SEASON: ${{ matrix.season }}
      PBPSTATS_FROM_DATE: ${{ matrix.from_date }}
      PBPSTATS_TO_DATE: ${{ matrix.to_date }}
      PBPSTATS_GROUP: ${{ matrix.group }}
      PBPSTATS_TEAM_IDS: ${{ matrix.team_ids }}
      PBPSTATS_TOP_WINDOW_DAYS: '14'
      PBPSTATS_CONNECT_TIMEOUT: '10'
      PBPSTATS_READ_TIMEOUT: '35'
      PBPSTATS_REQUEST_PAUSE: '0.45'
      PBPSTATS_OUTPUT_DIR: team_trb_all_players/full_build_output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Extract and validate five-team season shard
        run: python team_trb_all_players/full_adaptive_batch.py
      - name: Upload raw shard and validation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-trb-${{ matrix.season }}-g${{ matrix.group }}
          path: team_trb_all_players/full_build_output/**
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [plan, shards]
    if: ${{ always() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download every shard artifact
        uses: actions/download-artifact@v4
        with:
          pattern: team-trb-*
          path: all-shards
      - name: Build career leaderboard only when every shard validates
        run: python team_trb_all_players/full_adaptive_aggregate.py all-shards team_trb_all_players/full_career_output
      - name: Upload consolidated dataset and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-team-trb-complete-dataset
          path: team_trb_all_players/full_career_output/**
          if-no-files-found: error
          retention-days: 90
      - name: Report final workflow state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FINAL_STATUS: ${{ job.status }}
        run: python team_trb_all_players/workflow_status.py final
