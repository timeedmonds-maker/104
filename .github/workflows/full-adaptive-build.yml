name: Single-job resumable team rebound dataset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-adaptive-build.yml'
      - 'team_trb_all_players/full_adaptive_batch.py'
      - 'team_trb_all_players/slim_cached_batch.py'
      - 'team_trb_all_players/slim_checkpoint_plan.py'
      - 'team_trb_all_players/slim_run_one.py'
      - 'team_trb_all_players/slim_collect.py'
      - 'team_trb_all_players/slim_record_attempt.py'
      - 'team_trb_all_players/slim_checkpoint_aggregate.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: resumable-team-rebound-checkpoints
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  actions: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  STATUS_ISSUE: '9'
  PBPSTATS_CHECKPOINT_ROOT: team_trb_all_players/checkpoints
  PBPSTATS_RETRY_ROOT: team_trb_all_players/retry_state
  PBPSTATS_FINAL_MARKER: team_trb_all_players/full_career_output/aggregate_complete.json

jobs:
  cycle:
    runs-on: ubuntu-slim
    timeout-minutes: 14
    steps:
      - name: Cancel superseded VM and probe runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const stale = [
              30763698484,
              30766940270,
              30770803566,
              30770840311,
              30770923950
            ];
            for (const run_id of stale) {
              if (run_id === context.runId) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
              } catch (error) {
                core.info(`Run ${run_id} already finished or could not be cancelled: ${error.message}`);
              }
            }

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile the full checkpoint pipeline
        run: |
          python -m py_compile \
            team_trb_all_players/full_adaptive_batch.py \
            team_trb_all_players/slim_cached_batch.py \
            team_trb_all_players/slim_checkpoint_plan.py \
            team_trb_all_players/slim_run_one.py \
            team_trb_all_players/slim_collect.py \
            team_trb_all_players/slim_record_attempt.py \
            team_trb_all_players/slim_checkpoint_aggregate.py

      - name: Select one fair, incomplete team-season
        id: plan
        run: python team_trb_all_players/slim_checkpoint_plan.py

      - name: Restore this team-season's partial date windows
        if: ${{ steps.plan.outputs.has_work == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: checkpoint_work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}
          key: team-trb-work-${{ steps.plan.outputs.task_key }}-${{ github.run_id }}
          restore-keys: |
            team-trb-work-${{ steps.plan.outputs.task_key }}-

      - name: Install API dependency
        if: ${{ steps.plan.outputs.has_work == 'true' }}
        run: python -m pip install --disable-pip-version-check requests

      - name: Extract and validate the selected team-season
        if: ${{ steps.plan.outputs.has_work == 'true' }}
        id: extract_one
        env:
          PBPSTATS_SEASON: ${{ steps.plan.outputs.season }}
          PBPSTATS_FROM_DATE: ${{ steps.plan.outputs.from_date }}
          PBPSTATS_TO_DATE: ${{ steps.plan.outputs.to_date }}
          PBPSTATS_GROUP: ${{ steps.plan.outputs.group }}
          PBPSTATS_TEAM_IDS: ${{ steps.plan.outputs.team_ids }}
          PBPSTATS_TOP_WINDOW_DAYS: '14'
          PBPSTATS_CONNECT_TIMEOUT: '8'
          PBPSTATS_READ_TIMEOUT: '25'
          PBPSTATS_REQUEST_PAUSE: '0.45'
          PBPSTATS_RUNTIME_LIMIT_SECONDS: '480'
          PBPSTATS_OUTPUT_DIR: checkpoint_work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}
        run: python team_trb_all_players/slim_run_one.py

      - name: Preserve partial date windows for a later retry
        if: ${{ always() && steps.plan.outputs.has_work == 'true' && steps.extract_one.outputs.completed != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: checkpoint_work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}
          key: team-trb-work-${{ steps.plan.outputs.task_key }}-${{ github.run_id }}

      - name: Accept only a fully validated checkpoint
        if: ${{ always() && steps.plan.outputs.has_work == 'true' }}
        id: collect
        run: python team_trb_all_players/slim_collect.py checkpoint_work team_trb_all_players/checkpoints

      - name: Record retry state without blocking other team-seasons
        if: ${{ always() && steps.plan.outputs.has_work == 'true' }}
        run: |
          python team_trb_all_players/slim_record_attempt.py \
            --season '${{ steps.plan.outputs.season }}' \
            --team-id '${{ steps.plan.outputs.team_id }}' \
            --completed '${{ steps.extract_one.outputs.completed }}' \
            --timed-out '${{ steps.extract_one.outputs.timed_out }}' \
            --runner-result 'checkpoint_work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}/runner_result.json'

      - name: Recount checkpoints after this cycle
        id: after_plan
        run: python team_trb_all_players/slim_checkpoint_plan.py

      - name: Build the final career leaderboard when all 780 checkpoints exist
        if: ${{ steps.after_plan.outputs.needs_aggregate == 'true' }}
        run: python team_trb_all_players/slim_checkpoint_aggregate.py team_trb_all_players/checkpoints team_trb_all_players/full_career_output

      - name: Commit validated progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            team_trb_all_players/checkpoints \
            team_trb_all_players/retry_state \
            team_trb_all_players/full_career_output
          if git diff --cached --quiet; then
            echo "No repository progress to commit."
          else
            git commit -m "Team rebound checkpoint cycle $GITHUB_RUN_ID"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload this cycle's diagnostic payload
        if: ${{ always() && steps.plan.outputs.has_work == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-cycle-${{ steps.plan.outputs.task_key }}-${{ github.run_id }}
          path: |
            checkpoint_work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}/batch_complete.json
            checkpoint_work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}/batch_metadata.json
            checkpoint_work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}/player_team_batch.csv
            checkpoint_work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}/team_status.csv
            checkpoint_work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}/request_audit.csv
            checkpoint_work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}/window_manifest.csv
            checkpoint_work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}/runner_result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the completed career dataset
        if: ${{ steps.after_plan.outputs.needs_aggregate == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: career-team-trb-complete-dataset
          path: team_trb_all_players/full_career_output/**
          if-no-files-found: error
          retention-days: 90

      - name: Report verified cycle outcome
        if: ${{ always() && steps.plan.outputs.has_work == 'true' }}
        uses: actions/github-script@v7
        env:
          TASK_KEY: ${{ steps.plan.outputs.task_key }}
          PRIOR_ATTEMPTS: ${{ steps.plan.outputs.attempts }}
          COMPLETED: ${{ steps.extract_one.outputs.completed }}
          TIMED_OUT: ${{ steps.extract_one.outputs.timed_out }}
          BEFORE_COUNT: ${{ steps.plan.outputs.complete_count }}
          AFTER_COUNT: ${{ steps.after_plan.outputs.complete_count }}
          PENDING_TOTAL: ${{ steps.after_plan.outputs.pending_total }}
        with:
          github-token: ${{ github.token }}
          script: |
            const completed = process.env.COMPLETED === 'true';
            const result = completed ? 'validated and checkpointed' : 'incomplete; partial windows preserved for retry';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.STATUS_ISSUE),
              body: `Cycle ${context.runId}: ${process.env.TASK_KEY} ${result}. Progress ${process.env.AFTER_COUNT}/780; ${process.env.PENDING_TOTAL} pending; prior attempts ${process.env.PRIOR_ATTEMPTS}; timed out ${process.env.TIMED_OUT || 'false'}.`
            });

      - name: Report final completion
        if: ${{ steps.after_plan.outputs.done == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.STATUS_ISSUE),
              body: `Career team rebound dataset is complete and validated in run ${context.runId}.`
            });
