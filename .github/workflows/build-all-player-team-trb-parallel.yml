name: Build all-player team TRB leaderboard parallel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'team_trb_all_players/**'
      - '.github/workflows/build-all-player-team-trb-parallel.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  season:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: [2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r team_trb_all_players/requirements.txt
      - name: Collect one season
        run: |
          sed -i "s/START, END, MIN_MIN = 2000, 2025, 10000/START, END, MIN_MIN = ${{ matrix.year }}, ${{ matrix.year }}, 0/" team_trb_all_players/build.py
          python team_trb_all_players/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: season-${{ matrix.year }}
          path: team_trb_all_players/output/*
          if-no-files-found: error

  merge:
    needs: season
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: season-*
          path: season_artifacts
      - name: Merge and validate
        run: python team_trb_all_players/merge.py
      - name: Commit final verified dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf team_trb_all_players/final_output_previous
          git add team_trb_all_players/final_output
          git commit -m 'Build complete all-player team TRB leaderboard' || exit 0
          git pull --rebase
          git push
