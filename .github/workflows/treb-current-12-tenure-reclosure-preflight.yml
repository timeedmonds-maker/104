name: TREB current 12 tenure authoritative reclosure preflight
on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - 'team_trb_all_players/treb_current_12_tenure_reclosure_preflight.py'
      - '.github/workflows/treb-current-12-tenure-reclosure-preflight.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: treb-current-12-tenure-reclosure-preflight
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q pandas
      - name: Download controlling 9084/9647 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5; do
            rm -f authoritative.zip
            if gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9275527991/zip > authoritative.zip 2>/tmp/gh.err && unzip -tq authoritative.zip >/dev/null 2>&1; then
              break
            fi
            cat /tmp/gh.err || true
            sleep $((n*10))
          done
          unzip -tq authoritative.zip >/dev/null
      - name: Run bounded exact-tenure reclosure readiness gate
        run: |
          set -euo pipefail
          RES='team_trb_all_players/treb_recovery_status/artifacts/treb-current-21-static-schedule-resolution/TREB-current-21-static-schedule-resolution-32307450287/TREB_CURRENT_21_TRANSACTION_RESOLUTION.csv'
          test -f "$RES"
          python team_trb_all_players/treb_current_12_tenure_reclosure_preflight.py \
            --authoritative-zip authoritative.zip --resolution-csv "$RES" --out-dir out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-current-12-tenure-reclosure-preflight-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist reclosure readiness evidence
        if: always()
        run: |
          set -euo pipefail
          DEST="team_trb_all_players/treb_recovery_status/artifacts/treb-current-12-tenure-reclosure-preflight/TREB-current-12-tenure-reclosure-preflight-${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          if [ -d out ]; then cp -a out/. "$DEST/"; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Persist TREB 12-tenure reclosure preflight ${GITHUB_RUN_ID}"
            git pull --rebase origin agent/treb-final-exact-assembly
            git push origin HEAD:agent/treb-final-exact-assembly
          fi
