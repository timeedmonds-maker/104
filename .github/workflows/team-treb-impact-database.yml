name: Team TREB Impact Database

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - continue-team-treb-impact-database
  push:
    branches:
      - main
    paths:
      - .github/workflows/team-treb-impact-database.yml
      - team_trb_all_players/impact_database_actions_chunk.py
      - team_trb_all_players/impact_database_supervisor.py
      - team_trb_all_players/impact_database_build_fixed.py
      - team_trb_all_players/impact_database_build.py

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: team-treb-impact-database
  cancel-in-progress: false

jobs:
  build-core:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Configure checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate builder code
        run: |
          python -m py_compile \
            team_trb_all_players/impact_database_build.py \
            team_trb_all_players/impact_database_build_fixed.py \
            team_trb_all_players/impact_database_actions_chunk.py

      - name: Wait for a safe Codespace handoff
        id: handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for check in 1 2 3 4 5 6; do
            body=$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5161464311" --jq .body 2>/dev/null || true)

            if printf '%s' "$body" | grep -Fq 'Execution: **GitHub Actions**'; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "The Actions chain already owns execution."
              exit 0
            fi

            updated=$(printf '%s' "$body" | grep -oE 'Updated: [0-9T:+.-]+' | tail -1 | cut -d' ' -f2 | sed 's/\.$//' || true)
            if [ -z "$updated" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "No usable Codespace timestamp was found; Actions will take ownership."
              exit 0
            fi

            updated_epoch=$(date -u -d "$updated" +%s 2>/dev/null || echo 0)
            now_epoch=$(date -u +%s)
            age=$((now_epoch - updated_epoch))

            if [ "$updated_epoch" -gt 0 ] && [ "$age" -ge 300 ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "Codespace status is ${age}s old; Actions will take ownership."
              exit 0
            fi

            echo "Codespace is still reporting recent activity; handoff check $check/6."
            sleep 60
          done

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Codespace remained active during this handoff window. A retry will be queued."

      - name: Run bounded two-worker chunk
        id: chunk
        if: steps.handoff.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMPACT_DB_CORE_WORKERS: "2"
          IMPACT_DB_CORE_COMMIT_EVERY: "6"
          IMPACT_DB_HEARTBEAT_SECONDS: "120"
          IMPACT_DB_WATCHDOG_SECONDS: "1200"
          IMPACT_DB_RUN_SECONDS: "15000"
          TEAM_TRB_STATUS_COMMENT_ID: "5161464311"
        run: |
          set +e
          python team_trb_all_players/impact_database_actions_chunk.py
          rc=$?
          echo "runner_exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "Chunk runner exited with code $rc; cleanup and continuation logic will now run."
          exit 0

      - name: Commit and push any final local checkpoints
        if: always() && steps.handoff.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git add -A -- team_trb_all_players/impact_database
          if ! git diff --cached --quiet; then
            git commit -m "Impact database progress: Actions final checkpoint"
          fi

          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Final checkpoint sync attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done

          echo "Unable to push the final local checkpoint after six attempts."
          exit 1

      - name: Determine completion state
        id: state
        if: always()
        run: |
          count=$(python - <<'PY'
          import sys
          sys.path.insert(0, "team_trb_all_players")
          import impact_database_build as base
          print(base.completed_count("core"))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ge 780 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Verified core checkpoint count: $count/780"

      - name: Publish automatic-continuation status
        if: always() && steps.handoff.outputs.ready == 'true' && steps.state.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_COUNT: ${{ steps.state.outputs.count }}
          RUNNER_EXIT_CODE: ${{ steps.chunk.outputs.runner_exit_code }}
        run: |
          updated=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          body=$(cat <<EOF
          **NBA historical player-impact database build**

          Core player/team on-off layer: **${CORE_COUNT}/780** team-seasons.

          Teammate interaction layer: **disabled — not part of this build**.

          Execution: **GitHub Actions**. The latest bounded chunk ended with runner code ${RUNNER_EXIT_CODE:-unknown}. A continuation is being queued automatically. Updated: ${updated}.
          EOF
          )
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/5161464311" \
            -f "body=$body"

      - name: Queue the next handoff or build chunk
        if: always() && steps.state.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_COUNT: ${{ steps.state.outputs.count }}
          HANDOFF_READY: ${{ steps.handoff.outputs.ready }}
        run: |
          sleep 30
          python - <<'PY'
          import json
          import os

          payload = {
              "event_type": "continue-team-treb-impact-database",
              "client_payload": {
                  "previous_run_id": os.environ["GITHUB_RUN_ID"],
                  "core_complete": os.environ.get("CORE_COUNT", "unknown"),
                  "handoff_ready": os.environ.get("HANDOFF_READY", "unknown"),
              },
          }
          with open("/tmp/team-treb-dispatch.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input /tmp/team-treb-dispatch.json
          echo "Queued the next Team TREB Actions run."

      - name: Confirm completion
        if: always() && steps.state.outputs.complete == 'true'
        run: echo "Core historical player-impact database is complete at 780/780. No continuation was queued."
