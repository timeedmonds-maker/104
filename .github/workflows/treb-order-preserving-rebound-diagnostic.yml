name: TREB order-preserving rebound diagnostic

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - .github/workflows/treb-order-preserving-rebound-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  diagnose:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        year: [2008,2009,2010,2011,2015,2017,2018,2019,2021,2022,2023,2024]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Fetch residual targets and season sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"; mkdir -p "$RAW"
          git fetch --quiet origin treb-game-fact-repair-wave1
          git show origin/treb-game-fact-repair-wave1:team_trb_all_players/final_integrity_rebuild/game_fact_repair_wave1/${YEAR}/residual_failures.json > /tmp/residual.json
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          y=int('${{ matrix.year }}'); raw=Path(f'/tmp/trebraw-{y}')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode(); urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in [f'nbastats_{y}',f'nbastatsv3_{y}',f'pbpstats_{y}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]; subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Prove unique chronological assignments
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"; NBA=$(find "$RAW" -name "nbastats_${YEAR}.csv" -print -quit); V3=$(find "$RAW" -name "nbastatsv3_${YEAR}.csv" -print -quit); PBP=$(find "$RAW" -name "pbpstats_${YEAR}.csv" -print -quit)
          python -u team_trb_all_players/order_preserving_rebound_diagnostic.py --nba "$NBA" --v3 "$V3" --pbp "$PBP" --residual /tmp/residual.json --year "$YEAR" --output "/tmp/ORDER_${YEAR}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'treb-order-${{ matrix.year }}', path: '/tmp/ORDER_${{ matrix.year }}.json', retention-days: 90}
  aggregate:
    needs: diagnose
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: 'treb-order-*', path: /tmp/results}
      - name: Aggregate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          chunks=[]
          for p in Path('/tmp/results').rglob('ORDER_*.json'):
              try: chunks.append(json.loads(p.read_text()))
              except Exception: pass
          games=[g for c in chunks for g in c.get('games',[])]; analyzed=[g for g in games if g.get('status')=='OK']; solvable=[g for g in analyzed if g.get('all_unmatched_uniquely_assigned')]
          out={'status':'COMPLETE' if len(chunks)==12 else 'PARTIAL','chunks':len(chunks),'games_analyzed':len(analyzed),'games_all_unmatched_uniquely_assigned':len(solvable),'unmatched_rows':sum(g.get('unmatched_rows',0) for g in analyzed),'uniquely_assigned_rows_in_fully_unique_periods':sum(g.get('assigned_rows',0) for g in solvable),'control_applicable':sum(c.get('control_applicable',0) for c in chunks),'control_correct':sum(c.get('control_correct',0) for c in chunks),'control_wrong':sum(c.get('control_wrong',0) for c in chunks),'solvable_games':[g['game_id'] for g in solvable],'games':games}
          out['promotion_candidate']=bool(out['status']=='COMPLETE' and out['control_wrong']==0 and out['games_all_unmatched_uniquely_assigned']>0)
          Path('/tmp/ORDER_PRESERVING_REBOUND_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps({k:v for k,v in out.items() if k!='games'},indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git fetch origin agent/treb-batched-game-facts-20260812; git reset --hard origin/agent/treb-batched-game-facts-20260812
          DEST=team_trb_all_players/final_integrity_rebuild/order_preserving_rebound; mkdir -p "$DEST"; cp /tmp/ORDER_PRESERVING_REBOUND_SUMMARY.json "$DEST"/; git add -f "$DEST/ORDER_PRESERVING_REBOUND_SUMMARY.json"; if ! git diff --cached --quiet; then git commit -m 'Persist order-preserving rebound diagnostic'; git push origin HEAD:agent/treb-batched-game-facts-20260812; fi
