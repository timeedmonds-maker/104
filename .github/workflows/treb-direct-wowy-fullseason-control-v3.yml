name: TREB direct WOWY fullseason control v3

on:
  workflow_dispatch:
  push:
    branches:
      - agent/treb-final-exact-assembly
    paths:
      - .github/workflows/treb-direct-wowy-fullseason-control-v3.yml

permissions:
  actions: read
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Download exact state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/exact /tmp/out
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9260774395/zip > /tmp/exact.zip
          unzip -q /tmp/exact.zip -d /tmp/exact
      - name: Run control gate
        run: python -u team_trb_all_players/direct_wowy_fullseason_control_v2.py /tmp/exact /tmp/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-direct-WOWY-fullseason-control-v3-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
