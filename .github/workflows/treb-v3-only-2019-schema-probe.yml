name: TREB v3-only 2019 schema probe

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-v3-only-2019-schema-probe.yml
      - team_trb_all_players/probe_v3_only_2019_schema.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Download v3 2019 and CC0 PlayerStatistics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v3 /tmp/cc0
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          raw=Path('/tmp/v3')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          url=urls['nbastatsv3_2019'];arc=raw/url.rsplit('/',1)[-1]
          subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--output',str(arc),url],check=True)
          with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/cc0/dataset.zip 'https://www.kaggle.com/api/v1/datasets/download/eoinamoore/historical-nba-data-and-player-box-scores'
          unzip -j /tmp/cc0/dataset.zip 'PlayerStatistics.csv' -d /tmp/cc0 || unzip -j /tmp/cc0/dataset.zip '*/PlayerStatistics.csv' -d /tmp/cc0
      - name: Probe v3-only schema
        run: |
          python -u team_trb_all_players/probe_v3_only_2019_schema.py \
            --v3 /tmp/v3/nbastatsv3_2019.csv \
            --playerstatistics /tmp/cc0/PlayerStatistics.csv \
            --output /tmp/V3_ONLY_2019_SCHEMA_PROBE.json
      - name: Commit evidence durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          cp /tmp/V3_ONLY_2019_SCHEMA_PROBE.json team_trb_all_players/final_integrity_rebuild/V3_ONLY_2019_SCHEMA_PROBE.json
          git add team_trb_all_players/final_integrity_rebuild/V3_ONLY_2019_SCHEMA_PROBE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record v3-only 2019 game schema evidence"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
