name: Issue-triggered all-player team TRB build

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  build:
    if: startsWith(github.event.issue.title, 'Run complete all-player team TRB build')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Build dataset
        run: python team_trb_all_players/build.py
      - name: Validate output
        run: |
          test -f team_trb_all_players/output/career_team_trb_leaderboard.csv
          test -f team_trb_all_players/output/player_team_season_detail.csv
          test -f team_trb_all_players/output/metadata.json
          python - <<'PY'
          import json
          p='team_trb_all_players/output/metadata.json'
          m=json.load(open(p))
          assert m['failed_team_seasons']==0, m
          assert m['qualifying_players']>100, m
          assert m['detail_rows']>3000, m
          print(m)
          PY
      - name: Commit completed dataset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add team_trb_all_players/output
          git commit -m 'Complete all-player career team TRB dataset' || true
          git push
      - name: Comment success
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Completed and committed the validated all-player team TRB dataset.'
            })
