name: TREB completion supervisor

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-completion-supervisor.yml]

permissions:
  contents: write

concurrency:
  group: treb-final-completion-supervisor
  cancel-in-progress: false

jobs:
  rebound-semantics-2025-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - name: Download static 2025 source pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb2025
          python - <<'PY'
          from pathlib import Path
          import subprocess, tarfile, urllib.request
          raw = Path('/tmp/treb2025')
          text = urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls = {line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in ('nbastatsv3_2025','cdnnba_2025'):
              url = urls[key]
              arc = raw / url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url], check=True)
              with tarfile.open(arc,'r:xz') as tf:
                  tf.extractall(raw)
          PY
      - name: Validate two-source 2025 rebound semantics
        run: |
          mkdir -p /tmp/treb2025/out
          python -u team_trb_all_players/validate_2025_rebound_semantics.py \
            --cdn /tmp/treb2025/cdnnba_2025.csv \
            --nba /tmp/treb2025/nbastatsv3_2025.csv \
            --output /tmp/treb2025/out/REBOUND_SEMANTICS_2025_CANARY.json \
            | tee /tmp/treb2025/out/validator_stdout.txt
      - name: Upload canary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treb-rebound-semantics-2025-canary-${{ github.run_id }}
          path: /tmp/treb2025/out/
          retention-days: 90
          if-no-files-found: error
      - name: Persist canary checkpoint
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p treb_automation/status
          cp /tmp/treb2025/out/REBOUND_SEMANTICS_2025_CANARY.json treb_automation/status/REBOUND_SEMANTICS_2025_CANARY_LATEST.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add treb_automation/status/REBOUND_SEMANTICS_2025_CANARY_LATEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist TREB 2025 rebound semantic canary [skip ci]'
            git fetch origin agent/treb-final-exact-assembly
            git rebase origin/agent/treb-final-exact-assembly
            git push origin HEAD:agent/treb-final-exact-assembly
          fi
