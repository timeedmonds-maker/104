name: Observable all-player team TRB build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'team_trb_trigger/**'
      - 'team_trb_all_players/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build complete 2000-01 through 2025-26 leaderboard
        env:
          PBPSTATS_WORKERS: '8'
        run: python team_trb_all_players/hf_schema_diagnostic.py
      - name: Upload complete dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-player-team-trb-dataset
          path: team_trb_all_players/output/**
          if-no-files-found: warn
