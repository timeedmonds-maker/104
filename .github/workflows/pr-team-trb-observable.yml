name: Observable all-player team TRB build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'team_trb_trigger/**'
      - 'team_trb_all_players/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml pandas
      - name: Run source diagnostic
        run: python team_trb_all_players/build.py
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-trb-smoke-output
          path: team_trb_all_players/output/**
          if-no-files-found: warn

  full:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml pandas
      - name: Run complete build
        run: python team_trb_all_players/build.py
      - name: Upload complete dataset
        uses: actions/upload-artifact@v4
        with:
          name: all-player-team-trb-dataset
          path: team_trb_all_players/output/**
          if-no-files-found: error
