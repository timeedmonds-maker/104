name: Observable all-player team TRB build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'team_trb_trigger/**'
      - 'team_trb_all_players/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests
      - name: Inspect static parquet source
        run: python team_trb_all_players/hf_schema_diagnostic.py
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-trb-smoke-output
          path: team_trb_all_players/output/**
          if-no-files-found: warn

  full:
    needs: smoke
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Full build enabled after schema validation'
