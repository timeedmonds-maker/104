name: Observable all-player team TRB build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'team_trb_trigger/**'
      - 'team_trb_all_players/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run one-season diagnostic
        run: |
          python - <<'PY'
          import pathlib
          p=pathlib.Path('team_trb_all_players/build.py')
          s=p.read_text()
          s=s.replace('START, END, MIN_MIN = 2000, 2025, 10000','START, END, MIN_MIN = 2024, 2024, 0')
          pathlib.Path('/tmp/build_smoke.py').write_text(s)
          PY
          python /tmp/build_smoke.py
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-trb-smoke-output
          path: team_trb_all_players/output/**
          if-no-files-found: warn

  full:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run complete build
        run: python team_trb_all_players/build.py
      - name: Validate complete output
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('team_trb_all_players/output/metadata.json')
          m=json.loads(p.read_text())
          assert m['failed_team_seasons']==0, m
          assert m['detail_rows']>3000, m
          assert m['qualifying_players']>100, m
          print(m)
          PY
      - name: Upload complete dataset
        uses: actions/upload-artifact@v4
        with:
          name: all-player-team-trb-dataset
          path: team_trb_all_players/output/**
          if-no-files-found: error
