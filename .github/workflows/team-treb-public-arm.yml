name: Team TREB public ARM runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/team-treb-public-arm.yml'
  workflow_dispatch:
  repository_dispatch:
    types:
      - continue-team-treb-public-arm

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: team-treb-public-arm
  cancel-in-progress: false

jobs:
  impact_core:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330

    steps:
      - name: Announce GitHub Actions ownership
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: comment } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: 5161464311
            });
            const match = (comment.body || '').match(/Core player\/team on-off layer:\s*\*\*(\d+)\/780\*\*/);
            const count = match ? match[1] : '279';
            const body = `**NBA historical player-impact database build**\n\nCore player/team on-off layer: **${count}/780** team-seasons.\n\nTeammate interaction layer: **disabled — not part of this build**.\n\nExecution: **GitHub Actions**. Public ARM hosted runner chunk started. Updated: ${new Date().toISOString()}.`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: 5161464311,
              body
            });

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate collector
        run: |
          python -m py_compile \
            team_trb_all_players/impact_database_build.py \
            team_trb_all_players/impact_database_build_fixed.py \
            team_trb_all_players/impact_database_actions_chunk.py

      - name: Run bounded two-worker chunk
        id: chunk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMPACT_DB_CORE_WORKERS: '2'
          IMPACT_DB_CORE_COMMIT_EVERY: '6'
          IMPACT_DB_HEARTBEAT_SECONDS: '120'
          IMPACT_DB_WATCHDOG_SECONDS: '1200'
          IMPACT_DB_RUN_SECONDS: '15000'
          TEAM_TRB_STATUS_COMMENT_ID: '5161464311'
        run: |
          set +e
          python team_trb_all_players/impact_database_actions_chunk.py
          rc=$?
          echo "runner_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and push checkpoints
        if: always()
        run: |
          set -euo pipefail
          git add -A -- team_trb_all_players/impact_database
          if ! git diff --cached --quiet; then
            git commit -m "Impact database progress: public ARM Actions checkpoint"
          fi
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

      - name: Determine completion
        id: state
        if: always()
        run: |
          count=$(python - <<'PY'
          import sys
          sys.path.insert(0, "team_trb_all_players")
          import impact_database_build as base
          print(base.completed_count("core"))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ge 780 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish continuation status
        if: always() && steps.state.outputs.complete != 'true'
        uses: actions/github-script@v7
        env:
          CORE_COUNT: ${{ steps.state.outputs.count }}
          RUNNER_EXIT_CODE: ${{ steps.chunk.outputs.runner_exit_code }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = `**NBA historical player-impact database build**\n\nCore player/team on-off layer: **${process.env.CORE_COUNT}/780** team-seasons.\n\nTeammate interaction layer: **disabled — not part of this build**.\n\nExecution: **GitHub Actions**. Public ARM chunk ended with runner code ${process.env.RUNNER_EXIT_CODE || 'unknown'}; continuation queued. Updated: ${new Date().toISOString()}.`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: 5161464311,
              body
            });

      - name: Queue continuation
        if: always() && steps.state.outputs.complete != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await new Promise(resolve => setTimeout(resolve, 30000));
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'continue-team-treb-public-arm'
            });
