# Runner allocation diagnostic v2
name: Runner diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-diagnostic.yml'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: runner-diagnostic
  cancel-in-progress: true

jobs:
  announce:
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.number == 9 && contains(github.event.comment.body, '/runner-diagnostic')) }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `Runner diagnostic started: run ${context.runId}.`
            });

  slim:
    needs: announce
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: uname -a && python3 --version
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `Runner diagnostic ${context.runId}: ubuntu-slim executed successfully.`
            });

  x64:
    needs: announce
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: uname -a && python3 --version
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `Runner diagnostic ${context.runId}: ubuntu-24.04 executed successfully.`
            });

  arm:
    needs: announce
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - run: uname -a && python3 --version
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `Runner diagnostic ${context.runId}: ubuntu-24.04-arm executed successfully.`
            });
