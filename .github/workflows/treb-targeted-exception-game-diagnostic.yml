name: TREB targeted exception game diagnostic

on:
  push:
    branches: [treb-final-production-20260812]
    paths:
      - .github/workflows/treb-targeted-exception-game-diagnostic.yml
      - team_trb_all_players/diagnose_historical_exception_games.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  diagnose:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: [2002,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - run: python -m pip install -r team_trb_all_players/requirements.txt
      - name: Download legacy and v3 feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb-exception-${{ matrix.year }}
          YEAR=${{ matrix.year }} python - <<'PY'
          import os,subprocess,tarfile,urllib.request
          from pathlib import Path
          y=int(os.environ['YEAR']); raw=Path(f'/tmp/treb-exception-{y}')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in (f'nbastats_{y}',f'nbastatsv3_{y}'):
              if key not in urls: continue
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Re-test only exception games
        shell: bash
        run: |
          set -euo pipefail
          v3="/tmp/treb-exception-${{ matrix.year }}/nbastatsv3_${{ matrix.year }}.csv"
          args=()
          if [ -f "$v3" ]; then args+=(--v3 "$v3"); fi
          python -u team_trb_all_players/diagnose_historical_exception_games.py \
            --year ${{ matrix.year }} \
            --control team_trb_all_players/impact_database/HISTORICAL_EXCEPTION_GAMES.json \
            --nba /tmp/treb-exception-${{ matrix.year }}/nbastats_${{ matrix.year }}.csv \
            "${args[@]}" \
            --output /tmp/treb-exception-${{ matrix.year }}/exception_diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-exception-diagnostic-${{ matrix.year }}-${{ github.sha }}
          path: /tmp/treb-exception-${{ matrix.year }}/exception_diagnostic.json
          retention-days: 90
          if-no-files-found: error
