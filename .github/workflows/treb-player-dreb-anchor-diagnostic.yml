name: TREB player DREB anchor diagnostic

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths: [.github/workflows/treb-player-dreb-anchor-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  MANIFEST: team_trb_all_players/final_integrity_rebuild/rebound_forensics/CHUNKED_REBOUND_MANIFEST.json
  SOURCE_RUN_ID: '31634201123'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path(os.environ['MANIFEST']).read_text()); assert len(m['chunks'])==24 and m['target_games']==58
          matrix={'include':[{'chunk_id':c['chunk_id'],'year':int(c['year']),'games':','.join(map(str,c['game_ids']))} for c in m['chunks']]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
          PY

  diagnose:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy rapidfuzz
      - uses: actions/download-artifact@v4
        with:
          name: treb-residual-source-${{ matrix.year }}-${{ env.SOURCE_RUN_ID }}
          path: /tmp/source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: DREB counter truth plus two independent lineup anchors
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          GAMES: ${{ matrix.games }}
          CHUNK_ID: ${{ matrix.chunk_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import local_treb_rebuild as core
          import production_rebound_v4 as rebound
          import production_treb_engine_v3 as lineup_engine
          import run_local_treb_production as io

          y=int(os.environ['YEAR']); ids=[int(x) for x in os.environ['GAMES'].split(',') if x]
          nba=io.normalize_nba(pd.read_csv(f'/tmp/source/nbastats_{y}.csv',low_memory=False)); v3=lineup_engine.normalize_v3(pd.read_csv(f'/tmp/source/nbastatsv3_{y}.csv',low_memory=False)); pbp=io.normalize_pbp(pd.read_csv(f'/tmp/source/pbpstats_{y}.csv',low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}; vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}; pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}
          counter_re=re.compile(r'^(.*?)\s+REBOUND\s+\(Off:(\d+) Def:(\d+)\)',re.I)
          def norm(v): return re.sub(r'\s+',' ','' if pd.isna(v) else str(v)).strip().lower()
          def make_rows(p):
              x=p.copy(); x['PREV_PBP_DESCRIPTION']=x.groupby(core.POSSESSION_ID,dropna=False).DESCRIPTION.shift(1)
              r=x[x.DESCRIPTION.fillna('').str.contains('rebound',case=False)].copy()
              r['END_ELAPSED']=[core.elapsed_seconds(int(period),clock) for period,clock in zip(r.PERIOD,r.ENDTIME)]
              return r
          def rebound_kind_map(rows):
              prev={}; out={}
              for idx,row in rows.sort_index().iterrows():
                  m=counter_re.search(str(row.DESCRIPTION))
                  if not m: continue
                  key=norm(m.group(1)); off=int(m.group(2)); de=int(m.group(3)); po,pd=prev.get(key,(0,0))
                  kind=None
                  if off==po+1 and de==pd: kind='OREB'
                  elif de==pd+1 and off==po: kind='DREB'
                  # Counter resets/non-monotone rows are not evidence; only advance on monotone plausible observations.
                  if off>=po and de>=pd: prev[key]=(off,de)
                  out[idx]={'player_key':key,'off':off,'def':de,'prev_off':po,'prev_def':pd,'kind':kind}
              return out
          def endpoint(events,period,t,exclude=None,radius=5):
              ev=events[events.PERIOD.eq(period)].sort_values(['ELAPSED','EVENTNUM'],kind='stable')
              if exclude is not None: ev=ev[ev.index!=exclude]
              if bool(ev[ev.ELAPSED.ge(t-radius)&ev.ELAPSED.le(t+radius)].EVENTMSGTYPE.eq(8).any()): return None
              bef=ev[ev.ELAPSED.le(t)]; aft=ev[ev.ELAPSED.ge(t)]
              if bef.empty or aft.empty:return None
              a=tuple(int(x) for x in bef.iloc[-1].LINEUP); b=tuple(int(x) for x in aft.iloc[0].LINEUP)
              return a if a==b else None
          controls={k:0 for k in ['kind_applicable','kind_correct','kind_wrong','endpoint_applicable','endpoint_correct','endpoint_wrong','miss_applicable','miss_correct','miss_wrong','both_applicable','both_correct','both_wrong']}
          residual=[]
          for gid in ids:
              lu=lineup_engine.reconstruct_game_lineups(ng[gid],vg[gid]); joined,audit=rebound.join_pbp_rebounds(lu,pg[gid]); events=lu.events; rows=make_rows(pg[gid]); kinds=rebound_kind_map(rows)
              for idx,row in rows.iterrows():
                  k=kinds.get(idx); is_dreb=bool(k and k['kind']=='DREB')
                  prev_desc=norm(row.PREV_PBP_DESCRIPTION)
                  mh=events[events.PERIOD.eq(row.PERIOD)&events.DESCRIPTION_NORM.eq(prev_desc)&events.EVENTMSGTYPE.isin([2,3])]
                  miss=None; miss_source=None
                  if len(mh)==1:
                      mi=int(mh.index[0]); miss=tuple(int(x) for x in events.loc[mi,'LINEUP']); miss_source={'eventnum':int(events.loc[mi,'EVENTNUM']),'elapsed':int(events.loc[mi,'ELAPSED']),'description':str(events.loc[mi,'DESCRIPTION_NORM']),'eventmsgtype':int(events.loc[mi,'EVENTMSGTYPE'])}
                  if idx in joined.index and pd.notna(joined.loc[idx,'NBA_INDEX']):
                      ni=int(joined.loc[idx,'NBA_INDEX']); actual=tuple(int(x) for x in events.loc[ni,'LINEUP']); actual_real=bool(core._nba_real_rebound(events,ni))
                      if k and k['kind'] in {'DREB','OREB'}:
                          controls['kind_applicable']+=1
                          # NBA real rebound + locked classifier OREB gives independent kind truth.
                          classified=core.classify_rebounds(joined.copy())
                          actual_kind='OREB' if bool(classified.loc[idx].IS_OREB) else ('DREB' if actual_real else None)
                          if actual_kind==k['kind']:controls['kind_correct']+=1
                          else:controls['kind_wrong']+=1
                      if is_dreb:
                          ep=endpoint(events,int(row.PERIOD),int(row.END_ELAPSED),exclude=ni)
                          if ep is not None:
                              controls['endpoint_applicable']+=1
                              if ep==actual:controls['endpoint_correct']+=1
                              else:controls['endpoint_wrong']+=1
                          if miss is not None:
                              controls['miss_applicable']+=1
                              if miss==actual:controls['miss_correct']+=1
                              else:controls['miss_wrong']+=1
                          if ep is not None and miss is not None and ep==miss:
                              controls['both_applicable']+=1
                              if ep==actual:controls['both_correct']+=1
                              else:controls['both_wrong']+=1
                  elif idx not in joined.index:
                      ep=endpoint(events,int(row.PERIOD),int(row.END_ELAPSED),exclude=None) if is_dreb else None
                      residual.append({'game_id':gid,'pbp_index':int(idx),'period':int(row.PERIOD),'start_time':str(row.STARTTIME),'end_time':str(row.ENDTIME),'description':str(row.DESCRIPTION),'previous_description':'' if pd.isna(row.PREV_PBP_DESCRIPTION) else str(row.PREV_PBP_DESCRIPTION),'counter_evidence':k,'is_counter_dreb':is_dreb,'endpoint_lineup':list(ep) if ep is not None else None,'prior_miss_lineup':list(miss) if miss is not None else None,'anchors_agree':bool(ep is not None and miss is not None and ep==miss),'prior_miss_source':miss_source})
          out={'chunk_id':os.environ['CHUNK_ID'],'year':y,'controls':controls,'residual_rows':residual}
          Path('/tmp').joinpath('DREB_'+os.environ['CHUNK_ID']+'.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({'chunk_id':out['chunk_id'],'year':y,'controls':controls,'residual_rows':len(residual)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: treb-dreb-anchor-${{ matrix.chunk_id }}-${{ github.run_id }}
          path: /tmp/DREB_${{ matrix.chunk_id }}.json
          retention-days: 90

  aggregate:
    needs: [plan, diagnose]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-dreb-anchor-*-${{ github.run_id }}
          path: /tmp/results
      - name: Strict DREB-only control gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          chunks=[json.loads(p.read_text()) for p in sorted(Path('/tmp/results').rglob('DREB_*.json'))]; assert len(chunks)==24,len(chunks)
          keys=['kind_applicable','kind_correct','kind_wrong','endpoint_applicable','endpoint_correct','endpoint_wrong','miss_applicable','miss_correct','miss_wrong','both_applicable','both_correct','both_wrong']
          c={k:sum(int(x['controls'][k]) for x in chunks) for k in keys}; residual=[r for x in chunks for r in x['residual_rows']]; assert len(residual)==77,len(residual)
          kind_safe=c['kind_applicable']>0 and c['kind_wrong']==0
          endpoint_safe=c['endpoint_applicable']>0 and c['endpoint_wrong']==0
          miss_safe=c['miss_applicable']>0 and c['miss_wrong']==0
          both_safe=c['both_applicable']>0 and c['both_wrong']==0
          candidates=[]
          # Prefer the strongest rule: counter-proven DREB + two independently derived lineup anchors agree.
          for r in residual:
              if kind_safe and both_safe and r['is_counter_dreb'] and r['anchors_agree']:
                  x=dict(r); x['lineup']=x['endpoint_lineup']; x['real']=True; x['method']='counter_dreb_plus_agreeing_endpoint_and_exact_prior_miss_lineups'; candidates.append(x)
          bygame={}
          for r in residual:bygame.setdefault(int(r['game_id']),[]).append(r)
          keys2={(int(r['game_id']),int(r['pbp_index'])) for r in candidates}; full=sorted(g for g,rs in bygame.items() if all((g,int(r['pbp_index'])) in keys2 for r in rs))
          out={'status':'COMPLETE','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'controls':c,'counter_kind_rule_safe':kind_safe,'dreb_endpoint_rule_safe':endpoint_safe,'dreb_prior_miss_rule_safe':miss_safe,'dreb_agreeing_anchors_rule_safe':both_safe,'current_residual_rows':77,'repairable_rows':len(candidates),'fully_repairable_games':len(full),'fully_repairable_game_ids':full,'repair_candidates':candidates,'residual_rows':residual}
          Path('/tmp/PLAYER_DREB_ANCHOR_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k not in {'repair_candidates','residual_rows'}},indent=2))
          PY
      - name: Persist durable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-batched-game-facts-20260812; git reset --hard origin/agent/treb-batched-game-facts-20260812
          D=team_trb_all_players/final_integrity_rebuild/rebound_forensics; cp /tmp/PLAYER_DREB_ANCHOR_SUMMARY.json "$D/"
          git add -f "$D/PLAYER_DREB_ANCHOR_SUMMARY.json"
          if ! git diff --cached --quiet; then git commit -m 'Persist DREB-only rebound anchor diagnostic'; git push origin HEAD:agent/treb-batched-game-facts-20260812; fi
      - uses: actions/upload-artifact@v4
        with:
          name: treb-player-dreb-anchor-summary-${{ github.run_id }}
          path: /tmp/PLAYER_DREB_ANCHOR_SUMMARY.json
          retention-days: 90
