name: TREB Adams locked-classifier canary
on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths: [.github/workflows/treb-adams-locked-classifier-canary.yml]
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Download 2016 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          raw=Path('/tmp/raw')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in ['nbastats_2016','nbastatsv3_2016','pbpstats_2016']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Compare V3 lineup with locked classifier
        shell: bash
        run: |
          set -euo pipefail
          NBA=$(find /tmp/raw -name 'nbastats_2016.csv' -print -quit)
          V3=$(find /tmp/raw -name 'nbastatsv3_2016.csv' -print -quit)
          PBP=$(find /tmp/raw -name 'pbpstats_2016.csv' -print -quit)
          NBA="$NBA" V3="$V3" PBP="$PBP" python - <<'PY'
          import json,os,sys
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import local_treb_rebuild as locked
          import production_treb_engine_v3 as v3eng
          ADAMS=203500
          expected={'seconds_on':143368,'team_oreb_on':816,'team_dreb_on':1846,'opponent_oreb_on':643,'opponent_dreb_on':1632}
          nba=io.normalize_nba(pd.read_csv(os.environ['NBA'],low_memory=False))
          v3=v3eng.normalize_v3(pd.read_csv(os.environ['V3'],low_memory=False))
          pbp=io.normalize_pbp(pd.read_csv(os.environ['PBP'],low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}
          vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}
          pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}
          ids=sorted(int(g) for g in pbp.loc[pbp.OPPONENT.astype(str).eq('OKC'),'GAMEID'].unique())
          out={k:0 for k in expected}; games=0; unmatched=0
          for gid in ids:
              lu=v3eng.reconstruct_game_lineups(ng[gid],vg[gid])
              joined,a=locked.join_pbp_rebounds(lu,pg[gid])
              unmatched += int(a['unmatched_rebound_bearing_rows'])
              j=locked.classify_rebounds(joined)
              real=j.IS_REAL_REBOUND.astype(bool); off=j.IS_OREB.astype(bool); on=j.LINEUP.map(lambda x: ADAMS in x)
              okc_off=~j.OPPONENT.astype(str).eq('OKC'); okc_def=~okc_off
              out['seconds_on']+=int(lu.seconds.get(ADAMS,0))
              out['team_oreb_on']+=int((on&okc_off&real&off).sum())
              out['team_dreb_on']+=int((on&okc_def&real&~off).sum())
              out['opponent_oreb_on']+=int((on&okc_def&real&off).sum())
              out['opponent_dreb_on']+=int((on&okc_off&real&~off).sum())
              games += int(lu.seconds.get(ADAMS,0)>0)
          payload={'games':games,'unmatched':unmatched,'observed':out,'expected':expected,'diffs':{k:out[k]-expected[k] for k in expected}}
          print(json.dumps(payload,indent=2))
          assert games==80 and unmatched==0 and out==expected, payload
          PY
