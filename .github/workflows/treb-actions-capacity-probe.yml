name: TREB Actions capacity probe

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Capacity probe
        run: |
          echo "TREB_ACTIONS_CAPACITY_PROBE_STARTED=1"
          uname -a
          python3 --version || true
