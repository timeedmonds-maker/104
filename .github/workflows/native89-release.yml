name: Native 89 metric final release
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - scripts/build_native89_release.py
      - .github/workflows/native89-release.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 57ba237c36d75f7a3ef2cc998d91aa70a59b3c29
      - name: Diagnose established Stage2 key structure
        run: |
          python - <<'PY'
          import gzip,json,collections
          p='team_trb_all_players/impact_database/corrected_off/tenure_segment_on_off.jsonl.gz'
          rows=[]
          with gzip.open(p,'rt') as f:
            for line in f:
              if line.strip(): rows.append(json.loads(line))
          by=collections.defaultdict(list)
          for r in rows: by[(str(r['season']),str(r['player_id']),str(r['team_id']),str(r['metric']))].append(r)
          keys={(k[0],k[1],k[2]) for k in by}
          counts=collections.Counter(len(v) for v in by.values())
          incomplete=collections.Counter()
          confid=collections.Counter(); boundary=collections.Counter(); sources=collections.Counter()
          for r in rows:
            incomplete[str(r.get('complete'))]+=1; confid[str(r.get('tenure_confidence'))]+=1; boundary[str(r.get('boundary_resolution'))]+=1; sources[str(r.get('collection_source'))]+=1
          print('ROWS',len(rows),'KEYS',len(keys),'KEY_METRICS',len(by),'MULTIPLICITY',dict(counts))
          print('COMPLETE',dict(incomplete)); print('CONFIDENCE',dict(confid)); print('BOUNDARY',dict(boundary)); print('SOURCES',dict(sources))
          # Show key-level metric counts and segment multiplicity distribution; enough to establish canonicalisation without guessing.
          km=collections.Counter()
          for s,pid,tid,m in by: km[(s,pid,tid)]+=1
          print('METRICS_PER_KEY',dict(collections.Counter(km.values())))
          seg=collections.Counter()
          for k,v in by.items(): seg[(k[0],k[1],k[2])]=max(seg[(k[0],k[1],k[2])],len(v))
          print('MAX_SEGMENTS_PER_KEY',dict(collections.Counter(seg.values())))
          # Persist compact diagnostics.
          import pathlib
          pathlib.Path('native89_diag.txt').write_text('\n'.join([
            f'rows={len(rows)}',f'keys={len(keys)}',f'key_metrics={len(by)}',f'multiplicity={dict(counts)}',
            f'complete={dict(incomplete)}',f'confidence={dict(confid)}',f'boundary={dict(boundary)}',f'metrics_per_key={dict(collections.Counter(km.values()))}',f'max_segments_per_key={dict(collections.Counter(seg.values()))}'
          ])+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native89-key-diagnostic-${{ github.run_id }}
          path: native89_diag.txt
          if-no-files-found: error
          retention-days: 30