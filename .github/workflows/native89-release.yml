name: Native 89 metric final release
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 57ba237c36d75f7a3ef2cc998d91aa70a59b3c29
      - name: Validate and package complete native 89-metric Stage2 database
        run: |
          python - <<'PY'
          import gzip,json,csv,collections,zipfile,hashlib,pathlib
          src='team_trb_all_players/impact_database/corrected_off/tenure_segment_on_off.jsonl.gz'
          rows=[]
          with gzip.open(src,'rt') as f:
            for line in f:
              if line.strip(): rows.append(json.loads(line))
          metrics={str(r['metric']) for r in rows}; keys={(str(r['season']),str(r['player_id']),str(r['team_id'])) for r in rows}
          keymetrics={(str(r['season']),str(r['player_id']),str(r['team_id']),str(r['metric'])) for r in rows}
          assert len(metrics)==89,(len(metrics),'metrics')
          assert len(keys)==14600,(len(keys),'keys')
          assert len(keymetrics)==1299400,(len(keymetrics),'keymetrics')
          assert all(r.get('complete') is True for r in rows),'incomplete rows'
          assert all(r.get('on') is not None and r.get('off_corrected') is not None and r.get('on_minus_off_corrected') is not None for r in rows),'missing on/off/swing'
          assert not any('totalrebound' in ''.join(c for c in str(r['metric']).lower() if c.isalnum()) or ''.join(c for c in str(r['metric']).lower() if c.isalnum())=='trebpct' for r in rows),'TREB present'
          # Preserve the established tenure-segment grain. Do not average rates across transaction segments.
          fields=['season','player_id','team_id','metric','segment_index','segment_start','segment_end','on','off_corrected','on_minus_off_corrected','complete','tenure_confidence','boundary_resolution','collection_source']
          out=pathlib.Path('native89_release'); out.mkdir(exist_ok=True)
          with gzip.open(out/'native_89_metrics_on_off_swing_tenure_segments.csv.gz','wt',newline='') as f:
            w=csv.writer(f); w.writerow(fields)
            for r in rows: w.writerow([r.get(x) for x in fields])
          qa={'status':'PASS','seasons':26,'native_metrics':89,'player_season_team_keys':14600,'unique_key_metrics':1299400,'tenure_segment_rows':len(rows),'all_rows_complete':True,'states':['ON','OFF','SWING'],'off_field':'off_corrected','swing_field':'on_minus_off_corrected','total_rebound_pct_included':False,'grain':'tenure segment; preserves transaction boundaries','source_commit':'57ba237c36d75f7a3ef2cc998d91aa70a59b3c29'}
          (out/'FINAL_QA_NATIVE89.json').write_text(json.dumps(qa,indent=2)+'\n')
          (out/'README.txt').write_text('Complete established Stage2 native database: 89 metrics, 2000-01 through 2025-26, ON/OFF/SWING. TotalReboundPct intentionally excluded. Transaction seasons retain established tenure-segment rows; rates are not incorrectly averaged across segments.\n')
          z=pathlib.Path('NBA_native_89_metrics_2000-01_to_2025-26.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in out.iterdir(): q.write(p,p.name)
          h=hashlib.sha256(z.read_bytes()).hexdigest(); pathlib.Path(str(z)+'.sha256').write_text(h+'  '+z.name+'\n')
          print(json.dumps({**qa,'zip':z.name,'sha256':h},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NBA-native-89-metrics-final-${{ github.run_id }}
          path: |
            NBA_native_89_metrics_2000-01_to_2025-26.zip
            NBA_native_89_metrics_2000-01_to_2025-26.zip.sha256
          if-no-files-found: error
          retention-days: 90