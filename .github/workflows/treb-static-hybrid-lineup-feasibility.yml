name: TREB static hybrid lineup feasibility

on:
  push:
    branches:
      - agent/treb-final-exact-assembly
    paths:
      - 'team_trb_all_players/treb_static_hybrid_lineup_feasibility.py'
      - '.github/workflows/treb-static-hybrid-lineup-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      CURRENT_ARTIFACT_ID: 9275527991
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download authoritative checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CURRENT_ARTIFACT_ID}/zip" > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/current
      - name: Probe hybrid exact lineup reconstruction feasibility
        run: |
          python -u team_trb_all_players/treb_static_hybrid_lineup_feasibility.py --current-dir /tmp/current --out-dir /tmp/out
      - name: Upload durable diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: TREB-static-hybrid-lineup-feasibility-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
