name: TREB padded semantic rebound canary

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - .github/workflows/treb-padded-semantic-rebound-canary.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  canary:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        year: [2008,2009,2010,2011,2015,2017,2018,2019,2021,2022,2023,2024]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Fetch Wave-1 residual targets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin treb-game-fact-repair-wave1
          git show origin/treb-game-fact-repair-wave1:team_trb_all_players/final_integrity_rebuild/game_fact_repair_wave1/${{ matrix.year }}/residual_failures.json > /tmp/residual.json
      - name: Download season sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"; mkdir -p "$RAW"
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          y=int('${{ matrix.year }}'); raw=Path(f'/tmp/trebraw-{y}')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode(); urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in [f'nbastats_{y}',f'nbastatsv3_{y}',f'pbpstats_{y}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]; subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Run padded semantic candidate
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"; NBA=$(find "$RAW" -name "nbastats_${YEAR}.csv" -print -quit); V3=$(find "$RAW" -name "nbastatsv3_${YEAR}.csv" -print -quit); PBP=$(find "$RAW" -name "pbpstats_${YEAR}.csv" -print -quit)
          NBA="$NBA" V3="$V3" PBP="$PBP" YEAR="$YEAR" python - <<'PY'
          import json,os,sys
          from collections import Counter
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import production_treb_engine_v3 as engine
          import build_exact_game_fact_layer as base
          import production_rebound_semantic_candidate_padded as candidate
          base.rebound_join_engine=candidate
          y=int(os.environ['YEAR']); ids=sorted({int(r['game_id']) for r in json.loads(Path('/tmp/residual.json').read_text())})
          nba=io.normalize_nba(pd.read_csv(os.environ['NBA'],low_memory=False)); v3=engine.normalize_v3(pd.read_csv(os.environ['V3'],low_memory=False)); pbp=io.normalize_pbp(pd.read_csv(os.environ['PBP'],low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}; vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}; pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}
          audits=[]; residual=[]; semantic_rows=semantic_games=exact_rows=0
          for gid in ids:
              try:
                  _,_,a=base.build_game(gid,ng[gid],vg[gid],pg[gid]); audits.append(a)
                  ja=a['join_audit']; sr=int(ja.get('invariant_semantic_join_repairs',0)); semantic_rows+=sr; semantic_games+=int(sr>0); exact_rows+=int(ja.get('exact_identity_join_repairs',0))
              except Exception as exc: residual.append({'game_id':gid,'error':f'{type(exc).__name__}: {exc}'})
          def cls(e):
              x=e.lower()
              if 'unmatched pbp rebound rows' in x:return 'unmatched_rebound'
              if 'non-unique v3/team-local starter solution' in x:return 'nonunique_starter'
              if 'no legal v3/team-local starter solution' in x:return 'no_legal_starter'
              if 'missing in-period lineup transition' in x or 'starter solution requires missing' in x:return 'missing_transition'
              return 'other'
          classes=Counter(cls(r['error']) for r in residual)
          out={'year':y,'targets':len(ids),'recovered':len(audits),'residual':len(residual),'residual_classes':dict(classes),'semantic_repair_rows':semantic_rows,'semantic_repair_games':semantic_games,'exact_identity_rows':exact_rows,'residual_failures':residual}
          Path(f'/tmp/PADDED_{y}.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps({k:v for k,v in out.items() if k!='residual_failures'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'treb-padded-semantic-${{ matrix.year }}', path: '/tmp/PADDED_${{ matrix.year }}.json', retention-days: 90}
  aggregate:
    needs: canary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: 'treb-padded-semantic-*', path: /tmp/results}
      - name: Aggregate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          chunks=[]
          for p in Path('/tmp/results').rglob('PADDED_*.json'):
              try: chunks.append(json.loads(p.read_text()))
              except Exception: pass
          classes=Counter(); failures=[]
          for c in chunks: classes.update(c.get('residual_classes',{})); failures.extend(c.get('residual_failures',[]))
          out={'status':'COMPLETE' if len(chunks)==12 else 'PARTIAL','seasons_found':len(chunks),'targets':sum(c.get('targets',0) for c in chunks),'recovered':sum(c.get('recovered',0) for c in chunks),'residual':sum(c.get('residual',0) for c in chunks),'residual_classes':dict(classes),'semantic_repair_rows':sum(c.get('semantic_repair_rows',0) for c in chunks),'semantic_repair_games':sum(c.get('semantic_repair_games',0) for c in chunks),'exact_identity_rows':sum(c.get('exact_identity_rows',0) for c in chunks),'residual_failures':failures,'season_summaries':chunks}
          Path('/tmp/PADDED_SEMANTIC_REBOUND_CANARY_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps({k:v for k,v in out.items() if k not in {'residual_failures','season_summaries'}},indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git fetch origin agent/treb-batched-game-facts-20260812; git reset --hard origin/agent/treb-batched-game-facts-20260812
          DEST=team_trb_all_players/final_integrity_rebuild/padded_semantic_candidate; mkdir -p "$DEST"; cp /tmp/PADDED_SEMANTIC_REBOUND_CANARY_SUMMARY.json "$DEST"/; git add -f "$DEST/PADDED_SEMANTIC_REBOUND_CANARY_SUMMARY.json"; if ! git diff --cached --quiet; then git commit -m 'Persist padded semantic rebound canary'; git push origin HEAD:agent/treb-batched-game-facts-20260812; fi
