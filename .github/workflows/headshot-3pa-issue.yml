name: Headshot 3PA Professional Render
on:
  push:
    paths:
      - 'tmp/professional_headshot_render_trigger.txt'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip && pip install pillow requests pandas pyarrow
      - run: mkdir -p outputs && python scripts/render_top25_3pa.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add outputs/top25_team_3pt_swing_headshots_3pa.png outputs/top25_team_3pt_swing_3pa.csv
          git commit -m 'Render professional top 25 3PT swing headshot graphic' || exit 0
          git push
