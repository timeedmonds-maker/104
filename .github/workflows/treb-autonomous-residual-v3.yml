name: TREB autonomous residual recovery v3

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-autonomous-residual-v3.yml
      - team_trb_all_players/residual_materiality_autopilot_v3.py

permissions:
  actions: read
  contents: read

concurrency:
  group: treb-autonomous-residual-v3
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: /home/runner/work/104/104/team_trb_all_players
  TARGETS: team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz
  BLOCKER_RUN: "31877755142"
  PLAN_RUN: "31875740731"
  HIST_SOURCE_RUN: "31871719056"
  EXACT_SEASON_RUN: "31854913173"
  STAGEB_RUN: "31875740731"

jobs:
  recover:
    name: A - ${{ matrix.year }} retained-fact + safe-source recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix:
        year: [2000, 2001, 2003, 2004, 2005, 2009, 2010, 2012, 2015, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz
      - name: Download authoritative 1253 blocker manifest
        uses: actions/download-artifact@v4
        with:
          name: TREB-materiality-consolidated-${{ env.BLOCKER_RUN }}
          path: /tmp/current
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: ${{ env.BLOCKER_RUN }}
      - name: Download retained game-gap plan
        uses: actions/download-artifact@v4
        with:
          name: TREB-materiality-autopilot-plan-${{ env.PLAN_RUN }}
          path: /tmp/plan
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: ${{ env.PLAN_RUN }}
      - name: Download retained historical exact facts
        id: historical
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: TREB-auto-v3-historical-${{ matrix.year }}-*-${{ env.HIST_SOURCE_RUN }}
          path: /tmp/historical
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: ${{ env.HIST_SOURCE_RUN }}
      - name: Download retained exact-season partial facts
        uses: actions/download-artifact@v4
        with:
          name: TREB-fullcore-exact-${{ matrix.year }}-${{ env.EXACT_SEASON_RUN }}
          path: /tmp/exactseason
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: ${{ env.EXACT_SEASON_RUN }}
      - name: A1 - materialize exact current season target set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out /tmp/src /tmp/prior
          cp -a /tmp/exactseason /tmp/prior/exactseason
          if [ -d /tmp/historical ]; then cp -a /tmp/historical /tmp/prior/historical; fi
          YEAR='${{ matrix.year }}' python - <<'PY'
          import gzip,json,os,pandas as pd
          y=int(os.environ['YEAR']); season=f'{y}-{(y+1)%100:02d}'
          b=pd.read_csv('/tmp/current/AUTONOMOUS_BLOCKER_MANIFEST.csv',dtype={'player_id':str})
          b=b[b.season.eq(season)]
          ks={(r.season,int(r.team_id),str(r.player_id).removesuffix('.0')) for r in b.itertuples()}
          assert len(ks)>0,(season,'no blocker keys')
          selected=[]
          with gzip.open('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz','rt',encoding='utf-8') as f:
              for line in f:
                  if not line.strip(): continue
                  r=json.loads(line)
                  k=(str(r['season']),int(r['team_id']),str(r['player_id']).removesuffix('.0'))
                  if k in ks:
                      assert bool(r.get('full_core_reuse')); selected.append(r)
          got={(str(r['season']),int(r['team_id']),str(r['player_id']).removesuffix('.0')) for r in selected}
          assert got==ks and len(selected)==len(ks),(season,len(got),len(ks))
          with gzip.open('/tmp/targets.jsonl.gz','wt',encoding='utf-8') as f:
              for r in selected: f.write(json.dumps(r,separators=(',',':'))+'\n')
          print('TARGET_GATE=PASS',season,len(selected))
          PY
      - name: A2 - download retained static season feeds
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 --output /tmp/list_data.txt https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          python - '${{ matrix.year }}' <<'PY' > /tmp/urls.tsv
          import sys
          y=sys.argv[1]; vals={}
          for line in open('/tmp/list_data.txt',encoding='utf-8'):
              if '=' in line:
                  k,v=line.split('=',1); vals[k.strip()]=v.strip()
          for p in ('nbastats','nbastatsv3','pbpstats'):
              k=f'{p}_{y}'; assert k in vals,k; print(p,vals[k],sep='\t')
          PY
          while IFS=$'\t' read -r prefix url; do
            arc="/tmp/src/${prefix}_${{ matrix.year }}.tar.xz"
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 300 --output "$arc" "$url"
            tar -xJf "$arc" -C /tmp/src
          done < /tmp/urls.tsv
      - name: A3 - game-isolated exact/legal-scenario recovery
        timeout-minutes: 27
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/residual_materiality_autopilot_v3.py --year '${{ matrix.year }}' --targets /tmp/targets.jsonl.gz --historical-dir /tmp/prior --report /tmp/plan/GAME_GAP_FORENSIC_REPORT.json --candidates /tmp/plan/GAME_GAP_CANDIDATE_REPAIRS.json --nba /tmp/src/nbastats_${{ matrix.year }}.csv --v3 /tmp/src/nbastatsv3_${{ matrix.year }}.csv --pbp /tmp/src/pbpstats_${{ matrix.year }}.csv --out /tmp/out | tee /tmp/out/SUPERVISOR_V3.log
      - name: Retain every season result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TREB-autonomous-residual-v3-${{ matrix.year }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error

  consolidate:
    name: B - consolidate all retained recovery and gate 9647
    needs: recover
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      unresolved: ${{ steps.gate.outputs.unresolved }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - run: python -m pip install --disable-pip-version-check pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: TREB-materiality-autopilot-*-${{ env.STAGEB_RUN }}
          path: /tmp/allhist/stageb
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: ${{ env.STAGEB_RUN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: TREB-autonomous-residual-v3-*-${{ github.run_id }}
          path: /tmp/allhist/v3
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: TREB-fullcore-resume-consolidated-31858884423
          path: /tmp/baseexact
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31858884423'
      - uses: actions/download-artifact@v4
        with:
          name: TREB-starter-accept-immaterial-overlay-31861830762
          path: /tmp/starter1367
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31861830762'
      - uses: actions/download-artifact@v4
        with:
          name: TREB-starter-captains-call-63-consolidated-31864265375
          path: /tmp/starter63
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31864265375'
      - uses: actions/download-artifact@v4
        with:
          name: TREB-modern409-team-fanout-consolidated-31869325468
          path: /tmp/modern409
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31869325468'
      - name: B1 - fail-closed union
        shell: bash
        run: |
          set -euo pipefail
          MODERN=$(find /tmp/modern409 -name 'TREB_2025_26_RESIDUAL_409_TEAM_FANOUT.csv' -print -quit)
          test -n "$MODERN"
          python team_trb_all_players/autonomous_consolidate_fullcore.py --targets "$TARGETS" --baseexact /tmp/baseexact/FULLCORE_TOTALREBOUNDPCT_PASS_ROWS.csv.gz --starter1367 /tmp/starter1367/STARTER_ACCEPT_IMMATERIAL_OVERLAY_1367.csv.gz --starter63 /tmp/starter63/STARTER_CAPTAINS_CALL_63_OVERLAY.csv.gz --modern409 "$MODERN" --historical-dir /tmp/allhist --out /tmp/consolidated
      - name: B2 - safety/readiness gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          q=json.load(open('/tmp/consolidated/AUTONOMOUS_CONSOLIDATION_QA.json'))
          for p in pathlib.Path('/tmp/allhist').rglob('AUTOPILOT_QA.json'):
              x=json.load(open(p))
              assert x['materiality_threshold_pp']==0.01
              assert not x['rounded_percentage_backsolve_used']
              assert not x['opponent_rebound_inference_used']
              assert not x['whole_team_subtraction_across_partial_tenure_used']
          print(json.dumps(q,indent=2,sort_keys=True))
          with open('/tmp/gate_outputs','w') as f:
              f.write('ready=' + ('true' if q['status']=='PASS' else 'false') + '\n')
              f.write('unresolved=' + str(q['unresolved']) + '\n')
          PY
          cat /tmp/gate_outputs >> "$GITHUB_OUTPUT"
      - name: Retain consolidation whether PASS or blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TREB-autonomous-residual-v3-consolidated-${{ github.run_id }}
          path: /tmp/consolidated
          retention-days: 90
          compression-level: 1
          if-no-files-found: error

  final_release:
    name: C - final 90-metric database ZIP
    needs: consolidate
    if: needs.consolidate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy pyarrow duckdb
      - uses: actions/download-artifact@v4
        with:
          name: TREB-prepared-canonical-layers-31844978593
          path: /tmp/prep
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31844978593'
      - uses: actions/download-artifact@v4
        with:
          name: TREB-autonomous-residual-v3-consolidated-${{ github.run_id }}
          path: /tmp/consolidated
      - name: C1 - assemble canonical release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final
          python team_trb_all_players/autonomous_finalize_exact_release.py --targets "$TARGETS" --native /tmp/prep/native_89_canonical.parquet --partial /tmp/prep/exact_partial_4877.parquet --fullcore /tmp/consolidated/FULLCORE_TOTALREBOUNDPCT_AUTONOMOUS.csv.gz --out /tmp/final
      - name: C2 - hard QA and ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          q=json.load(open('/tmp/final/FINAL_QA.json'))
          assert q['status']=='PASS'
          assert q['canonical_keys']==14524 and q['seasons']==26
          assert q['native_metrics']==89 and q['total_metrics']==90
          assert q['native_canonical_rows']==1292636
          assert q['partial_treb']==4877 and q['full_core_treb']==9647
          assert q['total_rebound_pct_rows']==14524
          assert q['duplicate_total_rebound_pct']==0 and q['missing_total_rebound_pct']==0
          assert q['steven_adams_career_total_rebound_pct_rows']==1
          assert 20460 <= q['steven_adams_career_minutes'] <= 20485
          assert 540 <= q['career_10000_min_total_rebound_pct_population'] <= 565
          assert not q['rounded_percentage_backsolve']
          assert not q['opponent_rebound_inference']
          assert not q['partial_tenure_whole_team_subtraction']
          assert not q['empirical_model_used']
          print(json.dumps(q,indent=2,sort_keys=True))
          PY
          cd /tmp/final
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt ! -name TREB_final_database_2000-01_to_2025-26.zip -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          zip -q -9 TREB_final_database_2000-01_to_2025-26.zip $(find . -maxdepth 1 -type f ! -name TREB_final_database_2000-01_to_2025-26.zip -printf '%P\n' | sort)
          unzip -t TREB_final_database_2000-01_to_2025-26.zip > FINAL_ZIP_INTEGRITY.txt
          sha256sum TREB_final_database_2000-01_to_2025-26.zip | tee FINAL_ZIP_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-final-database-autonomous-v3-${{ github.run_id }}
          path: |
            /tmp/final/TREB_final_database_2000-01_to_2025-26.zip
            /tmp/final/FINAL_QA.json
            /tmp/final/FINAL_ZIP_SHA256.txt
            /tmp/final/FINAL_ZIP_INTEGRITY.txt
            /tmp/final/SHA256SUMS.txt
            /tmp/final/PROVENANCE.json
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

  blocked:
    name: D - retained exact blocker map
    needs: consolidate
    if: always() && needs.consolidate.outputs.ready != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TREB-autonomous-residual-v3-consolidated-${{ github.run_id }}
          path: /tmp/consolidated
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-autonomous-residual-v3-blockers-${{ github.run_id }}
          path: /tmp/consolidated
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
