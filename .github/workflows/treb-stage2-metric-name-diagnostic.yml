name: TREB Stage2 rebound metric name diagnostic
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-stage2-metric-name-diagnostic.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 0
      - name: Inspect pinned Stage2 metric names
        run: |
          set -euo pipefail
          git show 57ba237c36d75f7a3ef2cc998d91aa70a59b3c29:team_trb_all_players/impact_database/outputs/2000-01/team_on_off_metrics.csv.gz > /tmp/team_on_off_metrics.csv.gz
          python - <<'PY'
          import gzip,csv,json
          from pathlib import Path
          p='/tmp/team_on_off_metrics.csv.gz'
          with gzip.open(p,'rt',encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          metrics=sorted({str(r['metric']) for r in rows})
          rebound=[m for m in metrics if 'reb' in m.lower()]
          out={'status':'PASS','metric_count':len(metrics),'metrics':metrics,'rebound_like_metrics':rebound}
          assert len(metrics)==89, len(metrics)
          Path('team_trb_all_players/final_integrity_rebuild/stage2_metric_name_diagnostic').mkdir(parents=True,exist_ok=True)
          Path('team_trb_all_players/final_integrity_rebuild/stage2_metric_name_diagnostic/STAGE2_METRIC_NAMES.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Persist diagnostic
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add team_trb_all_players/final_integrity_rebuild/stage2_metric_name_diagnostic/STAGE2_METRIC_NAMES.json
          git commit -m 'Persist Stage2 metric-name diagnostic [skip ci]' || true
          git push origin HEAD:agent/treb-final-exact-assembly
