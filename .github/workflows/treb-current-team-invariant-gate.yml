name: TREB current invariant team-total exact gate

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-current-team-invariant-gate.yml]

permissions:
  actions: read
  contents: read

env:
  CURRENT_ARTIFACT_ID: '9275404348'
  PBP_ARTIFACT_ID: '9258020958'

jobs:
  recover:
    name: invariant team totals ${{ matrix.year }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        year: [2004,2009,2015,2017,2018,2019,2020,2021,2022,2023,2024]
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/treb-final-exact-assembly, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz
      - name: Download current exact state and retained exact controls
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          mkdir -p /tmp/current /tmp/pbp_control /tmp/out /tmp/src
          for spec in current:$CURRENT_ARTIFACT_ID pbp_control:$PBP_ARTIFACT_ID; do d=${spec%%:*};a=${spec##*:};gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${a}/zip" >/tmp/$d.zip;unzip -q /tmp/$d.zip -d /tmp/$d;done
      - name: Download season NBA V2 and PBP feeds
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail;y='${{ matrix.year }}'
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/list_data.txt https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          python - "$y" <<'PY' >/tmp/urls.tsv
          import sys
          y=sys.argv[1];v={}
          for line in open('/tmp/list_data.txt'):
            if '=' in line:k,x=line.split('=',1);v[k.strip()]=x.strip()
          for p in ('nbastats','pbpstats'):print(p,v[f'{p}_{y}'],sep='\t')
          PY
          while IFS=$'\t' read -r p url; do curl --fail --location --retry 5 --retry-all-errors -o /tmp/src/${p}_${y}.tar.xz "$url";tar -xJf /tmp/src/${p}_${y}.tar.xz -C /tmp/src;done </tmp/urls.tsv
      - name: Compute controls and target candidates
        shell: bash
        run: |
          y='${{ matrix.year }}'
          PYTHONPATH=team_trb_all_players python -u team_trb_all_players/recover_team_totals_invariant_event_status.py --year "$y" --current-dir /tmp/current --pbp-dir /tmp/pbp_control --nba /tmp/src/nbastats_${y}.csv --pbp /tmp/src/pbpstats_${y}.csv --output-dir /tmp/out
      - uses: actions/upload-artifact@v4
        with: {name: 'TREB-team-invariant-${{ matrix.year }}-${{ github.run_id }}', path: /tmp/out, retention-days: 90, compression-level: 1, if-no-files-found: error}

  gate:
    name: global zero-mismatch invariant team gate
    needs: recover
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas
      - uses: actions/download-artifact@v4
        with: {pattern: 'TREB-team-invariant-*-${{ github.run_id }}', path: /tmp/seasons, merge-multiple: false}
      - name: Gate candidates against all exact controls
        shell: bash
        run: |
          mkdir -p /tmp/final
          python - <<'PY'
          import pandas as pd,pathlib,json,gzip,csv
          R=pathlib.Path('/tmp/seasons');O=pathlib.Path('/tmp/final')
          cps=[pd.read_csv(p,low_memory=False) for p in R.rglob('TEAM_INVARIANT_CONTROLS.csv') if p.stat().st_size]
          controls=pd.concat(cps,ignore_index=True,sort=False) if cps else pd.DataFrame()
          computed=controls[controls.get('computed',False).astype(str).str.lower().isin(['true','1'])].copy() if len(controls) else controls
          mism=computed[~computed.get('match',False).astype(str).str.lower().isin(['true','1'])].copy() if len(computed) else computed
          tps=[pd.read_csv(p,low_memory=False) for p in R.rglob('TEAM_INVARIANT_TARGET_CANDIDATES.csv') if p.stat().st_size]
          targets=pd.concat(tps,ignore_index=True,sort=False) if tps else pd.DataFrame(columns=['season','game_id','team_id','team_oreb','team_dreb','opponent_oreb','opponent_dreb','provenance'])
          gate_pass=len(computed)>=50 and len(mism)==0
          if not gate_pass: targets=targets.iloc[0:0].copy()
          if len(targets):
            targets['game_id']=targets.game_id.astype(str).str.replace(r'\.0$','',regex=True).str.zfill(10);targets['team_id']=pd.to_numeric(targets.team_id,errors='raise').astype('int64').astype(str)
            # Every duplicate must agree exactly.
            for _,g in targets.groupby(['game_id','team_id']):
              vals=g[['team_oreb','team_dreb','opponent_oreb','opponent_dreb']].drop_duplicates()
              if len(vals)!=1: raise SystemExit('CONFLICT_TARGET_CANDIDATE')
            targets=targets.drop_duplicates(['game_id','team_id'])
          with gzip.open(O/'RECOVERED_RESIDUAL_SHARED_TEAM_GAME_PRIMITIVES.csv.gz','wt',encoding='utf-8',newline='') as f:
            fields=['season','game_id','team_id','team_oreb','team_dreb','opponent_oreb','opponent_dreb','provenance'];w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(targets[fields].to_dict('records'))
          controls.to_csv(O/'TEAM_INVARIANT_ALL_CONTROLS.csv',index=False);mism.to_csv(O/'TEAM_INVARIANT_MISMATCHES.csv',index=False)
          qa={'status':'PASS' if gate_pass else 'FAIL_CLOSED','minimum_computed_controls':50,'computed_exact_controls':int(len(computed)),'control_mismatches':int(len(mism)),'candidate_team_facts_before_gate':int(sum(len(pd.read_csv(p)) for p in R.rglob('TEAM_INVARIANT_TARGET_CANDIDATES.csv') if p.stat().st_size)),'promoted_team_facts_after_gate':int(len(targets)),'integrity':{'zero_control_mismatches_required':True,'lineup_reconstruction_used':False,'event_identity_inference_used':False,'opponent_rebound_inference_used':False,'empirical_model_used':False,'rounded_percentage_backsolve_used':False}}
          (O/'TEAM_INVARIANT_GLOBAL_GATE.json').write_text(json.dumps(qa,indent=2)+'\n');print(json.dumps(qa,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'TREB-team-invariant-gated-${{ github.run_id }}', path: /tmp/final, retention-days: 90, compression-level: 1, if-no-files-found: error}
