name: Split missed3 contact sheet
on:
  push:
    paths:
      - 'trigger_split_missed3_contactsheet.txt'
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf outputs/missed3_contact_chunks
          mkdir -p outputs/missed3_contact_chunks
          split -b 80000 -d -a 3 outputs/missed3_contactsheet.b64 outputs/missed3_contact_chunks/chunk_
          ls outputs/missed3_contact_chunks | sort > outputs/missed3_contact_chunks_manifest.txt
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add outputs/missed3_contact_chunks outputs/missed3_contact_chunks_manifest.txt
          git commit -m 'Split missed3 contact sheet for connector transfer' || exit 0
          git push
