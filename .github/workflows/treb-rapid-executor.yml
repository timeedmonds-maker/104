name: TREB rapid exact residual elimination executor
on:
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]
permissions:
  actions: read
  contents: write
  issues: write
concurrency:
  group: treb-rapid-exact-residual-elimination
  cancel-in-progress: true
jobs:
  eliminate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Run TREB rapid 30-game recovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download controlling checkpoint and exact support layers
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          for d in current consensus pbp old mid newer game currentcons resolution static current2 general twelve final; do mkdir -p "/tmp/$d"; done
          get(){ d="$1"; id="$2"; for a in 1 2 3 4 5; do rm -f "/tmp/$d.zip"; rm -rf "/tmp/$d"/*; if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "/tmp/$d.zip" && unzip -tq "/tmp/$d.zip" >/dev/null 2>&1; then unzip -q "/tmp/$d.zip" -d "/tmp/$d"; return 0; fi; sleep $((a*3)); done; return 1; }
          get current 9275527991
          get consensus 9252786257
          get pbp 9258020958
          get old 9258644772
          get mid 9260106595
          get newer 9260439871
          get game 9262554900
          get currentcons 9263341092
          get resolution 9385259872
          python - <<'PY'
          import csv,pathlib
          p=next(pathlib.Path('/tmp/current').rglob('AUTONOMOUS_BLOCKER_MANIFEST.csv'))
          assert sum(1 for _ in csv.DictReader(open(p)))==563
          PY
      - name: Fetch only affected pinned static NBA Stats archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/static_archives /tmp/nba_data
          git -C /tmp/nba_data init -q
          git -C /tmp/nba_data remote add origin https://github.com/shufinskiy/nba_data.git
          for a in 1 2 3; do
            if timeout 600 git -C /tmp/nba_data -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin e829d4678be1e075f99e5d41a1c5f97089be446b; then break; fi
            sleep $((a*5))
          done
          git -C /tmp/nba_data rev-parse FETCH_HEAD >/dev/null
          python - <<'PY' >/tmp/years.txt
          import csv,pathlib
          p=next(pathlib.Path('/tmp/current').rglob('NEXT_RESIDUAL_SHARED_GAME_REGISTRY.csv'))
          print('\n'.join(sorted({r['season'].split('-')[0] for r in csv.DictReader(open(p))})))
          PY
          cat /tmp/years.txt
          while read -r y; do
            [ -n "$y" ] || continue
            for a in 1 2 3; do
              if timeout 420 git -C /tmp/nba_data show FETCH_HEAD:datasets/nbastats_${y}.tar.xz > /tmp/static_archives/nbastats_${y}.tar.xz && test -s /tmp/static_archives/nbastats_${y}.tar.xz; then break; fi
              rm -f /tmp/static_archives/nbastats_${y}.tar.xz; sleep $((a*4))
            done
            test -s /tmp/static_archives/nbastats_${y}.tar.xz
          done </tmp/years.txt
      - name: Extract exact team OREB and DREB and require zero-mismatch retained controls
        run: |
          python -u team_trb_all_players/treb_static_nbastats_team_recovery.py --current /tmp/current --archives /tmp/static_archives --out /tmp/static
          cat /tmp/static/STATIC_NBASTATS_TEAM_RECOVERY_QA.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/static/STATIC_NBASTATS_TEAM_RECOVERY_QA.json'))
          assert q['status']=='PASS',q
          assert q['control_mismatches']==0,q
          assert q['recovered_target_team_facts']>0,q
          PY
      - name: Merge only exact static team facts into temporary controlling checkpoint
        run: |
          cp -a /tmp/current/. /tmp/current2/
          python - <<'PY'
          import csv,gzip,pathlib
          C=pathlib.Path('/tmp/current2'); P=pathlib.Path('/tmp/static/STATIC_NBASTATS_TEAM_RECOVERED.csv')
          def gid(x): return str(x).strip().removesuffix('.0').zfill(10)
          def tid(x): return str(int(float(x)))
          with open(P,newline='') as f:new=list(csv.DictReader(f))
          tp=next(C.rglob('RECOVERED_RESIDUAL_SHARED_TEAM_GAME_PRIMITIVES.csv.gz'))
          with gzip.open(tp,'rt',encoding='utf-8',newline='') as f:base=list(csv.DictReader(f))
          fields=list(base[0]); idx={(gid(r['game_id']),tid(r['team_id'])):r for r in base}
          for r in new:
            k=(gid(r['game_id']),tid(r['team_id']))
            if k in idx:
              for z in ['team_oreb','team_dreb','opponent_oreb','opponent_dreb']: assert abs(float(idx[k][z])-float(r[z]))<1e-9,(k,z)
              continue
            q={z:'' for z in fields}; q.update(r); base.append(q); idx[k]=q
          with gzip.open(tp,'wt',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(base)
          PY
      - name: Reclose all exact-tenure residuals and the 12 proven transaction tenures
        run: |
          python -u team_trb_all_players/treb_direct_563_reclosure.py --current /tmp/current2 --consensus /tmp/consensus --pbp /tmp/pbp --old /tmp/old --mid /tmp/mid --newer /tmp/newer --game /tmp/game --currentcons /tmp/currentcons --out /tmp/general
          RES=$(find /tmp/resolution -name TREB_CURRENT_21_TRANSACTION_RESOLUTION.csv -print -quit); test -n "$RES"
          python -u team_trb_all_players/treb_current_12_tenure_reclosure_v2.py --current /tmp/current2 --consensus /tmp/consensus --pbp /tmp/pbp --old /tmp/old --mid /tmp/mid --newer /tmp/newer --game /tmp/game --currentcons /tmp/currentcons --resolution "$RES" --out /tmp/twelve
      - name: Union exact promotions and persist only if 563 falls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,pathlib,shutil
          C=pathlib.Path('/tmp/current2'); F=pathlib.Path('/tmp/final');F.mkdir(exist_ok=True)
          def tid(x):return str(int(float(x)))
          def pid(x):return str(x).strip().removesuffix('.0')
          def key(r):return (str(r['season']),tid(r['team_id']),pid(r['player_id']))
          def rd(p):
            with open(p,newline='') as f:return list(csv.DictReader(f))
          cur=rd(next(C.rglob('AUTONOMOUS_BLOCKER_MANIFEST.csv'))); prior=rd(next(C.rglob('TREB_CUMULATIVE_EXACT_PROMOTED.csv'))); mat=rd(next(C.rglob('TREB_MATERIALITY_ACCEPTED.csv')))
          new={}
          for p in [pathlib.Path('/tmp/general/TREB_NEW_EXACT_PROMOTED.csv'),pathlib.Path('/tmp/twelve/TREB_NEW_EXACT_PROMOTED.csv')]:
            if p.exists():
              for r in rd(p):new[key(r)]=r
          assert not ({key(r) for r in prior}&set(new))
          remain=[r for r in cur if key(r) not in new]; cumulative=prior+[new[k] for k in sorted(new)]
          assert len(cumulative)+len(remain)+len(mat)==1250
          def wr(p,rs,fields=None):
            if fields is None:fields=sorted({z for r in rs for z in r}) if rs else []
            with open(p,'w',newline='') as f:
              if fields:
                w=csv.DictWriter(f,fieldnames=list(fields));w.writeheader();w.writerows(rs)
          wr(F/'TREB_NEW_EXACT_PROMOTED.csv',[new[k] for k in sorted(new)]);wr(F/'TREB_CUMULATIVE_EXACT_PROMOTED.csv',cumulative);wr(F/'AUTONOMOUS_BLOCKER_MANIFEST.csv',remain,cur[0].keys());wr(F/'TREB_MATERIALITY_ACCEPTED.csv',mat)
          for n in ['RECOVERED_RESIDUAL_SHARED_PLAYER_GAME_PRIMITIVES.csv.gz','RECOVERED_RESIDUAL_SHARED_TEAM_GAME_PRIMITIVES.csv.gz','NEXT_RESIDUAL_SHARED_GAME_REGISTRY.csv']:shutil.copy(next(C.rglob(n)),F/n)
          sq=json.load(open('/tmp/static/STATIC_NBASTATS_TEAM_RECOVERY_QA.json'))
          qa={'status':'PASS','starting_production_resolved_full_core':9084,'starting_residual':563,'static_team_facts_recovered':sq['recovered_target_team_facts'],'static_control_comparisons':sq['exact_control_comparisons'],'static_control_mismatches':sq['control_mismatches'],'new_exact_promotions':len(new),'ending_production_resolved_full_core':9084+len(new),'ending_residual':len(remain),'integrity':{'pinned_static_nba_stats':True,'zero_mismatch_controls':True,'minutes_gate_seconds':60,'model_used':False,'rounded_backsolve_used':False}}
          (F/'TREB_SHARED_GAME_RECLOSURE_QA.json').write_text(json.dumps(qa,indent=2,sort_keys=True)+'\n');print(json.dumps(qa,indent=2,sort_keys=True))
          PY
          NEW=$(python -c "import json;print(json.load(open('/tmp/final/TREB_SHARED_GAME_RECLOSURE_QA.json'))['ending_residual'])")
          if [ "$NEW" -ge 563 ]; then echo 'No residual reduction; fail closed.'; exit 0; fi
          DEST=team_trb_all_players/treb_direct_563_authoritative;rm -rf "$DEST";mkdir -p "$DEST";cp /tmp/final/* "$DEST/";cp /tmp/static/STATIC_NBASTATS_TEAM_RECOVERY_QA.json "$DEST/"
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f "$DEST";git commit -m "TREB: reduce production residual to ${NEW} using pinned static team boxes";git push origin HEAD:agent/treb-final-exact-assembly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-static-team-direct-${{ github.run_id }}
          path: |
            /tmp/static
            /tmp/general
            /tmp/twelve
            /tmp/final
          retention-days: 90
          if-no-files-found: warn
      - name: Comment completion
        if: always() && github.event_name == 'issues'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue comment "${{ github.event.issue.number }}" --body "TREB pinned-static team recovery ran as Actions run ${{ github.run_id }}. A lower residual, if achieved, is committed to the production branch."
