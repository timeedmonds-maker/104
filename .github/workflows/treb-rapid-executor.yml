name: TREB rapid exact residual elimination executor
on:
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]
permissions:
  actions: read
  contents: write
  issues: write
concurrency:
  group: treb-rapid-exact-residual-elimination
  cancel-in-progress: true
jobs:
  eliminate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Run TREB rapid 30-game recovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download controlling 563 checkpoint, exact support layers, and 12 proven tenures
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          for d in current consensus pbp old mid newer game currentcons resolution complement current2 general twelve final; do mkdir -p "/tmp/$d"; done
          get(){ d="$1"; id="$2"; for a in 1 2 3 4 5; do rm -f "/tmp/$d.zip"; rm -rf "/tmp/$d"/*; if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "/tmp/$d.zip" && unzip -tq "/tmp/$d.zip" >/dev/null 2>&1; then unzip -q "/tmp/$d.zip" -d "/tmp/$d"; return 0; fi; sleep $((a*3)); done; return 1; }
          get current 9275527991
          get consensus 9252786257
          get pbp 9258020958
          get old 9258644772
          get mid 9260106595
          get newer 9260439871
          get game 9262554900
          get currentcons 9263341092
          get resolution 9385259872
          python - <<'PY'
          import csv,pathlib
          p=next(pathlib.Path('/tmp/current').rglob('AUTONOMOUS_BLOCKER_MANIFEST.csv'))
          assert sum(1 for _ in csv.DictReader(open(p)))==563
          PY
      - name: Recover exact missing primitives by five-player conservation
        run: |
          python -u team_trb_all_players/treb_direct_five_player_complement.py \
            --current /tmp/current --consensus /tmp/consensus --pbp /tmp/pbp --old /tmp/old --mid /tmp/mid \
            --newer /tmp/newer --game /tmp/game --currentcons /tmp/currentcons --out /tmp/complement
      - name: Merge only conflict-free exact complement facts into temporary controlling checkpoint
        run: |
          cp -a /tmp/current/. /tmp/current2/
          python - <<'PY'
          import csv,gzip,pathlib
          C=pathlib.Path('/tmp/current2'); X=pathlib.Path('/tmp/complement')
          def gid(x): return str(x).strip().removesuffix('.0').zfill(10)
          def tid(x): return str(int(float(x)))
          def pid(x): return str(x).strip().removesuffix('.0')
          reg=list(csv.DictReader(open(next(C.rglob('NEXT_RESIDUAL_SHARED_GAME_REGISTRY.csv'))))); seas={gid(r['game_id']):r['season'] for r in reg}
          def plain(p):
            with open(p,newline='') as f:return list(csv.DictReader(f))
          pp=next(C.rglob('RECOVERED_RESIDUAL_SHARED_PLAYER_GAME_PRIMITIVES.csv.gz'))
          with gzip.open(pp,'rt',encoding='utf-8',newline='') as f: base=list(csv.DictReader(f))
          fields=list(base[0]); idx={(gid(r['game_id']),tid(r['team_id']),pid(r['player_id'])):r for r in base}
          for r in plain(X/'COMPLEMENT_PLAYER.csv'):
            k=(gid(r['game_id']),tid(r['team_id']),pid(r['player_id']))
            if k in idx:
              for z in ['seconds_on','team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on']: assert abs(float(idx[k][z])-float(r[z]))<1e-9,(k,z)
              continue
            q={z:'' for z in fields}; q.update(r); q['season']=seas[k[0]]; q['exact_zero_proof']='False'; base.append(q); idx[k]=q
          with gzip.open(pp,'wt',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(base)
          tp=next(C.rglob('RECOVERED_RESIDUAL_SHARED_TEAM_GAME_PRIMITIVES.csv.gz'))
          with gzip.open(tp,'rt',encoding='utf-8',newline='') as f: base=list(csv.DictReader(f))
          fields=list(base[0]); idx={(gid(r['game_id']),tid(r['team_id'])):r for r in base}
          for r in plain(X/'COMPLEMENT_TEAM.csv'):
            k=(gid(r['game_id']),tid(r['team_id']))
            if k in idx:
              for z in ['team_oreb','team_dreb','opponent_oreb','opponent_dreb']: assert abs(float(idx[k][z])-float(r[z]))<1e-9,(k,z)
              continue
            q={z:'' for z in fields}; q.update(r); q['season']=seas[k[0]]; base.append(q); idx[k]=q
          with gzip.open(tp,'wt',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(base)
          PY
      - name: Reclose all already-exact-tenure residuals
        run: |
          python -u team_trb_all_players/treb_direct_563_reclosure.py \
            --current /tmp/current2 --consensus /tmp/consensus --pbp /tmp/pbp --old /tmp/old --mid /tmp/mid \
            --newer /tmp/newer --game /tmp/game --currentcons /tmp/currentcons --out /tmp/general
      - name: Reclose the 12 independently proven transaction-schedule tenures
        run: |
          RES=$(find /tmp/resolution -name TREB_CURRENT_21_TRANSACTION_RESOLUTION.csv -print -quit); test -n "$RES"
          python -u team_trb_all_players/treb_current_12_tenure_reclosure_v2.py \
            --current /tmp/current2 --consensus /tmp/consensus --pbp /tmp/pbp --old /tmp/old --mid /tmp/mid \
            --newer /tmp/newer --game /tmp/game --currentcons /tmp/currentcons --resolution "$RES" --out /tmp/twelve
      - name: Union exact promotions from both direct closures and persist a genuinely lower residual
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,json,pathlib,shutil
          C=pathlib.Path('/tmp/current2'); F=pathlib.Path('/tmp/final'); F.mkdir(exist_ok=True)
          def tid(x): return str(int(float(x)))
          def pid(x): return str(x).strip().removesuffix('.0')
          def key(r): return (str(r['season']),tid(r['team_id']),pid(r['player_id']))
          def read(p):
            with open(p,newline='') as f:return list(csv.DictReader(f))
          current=read(next(C.rglob('AUTONOMOUS_BLOCKER_MANIFEST.csv'))); prior=read(next(C.rglob('TREB_CUMULATIVE_EXACT_PROMOTED.csv'))); mat=read(next(C.rglob('TREB_MATERIALITY_ACCEPTED.csv')))
          new={}
          for p in [pathlib.Path('/tmp/general/TREB_NEW_EXACT_PROMOTED.csv'),pathlib.Path('/tmp/twelve/TREB_NEW_EXACT_PROMOTED.csv')]:
            if not p.exists(): continue
            for r in read(p):
              k=key(r)
              if k in new:
                for z in ['on','off_corrected','on_minus_off_corrected','seconds_on']:
                  assert abs(float(new[k][z])-float(r[z]))<1e-9,(k,z)
              new[k]=r
          prior_keys={key(r) for r in prior}; assert not (prior_keys & set(new))
          cumulative=prior+[new[k] for k in sorted(new)]; remain=[r for r in current if key(r) not in new]
          assert len(cumulative)+len(remain)+len(mat)==1250
          def write(p,rs,fields=None):
            if fields is None: fields=sorted({z for r in rs for z in r}) if rs else []
            with open(p,'w',newline='') as f:
              if fields:
                w=csv.DictWriter(f,fieldnames=list(fields)); w.writeheader(); w.writerows(rs)
          write(F/'TREB_NEW_EXACT_PROMOTED.csv',[new[k] for k in sorted(new)])
          write(F/'TREB_CUMULATIVE_EXACT_PROMOTED.csv',cumulative)
          write(F/'AUTONOMOUS_BLOCKER_MANIFEST.csv',remain,current[0].keys())
          write(F/'TREB_MATERIALITY_ACCEPTED.csv',mat)
          for n in ['RECOVERED_RESIDUAL_SHARED_PLAYER_GAME_PRIMITIVES.csv.gz','RECOVERED_RESIDUAL_SHARED_TEAM_GAME_PRIMITIVES.csv.gz','NEXT_RESIDUAL_SHARED_GAME_REGISTRY.csv']:
            shutil.copy(next(C.rglob(n)),F/n)
          cq=json.load(open('/tmp/complement/COMPLEMENT_QA.json'))
          qa={'status':'PASS','starting_exact_full_core':9080,'starting_production_resolved_full_core':9084,'starting_residual':563,'complement_player_primitives':cq['recovered_exact_player_primitives'],'complement_team_facts':cq['recovered_exact_team_facts'],'new_exact_promotions':len(new),'ending_exact_full_core':9080+len(new),'ending_production_resolved_full_core':9084+len(new),'ending_residual':len(remain),'integrity':{'five_player_conservation_only_for_new_primitives':True,'raw_exact_counts_only':True,'minutes_gate_seconds':60.0,'model_used':False,'rounded_backsolve_used':False,'opponent_inference_used':False,'partial_tenure_subtraction_used':False}}
          (F/'TREB_SHARED_GAME_RECLOSURE_QA.json').write_text(json.dumps(qa,indent=2,sort_keys=True)+'\n'); print(json.dumps(qa,indent=2,sort_keys=True))
          PY
          NEW=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/final/TREB_SHARED_GAME_RECLOSURE_QA.json'))['ending_residual'])
          PY
          )
          if [ "$NEW" -ge 563 ]; then echo 'No direct residual reduction; fail closed.'; exit 0; fi
          DEST=team_trb_all_players/treb_direct_563_authoritative
          rm -rf "$DEST"; mkdir -p "$DEST"; cp /tmp/final/* "$DEST/"; cp /tmp/complement/COMPLEMENT_QA.json "$DEST/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f "$DEST"
          git commit -m "TREB: reduce production residual to ${NEW} by exact complement"
          git push origin HEAD:agent/treb-final-exact-assembly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-rapid-exact-complement-${{ github.run_id }}
          path: |
            /tmp/complement
            /tmp/general
            /tmp/twelve
            /tmp/final
          retention-days: 90
          if-no-files-found: warn
      - name: Comment result location
        if: always() && github.event_name == 'issues'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue comment "${{ github.event.issue.number }}" --body "TREB exact complement executor ran as Actions run ${{ github.run_id }}. A lower residual, if achieved, is committed under team_trb_all_players/treb_direct_563_authoritative on agent/treb-final-exact-assembly."
