name: TREB 293 exact tenure-window recovery v2

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-293-tenure-window-recovery-v2.yml]

permissions:
  actions: read
  contents: read

concurrency:
  group: treb-293-tenure-window-recovery-v2
  cancel-in-progress: false

env:
  CURRENT_ARTIFACT_ID: '9260774395'
  TENURE_ARTIFACT_ID: '9259414397'

jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix:
        year: [2000,2001,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - name: Download authoritative residual and prior tenure audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/tenure /tmp/src /tmp/out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CURRENT_ARTIFACT_ID}/zip" > /tmp/current.zip; unzip -q /tmp/current.zip -d /tmp/current
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TENURE_ARTIFACT_ID}/zip" > /tmp/tenure.zip; unzip -q /tmp/tenure.zip -d /tmp/tenure
      - name: Download retained regular-season NBA play-by-play feed
        run: |
          set -euo pipefail
          y='${{ matrix.year }}'
          curl --fail --location --retry 4 --retry-all-errors -o /tmp/list_data.txt https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          url=$(python - "$y" <<'PY'
          import sys
          y=sys.argv[1]; vals={}
          for line in open('/tmp/list_data.txt',encoding='utf-8'):
              if '=' in line:
                  k,v=line.split('=',1); vals[k.strip()]=v.strip()
          print(vals.get(f'nbastats_{y}',''))
          PY
          )
          test -n "$url"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 15 -o /tmp/src/nba.tar.xz "$url"
          tar -xJf /tmp/src/nba.tar.xz -C /tmp/src
          test -s "/tmp/src/nbastats_${y}.csv"
      - name: Recover only unique exact tenure identities
        run: |
          set -euo pipefail
          python - '${{ matrix.year }}' <<'PY'
          import csv,gzip,json,pathlib,sys
          y=int(sys.argv[1]); season=f'{y}-{(y+1)%100:02d}'
          def pid(x):
              s=str(x).strip(); return s[:-2] if s.endswith('.0') and s[:-2].isdigit() else s
          def tid(x): return str(int(float(x)))
          def gid(x):
              s=str(x).strip();
              if s.endswith('.0'): s=s[:-2]
              return str(int(float(s))).zfill(10)
          def key(r): return (str(r['season']),tid(r['team_id']),pid(r['player_id']))
          cur=list(csv.DictReader(open(next(pathlib.Path('/tmp/current').rglob('AUTONOMOUS_BLOCKER_MANIFEST.csv')),newline='')))
          wanted={key(r) for r in cur if str(r['season'])==season}
          prior=set()
          with open(next(pathlib.Path('/tmp/tenure').rglob('TREB_949_RETAINED_SCHEDULE_AUDITED_TENURE_AUDIT.csv')),newline='') as f:
              for r in csv.DictReader(f):
                  if str(r.get('season'))==season and r.get('status')=='EXACT_RETAINED_SCHEDULE_AUDITED_TENURE_IDENTITY': prior.add(key(r))
          missing=wanted-prior
          ledger={k:set() for k in missing}
          with gzip.open('team_trb_all_players/impact_database/roster_tenure_v3/player_game_roster_ledger.csv.gz','rt',encoding='utf-8',newline='') as f:
              for r in csv.DictReader(f):
                  try:k=key(r)
                  except:continue
                  if k in missing: ledger[k].add(gid(r['game_id']))
          targets={}
          with gzip.open('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz','rt',encoding='utf-8') as f:
              for line in f:
                  if not line.strip(): continue
                  r=json.loads(line)
                  try:k=key(r)
                  except:continue
                  if k in missing: targets[k]=r
          # nbastats retained source is event-level PBP. Build exact team schedule membership
          # from GAME_ID plus the three canonical player-team ID fields; regular-season IDs are 002*.
          sched={}
          with open(f'/tmp/src/nbastats_{y}.csv',newline='',encoding='utf-8-sig') as f:
              rd=csv.DictReader(f); cols=set(rd.fieldnames or [])
              if 'GAME_ID' not in cols: raise SystemExit(f'MISSING_GAME_ID {sorted(cols)}')
              team_cols=[c for c in ('PLAYER1_TEAM_ID','PLAYER2_TEAM_ID','PLAYER3_TEAM_ID') if c in cols]
              if not team_cols: raise SystemExit(f'MISSING_PLAYER_TEAM_IDS {sorted(cols)}')
              for r in rd:
                  try:g=gid(r['GAME_ID'])
                  except:continue
                  if not g.startswith('002'): continue
                  for c in team_cols:
                      raw=str(r.get(c) or '').strip()
                      if not raw or raw in {'0','0.0','nan','None'}: continue
                      try:t=tid(raw)
                      except:continue
                      sched.setdefault(t,set()).add(g)
          accepted=[]; audit=[]
          for k in sorted(missing):
              t=targets.get(k,{})
              expected=int(float(t.get('team_games_in_tenure') or 0))
              ordered=sorted(sched.get(k[1],set()),key=lambda g:int(g))
              ev=set(ledger.get(k,set()))
              candidates=[]; reason=''; method=''
              if expected<=0 or len(ordered)<expected:
                  reason='BAD_EXPECTED_OR_SCHEDULE'
              elif not ev:
                  reason='NO_EXACT_LEDGER_ANCHOR'
              else:
                  # Optional canonical game-ID anchors, if retained target happens to expose them.
                  first=next((t.get(z) for z in ('first_game_id','tenure_start_game_id','start_game_id') if t.get(z)),None)
                  last=next((t.get(z) for z in ('last_game_id','tenure_end_game_id','end_game_id') if t.get(z)),None)
                  for i in range(0,len(ordered)-expected+1):
                      w=ordered[i:i+expected]; ws=set(w)
                      if not ev.issubset(ws): continue
                      if first and gid(first)!=w[0]: continue
                      if last and gid(last)!=w[-1]: continue
                      candidates.append(w)
                  if len(candidates)==1: method='UNIQUE_EXACT_COUNT_TEAM_SCHEDULE_WINDOW_CONTAINING_EXACT_LEDGER'
                  else: reason=f'AMBIGUOUS_OR_NO_WINDOW:{len(candidates)}'
              common={'season':k[0],'team_id':k[1],'player_id':k[2],'expected_team_games':expected,'ledger_evidence_games':len(ev),'candidate_count':len(candidates)}
              if len(candidates)==1:
                  r={**common,'game_ids':'|'.join(candidates[0]),'status':'EXACT_DETERMINISTIC_TENURE_IDENTITY','method':method,'reason':''}; accepted.append(r); audit.append(r)
              else:
                  audit.append({**common,'game_ids':'','status':'UNRESOLVED_FAIL_CLOSED','method':'','reason':reason})
          cols=['season','team_id','player_id','expected_team_games','game_ids','status','method','ledger_evidence_games','candidate_count','reason']
          for name,rows in [(f'TENURE_WINDOW_AUDIT_{y}.csv',audit),(f'TENURE_WINDOW_ACCEPTED_{y}.csv',accepted)]:
              with open('/tmp/out/'+name,'w',newline='') as f: w=csv.DictWriter(f,fieldnames=cols); w.writeheader(); w.writerows(rows)
          q={'season':season,'input_residual_keys':len(wanted),'prior_exact_tenure_keys':len(wanted & prior),'attempted_missing_tenure_keys':len(missing),'accepted_exact_tenure_keys':len(accepted),'unresolved':len(audit)-len(accepted),'team_schedule_count':len(sched),'integrity':'FAIL_CLOSED_UNIQUE_WINDOW_ONLY'}
          pathlib.Path(f'/tmp/out/TENURE_WINDOW_QA_{y}.json').write_text(json.dumps(q,indent=2)+'\n'); print(json.dumps(q,indent=2))
          PY
      - name: Upload season checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TREB-293-tenure-window-v2-${{ matrix.year }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          if-no-files-found: warn

  consolidate:
    needs: recover
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TREB-293-tenure-window-v2-*-${{ github.run_id }}
          path: /tmp/all
          merge-multiple: true
      - name: Consolidate fail-closed identities
        run: |
          python - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('/tmp/all'); out=pathlib.Path('/tmp/final'); out.mkdir(parents=True,exist_ok=True)
          rows=[]; qas=[]
          for p in root.glob('TENURE_WINDOW_ACCEPTED_*.csv'): rows+=list(csv.DictReader(open(p,newline='')))
          for p in root.glob('TENURE_WINDOW_QA_*.json'):
              try: qas.append(json.loads(p.read_text()))
              except:pass
          key=lambda r:(r['season'],str(int(float(r['team_id']))),str(r['player_id']).removesuffix('.0'))
          ded={key(r):r for r in rows}
          cols=['season','team_id','player_id','expected_team_games','game_ids','status','method','ledger_evidence_games','candidate_count','reason']
          with open(out/'TREB_293_NEW_EXACT_TENURE_IDENTITIES.csv','w',newline='') as f: w=csv.DictWriter(f,fieldnames=cols); w.writeheader(); w.writerows([ded[k] for k in sorted(ded)])
          qa={'status':'PASS','season_jobs_with_qa':len(qas),'new_exact_tenure_identities':len(ded),'attempted_missing_tenure_keys':sum(int(q.get('attempted_missing_tenure_keys',0)) for q in qas),'failed_closed_remaining':sum(int(q.get('unresolved',0)) for q in qas),'rule':'exact target team-games count + retained regular-season event-derived team schedule + exact ledger evidence; accept only one deterministic contiguous team-game set'}
          (out/'TREB_293_TENURE_WINDOW_V2_QA.json').write_text(json.dumps(qa,indent=2)+'\n'); print(json.dumps(qa,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-293-tenure-window-v2-consolidated-${{ github.run_id }}
          path: /tmp/final
          retention-days: 90
