name: TREB 2002 target starter proof

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-2002-target-starter-proof.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Download 2002 source layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb-2002-target-proof
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          raw=Path('/tmp/treb-2002-target-proof')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in ('nbastats_2002','nbastatsv3_2002'):
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Build exact per-target starter evidence
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          import pandas as pd
          raw=Path('/tmp/treb-2002-target-proof')
          nba=pd.read_csv(raw/'nbastats_2002.csv',low_memory=False)
          v3=pd.read_csv(raw/'nbastatsv3_2002.csv',low_memory=False)
          gids=[20200169,20200200,20200261,20200344,20200359,20200373,20200464,20200619,20200839]
          ngid=pd.to_numeric(nba.GAME_ID,errors='coerce'); vgid=pd.to_numeric(v3.gameId,errors='coerce')
          ncols=[c for c in ['EVENTNUM','EVENTMSGTYPE','EVENTMSGACTIONTYPE','PERIOD','PCTIMESTRING','PLAYER1_ID','PLAYER1_NAME','PLAYER1_TEAM_ID','PLAYER2_ID','PLAYER2_NAME','PLAYER2_TEAM_ID','PLAYER3_ID','PLAYER3_NAME','PLAYER3_TEAM_ID','HOMEDESCRIPTION','VISITORDESCRIPTION'] if c in nba]
          vcols=[c for c in ['actionNumber','period','clock','actionType','subType','description','personId','playerName','teamId','teamTricode'] if c in v3]
          def clean(df,cols):
              h=df[cols].copy(); return h.where(pd.notna(h),None).to_dict('records')
          out=[]
          for gid in gids:
              g=nba[ngid.eq(gid)].copy(); vg=v3[vgid.eq(gid)].copy()
              # Identify first period where legacy period starter state contains an over/under-complete team candidate set.
              periods=[]
              for pn,p in g.groupby(pd.to_numeric(g.PERIOD,errors='coerce')):
                  pn=int(pn)
                  subs=p[pd.to_numeric(p.EVENTMSGTYPE,errors='coerce').eq(8)]
                  ids=[]
                  for c in ('PLAYER1_ID','PLAYER2_ID','PLAYER3_ID'):
                      ids += pd.to_numeric(p[c],errors='coerce').dropna().astype(int).tolist()
                  # Evidence packet only: full target period, preceding-period tail and V3 target chronology.
                  periods.append((pn,len(set(i for i in ids if i>0)),len(subs)))
              # From prior adjudication these are the target periods: failures are almost all OT; choose the last period with substitutions/candidate evidence.
              target_p=max(int(x) for x in pd.to_numeric(g.PERIOD,errors='coerce').dropna().unique())
              # If final period has no evidence, use latest period represented in V3 as well.
              p=g[pd.to_numeric(g.PERIOD,errors='coerce').eq(target_p)].copy()
              vp=vg[pd.to_numeric(vg.period,errors='coerce').eq(target_p)].copy()
              prev=g[pd.to_numeric(g.PERIOD,errors='coerce').eq(target_p-1)].tail(120)
              subs=p[pd.to_numeric(p.EVENTMSGTYPE,errors='coerce').eq(8)]
              opening=p.sort_values('EVENTNUM').head(40)
              vopening=vp.sort_values('actionNumber').head(60) if 'actionNumber' in vp else vp.head(60)
              out.append({'game_id':gid,'target_period':target_p,'period_inventory':periods,
                          'legacy_prior_tail':clean(prev,ncols),'legacy_opening_rows':clean(opening,ncols),
                          'legacy_substitutions':clean(subs,ncols),'v3_opening_rows':clean(vopening,vcols)})
          (raw/'target_starter_proof.json').write_text(json.dumps(out,indent=2,default=str)+'\n')
          print(json.dumps({'status':'EVIDENCE_ONLY','games':len(out),'game_ids':gids,'production_mutated':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-2002-target-starter-proof-${{ github.run_id }}
          path: /tmp/treb-2002-target-proof/target_starter_proof.json
          retention-days: 90
          if-no-files-found: error
