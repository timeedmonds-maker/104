name: TREB 2025-26 residual modern409 staged recovery

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-2025-residual-modern409-recovery.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: treb-2025-residual-modern409-recovery
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  recover409:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r team_trb_all_players/requirements.txt

      - name: Stage 1 - build authoritative 409 full-season target windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/work/residual /tmp/out /tmp/modern_raw /tmp/modern_out
          curl --fail --location --retry 4 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/work/residual.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9242191393/zip"
          unzip -q /tmp/work/residual.zip -d /tmp/work/residual
          python - <<'PY'
          import csv,gzip,json,pathlib,collections
          manifest=next(pathlib.Path('/tmp/work/residual').rglob('TREB_RESIDUAL_1751_MANIFEST.csv.gz'))
          with gzip.open(manifest,'rt',encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          keys={(int(float(r['player_id'])),int(float(r['team_id']))) for r in rows if str(r.get('season','')).replace('_','-')=='2025-26'}
          assert len(keys)==409,len(keys)
          full=pathlib.Path('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz')
          schedule=pathlib.Path('team_trb_all_players/impact_database/roster_tenure/regular_season_games.jsonl.gz')
          team_dates=collections.defaultdict(list)
          with gzip.open(schedule,'rt',encoding='utf-8') as f:
              for line in f:
                  if not line.strip(): continue
                  g=json.loads(line)
                  if g.get('season')!='2025-26': continue
                  d=str(g['game_date'])[:10]
                  team_dates[int(g['home_team_id'])].append(d); team_dates[int(g['away_team_id'])].append(d)
          selected=[]
          with gzip.open(full,'rt',encoding='utf-8') as f:
              for line in f:
                  if not line.strip(): continue
                  r=json.loads(line)
                  if r.get('season')!='2025-26' or not bool(r.get('full_core_reuse')): continue
                  k=(int(r['player_id']),int(r['team_id']))
                  if k not in keys: continue
                  dates=team_dates[int(r['team_id'])]
                  if not dates: raise SystemExit(f'NO_TEAM_DATES {k}')
                  r['query_start_date']=min(dates); r['query_end_date']=max(dates)
                  r['canonical_seconds_on']=float(r.get('seconds_on',0.0))
                  selected.append(r)
          got={(int(r['player_id']),int(r['team_id'])) for r in selected}
          assert len(selected)==409 and got==keys,(len(selected),len(got),len(keys-got))
          out=pathlib.Path('/tmp/work/targets_409.jsonl.gz')
          with gzip.open(out,'wt',encoding='utf-8') as f:
              for r in selected: f.write(json.dumps(r,separators=(',',':'))+'\n')
          # Modern engine reads this path; replace only inside ephemeral runner checkout.
          dst=pathlib.Path('team_trb_all_players/impact_database/roster_tenure_v2/wowy_partial_segments.jsonl.gz')
          dst.write_bytes(out.read_bytes())
          pathlib.Path('/tmp/out/stage_1.json').write_text(json.dumps({'stage':1,'status':'PASS','targets':409,'window_policy':'full regular-season team schedule','structural_minutes_gate_seconds':60},indent=2))
          print('STAGE1_GATE=PASS targets=409')
          PY

      - name: Upload Stage 1 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: TREB-modern409-stage-1-${{ github.run_id }}
          path: /tmp/out/stage_1.json
          retention-days: 90

      - name: Stage 2 - acquire proven static 2025-26 CDN source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess,tarfile,urllib.request,json
          raw=Path('/tmp/modern_raw'); raw.mkdir(parents=True,exist_ok=True)
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          url=urls['cdnnba_2025']
          arc=raw/'cdnnba_2025.tar.xz'
          subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
          sha=hashlib.sha256(arc.read_bytes()).hexdigest()
          expected='a5d1bed30778430816b755676649cb2e3690ea62df5d96f4d9d6e9a8b8839339'
          if sha!=expected: raise SystemExit(f'CDN_SHA_MISMATCH actual={sha} expected={expected}')
          with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          csv=raw/'cdnnba_2025.csv'
          if not csv.exists() or csv.stat().st_size!=208091508: raise SystemExit(f'CDN_CSV_SIZE_BAD {csv.stat().st_size if csv.exists() else None}')
          Path('/tmp/out/stage_2.json').write_text(json.dumps({'stage':2,'status':'PASS','archive_sha256':sha,'csv_bytes':csv.stat().st_size},indent=2))
          print('STAGE2_GATE=PASS sha=',sha,'bytes=',csv.stat().st_size)
          PY

      - name: Upload Stage 2 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: TREB-modern409-stage-2-${{ github.run_id }}
          path: /tmp/out/stage_2.json
          retention-days: 90

      - name: Stage 3 - reconstruct exact modern TREB for only 409 targets
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/run_modern_treb_production_2025.py \
            --raw /tmp/modern_raw --output /tmp/modern_out --batch-size 50 --force \
            2>&1 | tee /tmp/out/modern409-production.log
          test -f /tmp/modern_out/locked_seasons/2025-26.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/modern_out/locked_seasons/2025-26.json')
          d=json.loads(p.read_text())
          out={'stage':3,'status':d.get('status'),'target_count':d.get('target_count'),'games_required':d.get('games_required'),'exceptions':len(d.get('exceptions') or []),'unmatched_rebound_rows':len(d.get('unmatched_rebound_rows') or []),'accepted_excluded_games':len(d.get('accepted_excluded_games') or [])}
          pathlib.Path('/tmp/out/stage_3.json').write_text(json.dumps(out,indent=2))
          print('STAGE3_GATE',json.dumps(out,sort_keys=True))
          PY

      - name: Upload Stage 3 checkpoint and reconstruction checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TREB-modern409-stage-3-${{ github.run_id }}
          path: |
            /tmp/out/stage_3.json
            /tmp/out/modern409-production.log
            /tmp/modern_out/checkpoints/2025-26
            /tmp/modern_out/locked_seasons/2025-26.json
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn

      - name: Stage 4 - enforce minutes integrity and materialize exact 409 overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,csv,math,hashlib
          lock=json.loads(pathlib.Path('/tmp/modern_out/locked_seasons/2025-26.json').read_text())
          assert lock.get('status')=='COMPLETE',lock.get('status')
          assert int(lock.get('target_count',-1))==409,lock.get('target_count')
          assert not lock.get('exceptions'),len(lock.get('exceptions') or [])
          assert not lock.get('unmatched_rebound_rows'),len(lock.get('unmatched_rebound_rows') or [])
          assert not lock.get('accepted_excluded_games'),len(lock.get('accepted_excluded_games') or [])
          targets=lock.get('targets') or []
          assert len(targets)==409,len(targets)
          rows=[]; bad=[]; seen=set()
          for r in targets:
              key=('2025-26',int(r['team_id']),str(r['player_id']).removesuffix('.0'))
              if key in seen: raise SystemExit(f'DUPLICATE {key}')
              seen.add(key)
              actual=float(r.get('seconds_on',0.0)); target=float(r.get('canonical_seconds_on',0.0)); diff=actual-target
              if abs(diff)>60.0: bad.append({'season':'2025-26','team_id':key[1],'player_id':key[2],'actual_seconds':actual,'target_seconds':target,'diff_seconds':diff})
              ton=int(r['team_oreb_on'])+int(r['team_dreb_on']); oon=int(r['opponent_oreb_on'])+int(r['opponent_dreb_on'])
              toff=int(r['team_oreb_off'])+int(r['team_dreb_off']); ooff=int(r['opponent_oreb_off'])+int(r['opponent_dreb_off'])
              if min(ton,oon,toff,ooff)<0 or ton+oon<=0 or toff+ooff<=0: raise SystemExit(f'BAD_COUNTS {key}')
              on=ton/(ton+oon); off=toff/(toff+ooff)
              rows.append({'season':'2025-26','team_id':key[1],'player_id':key[2],'status':'PASS' if abs(diff)<=60 else 'MINUTES_MISMATCH','target_seconds_on':target,'direct_seconds_on':actual,'minutes_diff_seconds':diff,'team_oreb_on':int(r['team_oreb_on']),'team_dreb_on':int(r['team_dreb_on']),'opponent_oreb_on':int(r['opponent_oreb_on']),'opponent_dreb_on':int(r['opponent_dreb_on']),'team_oreb_off':int(r['team_oreb_off']),'team_dreb_off':int(r['team_dreb_off']),'opponent_oreb_off':int(r['opponent_oreb_off']),'opponent_dreb_off':int(r['opponent_dreb_off']),'direct_treb_on':on,'direct_treb_off':off,'direct_treb_swing':on-off,'source':'static_cdnnba_2025_modern_exact_reconstruction','rounded_percentage_backsolve_used':False,'opponent_rebound_inference_used':False,'whole_team_subtraction_across_partial_tenure_used':False})
          outcsv=pathlib.Path('/tmp/out/TREB_2025_26_RESIDUAL_409_MODERN_EXACT.csv')
          with outcsv.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          if bad:
              bp=pathlib.Path('/tmp/out/TREB_2025_26_RESIDUAL_409_MINUTES_FAILURES.json'); bp.write_text(json.dumps(bad,indent=2))
          summary={'stage':4,'status':'PASS' if not bad else 'INCOMPLETE','rows':len(rows),'minutes_gate_pass':len(rows)-len(bad),'minutes_gate_fail':len(bad),'max_abs_minutes_diff_seconds':max(abs(float(x['minutes_diff_seconds'])) for x in rows),'structural_minutes_gate_seconds':60,'overlay_sha256':hashlib.sha256(outcsv.read_bytes()).hexdigest()}
          pathlib.Path('/tmp/out/stage_4.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('STAGE4_GATE',json.dumps(summary,sort_keys=True))
          if bad: raise SystemExit(f'MINUTES_GATE_FAIL {len(bad)}')
          PY

      - name: Upload final 409 exact recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TREB-modern409-exact-recovery-${{ github.run_id }}
          path: |
            /tmp/out
            /tmp/modern_out/locked_seasons/2025-26.json
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
