name: TREB Adams 21600211 targeted classifier truth

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - team_trb_all_players/final_integrity_rebuild/ADAMS_21600211_TARGET_CONTROL.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz requests urllib3
      - name: Download 2016-17 local sources
        shell: bash
        run: |
          set -euo pipefail
          RAW=/tmp/trebraw-2016; mkdir -p "$RAW"
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          y=2016; raw=Path('/tmp/trebraw-2016')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in [f'nbastats_{y}',f'nbastatsv3_{y}',f'pbpstats_{y}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Retry exact truth for discriminating game
        shell: bash
        run: |
          set -o pipefail
          NBA=$(find /tmp/trebraw-2016 -name 'nbastats_2016.csv' -print -quit)
          V3=$(find /tmp/trebraw-2016 -name 'nbastatsv3_2016.csv' -print -quit)
          PBP=$(find /tmp/trebraw-2016 -name 'pbpstats_2016.csv' -print -quit)
          python -u team_trb_all_players/adams_classifier_target_game.py \
            --nba "$NBA" --v3 "$V3" --pbp "$PBP" --game-id 21600211 \
            --output /tmp/ADAMS_21600211_TARGET.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-adams-21600211-target
          path: /tmp/ADAMS_21600211_TARGET.json
          retention-days: 90
          if-no-files-found: warn
      - name: Persist result if present
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/ADAMS_21600211_TARGET.json ] || exit 0
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-batched-game-facts-20260812
          git reset --hard origin/agent/treb-batched-game-facts-20260812
          DEST=team_trb_all_players/final_integrity_rebuild/adams_classifier_target
          mkdir -p "$DEST"; cp /tmp/ADAMS_21600211_TARGET.json "$DEST"/
          git add -f "$DEST/ADAMS_21600211_TARGET.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist Adams 21600211 classifier truth retry'
          git push origin HEAD:agent/treb-batched-game-facts-20260812
