name: TREB aggregate exception diagnostics

on:
  push:
    branches: [treb-final-production-20260812]
    paths:
      - team_trb_all_players/impact_database/EXCEPTION_DIAGNOSTIC_AGGREGATE_CONTROL.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read source run
        id: control
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('team_trb_all_players/impact_database/EXCEPTION_DIAGNOSTIC_AGGREGATE_CONTROL.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"run_id={int(d['source_run_id'])}\n")
          PY
      - name: Download diagnostic artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/treb-exception-diag
          gh run download "${{ steps.control.outputs.run_id }}" --repo "${{ github.repository }}" --dir /tmp/treb-exception-diag
      - name: Aggregate
        run: |
          python -u team_trb_all_players/aggregate_exception_diagnostics.py \
            --root /tmp/treb-exception-diag \
            --output /tmp/treb-exception-diag/exception_diagnostic_index.json
      - uses: actions/upload-artifact@v4
        with:
          name: treb-exception-diagnostic-index-${{ github.sha }}
          path: /tmp/treb-exception-diag/exception_diagnostic_index.json
          retention-days: 90
          if-no-files-found: error
