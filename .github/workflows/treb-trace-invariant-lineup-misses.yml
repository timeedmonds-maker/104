name: TREB trace invariant lineup control misses

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - .github/workflows/treb-trace-invariant-lineup-misses.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  trace:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2008,2009,2010,2011,2015,2017,2018,2019,2021,2022,2023,2024]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Download sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"; mkdir -p "$RAW"
          cp team_trb_all_players/final_integrity_rebuild/nonlive_unmatched_rebound/NONLIVE_UNMATCHED_REBOUND_SUMMARY.json /tmp/nonlive-summary.json
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          y=int('${{ matrix.year }}'); raw=Path(f'/tmp/trebraw-{y}')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode(); urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in [f'nbastats_{y}',f'nbastatsv3_{y}',f'pbpstats_{y}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]; subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Trace misses
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"; NBA=$(find "$RAW" -name "nbastats_${YEAR}.csv" -print -quit); V3=$(find "$RAW" -name "nbastatsv3_${YEAR}.csv" -print -quit); PBP=$(find "$RAW" -name "pbpstats_${YEAR}.csv" -print -quit)
          python -u team_trb_all_players/trace_invariant_lineup_control_misses.py --nba "$NBA" --v3 "$V3" --pbp "$PBP" --summary /tmp/nonlive-summary.json --year "$YEAR" --output "/tmp/MISSES_${YEAR}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'treb-lineup-miss-${{ matrix.year }}', path: '/tmp/MISSES_${{ matrix.year }}.json', retention-days: 90}
  aggregate:
    needs: trace
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: 'treb-lineup-miss-*', path: /tmp/results}
      - name: Aggregate misses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          chunks=[]
          for p in Path('/tmp/results').rglob('MISSES_*.json'):
              try: chunks.append(json.loads(p.read_text()))
              except Exception: pass
          misses=[m for c in chunks for m in c.get('misses',[])]
          out={'status':'COMPLETE' if len(chunks)==12 else 'PARTIAL','chunks':len(chunks),'control_applicable':sum(c.get('control_applicable',0) for c in chunks),'control_correct':sum(c.get('control_correct',0) for c in chunks),'control_wrong':len(misses),'misses':misses}
          Path('/tmp/INVARIANT_LINEUP_CONTROL_MISSES.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - name: Persist trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git fetch origin agent/treb-batched-game-facts-20260812; git reset --hard origin/agent/treb-batched-game-facts-20260812
          DEST=team_trb_all_players/final_integrity_rebuild/invariant_semantic_rebound; mkdir -p "$DEST"; cp /tmp/INVARIANT_LINEUP_CONTROL_MISSES.json "$DEST"/; git add -f "$DEST/INVARIANT_LINEUP_CONTROL_MISSES.json"; if ! git diff --cached --quiet; then git commit -m 'Persist invariant-lineup control misses'; git push origin HEAD:agent/treb-batched-game-facts-20260812; fi
