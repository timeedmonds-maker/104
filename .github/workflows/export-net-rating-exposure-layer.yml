name: Export Net Rating exposure layer

on:
  push:
    branches:
      - agent/oreb-career-scatter
    paths:
      - '.github/workflows/export-net-rating-exposure-layer.yml'
      - 'net_rating_export_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export exact retained segment rows
        shell: bash
        run: |
          python - <<'PY'
          import csv, gzip, json, pathlib, hashlib, collections
          src = pathlib.Path('team_trb_all_players/impact_database/corrected_off/tenure_segment_on_off.jsonl.gz')
          out = pathlib.Path('net_rating_export')
          out.mkdir(exist_ok=True)
          if not src.exists():
              raise SystemExit(f'missing source: {src}')

          metrics = {'OReb%','Pts per 100 Possessions','Pts per 100 Possessions - Defense'}
          fields = [
            'season','player_id','player','team_id','team_abbr','metric',
            'tenure_start','tenure_end','query_start_date','query_end_date',
            'minutes_on','minutes_off','on','off_corrected','on_minus_off_corrected',
            'complete','tenure_confidence','boundary_resolution','collection_source',
            'tenure_source','transaction_day_policy','team_games_in_window'
          ]
          counts=collections.Counter(); total=0; sample_keys=None
          with gzip.open(src,'rt',encoding='utf-8') as f, \
               gzip.open(out/'exact_exposure_and_net_rating_components.csv.gz','wt',encoding='utf-8',newline='') as of:
              w=csv.DictWriter(of,fieldnames=fields); w.writeheader()
              for line in f:
                  if not line.strip(): continue
                  total += 1
                  r=json.loads(line)
                  if sample_keys is None: sample_keys=sorted(r.keys())
                  m=r.get('metric')
                  if m in metrics:
                      w.writerow({k:r.get(k) for k in fields})
                      counts[m]+=1
          sha=hashlib.sha256(src.read_bytes()).hexdigest()
          qa={
            'status':'PASS','source':str(src),'source_sha256':sha,'source_size_bytes':src.stat().st_size,
            'source_total_rows':total,'source_row_keys':sample_keys,'export_metric_counts':dict(counts),
            'export_fields':fields
          }
          (out/'EXPORT_QA.json').write_text(json.dumps(qa,indent=2),encoding='utf-8')
          print(json.dumps(qa,indent=2))
          PY
      - name: Upload Net Rating exposure layer
        uses: actions/upload-artifact@v4
        with:
          name: net-rating-exposure-layer-exact
          path: net_rating_export/
          if-no-files-found: error
          retention-days: 30
