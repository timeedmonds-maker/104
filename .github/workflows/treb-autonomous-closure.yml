name: TREB autonomous iterative closure
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-autonomous-closure.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: treb-autonomous-iterative-closure
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - name: Download authoritative 8,396 state diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/closure /tmp/out
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9253878073/zip > /tmp/closure.zip
          unzip -q /tmp/closure.zip -d /tmp/closure
      - name: Inventory retained repo evidence for exact missing games
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,pathlib,gzip,re,collections
          out=pathlib.Path('/tmp/out')
          diag=next(pathlib.Path('/tmp/closure').rglob('TREB_AUTONOMOUS_DIAGNOSTICS.csv'))
          rows=list(csv.DictReader(open(diag,newline='')))
          miss=collections.defaultdict(set)
          no_identity=[]
          for r in rows:
              raw=r.get('error') or ''
              try:e=json.loads(raw)
              except:
                  if 'no exact tenure identity set' in raw: no_identity.append(r)
                  continue
              for gid in e.get('missing',[]) or []:
                  miss[str(gid)].add((r['season'],str(int(float(r['team_id']))),str(r['player_id']).removesuffix('.0')))
          with open(out/'MISSING_GAME_KEYS.csv','w',newline='') as f:
              w=csv.writer(f);w.writerow(['game_id','season','team_id','player_id'])
              for gid in sorted(miss):
                  for k in sorted(miss[gid]): w.writerow([gid,*k])
          gids=set(miss)
          tokens=('retained','fact','game','box','pbp','v3','forensic','source','roster','cache','rebound')
          candidates=[]
          for p in pathlib.Path('team_trb_all_players').rglob('*'):
              if not p.is_file(): continue
              n=p.name.lower(); s=str(p.parent).lower()
              if not n.endswith(('.csv','.csv.gz','.json','.json.gz','.jsonl','.jsonl.gz')): continue
              if not any(t in n or t in s for t in tokens): continue
              try:size=p.stat().st_size
              except:continue
              if size<=250_000_000: candidates.append((p,size))
          gid_re=re.compile('|'.join(re.escape(x) for x in sorted(gids,key=len,reverse=True))) if gids else None
          hits=[]; scanned=[]
          for p,size in candidates:
              scanned.append((str(p),size))
              try:
                  opener=gzip.open if p.name.endswith('.gz') else open
                  with opener(p,'rt',encoding='utf-8',errors='ignore') as f:
                      for ln,line in enumerate(f,1):
                          if not gid_re: break
                          m=gid_re.search(line)
                          if m: hits.append({'game_id':m.group(0),'source_file':str(p),'line':ln,'snippet':line[:1600].replace('\n',' ')})
              except Exception as e:
                  hits.append({'game_id':'','source_file':str(p),'line':0,'snippet':'SCAN_ERROR '+repr(e)})
          with open(out/'RETAINED_SOURCE_GAME_HITS.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['game_id','source_file','line','snippet']);w.writeheader();w.writerows(hits)
          with open(out/'SCANNED_SOURCE_FILES.csv','w',newline='') as f:
              w=csv.writer(f);w.writerow(['source_file','bytes']);w.writerows(scanned)
          if no_identity:
              with open(out/'NO_TENURE_IDENTITY_KEYS.csv','w',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=no_identity[0].keys());w.writeheader();w.writerows(no_identity)
          by=collections.Counter(h['game_id'] for h in hits if h['game_id'])
          qa={'status':'PASS','authoritative_residual':1251,'resolved_total':8396,'diagnostic_rows':len(rows),'missing_game_ids':len(gids),'missing_key_game_pairs':sum(len(v) for v in miss.values()),'no_exact_tenure_identity_rows':len(no_identity),'candidate_files_scanned':len(scanned),'source_hit_rows':sum(by.values()),'missing_games_with_retained_repo_hits':len(by),'missing_games_without_retained_repo_hits':len(gids-set(by)),'strategy_ledger':{'prior':'exact retained consensus + deterministic tenure identity','prior_result':'0 promotions from 1251 residuals','current':'targeted retained repo source inventory for exact missing games','state':'COMPLETED','next':'Parse only hit-bearing source schemas and add exact missing primitives; separately attack no-tenure-identity keys from retained boundary/roster evidence.'},'integrity':{'materiality_threshold_pp':0.01,'minutes_spread_seconds':60,'empirical_model_used':False,'rounded_percentage_backsolve_used':False,'opponent_rebound_inference_used':False,'partial_tenure_whole_team_subtraction_used':False,'unsafe_global_event_order_used':False}}
          (out/'RETAINED_SOURCE_INVENTORY_QA.json').write_text(json.dumps(qa,indent=2)+'\n')
          print(json.dumps(qa,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-autonomous-retained-source-inventory-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error