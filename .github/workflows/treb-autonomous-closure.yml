name: TREB autonomous iterative closure
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-autonomous-closure.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: treb-autonomous-iterative-closure
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - name: Download authoritative 8396 state and exact retained consensus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/state /tmp/consensus /tmp/out
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9253822549/zip > /tmp/state.zip
          unzip -q /tmp/state.zip -d /tmp/state
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9252786257/zip > /tmp/consensus.zip
          unzip -q /tmp/consensus.zip -d /tmp/consensus
      - name: Exact zero-second DNP-aware promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,json,pathlib,collections
          OUT=pathlib.Path('/tmp/out')
          residual_file=next(pathlib.Path('/tmp/state').rglob('*RESIDUAL*.csv'),None) or next(pathlib.Path('/tmp/state').rglob('*BLOCKER*.csv'),None)
          if residual_file is None: raise SystemExit('No authoritative residual manifest')
          residual=list(csv.DictReader(open(residual_file,newline='')))
          def normkey(r): return (str(r['season']),str(int(float(r['team_id']))),str(r['player_id']).removesuffix('.0'))
          current={normkey(r):r for r in residual}
          cp=next(pathlib.Path('/tmp/consensus').rglob('PROMOTABLE_RETAINED_FACT_CONSENSUS.csv'))
          facts=collections.defaultdict(dict)
          with open(cp,newline='') as f:
            for r in csv.DictReader(f):
              facts[(str(r['game_id']),str(int(float(r['team_id']))),str(r.get('player_id','')).removesuffix('.0'))][r['field']]=float(r['value'])
          reqp={'seconds_on','team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on'}
          reqt={'game_seconds','team_oreb','team_dreb','opponent_oreb','opponent_dreb'}
          targets={}
          tp=pathlib.Path('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz')
          with gzip.open(tp,'rt') as f:
            for line in f:
              if not line.strip(): continue
              r=json.loads(line); k=normkey(r)
              if k in current: targets[k]=r
          schedule=collections.defaultdict(list)
          gp=pathlib.Path('team_trb_all_players/impact_database/roster_tenure/regular_season_games.jsonl.gz')
          with gzip.open(gp,'rt') as f:
            for line in f:
              if not line.strip(): continue
              r=json.loads(line); gid=str(r.get('game_id') or r.get('GAME_ID') or '')
              season=str(r.get('season') or r.get('SEASON') or ''); date=str(r.get('game_date') or r.get('GAME_DATE') or r.get('date') or '')[:10]
              tids=[]
              for fld in ['team_id','TEAM_ID','home_team_id','visitor_team_id','away_team_id','HOME_TEAM_ID','VISITOR_TEAM_ID']:
                if r.get(fld) not in (None,''):
                  try:tids.append(str(int(float(r[fld]))))
                  except: pass
              for tid in set(tids): schedule[(season,tid)].append((date,gid))
          # Explicit player-game roster ledger, preserving exact game identity and seconds_game.
          ledger_games=collections.defaultdict(set); ledger_seconds={}; duplicate_conflicts=[]
          lp=pathlib.Path('team_trb_all_players/impact_database/roster_tenure_v3/player_game_roster_ledger.csv.gz')
          with gzip.open(lp,'rt',newline='') as f:
            for r in csv.DictReader(f):
              try:k=normkey(r); gid=str(r['game_id']); sec=float(r.get('seconds_game') or 0)
              except: continue
              if k not in current: continue
              ledger_games[k].add(gid)
              kg=(k,gid)
              if kg in ledger_seconds and abs(ledger_seconds[kg]-sec)>1e-9: duplicate_conflicts.append((k,gid,ledger_seconds[kg],sec))
              ledger_seconds[kg]=sec
          if duplicate_conflicts: raise SystemExit(f'Conflicting ledger seconds: {duplicate_conflicts[:5]}')
          windows=collections.defaultdict(list)
          window_sources=[
            pathlib.Path('team_trb_all_players/impact_database/roster_tenure/player_team_season_windows_schedule_audited.jsonl.gz'),
            pathlib.Path('team_trb_all_players/impact_database/roster_tenure/player_team_season_windows_evidence_audited.jsonl.gz'),
            pathlib.Path('team_trb_all_players/impact_database/roster_tenure/player_team_season_windows.jsonl.gz'),
            pathlib.Path('team_trb_all_players/impact_database/roster_tenure_v3_hybrid/player_team_season_targets.jsonl.gz')]
          for wp in window_sources:
            if not wp.exists(): continue
            try:
              with gzip.open(wp,'rt') as f:
                for line in f:
                  if not line.strip(): continue
                  r=json.loads(line)
                  try:k=normkey(r)
                  except: continue
                  if k in current: windows[k].append((str(wp),r))
            except Exception as e: print('WINDOW_READ_FAIL',wp,e)
          def parse_intervals(r):
            vals=[]; raw=r.get('intervals')
            if isinstance(raw,str):
              try: raw=json.loads(raw)
              except: raw=None
            if isinstance(raw,list):
              for x in raw:
                if isinstance(x,dict):
                  a=x.get('start') or x.get('start_date') or x.get('segment_start') or x.get('from'); b=x.get('end') or x.get('end_date') or x.get('segment_end') or x.get('to')
                  if a and b: vals.append((str(a)[:10],str(b)[:10]))
            a=r.get('start_date') or r.get('segment_start') or r.get('tenure_start'); b=r.get('end_date') or r.get('segment_end') or r.get('tenure_end')
            if a and b: vals.append((str(a)[:10],str(b)[:10]))
            return vals
          def candidate_sets(k):
            expected=int(float(targets.get(k,{}).get('team_games_in_tenure',0) or 0)); yielded=set()
            s=set(ledger_games.get(k,set()))
            if s and len(s)==expected:
              yielded.add(tuple(sorted(s))); yield 'v3_roster_ledger',s
            for src,r in [('canonical_v2',targets.get(k,{}))]+windows.get(k,[]):
              if not r: continue
              for a,b in parse_intervals(r):
                s={gid for date,gid in schedule.get((k[0],k[1]),[]) if a<=date<=b}; sig=tuple(sorted(s))
                if s and len(s)==expected and sig not in yielded:
                  yielded.add(sig); yield 'interval:'+str(src),s
          def promote(k,gids,source):
            agg=collections.Counter(); missing_nonzero=[]; missing_unknown=[]; zero_filled=[]; missing_team=[]; bad=[]
            for gid in sorted(gids):
              tv=facts.get((gid,k[1],''),{})
              if not reqt.issubset(tv): missing_team.append(gid); continue
              pv=facts.get((gid,k[1],k[2]),{})
              if not reqp.issubset(pv):
                sec=ledger_seconds.get((k,gid))
                if sec is not None and abs(sec)<=1e-9:
                  # Exact identity + exactly zero seconds => exact zero ON sufficient statistics.
                  pv={'seconds_on':0.0,'team_oreb_on':0.0,'team_dreb_on':0.0,'opponent_oreb_on':0.0,'opponent_dreb_on':0.0}
                  zero_filled.append(gid)
                elif sec is None: missing_unknown.append(gid); continue
                else: missing_nonzero.append(gid); continue
              comps=[tv['team_oreb']-pv['team_oreb_on'],tv['team_dreb']-pv['team_dreb_on'],tv['opponent_oreb']-pv['opponent_oreb_on'],tv['opponent_dreb']-pv['opponent_dreb_on']]
              if min(comps)<-1e-9: bad.append(gid); continue
              for z in reqp: agg[z]+=pv[z]
              for z in reqt: agg[z]+=tv[z]
            if missing_team or missing_nonzero or missing_unknown or bad:
              return None,{'missing_team':missing_team,'missing_player_nonzero_seconds':missing_nonzero,'missing_player_unknown_seconds':missing_unknown,'zero_second_exact_fills':zero_filled,'bad':bad}
            tr_on=agg['team_oreb_on']+agg['team_dreb_on']; opp_on=agg['opponent_oreb_on']+agg['opponent_dreb_on']
            tr_off=(agg['team_oreb']+agg['team_dreb'])-tr_on; opp_off=(agg['opponent_oreb']+agg['opponent_dreb'])-opp_on
            if min(tr_off,opp_off)<-1e-9 or tr_on+opp_on<=0 or tr_off+opp_off<=0: return None,{'invalid_denominator':True,'zero_second_exact_fills':zero_filled}
            on=100*tr_on/(tr_on+opp_on); off=100*tr_off/(tr_off+opp_off)
            return {'season':k[0],'team_id':k[1],'player_id':k[2],'metric':'TotalReboundPct','on':on,'off_corrected':off,'on_minus_off_corrected':on-off,'seconds_on':agg['seconds_on'],'team_games_in_tenure':len(gids),'identity_source':source,'zero_second_games_filled':len(zero_filled),'provenance':'exact retained consensus + exact zero-second roster-ledger ON identity + deterministic tenure identity'},None
          promoted=[]; diagnostics=[]
          for k in list(current):
            attempts=0
            for src,gids in candidate_sets(k):
              attempts+=1; row,err=promote(k,gids,src)
              if row: promoted.append(row); del current[k]; break
              diagnostics.append({'season':k[0],'team_id':k[1],'player_id':k[2],'source':src,'game_count':len(gids),'error':json.dumps(err,sort_keys=True)})
            if attempts==0: diagnostics.append({'season':k[0],'team_id':k[1],'player_id':k[2],'source':'none','game_count':0,'error':'no exact tenure identity set'})
          if promoted:
            with open(OUT/'TREB_ZERO_SECOND_EXACT_PROMOTED.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=promoted[0].keys()); w.writeheader(); w.writerows(promoted)
          with open(OUT/'TREB_ZERO_SECOND_RESIDUAL.csv','w',newline='') as f:
            fields=list(residual[0].keys()); w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows([current[k] for k in sorted(current)])
          if diagnostics:
            with open(OUT/'TREB_ZERO_SECOND_DIAGNOSTICS.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=diagnostics[0].keys()); w.writeheader(); w.writerows(diagnostics)
          qa={'status':'PASS','starting_residual':len(residual),'new_exact_promotions':len(promoted),'ending_residual':len(current),'resolved_total_if_merged':9647-len(current),'promoted_zero_second_games_total':sum(int(r['zero_second_games_filled']) for r in promoted),'integrity':{'explicit_or_deterministic_tenure_identity':True,'zero_second_identity_from_explicit_roster_ledger':True,'exact_team_game_totals_required':True,'same_tenure_raw_count_complement':True,'models':False,'rounded_backsolve':False,'count_only_identity':False,'whole_season_off_complement':False},'next':'Merge any promoted keys into authoritative 8,396 state, then recover only remaining nonzero-second player-game primitives.'}
          (OUT/'TREB_ZERO_SECOND_QA.json').write_text(json.dumps(qa,indent=2)+'\n'); print(json.dumps(qa,indent=2))
          PY
      - name: Validate fail-closed outputs
        run: |
          python - <<'PY'
          import json
          q=json.load(open('/tmp/out/TREB_ZERO_SECOND_QA.json'))
          assert q['status']=='PASS'
          assert q['starting_residual']==1251
          assert q['ending_residual']+q['new_exact_promotions']==1251
          assert q['resolved_total_if_merged']==8396+q['new_exact_promotions']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-zero-second-exact-promotion-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
