name: TREB autonomous iterative closure
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-autonomous-closure.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: treb-autonomous-iterative-closure
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - name: Download targeted retained-source inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/inventory /tmp/out
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9254446960/zip > /tmp/inventory.zip
          unzip -q /tmp/inventory.zip -d /tmp/inventory
      - name: Classify hit-bearing schemas for exact TREB primitives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,pathlib,gzip,collections,re
          root=pathlib.Path('.')
          inv=pathlib.Path('/tmp/inventory')
          out=pathlib.Path('/tmp/out')
          hits=list(csv.DictReader(open(inv/'RETAINED_SOURCE_GAME_HITS.csv',newline='')))
          missing=set(r['game_id'] for r in csv.DictReader(open(inv/'MISSING_GAME_KEYS.csv',newline='')))
          files=sorted(set(r['source_file'] for r in hits if r.get('source_file')))
          game_alias={'game_id','gameid','gameId','GAME_ID','Game_ID'}
          player_alias={'player_id','playerid','playerId','PLAYER_ID','personId','person_id'}
          team_alias={'team_id','teamid','teamId','TEAM_ID'}
          # Exact TREB reconstruction needs rebound/opportunity sufficient-stat primitives, not percentages.
          primitive_tokens=('oreb','dreb','reb','rebound','miss','fgm','fga','poss','opportun','seconds','minutes','duration')
          percentage_tokens=('pct','percentage','rate')
          def op(p): return gzip.open(p,'rt',encoding='utf-8',errors='ignore') if str(p).endswith('.gz') else open(p,'rt',encoding='utf-8',errors='ignore')
          def flatten_keys(obj,prefix=''):
              ks=set()
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      kk=f'{prefix}.{k}' if prefix else str(k); ks.add(kk)
                      if isinstance(v,dict): ks |= flatten_keys(v,kk)
              return ks
          def sample_schema(p):
              name=p.name.lower(); rows=[]; keys=set(); err=''
              try:
                  if '.csv' in name:
                      with op(p) as f:
                          r=csv.DictReader(f); keys=set(r.fieldnames or [])
                          for i,x in enumerate(r):
                              rows.append(x)
                              if i>=49: break
                  elif '.jsonl' in name:
                      with op(p) as f:
                          for line in f:
                              line=line.strip()
                              if not line: continue
                              try:x=json.loads(line)
                              except:continue
                              if isinstance(x,dict): keys |= flatten_keys(x); rows.append(x)
                              if len(rows)>=50: break
                  elif '.json' in name:
                      with op(p) as f: obj=json.load(f)
                      seq=obj if isinstance(obj,list) else ([obj] if isinstance(obj,dict) else [])
                      if isinstance(obj,dict):
                          # Include likely row arrays nested one level down.
                          for v in obj.values():
                              if isinstance(v,list) and v and isinstance(v[0],dict): seq += v[:50]
                      for x in seq[:50]:
                          if isinstance(x,dict): keys |= flatten_keys(x); rows.append(x)
              except Exception as e: err=repr(e)
              return sorted(keys),rows,err
          def lower_tail(k): return k.split('.')[-1].lower()
          rows=[]; candidates=[]
          hitcounts=collections.Counter(r['source_file'] for r in hits)
          gamecounts=collections.defaultdict(set)
          for r in hits:
              if r.get('game_id'): gamecounts[r['source_file']].add(r['game_id'])
          for sf in files:
              p=root/sf
              keys,samples,err=sample_schema(p)
              tails={lower_tail(k) for k in keys}
              has_game=any(x.lower() in tails for x in game_alias)
              has_player=any(x.lower() in tails for x in player_alias)
              has_team=any(x.lower() in tails for x in team_alias)
              prim=[k for k in keys if any(t in lower_tail(k) for t in primitive_tokens) and not any(t in lower_tail(k) for t in percentage_tokens)]
              pct=[k for k in keys if any(t in lower_tail(k) for t in percentage_tokens) and ('reb' in lower_tail(k) or 'rebound' in lower_tail(k))]
              # Source is potentially exact only if game identity plus non-percentage rebound/opportunity fields are present.
              exact_candidate=bool(has_game and prim)
              rec={'source_file':sf,'bytes':p.stat().st_size if p.exists() else -1,'hit_rows':hitcounts[sf],'missing_games_hit':len(gamecounts[sf]),'has_game_id_field':has_game,'has_player_id_field':has_player,'has_team_id_field':has_team,'primitive_field_count':len(prim),'primitive_fields':'|'.join(prim[:80]),'percentage_fields':'|'.join(pct[:40]),'exact_primitive_candidate':exact_candidate,'schema_error':err,'schema_fields':'|'.join(keys[:250])}
              rows.append(rec)
              if exact_candidate: candidates.append(rec)
          fields=list(rows[0]) if rows else []
          with open(out/'TREB_RETAINED_SCHEMA_CLASSIFICATION.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          with open(out/'TREB_EXACT_PRIMITIVE_SOURCE_CANDIDATES.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(candidates)
          # Also retain the exact missing-game/key scope so subsequent repair can consume this artifact directly.
          for fn in ('MISSING_GAME_KEYS.csv','RETAINED_SOURCE_GAME_HITS.csv'):
              (out/fn).write_bytes((inv/fn).read_bytes())
          covered=set()
          for r in candidates: covered |= gamecounts[r['source_file']]
          qa={'status':'PASS','authoritative_resolved':8396,'authoritative_residual':1251,'missing_game_ids':len(missing),'hit_bearing_files':len(files),'schema_classified_files':len(rows),'schema_errors':sum(bool(r['schema_error']) for r in rows),'exact_primitive_candidate_files':len(candidates),'missing_games_hit_by_exact_candidate_files':len(covered & missing),'missing_games_not_hit_by_exact_candidate_files':len(missing-covered),'next':'Parse candidate source records for exact player-game/team-game sufficient-stat bundles, union them with retained consensus, and rerun strict tenure-complement promotion.','integrity':{'percentage_backsolve_used':False,'model_used':False,'count_only_tenure_proof_used':False,'whole_season_off_complement_used':False}}
          (out/'TREB_RETAINED_SCHEMA_QA.json').write_text(json.dumps(qa,indent=2)+'\n')
          print(json.dumps(qa,indent=2))
          print('TOP CANDIDATES')
          for r in sorted(candidates,key=lambda x:(-x['missing_games_hit'],-x['primitive_field_count']))[:30]:
              print(r['missing_games_hit'],r['source_file'],r['primitive_fields'][:400])
          PY
      - name: Require usable retained primitive candidates
        run: |
          python - <<'PY'
          import json
          q=json.load(open('/tmp/out/TREB_RETAINED_SCHEMA_QA.json'))
          assert q['status']=='PASS'
          assert q['schema_classified_files']>0
          assert q['exact_primitive_candidate_files']>0, q
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-retained-schema-classification-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
