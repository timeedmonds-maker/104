name: TREB roster tenure V3 hybrid classifier

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-roster-tenure-v3-hybrid.yml
      - team_trb_all_players/build_roster_targets_v3_hybrid.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Build corrected V3 tenure classifier
        run: |
          rm -rf team_trb_all_players/impact_database/roster_tenure_v3_hybrid
          python -u team_trb_all_players/build_roster_targets_v3_hybrid.py
      - name: Commit V3 hybrid outputs durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          git add -f team_trb_all_players/impact_database/roster_tenure_v3_hybrid
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build corrected V3 hybrid roster tenures"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
