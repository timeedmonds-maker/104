name: TREB counter team truth audit
on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths: [.github/workflows/treb-counter-team-truth-audit.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  MANIFEST: team_trb_all_players/final_integrity_rebuild/rebound_forensics/CHUNKED_REBOUND_MANIFEST.json
  SOURCE_RUN_ID: '31634201123'
  PYTHONUNBUFFERED: '1'
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path(os.environ['MANIFEST']).read_text()); assert len(m['chunks'])==24 and m['target_games']==58
          x={'include':[{'chunk_id':c['chunk_id'],'year':int(c['year']),'games':','.join(map(str,c['game_ids']))} for c in m['chunks']]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(x,separators=(',',':'))+'\n')
          PY
  audit:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy rapidfuzz
      - uses: actions/download-artifact@v4
        with:
          name: treb-residual-source-${{ matrix.year }}-${{ env.SOURCE_RUN_ID }}
          path: /tmp/source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - run: |
          python -u team_trb_all_players/rebound_counter_team_truth_audit.py \
            --year '${{ matrix.year }}' --games '${{ matrix.games }}' --chunk-id '${{ matrix.chunk_id }}' \
            --nba '/tmp/source/nbastats_${{ matrix.year }}.csv' --v3 '/tmp/source/nbastatsv3_${{ matrix.year }}.csv' --pbp '/tmp/source/pbpstats_${{ matrix.year }}.csv' \
            --output '/tmp/TEAMTRUTH_${{ matrix.chunk_id }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: treb-counter-teamtruth-${{ matrix.chunk_id }}-${{ github.run_id }}
          path: /tmp/TEAMTRUTH_${{ matrix.chunk_id }}.json
          retention-days: 90
  aggregate:
    needs: [plan,audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-counter-teamtruth-*-${{ github.run_id }}
          path: /tmp/results
      - name: Aggregate independent truth controls
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          chunks=[json.loads(p.read_text()) for p in sorted(Path('/tmp/results').rglob('TEAMTRUTH_*.json'))]; assert len(chunks)==24,len(chunks)
          keys=['applicable','counter_vs_team_correct','counter_vs_team_wrong','locked_vs_team_correct','locked_vs_team_wrong','counter_vs_locked_correct','counter_vs_locked_wrong']
          t={k:sum(int(c['totals'][k]) for c in chunks) for k in keys}; mm=[x for c in chunks for x in c['counter_locked_mismatches']]
          assert t['applicable']>0
          out={'status':'COMPLETE','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'totals':t,'counter_team_rule_safe':t['counter_vs_team_wrong']==0,'locked_team_rule_safe':t['locked_vs_team_wrong']==0,'counter_locked_mismatches':mm}
          Path('/tmp/COUNTER_TEAM_TRUTH_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps({k:v for k,v in out.items() if k!='counter_locked_mismatches'},indent=2))
          PY
      - name: Persist checkpoint
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-batched-game-facts-20260812; git reset --hard origin/agent/treb-batched-game-facts-20260812
          D=team_trb_all_players/final_integrity_rebuild/rebound_forensics; cp /tmp/COUNTER_TEAM_TRUTH_SUMMARY.json "$D/"
          git add -f "$D/COUNTER_TEAM_TRUTH_SUMMARY.json"
          if ! git diff --cached --quiet; then git commit -m 'Persist rebound counter team-truth audit'; git push origin HEAD:agent/treb-batched-game-facts-20260812; fi
      - uses: actions/upload-artifact@v4
        with:
          name: treb-counter-teamtruth-summary-${{ github.run_id }}
          path: /tmp/COUNTER_TEAM_TRUTH_SUMMARY.json
          retention-days: 90
