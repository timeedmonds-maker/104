name: TREB 2002 residual lineup diagnostic

on:
  push:
    branches: [treb-final-production-20260812]
    paths:
      - .github/workflows/treb-2002-residual-lineup-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Download legacy and v3 2002 feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb2002diag
          python - <<'PY'
          from pathlib import Path
          import subprocess,tarfile,urllib.request
          raw=Path('/tmp/treb2002diag')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in ('nbastats_2002','nbastatsv3_2002'):
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Dump exact residual evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          raw=Path('/tmp/treb2002diag')
          nba=pd.read_csv(raw/'nbastats_2002.csv',low_memory=False)
          v3=pd.read_csv(raw/'nbastatsv3_2002.csv',low_memory=False)
          nba_gid=pd.to_numeric(nba.GAME_ID,errors='coerce')
          v3_gid=pd.to_numeric(v3.gameId,errors='coerce')
          cases=[
            {'game_id':20200407,'period':4,'team_id':1610612760,'candidates':[56,72,699,958,2046,2209]},
            {'game_id':20201160,'period':5,'team_id':1610612765,'candidates':[361,688,1497,2246]},
          ]
          ncols=[c for c in ['GAME_ID','EVENTNUM','EVENTMSGTYPE','EVENTMSGACTIONTYPE','PERIOD','PCTIMESTRING','PERSON1TYPE','PLAYER1_ID','PLAYER1_NAME','PLAYER1_TEAM_ID','PERSON2TYPE','PLAYER2_ID','PLAYER2_NAME','PLAYER2_TEAM_ID','PERSON3TYPE','PLAYER3_ID','PLAYER3_NAME','PLAYER3_TEAM_ID','HOMEDESCRIPTION','NEUTRALDESCRIPTION','VISITORDESCRIPTION'] if c in nba]
          vcols=[c for c in ['gameId','actionNumber','period','clock','actionType','subType','description','personId','playerName','teamId','teamTricode'] if c in v3]
          def clean(df,cols):
              h=df[cols].copy()
              return h.where(pd.notna(h),None).to_dict('records')
          out=[]
          for c in cases:
              gid,p,team,cands=c['game_id'],c['period'],c['team_id'],c['candidates']
              ng=nba[nba_gid.eq(gid)].copy()
              npd=ng[pd.to_numeric(ng.PERIOD,errors='coerce').eq(p)].copy()
              vg=v3[v3_gid.eq(gid)].copy()
              vpd=vg[pd.to_numeric(vg.period,errors='coerce').eq(p)].copy()
              p1=pd.to_numeric(npd.PLAYER1_ID,errors='coerce'); p2=pd.to_numeric(npd.PLAYER2_ID,errors='coerce'); p3=pd.to_numeric(npd.PLAYER3_ID,errors='coerce')
              candidate_rows={}
              for pid in cands:
                  candidate_rows[str(pid)]=clean(npd[p1.eq(pid)|p2.eq(pid)|p3.eq(pid)],ncols)
              # Include prior period tail and target period full substitution chronology.
              prev=ng[pd.to_numeric(ng.PERIOD,errors='coerce').eq(p-1)].tail(80)
              subs=npd[pd.to_numeric(npd.EVENTMSGTYPE,errors='coerce').eq(8)]
              vperson=pd.to_numeric(vpd.personId,errors='coerce') if 'personId' in vpd else pd.Series(index=vpd.index,dtype=float)
              out.append({
                  **c,
                  'candidate_legacy_rows':candidate_rows,
                  'legacy_target_period_substitutions':clean(subs,ncols),
                  'legacy_prior_period_tail':clean(prev,ncols),
                  'v3_target_period_candidate_rows':{str(pid):clean(vpd[vperson.eq(pid)],vcols) for pid in cands},
                  'v3_target_period_rows':clean(vpd,vcols),
              })
          (raw/'residual_2002_lineups.json').write_text(json.dumps(out,indent=2,default=str)+'\n')
          for c in out:
              print('CASE',c['game_id'],'P',c['period'],'TEAM',c['team_id'])
              for pid,rows in c['candidate_legacy_rows'].items():
                  print('PLAYER',pid,'legacy_rows',len(rows))
                  for r in rows[:12]: print(r)
              print('SUBS',len(c['legacy_target_period_substitutions']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-2002-residual-lineup-diagnostic-${{ github.sha }}
          path: /tmp/treb2002diag/residual_2002_lineups.json
          retention-days: 90
          if-no-files-found: error
