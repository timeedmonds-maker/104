name: TREB historical residual game manifest
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-historical-residual-game-manifest.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_RUN: '31871425551'
      OUTDIR: team_trb_all_players/impact_database/historical_residual_game_manifest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - name: Reassert authoritative V2 contracts
        run: |
          python - <<'PY'
          import gzip,json
          p='team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz'
          rows=[json.loads(x) for x in gzip.open(p,'rt') if x.strip()]
          assert len(rows)==14524
          full=sum(bool(r.get('full_core_reuse')) for r in rows)
          partial=len(rows)-full
          assert (full,partial)==(9647,4877)
          assert len({(str(r['season']),int(r['team_id']),str(r['player_id']).removesuffix('.0')) for r in rows})==14524
          print('V2_PASS',len(rows),full,partial,'exact_segments_contract=5199')
          PY
      - name: Download only residual retry artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifacts
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/artifacts?per_page=100" > /tmp/artifacts.json
          python - <<'PY' > /tmp/download.tsv
          import json
          d=json.load(open('/tmp/artifacts.json'))
          arts=d.get('artifacts',[])
          rows=[]
          for a in arts:
              n=a['name']
              if n.startswith('TREB-historical-residual-retry-') and n.endswith('-31871425551'):
                  rows.append((a['id'],n))
          print('\n'.join(f'{i}\t{n}' for i,n in sorted(rows,key=lambda x:x[1])))
          assert len(rows)==17,len(rows)
          PY
          while IFS=$'\t' read -r id name; do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "/tmp/artifacts/${name}.zip"
            mkdir -p "/tmp/artifacts/${name}"
            unzip -q "/tmp/artifacts/${name}.zip" -d "/tmp/artifacts/${name}"
          done < /tmp/download.tsv
      - name: Consolidate exact failed-game evidence
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR"
          python - <<'PY'
          import json,re,csv,os
          from pathlib import Path
          root=Path('/tmp/artifacts')
          out=Path(os.environ['OUTDIR'])
          rows=[]; seasons=[]
          for d in sorted(root.glob('TREB-historical-residual-retry-*-31871425551')):
              m=re.search(r'retry-(\d{4})-',d.name); assert m,d
              y=int(m.group(1)); season=f'{y}-{(y+1)%100:02d}'
              gf=d/'game_failures.json'
              sg=d/'SEASON_GATE.json'
              if not gf.exists(): gf=d/'game_failures.partial.json'
              failures=json.load(open(gf)) if gf.exists() else []
              gate=json.load(open(sg)) if sg.exists() else {}
              classes={}
              for f in failures:
                  e=str(f.get('error',''))
                  if 'non-unique v3/team-local starter solution' in e: c='NON_UNIQUE_STARTER'
                  elif 'missing in-period lineup transition' in e: c='MISSING_LINEUP_TRANSITION'
                  elif 'no legal' in e.lower() and 'starter' in e.lower(): c='NO_LEGAL_STARTER'
                  else: c='OTHER_RECONSTRUCTION_FAIL'
                  classes[c]=classes.get(c,0)+1
                  rows.append({'season':season,'year':y,'game_id':int(f['game_id']),'classification':c,'teams':','.join(map(str,f.get('teams',[]))),'error':e})
              seasons.append({'season':season,'year':y,'target_rows':gate.get('rows'),'status':gate.get('status'),'status_counts':gate.get('status_counts',{}),'failed_games':len(failures),'classifications':classes})
          # one row per game id per season; duplicates would indicate artifact contamination
          keys=[(r['season'],r['game_id']) for r in rows]
          assert len(keys)==len(set(keys)),(len(keys),len(set(keys)))
          rows=sorted(rows,key=lambda r:(r['year'],r['game_id']))
          seasons=sorted(seasons,key=lambda r:r['year'])
          payload={'status':'PASS','source_run':31871425551,'v2_contract':{'rows':14524,'full_core':9647,'partial':4877,'exact_segments':5199},'season_count':len(seasons),'failed_game_count':len(rows),'classification_counts':{},'seasons':seasons,'games':rows,'policy':{'rounded_percentage_backsolve':False,'opponent_rebound_inference':False,'partial_tenure_whole_team_subtraction':False,'bos_2004_legacy_clock_21s':'NON_BLOCKING_QA_ONLY'}}
          for r in rows: payload['classification_counts'][r['classification']]=payload['classification_counts'].get(r['classification'],0)+1
          (out/'HISTORICAL_RESIDUAL_GAME_MANIFEST.json').write_text(json.dumps(payload,indent=2)+'\n')
          with open(out/'HISTORICAL_RESIDUAL_GAMES.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['season','year','game_id','classification','teams','error']);w.writeheader();w.writerows(rows)
          print(json.dumps({k:payload[k] for k in ['status','season_count','failed_game_count','classification_counts']},indent=2))
          assert len(seasons)==17
          PY
      - name: Persist manifest checkpoint
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUTDIR"
          git commit -m 'Persist historical residual game manifest [skip ci]' || true
          git push origin HEAD:agent/treb-final-exact-assembly
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-historical-residual-game-manifest-${{ github.run_id }}
          path: ${{ env.OUTDIR }}
          retention-days: 90
