name: TREB CC0 PlayerStatistics tenure probe

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-cc0-playerstatistics-probe.yml
      - team_trb_all_players/probe_cc0_playerstatistics.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Download public CC0 dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cc0
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            -o /tmp/cc0/dataset.zip \
            'https://www.kaggle.com/api/v1/datasets/download/eoinamoore/historical-nba-data-and-player-box-scores'
          unzip -l /tmp/cc0/dataset.zip | tee /tmp/cc0/filelist.txt
          unzip -j /tmp/cc0/dataset.zip 'PlayerStatistics.csv' -d /tmp/cc0 || \
          unzip -j /tmp/cc0/dataset.zip '*/PlayerStatistics.csv' -d /tmp/cc0
          test -s /tmp/cc0/PlayerStatistics.csv
      - name: Probe roster/minute coverage
        run: |
          python -u team_trb_all_players/probe_cc0_playerstatistics.py \
            --csv /tmp/cc0/PlayerStatistics.csv \
            --output /tmp/CC0_PLAYERSTATISTICS_PROBE.json
      - name: Commit probe result durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          mkdir -p team_trb_all_players/final_integrity_rebuild
          cp /tmp/CC0_PLAYERSTATISTICS_PROBE.json team_trb_all_players/final_integrity_rebuild/CC0_PLAYERSTATISTICS_PROBE.json
          git add team_trb_all_players/final_integrity_rebuild/CC0_PLAYERSTATISTICS_PROBE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record CC0 PlayerStatistics tenure probe"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
