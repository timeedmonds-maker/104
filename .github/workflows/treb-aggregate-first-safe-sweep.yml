name: TREB aggregate first safe sweep

on:
  push:
    branches: [treb-final-production-20260812]
    paths:
      - team_trb_all_players/impact_database/FIRST_SAFE_SWEEP_AGGREGATE_CONTROL.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Read source run
        id: control
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('team_trb_all_players/impact_database/FIRST_SAFE_SWEEP_AGGREGATE_CONTROL.json'))
          run=int(d['source_run_id'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'run_id={run}\n')
          print('SOURCE_RUN',run)
          PY
      - name: Download all first-sweep artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb-first-safe
          gh run download "${{ steps.control.outputs.run_id }}" --repo "${{ github.repository }}" --dir /tmp/treb-first-safe
          find /tmp/treb-first-safe -maxdepth 1 -type d -name 'treb-safe-season-*' | sort | wc -l
      - name: Aggregate repair queues
        run: |
          python -u team_trb_all_players/aggregate_safe_sweep_repairs.py \
            --root /tmp/treb-first-safe \
            --output /tmp/treb-first-safe/first_safe_sweep_repair_index.json
      - uses: actions/upload-artifact@v4
        with:
          name: treb-first-safe-sweep-repair-index-${{ github.sha }}
          path: /tmp/treb-first-safe/first_safe_sweep_repair_index.json
          retention-days: 90
          if-no-files-found: error
