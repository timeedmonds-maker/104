name: funakistats missed3 logo fix
on:
  push:
    branches: [agent/funakistats-missed3-logo-fix]
    paths:
      - 'tmp/funakistats_m3/**'
      - '.github/workflows/funakistats_missed3_logo_fix.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy matplotlib pillow requests cairosvg
      - name: Skip duplicate highlighted team logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tmp/funakistats_m3/render.py')
          s=p.read_text()
          old="""  for k,r in ts.iterrows():\n    x=xm[s]+((k%5)-2)*.035\n    ax.add_artist(AnnotationBbox(OffsetImage(np.asarray(logos[r.team_abbr]),zoom=.42),(x,r.pct),frameon=False,zorder=2))"""
          new="""  for k,r in ts.iterrows():\n    if pd.notna(r.on_pct):\n      continue\n    x=xm[s]+((k%5)-2)*.035\n    ax.add_artist(AnnotationBbox(OffsetImage(np.asarray(logos[r.team_abbr]),zoom=.42),(x,r.pct),frameon=False,zorder=2))"""
          if old not in s:
              raise SystemExit('target render block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: python tmp/funakistats_m3/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: funakistats-missed3-chart
          path: STEVEN_ADAMS_OREB_MISSED_3S_STACKED_LOGOS_CDN_FINAL.png
          if-no-files-found: error
