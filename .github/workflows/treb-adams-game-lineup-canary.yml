name: TREB Adams exact game-lineup canary

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-adams-game-lineup-canary.yml
      - team_trb_all_players/canary_adams_2016_game_lineups.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests urllib3
      - name: Run exact 82-game Adams canary
        shell: bash
        run: |
          set -o pipefail
          python -u team_trb_all_players/canary_adams_2016_game_lineups.py \
            --schedule team_trb_all_players/impact_database/roster_tenure/regular_season_games_raw/2016-17.json.gz \
            --output /tmp/ADAMS_2016_GAME_LINEUP_CANARY.json \
            --cache /tmp/ADAMS_2016_GAME_LINEUP_CACHE.json.gz 2>&1 | tee /tmp/adams-canary.log
      - name: Preserve canary outputs outside checkout
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/treb-adams-save
          cp /tmp/ADAMS_2016_GAME_LINEUP_CANARY.json /tmp/treb-adams-save/ 2>/dev/null || true
          cp /tmp/ADAMS_2016_GAME_LINEUP_CACHE.json.gz /tmp/treb-adams-save/ 2>/dev/null || true
          cp /tmp/adams-canary.log /tmp/treb-adams-save/ 2>/dev/null || true
      - name: Commit canary outputs durably
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/treb-final-integrity-rebuild-20260812
          git reset --hard origin/agent/treb-final-integrity-rebuild-20260812
          mkdir -p team_trb_all_players/final_integrity_rebuild
          cp /tmp/treb-adams-save/ADAMS_2016_GAME_LINEUP_CANARY.json team_trb_all_players/final_integrity_rebuild/ 2>/dev/null || true
          cp /tmp/treb-adams-save/ADAMS_2016_GAME_LINEUP_CACHE.json.gz team_trb_all_players/final_integrity_rebuild/ 2>/dev/null || true
          cp /tmp/treb-adams-save/adams-canary.log team_trb_all_players/final_integrity_rebuild/ADAMS_2016_GAME_LINEUP_CANARY.log 2>/dev/null || true
          git add -f team_trb_all_players/final_integrity_rebuild/ADAMS_2016_GAME_LINEUP_CANARY.json team_trb_all_players/final_integrity_rebuild/ADAMS_2016_GAME_LINEUP_CACHE.json.gz team_trb_all_players/final_integrity_rebuild/ADAMS_2016_GAME_LINEUP_CANARY.log 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record exact Adams game-lineup TREB canary"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/treb-final-integrity-rebuild-20260812; then exit 0; fi
            git fetch origin agent/treb-final-integrity-rebuild-20260812
            git rebase origin/agent/treb-final-integrity-rebuild-20260812
          done
          exit 1
