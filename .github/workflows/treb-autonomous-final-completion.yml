name: TREB autonomous final completion

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-autonomous-final-completion.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: treb-autonomous-final-completion
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  FANOUT_RUN: "31869325468"
  RESIDUAL_RUN: "31866566295"
  TARGETS: team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz
  STAGE2_SHA: 57ba237c36d75f7a3ef2cc998d91aa70a59b3c29

jobs:
  prepare:
    name: A - wait, verify modern409, prepare historical fanout
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1

      - name: A1 - wait for current six-batch recovery to finish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/progress
          for i in $(seq 1 120); do
            body=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${FANOUT_RUN}")
            status=$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$body")
            conclusion=$(python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$body")
            printf '{"stage":"A1","poll":%s,"run_id":%s,"status":"%s","conclusion":"%s","utc":"%s"}\n' "$i" "$FANOUT_RUN" "$status" "$conclusion" "$(date -u +%FT%TZ)" | tee /tmp/progress/A1.json
            if [ "$status" = completed ]; then break; fi
            sleep 30
          done
          test "$status" = completed

      - name: A2 - download consolidated modern409 recovery
        uses: actions/download-artifact@v4
        with:
          name: TREB-modern409-team-fanout-consolidated-31869325468
          path: /tmp/modern409
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31869325468'

      - name: A3 - download authoritative residual manifest
        uses: actions/download-artifact@v4
        with:
          name: TREB-residual-1751-manifest-31866566295
          path: /tmp/residual
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31866566295'

      - name: A4 - hard-gate 409 and derive exact historical season matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/auto_inputs
          cp /tmp/modern409/TREB_2025_26_RESIDUAL_409_TEAM_FANOUT.csv /tmp/auto_inputs/modern409.csv
          cp /tmp/modern409/FANOUT_GATE.json /tmp/auto_inputs/MODERN409_GATE.json
          python - <<'PY'
          import csv,gzip,json,pathlib
          gate=json.loads(pathlib.Path('/tmp/modern409/FANOUT_GATE.json').read_text())
          assert gate['status']=='PASS',gate
          assert int(gate['rows'])==409 and int(gate['unique_keys'])==409 and int(gate['minutes_gate_pass'])==409 and int(gate['minutes_gate_fail'])==0,gate
          m=next(pathlib.Path('/tmp/residual').rglob('TREB_RESIDUAL_1751_MANIFEST.csv.gz'))
          with gzip.open(m,'rt',encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          hist=[r for r in rows if str(r.get('season','')).replace('_','-')!='2025-26']
          assert len(rows)==1751 and len(hist)==1342,(len(rows),len(hist))
          keys={(str(r['season']).replace('_','-'),int(float(r['team_id'])),str(r['player_id']).removesuffix('.0')) for r in hist}
          assert len(keys)==1342,len(keys)
          p=pathlib.Path('/tmp/auto_inputs/historical_residual_keys.csv')
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['season','team_id','player_id']); w.writerows(sorted(keys))
          years=sorted({int(s[:4]) for s,_,_ in keys})
          matrix={'year':years}
          pathlib.Path('/tmp/auto_inputs/A4_GATE.json').write_text(json.dumps({'status':'PASS','modern409':409,'historical_residual_keys':1342,'season_count':len(years),'years':years},indent=2)+'\n')
          with open('/tmp/matrix.txt','w') as f: f.write(json.dumps(matrix,separators=(',',':')))
          print(json.dumps({'A4_GATE':'PASS',**json.loads(pathlib.Path('/tmp/auto_inputs/A4_GATE.json').read_text())},indent=2))
          PY
          echo "matrix=$(cat /tmp/matrix.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload autonomous input checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: TREB-autonomous-inputs-${{ github.run_id }}
          path: /tmp/auto_inputs
          retention-days: 90
          compression-level: 1

  historical:
    name: B - historical residual exact ${{ matrix.year }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz

      - name: B1 - download exact residual scope
        uses: actions/download-artifact@v4
        with:
          name: TREB-autonomous-inputs-${{ github.run_id }}
          path: /tmp/inputs

      - name: B2 - materialize this season's residual-only full-core targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src /tmp/out
          YEAR='${{ matrix.year }}' python - <<'PY'
          import csv,gzip,json,os,pathlib
          y=int(os.environ['YEAR']); season=f'{y}-{(y+1)%100:02d}'
          with open('/tmp/inputs/historical_residual_keys.csv',newline='',encoding='utf-8') as f:
              ks={(r['season'],int(r['team_id']),str(r['player_id'])) for r in csv.DictReader(f) if r['season']==season}
          selected=[]
          with gzip.open('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz','rt',encoding='utf-8') as f:
              for line in f:
                  if not line.strip(): continue
                  r=json.loads(line); k=(str(r['season']),int(r['team_id']),str(r['player_id']).removesuffix('.0'))
                  if k in ks:
                      assert bool(r.get('full_core_reuse')),k
                      selected.append(r)
          got={(str(r['season']),int(r['team_id']),str(r['player_id']).removesuffix('.0')) for r in selected}
          assert got==ks and len(selected)==len(ks)>0,(season,len(selected),len(ks),len(ks-got))
          with gzip.open('/tmp/targets.jsonl.gz','wt',encoding='utf-8') as f:
              for r in selected: f.write(json.dumps(r,separators=(',',':'))+'\n')
          pathlib.Path('/tmp/out/B2_GATE.json').write_text(json.dumps({'status':'PASS','year':y,'season':season,'target_keys':len(selected)},indent=2)+'\n')
          print('B2_GATE=PASS',season,len(selected))
          PY

      - name: B3-B4 - fetch retained feeds and run exact engine fail-closed
        timeout-minutes: 48
        shell: bash
        run: |
          set -euo pipefail
          y='${{ matrix.year }}'
          ready=1
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 2 --output /tmp/list_data.txt https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          if ! python - "$y" <<'PY' > /tmp/urls.tsv
          import sys
          y=sys.argv[1]; vals={}
          for line in open('/tmp/list_data.txt',encoding='utf-8'):
              if '=' in line:
                  k,v=line.split('=',1); vals[k.strip()]=v.strip()
          miss=[]
          for prefix in ('nbastats','nbastatsv3','pbpstats'):
              k=f'{prefix}_{y}'
              if k not in vals: miss.append(k)
              else: print(prefix,vals[k],sep='\t')
          if miss: raise SystemExit('MISSING_SOURCE_KEYS '+','.join(miss))
          PY
          then ready=0; fi
          if [ "$ready" = 1 ]; then
            while IFS=$'\t' read -r prefix url; do
              arc="/tmp/src/${prefix}_${y}.tar.xz"
              if ! curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 20 --output "$arc" "$url"; then ready=0; break; fi
              if ! tar -xJf "$arc" -C /tmp/src; then ready=0; break; fi
            done < /tmp/urls.tsv
          fi
          if [ "$ready" = 1 ]; then
            set +e
            python -u team_trb_all_players/rebuild_fullcore_treb_fanout.py \
              --year "$y" --targets /tmp/targets.jsonl.gz \
              --nba "/tmp/src/nbastats_${y}.csv" --v3 "/tmp/src/nbastatsv3_${y}.csv" --pbp "/tmp/src/pbpstats_${y}.csv" \
              --output-dir /tmp/out
            rc=$?
            set -e
          else
            rc=97
          fi
          if [ "$rc" -ne 0 ] && [ ! -s "/tmp/out/fresh_fullcore_${y}.csv" ]; then
            YEAR="$y" RC="$rc" python - <<'PY'
          import gzip,json,os,pathlib,pandas as pd
          y=int(os.environ['YEAR']); rc=int(os.environ['RC']); season=f'{y}-{(y+1)%100:02d}'
          rows=[]
          with gzip.open('/tmp/targets.jsonl.gz','rt',encoding='utf-8') as f:
              for line in f:
                  if line.strip():
                      r=json.loads(line); rows.append({'season':season,'team_id':int(r['team_id']),'player_id':str(r['player_id']).removesuffix('.0'),'player':r.get('player',''),'status':'SOURCE_MANIFEST_GAP' if rc==97 else 'ENGINE_CRASH','error':f'bounded residual runner rc={rc}'})
          pd.DataFrame(rows).to_csv(f'/tmp/out/fresh_fullcore_{y}.csv',index=False)
          pathlib.Path('/tmp/out/season_gate.json').write_text(json.dumps({'status':'INCOMPLETE','season':season,'required_full_core_keys':len(rows),'pass_rows':0,'failure_rows':len(rows),'runner_rc':rc},indent=2)+'\n')
          PY
          fi
          python - <<'PY'
          import json,pathlib,pandas as pd
          p=next(pathlib.Path('/tmp/out').glob('fresh_fullcore_*.csv'))
          d=pd.read_csv(p,low_memory=False); c=d.status.astype(str).value_counts().to_dict()
          pathlib.Path('/tmp/out/B4_GATE.json').write_text(json.dumps({'status':'PASS','rows':len(d),'status_counts':c},indent=2)+'\n')
          print('B4_GATE',json.dumps({'rows':len(d),'status_counts':c},sort_keys=True))
          PY

      - name: Upload historical season result and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TREB-autonomous-historical-${{ matrix.year }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error

  consolidate:
    name: C - consolidate full-core exact recovery
    needs: [prepare, historical]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      unresolved: ${{ steps.gate.outputs.unresolved }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - run: python -m pip install --disable-pip-version-check pandas pyarrow

      - uses: actions/download-artifact@v4
        with:
          name: TREB-autonomous-inputs-${{ github.run_id }}
          path: /tmp/inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: TREB-autonomous-historical-*-${{ github.run_id }}
          path: /tmp/historical
          merge-multiple: false

      - name: C1 - download established resolved full-core layers
        uses: actions/download-artifact@v4
        with:
          name: TREB-fullcore-resume-consolidated-31858884423
          path: /tmp/baseexact
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31858884423'
      - uses: actions/download-artifact@v4
        with:
          name: TREB-starter-accept-immaterial-overlay-31861830762
          path: /tmp/starter1367
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31861830762'
      - uses: actions/download-artifact@v4
        with:
          name: TREB-starter-captains-call-63-consolidated-31864265375
          path: /tmp/starter63
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31864265375'

      - name: C2 - exact union, blocker manifest, final readiness gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/consolidated
          python - <<'PY'
          import gzip,json,pathlib
          import pandas as pd
          K=['season','team_id','player_id']
          def sid(v):
              s=str(v).strip(); return s[:-2] if s.endswith('.0') and s[:-2].isdigit() else s
          def canon(d):
              d=d.copy(); d['season']=d.season.astype(str); d['team_id']=pd.to_numeric(d.team_id,errors='raise').astype('int64'); d['player_id']=d.player_id.map(sid); return d
          targets=[]
          with gzip.open('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz','rt',encoding='utf-8') as f:
              for line in f:
                  if line.strip(): targets.append(json.loads(line))
          t=canon(pd.DataFrame(targets)); full=t[t.full_core_reuse.astype(bool)].copy(); assert len(full)==9647
          base=canon(pd.read_csv('/tmp/baseexact/FULLCORE_TOTALREBOUNDPCT_PASS_ROWS.csv.gz',dtype={'player_id':str},low_memory=False)); assert len(base)==6466
          a1367=canon(pd.read_csv('/tmp/starter1367/STARTER_ACCEPT_IMMATERIAL_OVERLAY_1367.csv.gz',dtype={'player_id':str},low_memory=False)); assert len(a1367)==1367
          a63=canon(pd.read_csv('/tmp/starter63/STARTER_CAPTAINS_CALL_63_OVERLAY.csv.gz',dtype={'player_id':str},low_memory=False)); assert len(a63)==63
          modern=canon(pd.read_csv('/tmp/inputs/modern409.csv',dtype={'player_id':str},low_memory=False)); assert len(modern)==409 and modern.status.astype(str).eq('PASS').all()
          hist=[]
          for p in sorted(pathlib.Path('/tmp/historical').rglob('fresh_fullcore_*.csv')):
              hist.append(canon(pd.read_csv(p,dtype={'player_id':str},low_memory=False)))
          h=pd.concat(hist,ignore_index=True,sort=False) if hist else pd.DataFrame(columns=K+['status'])
          assert len(h)==1342,(len(h),h.status.astype(str).value_counts().to_dict())
          hpass=h[h.status.astype(str).eq('PASS')].copy()
          def take(d,label,rank):
              q=d[K+['direct_treb_on','direct_treb_off']].copy(); q['source']=label; q['source_rank']=rank; return q
          parts=[take(base,'EXACT_FULLCORE_INTEGER_COUNTS',1),take(a1367,'PROVEN_IMMATERIAL_STARTER_REPRESENTATIVE',2),take(a63,'CAPTAINS_CALL_STARTER_REPRESENTATIVE',3),take(modern,'EXACT_MODERN_CDN_2025_26',4)]
          if len(hpass): parts.append(take(hpass,'EXACT_HISTORICAL_RESIDUAL_RECONSTRUCTION',5))
          r=pd.concat(parts,ignore_index=True).sort_values('source_rank').drop_duplicates(K,keep='first')
          targetset=set(map(tuple,full[K].itertuples(index=False,name=None))); resolved=set(map(tuple,r[K].itertuples(index=False,name=None)))
          missing=targetset-resolved; extra=resolved-targetset
          assert not extra, list(extra)[:5]
          unresolved=full[K].merge(pd.DataFrame(list(resolved),columns=K),on=K,how='left',indicator=True); unresolved=unresolved[unresolved._merge.eq('left_only')][K].drop(columns=[],errors='ignore')
          if len(unresolved):
              blockers=unresolved.merge(h,on=K,how='left',validate='one_to_one')
              blockers.to_csv('/tmp/consolidated/AUTONOMOUS_BLOCKER_MANIFEST.csv',index=False)
          r.drop(columns=['source_rank']).to_csv('/tmp/consolidated/FULLCORE_RESOLVED.csv',index=False)
          h.to_csv('/tmp/consolidated/HISTORICAL_RESIDUAL_RESULTS.csv.gz',index=False,compression='gzip')
          summary={'status':'PASS' if len(missing)==0 and len(r)==9647 else 'BLOCKED','full_core_required':9647,'base_exact':6466,'starter_immaterial':1367,'starter_captains_call':63,'modern_2025_exact':409,'historical_requested':1342,'historical_exact_pass':int(len(hpass)),'historical_status_counts':h.status.astype(str).value_counts().to_dict(),'resolved_unique':int(len(r)),'unresolved':int(len(missing)),'empirical_model_used':False,'rounded_percentage_backsolve_used':False,'opponent_rebound_inference_used':False,'partial_tenure_whole_team_subtraction_used':False}
          pathlib.Path('/tmp/consolidated/FINAL_READINESS_GATE.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          open('/tmp/ready.txt','w').write('true' if summary['status']=='PASS' else 'false')
          open('/tmp/unresolved.txt','w').write(str(summary['unresolved']))
          PY
          echo "ready=$(cat /tmp/ready.txt)" >> "$GITHUB_OUTPUT"
          echo "unresolved=$(cat /tmp/unresolved.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload consolidated readiness/blocker checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TREB-autonomous-fullcore-consolidated-${{ github.run_id }}
          path: /tmp/consolidated
          retention-days: 90
          compression-level: 1
          if-no-files-found: error

  assemble:
    name: D - final 90-metric assembly and hard QA
    needs: consolidate
    if: needs.consolidate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - run: python -m pip install --disable-pip-version-check pandas numpy pyarrow duckdb

      - uses: actions/download-artifact@v4
        with:
          name: TREB-autonomous-fullcore-consolidated-${{ github.run_id }}
          path: /tmp/consolidated
      - name: D1 - download immutable prepared canonical native89 + exact partial4877
        uses: actions/download-artifact@v4
        with:
          name: TREB-prepared-canonical-layers-31844978593
          path: /tmp/prep
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31844978593'

      - name: D2 - materialize 9,647 direct source without empirical fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct /tmp/final /tmp/release
          python - <<'PY'
          import pandas as pd
          K=['season','team_id','player_id']
          def sid(v):
              s=str(v).strip(); return s[:-2] if s.endswith('.0') and s[:-2].isdigit() else s
          r=pd.read_csv('/tmp/consolidated/FULLCORE_RESOLVED.csv',dtype={'player_id':str},low_memory=False)
          r['season']=r.season.astype(str); r['team_id']=pd.to_numeric(r.team_id).astype('int64'); r['player_id']=r.player_id.map(sid)
          assert len(r)==9647 and not r.duplicated(K).any()
          n=pd.read_parquet('/tmp/prep/native_89_canonical.parquet'); n['season']=n.season.astype(str); n['team_id']=pd.to_numeric(n.team_id).astype('int64'); n['player_id']=n.player_id.map(sid)
          if 'player' not in n: n['player']=n.get('subject_player','')
          meta=n.groupby(K,as_index=False).agg(player=('player','first'),minutes_on=('minutes_on','first'),minutes_off=('minutes_off','first'))
          x=r.merge(meta,on=K,how='left',validate='one_to_one')
          assert not x[['direct_treb_on','direct_treb_off','minutes_on','minutes_off']].isna().any().any()
          x['direct_minutes_on']=x.minutes_on; x['direct_minutes_off']=x.minutes_off; x['status']='PASS'; x['error']=''
          x[K+['player','direct_treb_on','direct_treb_off','direct_minutes_on','direct_minutes_off','status','error','source']].to_csv('/tmp/direct/direct_treb_final.csv',index=False)
          x[K+['source','direct_treb_on','direct_treb_off']].to_csv('/tmp/final/TOTALREBOUNDPCT_FULLCORE_PROVENANCE.csv',index=False)
          PY
          cp -a /tmp/prep/exact_support/. /tmp/final/

      - name: D3 - assemble canonical release contract
        run: |
          python -u team_trb_all_players/finalize_complete_treb_release.py \
            --targets "$TARGETS" --native /tmp/prep/native_89_canonical.parquet \
            --exact /tmp/prep/exact_partial_4877.parquet --direct-dir /tmp/direct \
            --out /tmp/final --stage2-sha "$STAGE2_SHA"

      - name: D4 - normalize analysis universe to exactly 90 metrics and build databases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          import duckdb,pandas as pd
          out=Path('/tmp/final'); K=['season','team_id','player_id']
          native=pd.read_parquet(out/'all_metrics_player_team_season.parquet'); treb=pd.read_parquet(out/'treb_overlay_player_team_season_long.parquet')
          t=treb[treb.metric.astype(str).eq('TotalReboundPct')].copy(); cols=sorted(set(native.columns)|set(t.columns))
          for z in (native,t):
              for c in cols:
                  if c not in z: z[c]=pd.NA
          all90=pd.concat([native[cols],t[cols]],ignore_index=True,sort=False)
          assert len(native)==1292636 and native.metric.nunique()==89
          assert len(all90)==14524*90 and all90.metric.nunique()==90 and not all90.duplicated(K+['metric']).any()
          assert all90.groupby(K).metric.nunique().eq(90).all()
          all90.to_parquet(out/'all_metrics_player_team_season.parquet',index=False,compression='zstd'); all90.to_csv(out/'all_metrics_player_team_season.csv.gz',index=False,compression='gzip')
          nc=pd.read_parquet(out/'all_metrics_career.parquet'); tc=pd.read_parquet(out/'treb_overlay_career_long.parquet'); tc=tc[tc.metric.astype(str).eq('TotalReboundPct')].copy(); ccols=sorted(set(nc.columns)|set(tc.columns))
          for z in (nc,tc):
              for c in ccols:
                  if c not in z: z[c]=pd.NA
          c90=pd.concat([nc[ccols],tc[ccols]],ignore_index=True,sort=False)
          assert c90.metric.nunique()==90 and not c90.duplicated(['player_id','metric']).any() and c90.groupby('player_id').metric.nunique().eq(90).all()
          c90.to_parquet(out/'all_metrics_career.parquet',index=False,compression='zstd'); c90.to_csv(out/'all_metrics_career.csv.gz',index=False,compression='gzip')
          def wide(df,keys,meta):
              p=df.pivot(index=keys,columns='metric',values=['on','off','swing']); p.columns=[f'{m}__{f}' for f,m in p.columns]; p=p.reset_index(); present=[c for c in meta if c in df and c not in keys]
              if present: p=df.groupby(keys,as_index=False)[present].first().merge(p,on=keys,how='left',validate='one_to_one')
              return p
          w=wide(all90,K,['player','team_abbr','minutes_on','minutes_off']); cw=wide(c90,['player_id'],['player','minutes_on','minutes_off'])
          w.to_parquet(out/'final_combined_player_team_season_wide.parquet',index=False,compression='zstd'); w.to_csv(out/'final_combined_player_team_season_wide.csv.gz',index=False,compression='gzip')
          cw.to_parquet(out/'final_combined_career_wide.parquet',index=False,compression='zstd'); cw.to_csv(out/'final_combined_career_wide.csv.gz',index=False,compression='gzip')
          md=pd.DataFrame({'metric':sorted(all90.metric.astype(str).unique())}); md['family']=md.metric.map(lambda x:'canonical_total_rebound_pct' if x=='TotalReboundPct' else 'native_stage2_89'); md.to_parquet(out/'metric_dictionary.parquet',index=False); md.to_csv(out/'metric_dictionary.csv',index=False)
          detail=t.sort_values(K).copy(); detail.to_csv(out/'career_treb_detail.csv',index=False)
          summ=tc.sort_values(['player_id']).copy(); summ.to_csv(out/'career_treb_summary.csv',index=False)
          sp=out/'TREB_all_metrics.sqlite'; sp.unlink(missing_ok=True); con=sqlite3.connect(sp); all90.to_sql('all_metrics_player_team_season',con,index=False); c90.to_sql('all_metrics_career',con,index=False); w.to_sql('final_combined_player_team_season_wide',con,index=False); cw.to_sql('final_combined_career_wide',con,index=False); con.close()
          dp=out/'TREB_all_metrics.duckdb'; dp.unlink(missing_ok=True); db=duckdb.connect(str(dp)); db.register('a',all90); db.execute('CREATE TABLE all_metrics_player_team_season AS SELECT * FROM a'); db.unregister('a'); db.register('c',c90); db.execute('CREATE TABLE all_metrics_career AS SELECT * FROM c'); db.unregister('c'); db.register('w',w); db.execute('CREATE TABLE final_combined_player_team_season_wide AS SELECT * FROM w'); db.unregister('w'); db.register('cw',cw); db.execute('CREATE TABLE final_combined_career_wide AS SELECT * FROM cw'); db.unregister('cw'); db.close()
          ad=c90[(c90.player_id.astype(str)=='203500') & c90.metric.astype(str).eq('TotalReboundPct')]
          assert len(ad)==1; adm=float(ad.minutes_on.iloc[0]); assert 20460<=adm<=20485,adm
          q=int(c90[(c90.metric.astype(str)=='TotalReboundPct') & (pd.to_numeric(c90.minutes_on,errors='coerce')>=10000)].player_id.astype(str).nunique()); assert 540<=q<=565,q
          qa={'status':'PASS','canonical_keys':14524,'seasons':int(all90.season.nunique()),'native_metrics':89,'total_metrics':90,'native_canonical_rows':1292636,'all90_rows':int(len(all90)),'partial_treb':4877,'full_core_treb':9647,'total_rebound_pct_rows':int((all90.metric.astype(str)=='TotalReboundPct').sum()),'duplicate_total_rebound_pct':int(all90[all90.metric.astype(str)=='TotalReboundPct'].duplicated(K).sum()),'steven_adams_player_id':'203500','steven_adams_career_minutes':adm,'gte_10000_treb_population':q,'rounded_percentage_backsolve':False,'opponent_rebound_inference':False,'partial_tenure_whole_team_subtraction':False,'empirical_residual_model':False}
          assert qa['canonical_keys']==14524 and qa['seasons']==26 and qa['total_rebound_pct_rows']==14524 and qa['duplicate_total_rebound_pct']==0
          (out/'AUTONOMOUS_FINAL_QA.json').write_text(json.dumps(qa,indent=2,sort_keys=True)+'\n')
          (out/'README_AUTONOMOUS_FINAL_RELEASE.md').write_text('# TREB final database\n\nFinal canonical 90-metric database: 89 native Stage2 metrics plus separate TotalReboundPct. The rejected empirical residual model is not used. Full-core residuals are exact or previously documented accepted starter representatives; partial/traded tenures use exact count-derived tenure segments.\n')
          print(json.dumps(qa,indent=2,sort_keys=True))
          PY

      - name: D5 - SHA256, ZIP integrity, independent final gate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/final
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          zip -q -9 -r /tmp/release/TREB_final_database_2000-01_to_2025-26.zip .
          unzip -t /tmp/release/TREB_final_database_2000-01_to_2025-26.zip
          test -s /tmp/release/TREB_final_database_2000-01_to_2025-26.zip
          sha256sum /tmp/release/TREB_final_database_2000-01_to_2025-26.zip | tee /tmp/release/TREB_final_database_2000-01_to_2025-26.zip.sha256
          cp AUTONOMOUS_FINAL_QA.json /tmp/release/AUTONOMOUS_FINAL_QA.json

      - name: Upload actual final downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TREB-final-database-autonomous-${{ github.run_id }}
          path: /tmp/release
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
