name: TREB authoritative V2 canonical gate

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-authoritative-v2-canonical-gate.yml]

permissions:
  contents: write

concurrency:
  group: treb-authoritative-v2-canonical-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Rebuild authoritative V2 roster universe
        run: python -u team_trb_all_players/build_roster_targets_v2.py
      - name: Enforce canonical invariants and reject V3-hybrid contamination
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path
          root=Path('team_trb_all_players')
          v2=root/'impact_database/roster_tenure_v2'
          summary=json.loads((v2/'roster_repair_v2_summary.json').read_text())
          expected={
            'validated_player_team_season_rows':14524,
            'full_core_reuse_rows':9647,
            'partial_player_team_season_rows':4877,
            'wowy_game_bearing_segments':5199,
            'cross_team_overlap_pairs':0,
            'impossible_minute_rows':0,
            'empty_played_tenures':0,
          }
          bad={k:(summary.get(k),v) for k,v in expected.items() if summary.get(k)!=v}
          if bad: raise SystemExit(f'V2 invariant failure: {bad}')
          with gzip.open(v2/'player_team_season_targets.jsonl.gz','rt',encoding='utf-8') as f:
            rows=[json.loads(x) for x in f if x.strip()]
          keys={(str(r['season']),str(r['player_id']),str(r['team_id'])) for r in rows}
          if len(rows)!=14524 or len(keys)!=14524: raise SystemExit('V2 canonical key duplication/missing')
          residual=root/'final_integrity_rebuild/final_exact_release/safe_lock_overlay/CANONICAL_UNRESOLVED_AFTER_SAFE_LOCK.csv'
          overlay=root/'final_integrity_rebuild/final_exact_release/source_overlay_mapping/CANONICAL_EXACT_SOURCE_OVERLAY_MAPPING.csv'
          audit={'status':'PASS','v2_summary':summary,'v2_unique_keys':len(keys),'residual_checked':False,'overlay_checked':False,'policy':{'canonical_roster_source':'roster_tenure_v2','v3_hybrid_authoritative':False}}
          def ckey(r): return (str(r['season']).strip(),str(r['player_id']).strip().removesuffix('.0'),str(r['team_id']).strip().removesuffix('.0'))
          if residual.exists():
            with residual.open(newline='',encoding='utf-8-sig') as f: rr=list(csv.DictReader(f))
            rk=[ckey(r) for r in rr]
            missing=sorted(set(rk)-keys)
            audit['residual_checked']=True; audit['residual_rows']=len(rr); audit['residual_keys_outside_v2']=len(missing)
            if missing: raise SystemExit(f'residual contains keys outside authoritative V2: {missing[:20]}')
          if overlay.exists():
            with overlay.open(newline='',encoding='utf-8-sig') as f: oo=list(csv.DictReader(f))
            ok=[ckey(r) for r in oo]
            audit['overlay_checked']=True; audit['overlay_rows']=len(oo); audit['overlay_unique_keys']=len(set(ok)); audit['overlay_keys_outside_v2']=len(set(ok)-keys); audit['v2_keys_missing_overlay']=len(keys-set(ok))
            if len(oo)!=14524 or set(ok)!=keys: raise SystemExit('existing overlay does not exactly reconcile to authoritative V2 keys')
          out=root/'final_integrity_rebuild/final_exact_release/AUTHORITATIVE_V2_CANONICAL_GATE.json'
          out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps(audit,indent=2,sort_keys=True))
          PY
      - name: Persist V2 gate proof
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add team_trb_all_players/impact_database/roster_tenure_v2 team_trb_all_players/final_integrity_rebuild/final_exact_release/AUTHORITATIVE_V2_CANONICAL_GATE.json
          git commit -m 'Persist authoritative V2 canonical gate [skip ci]' || exit 0
          git push origin HEAD:agent/treb-final-exact-assembly
