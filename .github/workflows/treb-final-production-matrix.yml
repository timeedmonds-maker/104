name: TREB final historical production

on:
  push:
    branches: [treb-final-production-20260812]
    paths:
      - .github/workflows/treb-final-production-matrix.yml
      - team_trb_all_players/impact_database/FINAL_PRODUCTION_CONTROL.json
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: treb-final-historical-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      years: ${{ steps.control.outputs.years }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r team_trb_all_players/requirements.txt
      - name: Read production control
        id: control
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/FINAL_PRODUCTION_CONTROL.json')
          d=json.loads(p.read_text())
          years=[int(y) for y in d['years']]
          bad=[y for y in years if y < 2000 or y > 2024]
          assert not bad, bad
          assert len(years)==len(set(years)), years
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('years='+json.dumps(years,separators=(',',':'))+'\n')
          print('PRODUCTION_YEARS', years)
          PY
      - name: Rebuild and verify authoritative V2 targets
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/build_roster_targets_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/roster_tenure_v2/roster_repair_v2_summary.json')
          d=json.loads(p.read_text())
          expected={
              'validated_player_team_season_rows':14524,
              'safe_full_core_reuse_rows':9647,
              'partial_player_team_season_rows':4877,
              'game_bearing_partial_segments':5199,
              'cross_team_overlaps':0,
              'impossible_minute_rows':0,
              'empty_played_tenures':0,
          }
          for k,v in expected.items(): assert int(d[k])==v,(k,d[k],v)
          print('V2_TARGET_GATE=PASS', expected)
          PY
      - name: Download locked 2016 source pair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tarfile, urllib.request
          raw=Path('team_trb_all_players/impact_database/local_raw'); raw.mkdir(parents=True,exist_ok=True)
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for kind in ('nbastats','pbpstats'):
              url=urls[f'{kind}_2016']; arc=raw/url.rsplit('/',1)[-1]
              urllib.request.urlretrieve(url,arc)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Exact 2016 Adams regression gate
        run: python -u team_trb_all_players/run_local_2016_regression.py
      - name: Compile final production engine
        run: python -m py_compile team_trb_all_players/local_treb_rebuild.py team_trb_all_players/production_treb_engine.py team_trb_all_players/run_local_treb_production.py
      - uses: actions/upload-artifact@v4
        with:
          name: treb-final-v2-targets-${{ github.sha }}
          path: |
            team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz
            team_trb_all_players/impact_database/roster_tenure_v2/wowy_partial_segments.jsonl.gz
            team_trb_all_players/impact_database/roster_tenure_v2/roster_repair_v2_summary.json
          retention-days: 90
          if-no-files-found: error

  reconstruct:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: ${{ fromJSON(needs.preflight.outputs.years) }}
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r team_trb_all_players/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: treb-final-v2-targets-${{ github.sha }}
          path: team_trb_all_players/impact_database/roster_tenure_v2
      - name: Download and verify season sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR=${{ matrix.year }} python - <<'PY'
          from pathlib import Path
          import hashlib, os, tarfile, urllib.request
          year=int(os.environ['YEAR'])
          raw=Path('team_trb_all_players/impact_database/local_raw'); raw.mkdir(parents=True,exist_ok=True)
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          hashes=[]
          for kind in ('nbastats','pbpstats'):
              url=urls[f'{kind}_{year}']; arc=raw/url.rsplit('/',1)[-1]
              print('download',url,flush=True)
              urllib.request.urlretrieve(url,arc)
              hashes.append(f'{hashlib.sha256(arc.read_bytes()).hexdigest()}  {arc.name}')
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          (raw/'source_archives.sha256').write_text('\n'.join(hashes)+'\n')
          PY
      - name: Reconstruct season once
        shell: bash
        run: |
          set -euo pipefail
          y=${{ matrix.year }}
          python -u team_trb_all_players/run_local_treb_production.py --years "$y" --batch-size 50 --force 2>&1 | tee "treb-final-${y}.log"
      - name: Persist successful season lock branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          y=${{ matrix.year }}
          season="${y}-$(printf '%02d' $(((y+1)%100)))"
          out=team_trb_all_players/impact_database/final_local_rebuild
          test -f "$out/locked_seasons/$season.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "treb-final-lock-${y}"
          git add -f "$out/checkpoints/$season" "$out/locked_seasons/$season.json" "$out/master_manifest.json"
          git commit -m "Final lock ${season} reconstructed partial tenures"
          git push --force origin "HEAD:refs/heads/treb-final-lock-${y}"
      - name: Upload season evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treb-final-season-${{ matrix.year }}-${{ github.sha }}
          path: |
            treb-final-${{ matrix.year }}.log
            team_trb_all_players/impact_database/final_local_rebuild/**
            team_trb_all_players/impact_database/local_raw/source_archives.sha256
          if-no-files-found: warn
          retention-days: 90

  historical-status:
    needs: [preflight, reconstruct]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: treb-final-v2-targets-${{ github.sha }}
          path: team_trb_all_players/impact_database/roster_tenure_v2
      - name: Gather all durable historical locks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p team_trb_all_players/impact_database/final_local_rebuild/locked_seasons
          python - <<'PY'
          import gzip,json
          from collections import Counter
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/roster_tenure_v2/wowy_partial_segments.jsonl.gz')
          c=Counter()
          with gzip.open(p,'rt',encoding='utf-8') as f:
              for line in f:
                  if line.strip(): c[json.loads(line)['season']]+=1
          Path('/tmp/expected_targets.json').write_text(json.dumps(c,sort_keys=True))
          PY
          for y in $(seq 2000 2024); do
            season="${y}-$(printf '%02d' $(((y+1)%100)))"
            branch="treb-final-lock-${y}"
            if git fetch --quiet origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
              git show "origin/${branch}:team_trb_all_players/impact_database/final_local_rebuild/locked_seasons/${season}.json" > "team_trb_all_players/impact_database/final_local_rebuild/locked_seasons/${season}.json"
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('team_trb_all_players/impact_database/final_local_rebuild/locked_seasons')
          expected=json.loads(Path('/tmp/expected_targets.json').read_text())
          rows=[]
          for y in range(2000,2025):
              season=f"{y}-{(y+1)%100:02d}"
              p=root/f'{season}.json'
              if p.exists():
                  d=json.loads(p.read_text())
                  rows.append({'year':y,'season':season,'locked':True,'status':d.get('status'),'targets':int(d.get('target_count',-1)),'expected_targets':int(expected.get(season,0)),'exceptions':len(d.get('exceptions',[])),'unmatched_rebound_rows':len(d.get('unmatched_rebound_rows',[])),'repairs':len(d.get('repairs',[])),'code_commit':d.get('code_commit')})
              else:
                  rows.append({'year':y,'season':season,'locked':False,'status':'MISSING','targets':0,'expected_targets':int(expected.get(season,0))})
          locked=[r for r in rows if r['locked'] and r['status']=='COMPLETE' and r['targets']==r['expected_targets']]
          payload={'historical_years':25,'locked_clean_and_target_exact':len(locked),'missing_or_failed':25-len(locked),'expected_partial_segments_2000_2024':sum(r['expected_targets'] for r in rows),'locked_partial_segments':sum(r['targets'] for r in locked),'rows':rows}
          out=Path('team_trb_all_players/impact_database/final_local_rebuild/historical_production_status.json')
          out.write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY
      - name: Persist combined historical lock set when complete
        shell: bash
        run: |
          set -euo pipefail
          status=team_trb_all_players/impact_database/final_local_rebuild/historical_production_status.json
          missing=$(python -c "import json;print(json.load(open('$status'))['missing_or_failed'])")
          if [ "$missing" != "0" ]; then
            echo "Historical sweep not complete: $missing seasons missing/failed; preserving successful lock branches and status artifact."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B treb-final-historical-locks-20260812
          git add -f team_trb_all_players/impact_database/final_local_rebuild/locked_seasons team_trb_all_players/impact_database/final_local_rebuild/historical_production_status.json
          git commit -m 'Combine all 2000-01 through 2024-25 final TREB locks'
          git push --force origin HEAD:refs/heads/treb-final-historical-locks-20260812
      - uses: actions/upload-artifact@v4
        with:
          name: treb-final-historical-status-${{ github.sha }}
          path: |
            team_trb_all_players/impact_database/final_local_rebuild/locked_seasons/*.json
            team_trb_all_players/impact_database/final_local_rebuild/historical_production_status.json
          retention-days: 90
          if-no-files-found: error
