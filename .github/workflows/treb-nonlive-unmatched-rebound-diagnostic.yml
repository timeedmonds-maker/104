name: TREB unmatched rebound zero-impact diagnostic

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - team_trb_all_players/final_integrity_rebuild/NONLIVE_UNMATCHED_CONTROL.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  diagnose:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {year: 2008, chunk: 0}
          - {year: 2009, chunk: 0}
          - {year: 2010, chunk: 0}
          - {year: 2011, chunk: 0}
          - {year: 2015, chunk: 0}
          - {year: 2017, chunk: 0}
          - {year: 2017, chunk: 1}
          - {year: 2017, chunk: 2}
          - {year: 2017, chunk: 3}
          - {year: 2017, chunk: 4}
          - {year: 2017, chunk: 5}
          - {year: 2018, chunk: 0}
          - {year: 2018, chunk: 1}
          - {year: 2019, chunk: 0}
          - {year: 2021, chunk: 0}
          - {year: 2021, chunk: 1}
          - {year: 2022, chunk: 0}
          - {year: 2022, chunk: 1}
          - {year: 2022, chunk: 2}
          - {year: 2023, chunk: 0}
          - {year: 2024, chunk: 0}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Fetch exact-identity residual summary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 -o /tmp/summary.json \
            "https://raw.githubusercontent.com/timeedmonds-maker/104/agent/treb-batched-game-facts-20260812/team_trb_all_players/final_integrity_rebuild/exact_identity_rebound_diagnostic_v2/EXACT_IDENTITY_REBOUND_DIAGNOSTIC_V2_SUMMARY.json"
      - name: Download season sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"; mkdir -p "$RAW"
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          y=int('${{ matrix.year }}'); raw=Path(f'/tmp/trebraw-{y}')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode(); urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in [f'nbastats_{y}',f'nbastatsv3_{y}',f'pbpstats_{y}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]; subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Screen unmatched rows against existing non-live PBP rules
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"
          NBA=$(find "$RAW" -name "nbastats_${YEAR}.csv" -print -quit); V3=$(find "$RAW" -name "nbastatsv3_${YEAR}.csv" -print -quit); PBP=$(find "$RAW" -name "pbpstats_${YEAR}.csv" -print -quit)
          python -u team_trb_all_players/nonlive_unmatched_rebound_diagnostic.py --nba "$NBA" --v3 "$V3" --pbp "$PBP" --summary /tmp/summary.json --year "$YEAR" --chunk-index '${{ matrix.chunk }}' --chunk-size 10 --output '/tmp/NONLIVE_${{ matrix.year }}_${{ matrix.chunk }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-nonlive-${{ matrix.year }}-${{ matrix.chunk }}
          path: /tmp/NONLIVE_${{ matrix.year }}_${{ matrix.chunk }}.json
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    needs: diagnose
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-nonlive-*
          path: /tmp/results
      - name: Aggregate zero-impact yield
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          chunks=[]
          for p in Path('/tmp/results').rglob('NONLIVE_*.json'):
              try: chunks.append(json.loads(p.read_text()))
              except Exception: pass
          games=[g for c in chunks for g in c.get('games',[])]
          safe=[g for g in games if g.get('status')=='ALL_PBP_PROVEN_NONLIVE']
          out={'status':'COMPLETE' if len(chunks)==21 and len(games)==109 else 'PARTIAL','chunks_found':len(chunks),'games_screened':len(games),'zero_impact_safe_games':len(safe),'zero_impact_safe_rows':sum(g.get('unmatched_rows',0) for g in safe),'unknown_or_real_games':sum(g.get('status')=='UNKNOWN_OR_REAL' for g in games),'lineup_or_source_failures':sum(g.get('status')=='LINEUP_OR_SOURCE_FAILURE' for g in games),'safe_games':safe,'all_games':games}
          Path('/tmp/NONLIVE_UNMATCHED_REBOUND_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps({k:v for k,v in out.items() if k not in {'safe_games','all_games'}},indent=2))
          PY
      - name: Persist checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-batched-game-facts-20260812; git reset --hard origin/agent/treb-batched-game-facts-20260812
          DEST=team_trb_all_players/final_integrity_rebuild/nonlive_unmatched_rebound; mkdir -p "$DEST"; cp /tmp/NONLIVE_UNMATCHED_REBOUND_SUMMARY.json "$DEST"/
          git add -f "$DEST/NONLIVE_UNMATCHED_REBOUND_SUMMARY.json"; if ! git diff --cached --quiet; then git commit -m 'Persist zero-impact unmatched rebound diagnostic'; git push origin HEAD:agent/treb-batched-game-facts-20260812; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-nonlive-unmatched-rebound-summary
          path: /tmp/NONLIVE_UNMATCHED_REBOUND_SUMMARY.json
          retention-days: 90
