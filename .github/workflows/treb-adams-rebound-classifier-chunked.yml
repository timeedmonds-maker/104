name: TREB Adams rebound classifier audit chunked

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - team_trb_all_players/final_integrity_rebuild/ADAMS_REBOUND_CLASSIFIER_CHUNKED_CONTROL.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit-chunk:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        chunk: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz requests urllib3
      - name: Download 2016-17 local sources
        shell: bash
        run: |
          set -euo pipefail
          RAW=/tmp/trebraw-2016; mkdir -p "$RAW"
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          y=2016; raw=Path('/tmp/trebraw-2016')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in [f'nbastats_{y}',f'nbastatsv3_{y}',f'pbpstats_{y}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Run 10-game classifier chunk
        shell: bash
        run: |
          set -o pipefail
          NBA=$(find /tmp/trebraw-2016 -name 'nbastats_2016.csv' -print -quit)
          V3=$(find /tmp/trebraw-2016 -name 'nbastatsv3_2016.csv' -print -quit)
          PBP=$(find /tmp/trebraw-2016 -name 'pbpstats_2016.csv' -print -quit)
          python -u team_trb_all_players/adams_rebound_classifier_audit_chunk.py \
            --nba "$NBA" --v3 "$V3" --pbp "$PBP" \
            --chunk-index '${{ matrix.chunk }}' --chunk-size 10 \
            --output '/tmp/ADAMS_REBOUND_CLASSIFIER_CHUNK_${{ matrix.chunk }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-adams-classifier-chunk-${{ matrix.chunk }}
          path: /tmp/ADAMS_REBOUND_CLASSIFIER_CHUNK_${{ matrix.chunk }}.json
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    needs: audit-chunk
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-adams-classifier-chunk-*
          path: /tmp/chunks
      - name: Build partial-safe aggregate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          LOCKED={
            'seconds_on':143368,
            'team_oreb_on':816,
            'team_dreb_on':1846,
            'opponent_oreb_on':643,
            'opponent_dreb_on':1632,
          }
          KEYS=list(LOCKED)
          MODES=['current','real_first','description_counter']
          def zero(): return {k:0 for k in KEYS}
          def add(dst,src):
              for k in KEYS: dst[k]+=int(src.get(k,0))
          def diff(a,b): return {k:int(a[k]-b[k]) for k in KEYS}

          payloads=[]
          for p in sorted(Path('/tmp/chunks').rglob('ADAMS_REBOUND_CLASSIFIER_CHUNK_*.json')):
              try: payloads.append(json.loads(p.read_text()))
              except Exception: pass
          by_chunk={int(x['chunk_index']):x for x in payloads}
          found=sorted(by_chunk)
          expected=list(range(9))
          missing=[x for x in expected if x not in by_chunk]
          truth=zero(); universe=0; per_game=[]; failures=[]
          methods={m:{'observed':zero(),'exact_games':0,'sum_abs_game_error':zero()} for m in MODES}
          for idx in found:
              p=by_chunk[idx]
              add(truth,p.get('api_truth',{})); universe+=int(p.get('okc_oreb_universe',0))
              per_game.extend(p.get('per_game',[])); failures.extend(p.get('failures',[]))
              for m in MODES:
                  s=p.get('methods',{}).get(m,{})
                  add(methods[m]['observed'],s.get('observed',{}))
                  methods[m]['exact_games']+=int(s.get('exact_games',0))
                  add(methods[m]['sum_abs_game_error'],s.get('sum_abs_game_error',{}))
          for m in MODES:
              methods[m]['diff_vs_api_truth']=diff(methods[m]['observed'],truth)
          chunk_status={str(i):by_chunk[i].get('status') for i in found}
          complete=(not missing and len(per_game)==82 and not failures and all(by_chunk[i].get('status')=='COMPLETE' for i in expected))
          out={
            'status':'COMPLETE' if complete else 'PARTIAL',
            'expected_chunks':expected,
            'found_chunks':found,
            'missing_chunks':missing,
            'chunk_status':chunk_status,
            'games_compared':len(per_game),
            'failures':failures,
            'okc_oreb_universe':universe,
            'api_truth':truth,
            'locked':LOCKED,
            'api_truth_diff_vs_locked':diff(truth,LOCKED),
            'methods':methods,
            'per_game':sorted(per_game,key=lambda x:int(x['game_id'])),
          }
          dest=Path('/tmp/ADAMS_REBOUND_CLASSIFIER_CHUNKED_SUMMARY.json')
          dest.write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='per_game'},indent=2))
          PY
      - name: Persist aggregate checkpoint durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-batched-game-facts-20260812
          git reset --hard origin/agent/treb-batched-game-facts-20260812
          DEST=team_trb_all_players/final_integrity_rebuild/adams_classifier_chunks
          mkdir -p "$DEST"
          cp /tmp/ADAMS_REBOUND_CLASSIFIER_CHUNKED_SUMMARY.json "$DEST"/
          git add -f "$DEST/ADAMS_REBOUND_CLASSIFIER_CHUNKED_SUMMARY.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist chunked Adams rebound classifier audit'
          git push origin HEAD:agent/treb-batched-game-facts-20260812
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-adams-classifier-chunked-summary
          path: /tmp/ADAMS_REBOUND_CLASSIFIER_CHUNKED_SUMMARY.json
          retention-days: 90
          if-no-files-found: warn
