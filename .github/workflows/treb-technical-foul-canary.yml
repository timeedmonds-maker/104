name: TREB technical-foul lineup guard canary

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - team_trb_all_players/final_integrity_rebuild/TECHNICAL_FOUL_CANARY_CONTROL.json

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  canary:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - year: 2006
            games: '20600017,20600034,20600058,20600092'
          - year: 2010
            games: '21000025,21000109,21000163,21000213'
          - year: 2015
            games: '21500034,21500057,21500082,21500098'
          - year: 2018
            games: '21800011,21800021,21800068,21800072'
          - year: 2024
            games: '22400010,22400019,22400043,22400078'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Fetch consolidated failure list
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin treb-game-fact-qa-consolidation
          git show origin/treb-game-fact-qa-consolidation:team_trb_all_players/final_integrity_rebuild/game_fact_qa_consolidated/FAILED_GAMES.csv > /tmp/FAILED_GAMES.csv
      - name: Download season sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"; mkdir -p "$RAW"
          python - <<'PY'
          import subprocess, tarfile, urllib.request
          from pathlib import Path
          year=int('${{ matrix.year }}'); raw=Path(f'/tmp/trebraw-{year}')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in [f'nbastats_{year}',f'nbastatsv3_{year}',f'pbpstats_{year}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Run cross-era technical-foul canary
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"
          NBA=$(find "$RAW" -name "nbastats_${YEAR}.csv" -print -quit)
          V3=$(find "$RAW" -name "nbastatsv3_${YEAR}.csv" -print -quit)
          PBP=$(find "$RAW" -name "pbpstats_${YEAR}.csv" -print -quit)
          NBA="$NBA" V3="$V3" PBP="$PBP" YEAR="$YEAR" GAMES='${{ matrix.games }}' python - <<'PY'
          import csv, json, os, sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import production_treb_engine_v3 as engine
          import build_exact_game_fact_layer as base

          year=int(os.environ['YEAR']); season=f"{year}-{(year+1)%100:02d}"
          target_ids=[int(x) for x in os.environ['GAMES'].split(',')]
          nba=io.normalize_nba(pd.read_csv(os.environ['NBA'],low_memory=False))
          v3=engine.normalize_v3(pd.read_csv(os.environ['V3'],low_memory=False))
          pbp=io.normalize_pbp(pd.read_csv(os.environ['PBP'],low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}
          vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}
          pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}
          common=sorted(set(ng)&set(vg)&set(pg))
          failed=set()
          with open('/tmp/FAILED_GAMES.csv',encoding='utf-8') as fh:
              for r in csv.DictReader(fh):
                  if r['season']==season: failed.add(int(r['game_id']))
          controls=[g for g in common if g not in failed][:3]

          def canonical(gid):
              tr,pr,a=base.build_game(gid,ng[gid],vg[gid],pg[gid])
              return {
                  'team':sorted(tr,key=lambda r:(r['team_id'],r['game_id'])),
                  'player':sorted(pr,key=lambda r:(r['team_id'],r['player_id'],r['game_id'])),
                  'unmatched':int(a['join_audit'].get('unmatched_rebound_bearing_rows',0)),
              }

          baseline={g:canonical(g) for g in controls}
          original=engine._ignore_participant_constraint
          def patched(row):
              if original(row):
                  return True
              text=engine._description(row)
              return 't.foul' in text or 'non-unsportsmanlike' in text
          engine._ignore_participant_constraint=patched

          regressions=[]
          for g in controls:
              after=canonical(g)
              if after != baseline[g]: regressions.append(g)

          targets=[]
          for g in target_ids:
              try:
                  c=canonical(g)
                  targets.append({'game_id':g,'success':True,'unmatched':c['unmatched'],'player_rows':len(c['player'])})
              except Exception as exc:
                  targets.append({'game_id':g,'success':False,'error':f'{type(exc).__name__}: {exc}'})

          payload={
              'year':year,'season':season,'controls':controls,'control_regressions':regressions,
              'targets':targets,'target_successes':sum(x['success'] for x in targets),
              'target_failures':sum(not x['success'] for x in targets),
              'status':'PASS' if not regressions else 'CONTROL_REGRESSION'
          }
          Path(f'/tmp/technical-foul-canary-{year}.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          if regressions: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-foul-canary-${{ matrix.year }}
          path: /tmp/technical-foul-canary-${{ matrix.year }}.json
          retention-days: 90
          if-no-files-found: warn

  adams-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Download 2016-17 sources
        shell: bash
        run: |
          set -euo pipefail
          RAW=/tmp/trebraw-2016; mkdir -p "$RAW"
          python - <<'PY'
          import subprocess, tarfile, urllib.request
          from pathlib import Path
          year=2016; raw=Path('/tmp/trebraw-2016')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in [f'nbastats_{year}',f'nbastatsv3_{year}',f'pbpstats_{year}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Run locked Steven Adams regression under patch
        shell: bash
        run: |
          set -euo pipefail
          NBA=$(find /tmp/trebraw-2016 -name 'nbastats_2016.csv' -print -quit)
          V3=$(find /tmp/trebraw-2016 -name 'nbastatsv3_2016.csv' -print -quit)
          PBP=$(find /tmp/trebraw-2016 -name 'pbpstats_2016.csv' -print -quit)
          NBA="$NBA" V3="$V3" PBP="$PBP" python - <<'PY'
          import json, os, sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import production_treb_engine_v3 as engine
          import build_exact_game_fact_layer as base
          ADAMS=203500; OKC=1610612760
          nba=io.normalize_nba(pd.read_csv(os.environ['NBA'],low_memory=False))
          v3=engine.normalize_v3(pd.read_csv(os.environ['V3'],low_memory=False))
          pbp=io.normalize_pbp(pd.read_csv(os.environ['PBP'],low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}
          vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}
          pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}
          original=engine._ignore_participant_constraint
          def patched(row):
              if original(row): return True
              text=engine._description(row)
              return 't.foul' in text or 'non-unsportsmanlike' in text
          engine._ignore_participant_constraint=patched
          gids=[]
          for gid,g in ng.items():
              cols=[c for c in ('PLAYER1_ID','PLAYER2_ID','PLAYER3_ID') if c in g.columns]
              if any(pd.to_numeric(g[c],errors='coerce').eq(ADAMS).any() for c in cols): gids.append(gid)
          sums={'team_oreb_on':0,'team_dreb_on':0,'opponent_oreb_on':0,'opponent_dreb_on':0,'seconds_on':0,'okc_oreb_universe':0}
          failures=[]; audits=[]
          for gid in sorted(gids):
              try:
                  tr,pr,a=base.build_game(gid,ng[gid],vg[gid],pg[gid]); audits.append(a)
                  for r in tr:
                      if r['team_id']==OKC: sums['okc_oreb_universe']+=int(r['team_oreb'])
                  for r in pr:
                      if r['player_id']==ADAMS and r['team_id']==OKC:
                          for k in ('team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on','seconds_on'): sums[k]+=int(r[k])
              except Exception as exc: failures.append({'game_id':gid,'error':f'{type(exc).__name__}: {exc}'})
          sums['team_rebounds_on']=sums['team_oreb_on']+sums['team_dreb_on']
          sums['opponent_rebounds_on']=sums['opponent_oreb_on']+sums['opponent_dreb_on']
          expected={'team_oreb_on':816,'team_dreb_on':1846,'team_rebounds_on':2662,'opponent_oreb_on':643,'opponent_dreb_on':1632,'opponent_rebounds_on':2275,'seconds_on':143368,'okc_oreb_universe':1277}
          payload={'games':len(gids),'successful_games':len(audits),'failures':failures,'observed':sums,'expected':expected,'matches':{k:sums[k]==v for k,v in expected.items()}}
          payload['status']='PASS' if not failures and all(payload['matches'].values()) else 'FAIL'
          Path('/tmp/adams-regression.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          if payload['status']!='PASS': raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-foul-canary-adams-regression
          path: /tmp/adams-regression.json
          retention-days: 90

  aggregate:
    needs: [canary, adams-regression]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: technical-foul-canary-*
          path: /tmp/canary
          merge-multiple: true
      - name: Aggregate canary results
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('/tmp/canary').glob('*.json'))
          data=[json.loads(p.read_text()) for p in files]
          seasons=[x for x in data if 'targets' in x]
          adams=next((x for x in data if 'matches' in x),None)
          out={
            'season_canaries':len(seasons),
            'target_games':sum(len(x['targets']) for x in seasons),
            'target_successes':sum(x['target_successes'] for x in seasons),
            'target_failures':sum(x['target_failures'] for x in seasons),
            'control_regressions':sum(len(x['control_regressions']) for x in seasons),
            'adams_regression_status':None if adams is None else adams['status'],
            'details':data,
          }
          out['status']='PASS' if out['control_regressions']==0 and out['adams_regression_status']=='PASS' else 'FAIL'
          Path('/tmp/TECHNICAL_FOUL_CANARY_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='details'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: technical-foul-canary-summary
          path: /tmp/TECHNICAL_FOUL_CANARY_SUMMARY.json
          retention-days: 90
