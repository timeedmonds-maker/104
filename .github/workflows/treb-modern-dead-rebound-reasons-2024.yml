name: TREB modern dead rebound reasons 2024

on:
  push:
    branches: [treb-final-production-20260812]
    paths:
      - .github/workflows/treb-modern-dead-rebound-reasons-2024.yml
      - team_trb_all_players/diagnose_modern_dead_rebound_reasons_2024.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - run: python -m pip install -r team_trb_all_players/requirements.txt
      - name: Download 2024 legacy and v3 feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb-dead-reasons
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          raw=Path('/tmp/treb-dead-reasons')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in ('nbastats_2024','nbastatsv3_2024'):
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Map dead-ball reasons
        run: |
          python -u team_trb_all_players/diagnose_modern_dead_rebound_reasons_2024.py \
            --nba /tmp/treb-dead-reasons/nbastats_2024.csv \
            --v3 /tmp/treb-dead-reasons/nbastatsv3_2024.csv \
            --output /tmp/treb-dead-reasons/dead_rebound_reasons.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-modern-dead-rebound-reasons-${{ github.sha }}
          path: /tmp/treb-dead-reasons/dead_rebound_reasons.json
          retention-days: 90
          if-no-files-found: error
