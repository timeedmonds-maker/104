name: TREB precision legacy canary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/treb-precision-legacy-canary.yml
      - scripts/patch_treb_legacy_recovery.py
      - scripts/diagnose_treb_legacy_queue.py
      - team_trb_all_players/impact_database/TREB_PRECISION_CANARY_TRIGGER.txt

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  canary:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout control scripts from main
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1

      - name: Checkout recovery source separately
        uses: actions/checkout@v4
        with:
          ref: treb-validated-2016-recovery
          path: recovery
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recovery/team_trb_all_players/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r recovery/team_trb_all_players/requirements.txt

      - name: Apply hypothetical narrow repair in disposable checkout
        run: python control/scripts/patch_treb_legacy_recovery.py recovery

      - name: Compile patched production code
        run: python -m py_compile recovery/team_trb_all_players/local_treb_rebuild.py recovery/team_trb_all_players/production_treb_engine.py recovery/team_trb_all_players/run_local_treb_production.py

      - name: Rebuild and verify authoritative V2 targets
        shell: bash
        working-directory: recovery
        run: |
          set -euo pipefail
          python -u team_trb_all_players/build_roster_targets_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/roster_tenure_v2/roster_repair_v2_summary.json').read_text())
          assert d['validated_player_team_season_rows']==14524, d
          assert d['full_core_reuse_rows']==9647, d
          assert d['partial_player_team_season_rows']==4877, d
          assert d['wowy_game_bearing_segments']==5199, d
          assert d['cross_team_overlap_pairs']==0, d
          assert d['impossible_minute_rows']==0, d
          assert d['empty_played_tenures']==0, d
          print('V2_TARGET_GATE=PASS')
          PY

      - name: Download source archives for exact 2016 and legacy canaries
        shell: bash
        working-directory: recovery
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tarfile, urllib.request
          raw=Path('team_trb_all_players/impact_database/local_raw')
          raw.mkdir(parents=True, exist_ok=True)
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={}
          for line in text.splitlines():
              if '=' in line:
                  k,v=line.split('=',1); urls[k.strip()]=v.strip()
          for year in (2016, 2000, 2001):
              for kind in ('nbastats','pbpstats'):
                  url=urls[f'{kind}_{year}']
                  arc=raw / url.rsplit('/',1)[-1]
                  print('download', url, flush=True)
                  urllib.request.urlretrieve(url, arc)
                  with tarfile.open(arc, 'r:xz') as tf:
                      tf.extractall(raw)
          PY

      - name: Exact 2016 Adams regression must remain unchanged
        working-directory: recovery
        run: python -u team_trb_all_players/run_local_2016_regression.py

      - name: Run 2000-01 canary and preserve repair evidence
        shell: bash
        working-directory: recovery
        run: |
          set +e
          python -u team_trb_all_players/run_local_treb_production.py --years 2000 --output team_trb_all_players/impact_database/canary_out/2000 2>&1 | tee treb-canary-2000.log
          code=${PIPESTATUS[0]}
          echo "CANARY_2000_EXIT=$code"
          exit 0

      - name: Diagnose 2000-01 queue
        shell: bash
        run: python control/scripts/diagnose_treb_legacy_queue.py --repo-root recovery --year 2000 --output recovery/team_trb_all_players/impact_database/canary_out/2000

      - name: Run 2001-02 canary and preserve repair evidence
        shell: bash
        working-directory: recovery
        run: |
          set +e
          python -u team_trb_all_players/run_local_treb_production.py --years 2001 --output team_trb_all_players/impact_database/canary_out/2001 2>&1 | tee treb-canary-2001.log
          code=${PIPESTATUS[0]}
          echo "CANARY_2001_EXIT=$code"
          exit 0

      - name: Diagnose 2001-02 queue
        shell: bash
        run: python control/scripts/diagnose_treb_legacy_queue.py --repo-root recovery --year 2001 --output recovery/team_trb_all_players/impact_database/canary_out/2001

      - name: Assert bad generic post-horn repair is absent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for year, season in [(2000,'2000-01'),(2001,'2001-02')]:
              p=Path(f'recovery/team_trb_all_players/impact_database/canary_out/{year}/repair_queue/{season}.json')
              if not p.exists():
                  continue
              d=json.loads(p.read_text())
              bad=[r for r in d.get('repairs',[]) if r.get('type')=='post_horn_clock_repair']
              assert not bad, f'{season}: overbroad post-horn deletions remain: {len(bad)}'
          print('POST_HORN_OVERBROAD_REPAIR=ABSENT')
          PY

      - name: Upload complete canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treb-precision-legacy-canary-${{ github.sha }}
          path: |
            recovery/treb-canary-2000.log
            recovery/treb-canary-2001.log
            recovery/team_trb_all_players/production_treb_engine.py
            recovery/team_trb_all_players/impact_database/canary_out/**
          if-no-files-found: error
          retention-days: 30
