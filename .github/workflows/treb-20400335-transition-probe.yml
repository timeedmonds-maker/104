name: TREB 20400335 missing transition probe

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-20400335-transition-probe.yml
      - team_trb_all_players/probe_20400335_missing_transition.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Download 2004 archived source pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb204
          for kind in nbastats nbastatsv3; do
            url="https://github.com/shufinskiy/nba_data/raw/main/datasets/${kind}_2004.tar.xz"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 -o "/tmp/treb204/${kind}_2004.tar.xz" "$url"
            tar -xJf "/tmp/treb204/${kind}_2004.tar.xz" -C /tmp/treb204
          done
          test -s /tmp/treb204/nbastats_2004.csv
          test -s /tmp/treb204/nbastatsv3_2004.csv
      - name: Extract missing-transition evidence
        run: |
          python -u team_trb_all_players/probe_20400335_missing_transition.py \
            --legacy /tmp/treb204/nbastats_2004.csv \
            --v3 /tmp/treb204/nbastatsv3_2004.csv \
            --output /tmp/GAME_20400335_MISSING_TRANSITION_EVIDENCE.json
      - name: Commit evidence durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          mkdir -p team_trb_all_players/final_integrity_rebuild
          cp /tmp/GAME_20400335_MISSING_TRANSITION_EVIDENCE.json \
             team_trb_all_players/final_integrity_rebuild/GAME_20400335_MISSING_TRANSITION_EVIDENCE.json
          git add team_trb_all_players/final_integrity_rebuild/GAME_20400335_MISSING_TRANSITION_EVIDENCE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record game 20400335 transition evidence"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
