name: TREB exact game facts - one season

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-final-integrity-game-facts.yml
      - team_trb_all_players/final_integrity_rebuild/GAME_FACT_CHUNK_CONTROL.json
  workflow_dispatch:
    inputs:
      year:
        description: "Season start year, e.g. 2000"
        required: false
        type: string

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: treb-exact-game-facts-single-season
  cancel-in-progress: false

jobs:
  build-one-season:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install pandas numpy rapidfuzz

      - name: Resolve one season only
        id: season
        shell: bash
        run: |
          set -euo pipefail
          INPUT_YEAR='${{ inputs.year }}'
          if [ -n "$INPUT_YEAR" ]; then
            YEAR="$INPUT_YEAR"
          else
            YEAR=$(python - <<'PY'
          import json
          p='team_trb_all_players/final_integrity_rebuild/GAME_FACT_CHUNK_CONTROL.json'
          print(int(json.load(open(p))['year']))
          PY
          )
          fi
          if [ "$YEAR" -lt 2000 ] || [ "$YEAR" -gt 2024 ]; then
            echo "invalid historical season start year: $YEAR" >&2
            exit 2
          fi
          NEXT=$((YEAR+1))
          SEASON="${YEAR}-$(printf '%02d' $((NEXT%100)))"
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "RUNNING_SINGLE_SEASON=$SEASON"

      - name: Compile exact fact builder
        run: python -m py_compile team_trb_all_players/build_exact_game_fact_layer.py

      - name: Download this season's local historical sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ steps.season.outputs.year }}'
          RAW="/tmp/trebraw-${YEAR}"
          rm -rf "$RAW" && mkdir -p "$RAW"
          python - <<'PY'
          import subprocess, tarfile, urllib.request
          from pathlib import Path
          year=int('${{ steps.season.outputs.year }}')
          raw=Path(f'/tmp/trebraw-{year}')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt', timeout=60).read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          keys=[f'nbastats_{year}', f'nbastatsv3_{year}', f'pbpstats_{year}']
          for key in keys:
              if key not in urls:
                  raise SystemExit(f'missing source key {key}')
              url=urls[key]
              arc=raw/url.rsplit('/',1)[-1]
              print(f'DOWNLOAD {key} {url}', flush=True)
              subprocess.run(['curl','--fail','--location','--retry','8','--retry-all-errors','--retry-delay','3','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf:
                  tf.extractall(raw)
          for key in keys:
              hits=list(raw.rglob(f'{key}.csv'))
              if len(hits)!=1:
                  raise SystemExit(f'{key}: expected exactly one csv, got {hits}')
              print(f'SOURCE {key} {hits[0]}', flush=True)
          PY

      - name: Build exact game facts for this season
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ steps.season.outputs.year }}'
          SEASON='${{ steps.season.outputs.season }}'
          RAW="/tmp/trebraw-${YEAR}"
          OUT="/tmp/treb-game-facts-${YEAR}"
          NBA=$(find "$RAW" -name "nbastats_${YEAR}.csv" -print -quit)
          V3=$(find "$RAW" -name "nbastatsv3_${YEAR}.csv" -print -quit)
          PBP=$(find "$RAW" -name "pbpstats_${YEAR}.csv" -print -quit)
          rm -rf "$OUT" && mkdir -p "$OUT"
          python -u team_trb_all_players/build_exact_game_fact_layer.py \
            --season "$SEASON" \
            --nba "$NBA" \
            --v3 "$V3" \
            --pbp "$PBP" \
            --output-dir "$OUT" 2>&1 | tee "$OUT/build.log"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          year='${{ steps.season.outputs.year }}'
          qa=json.loads(Path(f'/tmp/treb-game-facts-{year}/qa.json').read_text())
          print(json.dumps(qa, indent=2))
          if qa.get('status') not in {'PASS','INCOMPLETE'}:
              raise SystemExit('unexpected QA state')
          PY

      - name: Persist this season durably even if repairs remain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ steps.season.outputs.year }}'
          SEASON='${{ steps.season.outputs.season }}'
          OUT="/tmp/treb-game-facts-${YEAR}"
          if [ ! -f "$OUT/qa.json" ]; then
            echo "No season output was produced; nothing durable to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "treb-game-facts-${YEAR}" "${{ github.sha }}"
          DEST="team_trb_all_players/impact_database/exact_game_facts/${SEASON}"
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp "$OUT"/* "$DEST"/
          git add -f "$DEST"
          git commit -m "Persist exact TREB game facts ${SEASON}"
          git push --force origin HEAD:"treb-game-facts-${YEAR}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-exact-game-facts-${{ steps.season.outputs.year }}
          path: /tmp/treb-game-facts-${{ steps.season.outputs.year }}/**
          retention-days: 90
          if-no-files-found: warn
