name: TREB final14 source triage
on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-final14-source-triage.yml]
permissions:
  contents: write
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Download only source years for unresolved games and audit game presence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, tarfile, urllib.request
          from pathlib import Path
          import pandas as pd
          unresolved=json.loads(Path('team_trb_all_players/impact_database/final_exact_exclusion_recovery/remaining_14_unresolved.json').read_text())
          gids=[int(x['game_id']) for x in unresolved['games']]
          years=sorted({2000+int(str(g)[1:3]) for g in gids})
          raw=Path('/tmp/final14src'); raw.mkdir(parents=True,exist_ok=True)
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for y in years:
            yd=raw/str(y); yd.mkdir(exist_ok=True)
            for prefix in ('nbastats','nbastatsv3','pbpstats'):
              key=f'{prefix}_{y}'
              rec={'key':key}
              if key not in urls:
                continue
              url=urls[key]; arc=yd/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(yd)
          def game_rows(df,gid):
            for c in ('GAME_ID','GAMEID','gameId','game_id'):
              if c in df.columns:
                return df[pd.to_numeric(df[c],errors='coerce').eq(gid)]
            return df.iloc[0:0]
          out=[]
          for gid in gids:
            y=2000+int(str(gid)[1:3]); yd=raw/str(y)
            rec={'game_id':gid,'year':y,'sources':{}}
            for prefix in ('nbastats','nbastatsv3','pbpstats'):
              p=yd/f'{prefix}_{y}.csv'
              if not p.exists():
                rec['sources'][prefix]={'present':False,'rows':0}; continue
              df=pd.read_csv(p,low_memory=False)
              g=game_rows(df,gid)
              info={'present':len(g)>0,'rows':int(len(g)),'columns':list(g.columns)[:25]}
              if prefix=='nbastats' and len(g):
                if 'EVENTMSGTYPE' in g: info['rebound_events']=int(pd.to_numeric(g.EVENTMSGTYPE,errors='coerce').eq(4).sum())
              if prefix=='nbastatsv3' and len(g):
                ac='actionType' if 'actionType' in g else None
                if ac: info['rebound_events']=int(g[ac].astype(str).str.lower().eq('rebound').sum())
              rec['sources'][prefix]=info
            rec['all_three_present']=all(rec['sources'][p]['present'] for p in ('nbastats','nbastatsv3','pbpstats'))
            out.append(rec)
          dest=Path('team_trb_all_players/impact_database/final14_source_triage'); dest.mkdir(parents=True,exist_ok=True)
          payload={'status':'PASS','games':out,'all_three_source_games':sum(r['all_three_present'] for r in out),'missing_any_source_games':sum(not r['all_three_present'] for r in out)}
          (dest/'FINAL14_SOURCE_TRIAGE.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps({'status':'PASS','all_three_source_games':payload['all_three_source_games'],'missing_any_source_games':payload['missing_any_source_games']},indent=2))
          PY
      - name: Reassert authoritative V2 and persist
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json
          p='team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz'
          rows=[json.loads(x) for x in gzip.open(p,'rt') if x.strip()]
          assert len(rows)==14524
          assert len({(str(r['season']),str(r['player_id']).removesuffix('.0'),int(r['team_id'])) for r in rows})==14524
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team_trb_all_players/impact_database/final14_source_triage
          git commit -m 'Persist final-14 source triage' || true
          git push origin HEAD:agent/treb-final-exact-assembly
      - uses: actions/upload-artifact@v4
        with:
          name: treb-final14-source-triage-${{ github.run_id }}
          path: team_trb_all_players/impact_database/final14_source_triage
          retention-days: 90
