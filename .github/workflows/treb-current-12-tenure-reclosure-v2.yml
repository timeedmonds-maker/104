name: TREB current 12 exact tenure reclosure v2

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - 'team_trb_all_players/treb_current_12_tenure_reclosure_v2.py'
      - '.github/workflows/treb-current-12-tenure-reclosure-v2.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: treb-current-12-tenure-reclosure-v2
  cancel-in-progress: true

jobs:
  reclose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download controlling authoritative checkpoint and exact fact layers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for d in current consensus pbp old mid newer game currentcons resolution out; do mkdir -p "/tmp/$d"; done
          get(){
            local d="$1" id="$2"
            for a in 1 2 3 4; do
              rm -f "/tmp/${d}.zip"
              rm -rf "/tmp/${d:?}"/*
              if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "/tmp/${d}.zip" && unzip -tq "/tmp/${d}.zip" >/dev/null 2>&1; then
                unzip -q "/tmp/${d}.zip" -d "/tmp/${d}"; return 0
              fi
              sleep $((a*4))
            done
            echo "FAILED_ARTIFACT $d $id" >&2; return 1
          }
          get current 9275527991
          get consensus 9252786257
          get pbp 9258020958
          get old 9258644772
          get mid 9260106595
          get newer 9260439871
          get game 9262554900
          get currentcons 9263341092
          # Exact transaction+static-schedule evidence from the successful current-21 resolver run.
          get resolution 9385259872
      - name: Validate retained 12-tenure resolution evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, pathlib
          cands=list(pathlib.Path('/tmp/resolution').rglob('TREB_CURRENT_21_TRANSACTION_RESOLUTION.csv'))
          if len(cands)!=1:
              raise SystemExit(f'expected exactly one transaction resolution CSV, found {len(cands)}: {cands}')
          p=cands[0]
          rows=list(csv.DictReader(p.open(newline='', encoding='utf-8-sig')))
          exact=[r for r in rows if r.get('status')=='EXACT_TRANSACTION_SCHEDULE']
          if len(exact)!=12:
              raise SystemExit(f'expected exactly 12 EXACT_TRANSACTION_SCHEDULE rows, found {len(exact)}')
          keys=[]
          for r in exact:
              k=(r.get('season'), r.get('player_id'), r.get('team_id'))
              if None in k or '' in k:
                  raise SystemExit(f'missing exact-tenure key fields: {r}')
              keys.append(k)
          if len(set(keys))!=12:
              raise SystemExit('duplicate exact-tenure keys in retained resolution evidence')
          pathlib.Path('/tmp/RESOLUTION_PATH.txt').write_text(str(p))
          print('validated retained exact tenure resolution:', p)
          print('exact rows:', len(exact))
          PY
      - name: Reclose transaction-proven exact tenure identities with controlling-checkpoint priority
        shell: bash
        run: |
          set -uo pipefail
          RES="$(cat /tmp/RESOLUTION_PATH.txt)"
          python3 -u team_trb_all_players/treb_current_12_tenure_reclosure_v2.py \
            --current /tmp/current --consensus /tmp/consensus --pbp /tmp/pbp \
            --old /tmp/old --mid /tmp/mid --newer /tmp/newer --game /tmp/game \
            --currentcons /tmp/currentcons --resolution "$RES" --out /tmp/out \
            2>&1 | tee /tmp/out/RECLOSURE_ENGINE.log
          rc=${PIPESTATUS[0]}
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-current-12-tenure-reclosure-v2-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn
      - name: Persist reclosure summary and run status for autonomous handoff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEST='team_trb_all_players/treb_recovery_status/current_12_tenure_reclosure_v2'
          rm -rf "$DEST"; mkdir -p "$DEST"
          for f in /tmp/out/TREB_CURRENT_12_TENURE_RECLOSURE_QA.json /tmp/out/TREB_NEW_EXACT_PROMOTED.csv /tmp/out/TREB_CURRENT_12_TENURE_RECLOSURE_DIAGNOSTICS.csv /tmp/out/TREB_STALE_SOURCE_CONFLICTS_SHADOWED_BY_CONTROLLING_CHECKPOINT.csv /tmp/out/RECLOSURE_ENGINE.log; do [ -f "$f" ] && cp "$f" "$DEST/"; done
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "job_status=${{ job.status }}"
            echo "head_sha=${GITHUB_SHA}"
            echo "utc_finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "qa_present=$([ -f /tmp/out/TREB_CURRENT_12_TENURE_RECLOSURE_QA.json ] && echo true || echo false)"
          } > "$DEST/RUN_STATUS.txt"
          git config user.name 'TREB automation'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m 'Persist current 12-tenure reclosure v2 diagnostic result'
            git pull --rebase origin agent/treb-final-exact-assembly
            git push origin HEAD:agent/treb-final-exact-assembly
          fi
