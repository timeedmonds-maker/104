name: TREB WOWY exact-date Stage2 repair

on:
  push:
    branches: [treb-stage2-actions-live]
    paths:
      - '.github/workflows/treb-wowy-repair.yml'
      - 'team_trb_all_players/impact_database/corrected_off_wowy/trigger.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treb-wowy-exact-date-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out durable Stage2 branch
        uses: actions/checkout@v4
        with:
          ref: treb-stage2-actions-live
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install network dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Self-test WOWY repair collector
        run: python team_trb_all_players/wowy_repair_collector.py --self-test

      - name: Collect exact-date WOWY repair batch
        id: collect
        continue-on-error: true
        run: python team_trb_all_players/wowy_repair_collector.py --batch-size 25 --attempts 5 --interval 0.5

      - name: Show repair checkpoint
        if: always()
        run: |
          test -f team_trb_all_players/impact_database/corrected_off_wowy/wowy_collection_summary.json && cat team_trb_all_players/impact_database/corrected_off_wowy/wowy_collection_summary.json || true
          test -f team_trb_all_players/impact_database/corrected_off_wowy/wowy_bogut_date_proof.json && cat team_trb_all_players/impact_database/corrected_off_wowy/wowy_bogut_date_proof.json || true

      - name: Commit durable WOWY repair checkpoint and chain next batch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team_trb_all_players/impact_database/corrected_off_wowy
          if git diff --cached --quiet; then
            echo 'No WOWY repair changes to commit'
          else
            git commit -m 'Advance exact-date WOWY Stage2 repair [skip ci]'
            git pull --rebase origin treb-stage2-actions-live
            git push origin HEAD:treb-stage2-actions-live
          fi

      - name: Surface collector errors after preserving checkpoint
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'WOWY batch had errors; completed windows were preserved and the trigger checkpoint was advanced for automatic retry.'
          exit 1
