name: TREB final release dispatch

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-final-release-dispatch.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/333267224/dispatches" \
            -f ref='${{ github.ref_name }}'
