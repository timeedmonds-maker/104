# trigger: full-season tenure identity audit
name: TREB 949 full-season tenure identity

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-272-primitives-consolidate-only.yml

permissions:
  contents: read
  actions: read

env:
  RECLOSURE_ARTIFACT_ID: '9258703567'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - name: Download current residual diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/reclosure /tmp/out
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/${RECLOSURE_ARTIFACT_ID}/zip > /tmp/reclosure.zip
          unzip -q /tmp/reclosure.zip -d /tmp/reclosure
      - name: Prove exact full-season tenure identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,json,pathlib,collections
          R=pathlib.Path('/tmp/reclosure'); O=pathlib.Path('/tmp/out')
          diag=next(R.rglob('TREB_RECLOSURE_DIAGNOSTICS.csv'))
          blocked=[r for r in csv.DictReader(open(diag,newline='')) if r.get('status')=='NO_EXACT_TENURE_IDENTITY']
          assert len(blocked)==949,len(blocked)
          def pid(x): return str(x).strip().removesuffix('.0')
          def tid(x): return str(int(float(x)))
          def gid(x):
              s=str(x).strip().removesuffix('.0')
              try:return str(int(float(s))).zfill(10)
              except:return s.zfill(10)
          def key(r): return (str(r['season']),tid(r['team_id']),pid(r['player_id']))
          B={key(r):r for r in blocked}
          targets={}
          target_path=pathlib.Path('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz')
          with gzip.open(target_path,'rt',encoding='utf-8') as f:
              for line in f:
                  if not line.strip(): continue
                  r=json.loads(line); k=key(r)
                  if k in B: targets[k]=r
          assert len(targets)==949,len(targets)
          sched=collections.defaultdict(list)
          schedule_path=pathlib.Path('team_trb_all_players/impact_database/roster_tenure/regular_season_games.jsonl.gz')
          with gzip.open(schedule_path,'rt',encoding='utf-8') as f:
              for line in f:
                  if not line.strip(): continue
                  g=json.loads(line); season=str(g.get('season')); game=gid(g.get('game_id'))
                  for t in (g.get('home_team_id'),g.get('away_team_id')):
                      try:sched[(season,tid(t))].append(game)
                      except:pass
          rows=[]; exact=0; ambiguous=0
          for k in sorted(B):
              t=targets[k]
              expected=int(float(t.get('team_games_in_tenure') or 0))
              games=sorted(set(sched.get((k[0],k[1]),[])))
              season_total=len(games)
              if expected>0 and expected==season_total:
                  status='EXACT_FULL_SEASON_TENURE_IDENTITY'; exact+=1; ids='|'.join(games)
              else:
                  status='AMBIGUOUS_PARTIAL_TENURE'; ambiguous+=1; ids=''
              rows.append({'season':k[0],'team_id':k[1],'player_id':k[2],'status':status,'expected_team_games':expected,'team_regular_season_games':season_total,'exact_game_ids':ids})
          with open(O/'TREB_949_FULL_SEASON_TENURE_IDENTITY.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          qa={'status':'PASS','target_keys':949,'exact_full_season_tenure_identity':exact,'ambiguous_partial_tenure':ambiguous,'integrity':{'exact_schedule_only':True,'expected_games_equals_complete_team_schedule_required':True,'empirical_model_used':False,'rounded_percentage_backsolve_used':False,'promotion_performed':False},'next':'inject only exact full-season game lists into closure; leave partial-tenure rows blocked'}
          (O/'TREB_949_FULL_SEASON_TENURE_IDENTITY_QA.json').write_text(json.dumps(qa,indent=2,sort_keys=True)+'\n')
          print(json.dumps(qa,indent=2,sort_keys=True),flush=True)
          assert exact+ambiguous==949
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-949-full-season-tenure-identity-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
