name: TREB tenure repair proposals

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-tenure-repair-proposals.yml
      - team_trb_all_players/summarize_tenure_repair_evidence.py
      - team_trb_all_players/final_integrity_rebuild/TENURE_REPAIR_EVIDENCE.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - run: python -u team_trb_all_players/summarize_tenure_repair_evidence.py
      - name: Commit proposals durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          git add team_trb_all_players/final_integrity_rebuild/TENURE_REPAIR_PROPOSALS.json team_trb_all_players/final_integrity_rebuild/TENURE_REPAIR_PROPOSALS_SUMMARY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record targeted tenure repair proposals"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
