name: TREB Stage2 public Actions

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: treb-stage2-public-actions
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Legacy Stage2 collector retired. Solved-engine recovery is authoritative.'
