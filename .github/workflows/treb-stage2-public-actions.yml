name: TREB Stage2 public Actions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'team_trb_all_players/treb_stage2_public_actions_trigger.txt'

permissions:
  contents: write

concurrency:
  group: treb-stage2-public-actions
  cancel-in-progress: true

jobs:
  collect:
    name: Stage2 continuous durable collector
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Check out best durable Stage2 branch
        uses: actions/checkout@v4
        with:
          ref: treb-stage2-actions-live
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Restore successful endpoint cache
        uses: actions/cache@v4
        with:
          path: .treb_stage2_netcache_v4
          key: treb-stage2-netcache-v5-${{ github.run_id }}
          restore-keys: |
            treb-stage2-netcache-v5-
            treb-stage2-netcache-v4-

      - name: Confirm safe baseline and self-test collector
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json')
          d=json.loads(p.read_text())
          complete=int(d.get('complete_windows') or 0)
          remaining=int(d.get('remaining_windows') or 0)
          assert complete >= 10112, d
          assert int(d.get('impact_windows_total') or 0) == 15427, d
          print(f'BASELINE complete={complete} remaining={remaining}')
          PY
          python team_trb_all_players/run_corrected_off_batch_public_resilient.py --self-test

      - name: Continuously collect and checkpoint Stage2
        env:
          TREB_STAGE2_NET_CACHE: ${{ github.workspace }}/.treb_stage2_netcache_v4
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          started=$(date +%s)
          max_runtime=$((5*60*60+15*60))
          iteration=0

          while true; do
            iteration=$((iteration+1))

            read -r complete remaining total <<<"$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json').read_text())
          print(int(d.get('complete_windows') or 0), int(d.get('remaining_windows') or 0), int(d.get('impact_windows_total') or 0))
          PY
          )"

            echo "ITERATION=$iteration BASELINE=$complete/$total REMAINING=$remaining"
            if [ "$remaining" -eq 0 ]; then
              echo 'STAGE2_COLLECTION_COMPLETE=1'
              break
            fi

            before=$complete
            set +e
            python team_trb_all_players/run_corrected_off_batch_public_resilient.py \
              --batch-size 50 \
              --workers 1 \
              --request-interval 1.0
            collector_rc=$?
            set -e

            python - "$iteration" "$before" "$collector_rc" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          iteration=int(sys.argv[1]); before=int(sys.argv[2]); rc=int(sys.argv[3])
          src=Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json')
          d=json.loads(src.read_text())
          status={
            'generated_utc': datetime.now(timezone.utc).isoformat(),
            'runner': 'ubuntu-latest',
            'workflow': 'TREB Stage2 continuous durable collector',
            'run_id': os.environ.get('GITHUB_RUN_ID'),
            'iteration': iteration,
            'complete_windows': int(d.get('complete_windows') or 0),
            'remaining_windows': int(d.get('remaining_windows') or 0),
            'added_this_iteration': int(d.get('complete_windows') or 0)-before,
            'collector_rc': rc,
            'batch_successes': int(d.get('batch_successes') or 0),
            'batch_requested': int(d.get('batch_requested') or 0),
            'selection_mode': d.get('selection_mode'),
            'batch_elapsed_seconds': d.get('batch_elapsed_seconds'),
            'transient_http_failure_rate': d.get('transient_http_failure_rate'),
            'network_counters': d.get('network_counters'),
            'all_complete': bool(d.get('all_complete')),
          }
          out=Path('team_trb_all_players/impact_database/actions_stage2_status.json')
          out.write_text(json.dumps(status,indent=2),encoding='utf-8')
          print(json.dumps(status,indent=2))
          PY

            git add team_trb_all_players/impact_database/corrected_off \
                    team_trb_all_players/impact_database/actions_stage2_status.json
            if ! git diff --cached --quiet; then
              git commit -m "TREB continuous Stage2 iteration $iteration [skip ci]"
              git pull --rebase origin treb-stage2-actions-live
              git push origin HEAD:treb-stage2-actions-live
            fi

            after=$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json').read_text())
          print(int(d.get('complete_windows') or 0))
          PY
          )

            if [ "$after" -le "$before" ]; then
              echo "NO_PROGRESS iteration=$iteration before=$before after=$after rc=$collector_rc"
              sleep 15
            fi

            elapsed=$(( $(date +%s) - started ))
            if [ "$elapsed" -ge "$max_runtime" ]; then
              echo "RUNNER_HANDOFF_REQUIRED=1 elapsed_seconds=$elapsed"
              break
            fi
          done

      - name: Final collection status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json').read_text())
          print(json.dumps({
            'complete_windows': d.get('complete_windows'),
            'impact_windows_total': d.get('impact_windows_total'),
            'remaining_windows': d.get('remaining_windows'),
            'failed_windows': d.get('failed_windows'),
            'all_complete': d.get('all_complete')
          }, indent=2))
          PY

  finalize:
    name: Final database + @funakistats publication pack
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out final Stage2 state
        uses: actions/checkout@v4
        with:
          ref: treb-stage2-actions-live
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate finalization
        id: gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json').read_text())
          ready=bool(d.get('all_complete')) and int(d.get('remaining_windows') or 0)==0 and int(d.get('failed_windows') or 0)==0
          with open(os.environ['GITHUB_OUTPUT'],'a') as h:
              h.write(f'ready={str(ready).lower()}\n')
          print('FINALIZE_READY=',ready,'complete=',d.get('complete_windows'),'remaining=',d.get('remaining_windows'))
          PY

      - name: Install final database and visualization dependencies
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow duckdb matplotlib pillow requests

      - name: Self-test finalization and publication tooling
        if: steps.gate.outputs.ready == 'true'
        run: |
          python team_trb_all_players/finalize_corrected_off_package_extended.py --self-test
          python team_trb_all_players/build_funakistats_visual_pack.py --self-test
          python team_trb_all_players/funakistats_headshots.py --self-test
          python team_trb_all_players/funakistats_publication_provenance.py --self-test
          python team_trb_all_players/finalize_funakistats_visual_pack.py --self-test

      - name: Build and validate final corrected database
        if: steps.gate.outputs.ready == 'true'
        run: |
          python team_trb_all_players/finalize_corrected_off_package_extended.py
          test -s team_trb_all_players/impact_database/corrected_off/TREB_corrected_off_final.zip
          test -s team_trb_all_players/impact_database/corrected_off/final_export/career_total_rebound_pct.parquet
          test -s team_trb_all_players/impact_database/corrected_off/final_export/player_season_total_rebound_pct.parquet
          echo TREB_FINAL_DATABASE_READY=1

      - name: Build agreed @funakistats visualization and ranking pack
        if: steps.gate.outputs.ready == 'true'
        run: |
          python team_trb_all_players/build_funakistats_visual_pack.py --minutes-threshold 10000 --label-count 20
          test -s team_trb_all_players/impact_database/corrected_off/visual_pack/treb_career_impact_best_only_square.png
          test -s team_trb_all_players/impact_database/corrected_off/visual_pack/treb_career_impact_full_profile_portrait.png
          test -s team_trb_all_players/impact_database/corrected_off/visual_pack/rankings/all_metrics_top20_corrected_swing.csv.gz

      - name: Apply publication provenance guard to every X-ready PNG
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          root='team_trb_all_players/impact_database/corrected_off/visual_pack'
          for stem in treb_career_impact_best_only_square treb_career_impact_best_only_portrait treb_career_impact_full_profile_square treb_career_impact_full_profile_portrait; do
            python team_trb_all_players/funakistats_publication_provenance.py --png "$root/$stem.png" --manifest "$root/${stem}_publication_provenance.json"
          done
          python team_trb_all_players/finalize_funakistats_visual_pack.py
          test -s "$root/X_READY"
          test -s team_trb_all_players/impact_database/corrected_off/project_completion_status.json
          echo FUNAKISTATS_X_READY=1

      - name: Upload complete final database and visualization artifact
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TREB-final-database-and-funakistats-visuals
          retention-days: 90
          compression-level: 0
          path: |
            team_trb_all_players/impact_database/corrected_off/TREB_corrected_off_final.zip
            team_trb_all_players/impact_database/corrected_off/final_export
            team_trb_all_players/impact_database/corrected_off/visual_pack
            team_trb_all_players/impact_database/corrected_off/project_completion_status.json

      - name: Commit durable final outputs and completion status
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team_trb_all_players/impact_database/corrected_off
          while IFS= read -r -d '' f; do
            echo "Leaving >90MB file in Actions artifact rather than Git: $f"
            git reset -- "$f"
          done < <(find team_trb_all_players/impact_database/corrected_off -type f -size +90M -print0)
          if ! git diff --cached --quiet; then
            git commit -m 'Complete TREB database and @funakistats publication pack [skip ci]'
            git pull --rebase origin treb-stage2-actions-live
            git push origin HEAD:treb-stage2-actions-live
          fi
