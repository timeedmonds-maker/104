name: TREB Stage2 public Actions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'team_trb_all_players/treb_stage2_public_actions_trigger.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: treb-stage2-public-actions
  cancel-in-progress: true

jobs:
  collect:
    name: WOWY exact-date partial-tenure repair
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Check out durable Stage2 branch
        uses: actions/checkout@v4
        with:
          ref: treb-stage2-actions-live
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repair dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Confirm invalid old partial method and self-test WOWY repair
        run: |
          python team_trb_all_players/wowy_repair_collector.py --self-test
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          old=Path('team_trb_all_players/impact_database/corrected_off/cache')
          files=list(old.glob('*.json.gz'))
          assert len(files)==5726, len(files)
          print(f'WOWY_REPAIR_TARGETS={len(files)}')
          print('OLD_PARTIAL_GET_ON_OFF_DATE_FILTER_INVALID=1')
          PY

      - name: Continuously repair exact-date partial tenures and checkpoint
        env:
          TREB_WOWY_REPAIR: '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          started=$(date +%s)
          max_runtime=$((5*60*60+15*60))
          iteration=0

          while true; do
            iteration=$((iteration+1))
            before=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/corrected_off_wowy/wowy_collection_summary.json')
          if p.exists():
              d=json.loads(p.read_text()); print(int(d.get('complete_windows') or 0))
          else:
              print(0)
          PY
          )
            echo "WOWY_ITERATION=$iteration BEFORE=$before"

            set +e
            python team_trb_all_players/wowy_repair_collector.py --batch-size 25 --attempts 5 --interval 0.5
            collector_rc=$?
            set -e

            cat team_trb_all_players/impact_database/corrected_off_wowy/wowy_collection_summary.json
            if [ -f team_trb_all_players/impact_database/corrected_off_wowy/wowy_bogut_date_proof.json ]; then
              echo '--- BOGUT EXACT-DATE PROOF ---'
              cat team_trb_all_players/impact_database/corrected_off_wowy/wowy_bogut_date_proof.json
            fi

            git add team_trb_all_players/impact_database/corrected_off_wowy
            if ! git diff --cached --quiet; then
              git commit -m "TREB WOWY exact-date repair iteration $iteration [skip ci]"
              git pull --rebase origin treb-stage2-actions-live
              git push origin HEAD:treb-stage2-actions-live
            fi

            read -r complete remaining errors <<<"$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/corrected_off_wowy/wowy_collection_summary.json').read_text())
          print(int(d.get('complete_windows') or 0), int(d.get('remaining_windows') or 0), int(d.get('batch_errors') or 0))
          PY
          )"
            echo "WOWY_CHECKPOINT complete=$complete/5726 remaining=$remaining batch_errors=$errors rc=$collector_rc"

            if [ "$remaining" -eq 0 ]; then
              echo 'WOWY_PARTIAL_REPAIR_COMPLETE=1'
              break
            fi

            after=$complete
            if [ "$after" -le "$before" ]; then
              echo "WOWY_NO_PROGRESS before=$before after=$after rc=$collector_rc"
              sleep 20
            fi

            elapsed=$(( $(date +%s) - started ))
            if [ "$elapsed" -ge "$max_runtime" ]; then
              echo "WOWY_RUNNER_HANDOFF_REQUIRED=1 elapsed_seconds=$elapsed remaining=$remaining"
              break
            fi
          done

      - name: Final repair status
        id: status
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/corrected_off_wowy/wowy_collection_summary.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          print(json.dumps(d,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('complete='+('true' if d.get('all_complete') else 'false')+'\n')
              f.write('remaining='+str(int(d.get('remaining_windows') or 5726))+'\n')
          PY

      - name: Self-dispatch continuation if repair remains
        if: steps.status.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ steps.status.outputs.remaining }} WOWY windows remain; dispatching continuation."
          gh workflow run treb-stage2-public-actions.yml --ref main

      - name: Mark repair complete for downstream finalizer
        if: steps.status.outputs.complete == 'true'
        run: |
          echo 'All exact-date WOWY partial tenures collected and validated.'
          echo 'TREB_WOWY_REPAIR_READY_FOR_FINALIZATION=1'
