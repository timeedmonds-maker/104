name: TREB endpoint lineup diagnostic

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths: [.github/workflows/treb-endpoint-lineup-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  MANIFEST: team_trb_all_players/final_integrity_rebuild/rebound_forensics/CHUNKED_REBOUND_MANIFEST.json
  V4TAIL: team_trb_all_players/final_integrity_rebuild/rebound_forensics/V4_REBOUND_TAIL_SUMMARY.json
  SOURCE_RUN_ID: '31634201123'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path(os.environ['MANIFEST']).read_text())
          assert len(m['chunks'])==24 and m['target_games']==58 and m['target_unmatched_rows']==110
          matrix={'include':[{'chunk_id':c['chunk_id'],'year':int(c['year']),'games':','.join(map(str,c['game_ids']))} for c in m['chunks']]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
          PY

  diagnose:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy rapidfuzz
      - uses: actions/download-artifact@v4
        with:
          name: treb-residual-source-${{ matrix.year }}-${{ env.SOURCE_RUN_ID }}
          path: /tmp/source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Validate endpoint-lineup and real-status rules
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          GAMES: ${{ matrix.games }}
          CHUNK_ID: ${{ matrix.chunk_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import local_treb_rebuild as core
          import production_rebound_v4 as rebound
          import production_treb_engine_v3 as lineup_engine
          import run_local_treb_production as io

          y=int(os.environ['YEAR']); ids=[int(x) for x in os.environ['GAMES'].split(',') if x]
          nba=io.normalize_nba(pd.read_csv(f'/tmp/source/nbastats_{y}.csv',low_memory=False)); v3=lineup_engine.normalize_v3(pd.read_csv(f'/tmp/source/nbastatsv3_{y}.csv',low_memory=False)); pbp=io.normalize_pbp(pd.read_csv(f'/tmp/source/pbpstats_{y}.csv',low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}; vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}; pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}

          def pbp_rows(p):
              x=p.copy(); x['PREV_PBP_DESCRIPTION']=x.groupby(core.POSSESSION_ID,dropna=False).DESCRIPTION.shift(1)
              r=x[x.DESCRIPTION.fillna('').str.contains('rebound',case=False)].copy()
              r['END_ELAPSED']=[core.elapsed_seconds(int(period),clock) for period,clock in zip(r.PERIOD,r.ENDTIME)]
              return r

          def endpoint_lineup(events,period,t,exclude_index=None,radius=5):
              ev=events[events.PERIOD.eq(period)].sort_values(['ELAPSED','EVENTNUM'],kind='stable')
              if exclude_index is not None: ev=ev[ev.index!=exclude_index]
              # Clock/source drift guard: any substitution within +/- radius makes endpoint attribution unsafe.
              near=ev[ev.ELAPSED.ge(t-radius)&ev.ELAPSED.le(t+radius)]
              if bool(near.EVENTMSGTYPE.eq(8).any()): return None,'near_substitution'
              before=ev[ev.ELAPSED.le(t)]
              after=ev[ev.ELAPSED.ge(t)]
              if before.empty or after.empty: return None,'missing_bracket'
              a=before.iloc[-1]; b=after.iloc[0]
              la=tuple(int(x) for x in a.LINEUP); lb=tuple(int(x) for x in b.LINEUP)
              if la!=lb: return None,'bracket_lineup_disagreement'
              return la,'bracket_agreement_no_near_sub'

          ft_re=re.compile(r'Free Throw (?:1 of [23]|2 of 3)|Technical Free Throw|Flagrant Free Throw',re.I)
          def generic_pbp_live(row):
              desc=str(row.DESCRIPTION); prev='' if pd.isna(row.PREV_PBP_DESCRIPTION) else str(row.PREV_PBP_DESCRIPTION)
              generic=re.search(r'\(Off:',desc,re.I) is None
              if not generic:return None
              nonlive=(bool(ft_re.search(prev)) or bool(re.search(r'Turnover|Violation',prev,re.I)) or str(row.ENDTIME)=='00:00' or str(row.STARTTIME)==str(row.ENDTIME))
              return not nonlive

          controls={'endpoint_applicable':0,'endpoint_correct':0,'endpoint_wrong':0,'player_real_applicable':0,'player_real_correct':0,'player_real_wrong':0,'generic_live_applicable':0,'generic_live_correct':0,'generic_live_wrong':0}
          residual=[]
          for gid in ids:
              lu=lineup_engine.reconstruct_game_lineups(ng[gid],vg[gid]); joined,audit=rebound.join_pbp_rebounds(lu,pg[gid]); rows=pbp_rows(pg[gid]); events=lu.events
              # Leave-one-out controls on genuine NBA-indexed joined rows only.
              for idx,j in joined.iterrows():
                  if pd.isna(j.NBA_INDEX) or idx not in rows.index: continue
                  ni=int(j.NBA_INDEX); row=rows.loc[idx]; t=int(row.END_ELAPSED); period=int(row.PERIOD)
                  pred,reason=endpoint_lineup(events,period,t,exclude_index=ni,radius=5)
                  if pred is not None:
                      controls['endpoint_applicable']+=1
                      actual=tuple(int(x) for x in events.loc[ni,'LINEUP'])
                      if pred==actual: controls['endpoint_correct']+=1
                      else: controls['endpoint_wrong']+=1
                  player=bool(re.search(r'\(Off:\d+ Def:\d+\)',str(row.DESCRIPTION),re.I))
                  actual_real=bool(core._nba_real_rebound(events,ni))
                  if player:
                      controls['player_real_applicable']+=1
                      if actual_real: controls['player_real_correct']+=1
                      else: controls['player_real_wrong']+=1
                  live=generic_pbp_live(row)
                  if live is True:
                      controls['generic_live_applicable']+=1
                      if actual_real: controls['generic_live_correct']+=1
                      else: controls['generic_live_wrong']+=1
              # Current v4 unmatched rows.
              for idx,row in rows.iterrows():
                  if idx in joined.index: continue
                  t=int(row.END_ELAPSED); period=int(row.PERIOD); pred,reason=endpoint_lineup(events,period,t,exclude_index=None,radius=5)
                  player=bool(re.search(r'\(Off:\d+ Def:\d+\)',str(row.DESCRIPTION),re.I))
                  generic_live=generic_pbp_live(row)
                  residual.append({'game_id':gid,'pbp_index':int(idx),'period':period,'start_time':str(row.STARTTIME),'end_time':str(row.ENDTIME),'description':str(row.DESCRIPTION),'endpoint_lineup':list(pred) if pred is not None else None,'endpoint_reason':reason,'player_credited':player,'generic_pbp_live':generic_live})
          out={'chunk_id':os.environ['CHUNK_ID'],'year':y,'controls':controls,'residual_rows':residual}
          Path('/tmp').joinpath('ENDPOINT_'+os.environ['CHUNK_ID']+'.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({'chunk_id':out['chunk_id'],'year':y,'controls':controls,'residual_rows':len(residual)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: treb-endpoint-${{ matrix.chunk_id }}-${{ github.run_id }}
          path: /tmp/ENDPOINT_${{ matrix.chunk_id }}.json
          retention-days: 90

  aggregate:
    needs: [plan, diagnose]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-endpoint-*-${{ github.run_id }}
          path: /tmp/results
      - name: Aggregate controls and current residual repairability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          chunks=[json.loads(p.read_text()) for p in sorted(Path('/tmp/results').rglob('ENDPOINT_*.json'))]
          assert len(chunks)==24,len(chunks)
          keys=['endpoint_applicable','endpoint_correct','endpoint_wrong','player_real_applicable','player_real_correct','player_real_wrong','generic_live_applicable','generic_live_correct','generic_live_wrong']
          controls={k:sum(int(c['controls'][k]) for c in chunks) for k in keys}
          residual=[r for c in chunks for r in c['residual_rows']]
          # v4 has 77 current rows; the 33 v4-promoted rows are no longer unmatched in this live join.
          assert len(residual)==77,len(residual)
          endpoint_safe=controls['endpoint_applicable']>0 and controls['endpoint_wrong']==0
          player_real_safe=controls['player_real_applicable']>0 and controls['player_real_wrong']==0
          generic_live_safe=controls['generic_live_applicable']>0 and controls['generic_live_wrong']==0
          candidates=[]
          for r in residual:
              real_forced=(r['player_credited'] and player_real_safe) or (r['generic_pbp_live'] is True and generic_live_safe)
              if r['endpoint_lineup'] is not None and endpoint_safe and real_forced:
                  x=dict(r); x['real']=True; x['method']='endpoint_bracket_lineup_no_sub_5s_plus_forced_real'; candidates.append(x)
          bygame={}
          for r in residual: bygame.setdefault(int(r['game_id']),[]).append(r)
          candkeys={(int(r['game_id']),int(r['pbp_index'])) for r in candidates}
          fully=[]
          for gid,rows in bygame.items():
              if all((gid,int(r['pbp_index'])) in candkeys for r in rows): fully.append(gid)
          out={'status':'COMPLETE','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'controls':controls,'endpoint_rule_safe':endpoint_safe,'player_real_rule_safe':player_real_safe,'generic_live_rule_safe':generic_live_safe,'current_residual_rows':77,'repairable_rows':len(candidates),'fully_repairable_games':len(fully),'fully_repairable_game_ids':sorted(fully),'repair_candidates':candidates,'residual_rows':residual}
          Path('/tmp/ENDPOINT_LINEUP_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k not in {'repair_candidates','residual_rows'}},indent=2))
          PY
      - name: Persist durable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-batched-game-facts-20260812; git reset --hard origin/agent/treb-batched-game-facts-20260812
          D=team_trb_all_players/final_integrity_rebuild/rebound_forensics; cp /tmp/ENDPOINT_LINEUP_SUMMARY.json "$D/"
          git add -f "$D/ENDPOINT_LINEUP_SUMMARY.json"
          if ! git diff --cached --quiet; then git commit -m 'Persist endpoint-lineup rebound diagnostic'; git push origin HEAD:agent/treb-batched-game-facts-20260812; fi
      - uses: actions/upload-artifact@v4
        with:
          name: treb-endpoint-lineup-summary-${{ github.run_id }}
          path: /tmp/ENDPOINT_LINEUP_SUMMARY.json
          retention-days: 90
