name: TREB PBPStats game-lineup metric probe

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-pbpstats-game-lineup-probe.yml
      - team_trb_all_players/probe_pbpstats_game_lineup.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Probe game-level lineup/player stat schemas
        run: |
          python -u team_trb_all_players/probe_pbpstats_game_lineup.py \
            --game-id 0021600358 \
            --output /tmp/PBPSTATS_GAME_LINEUP_PROBE.json
      - name: Commit probe durably
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          if [ -s /tmp/PBPSTATS_GAME_LINEUP_PROBE.json ]; then
            cp /tmp/PBPSTATS_GAME_LINEUP_PROBE.json team_trb_all_players/final_integrity_rebuild/PBPSTATS_GAME_LINEUP_PROBE.json
            git add team_trb_all_players/final_integrity_rebuild/PBPSTATS_GAME_LINEUP_PROBE.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record PBPStats game-level lineup metric probe"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
