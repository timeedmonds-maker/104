name: TREB PBPStats game-lineup metric probe

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-pbpstats-game-lineup-probe.yml
      - team_trb_all_players/probe_pbpstats_game_lineup.py
      - team_trb_all_players/summarize_pbpstats_game_lineup_probe.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Probe game-level lineup/player stat schemas
        run: |
          python -u team_trb_all_players/probe_pbpstats_game_lineup.py \
            --game-id 0021600358 \
            --output team_trb_all_players/final_integrity_rebuild/PBPSTATS_GAME_LINEUP_PROBE.json
      - name: Summarize raw schema
        run: python -u team_trb_all_players/summarize_pbpstats_game_lineup_probe.py
      - name: Preserve generated outputs outside checkout
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/treb-probe-save
          cp team_trb_all_players/final_integrity_rebuild/PBPSTATS_GAME_LINEUP_PROBE.json /tmp/treb-probe-save/ 2>/dev/null || true
          cp team_trb_all_players/final_integrity_rebuild/PBPSTATS_GAME_LINEUP_SCHEMA_SUMMARY.json /tmp/treb-probe-save/ 2>/dev/null || true
      - name: Commit probe durably without concurrent-branch loss
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/treb-final-integrity-rebuild-20260812
          git reset --hard origin/agent/treb-final-integrity-rebuild-20260812
          mkdir -p team_trb_all_players/final_integrity_rebuild
          cp /tmp/treb-probe-save/PBPSTATS_GAME_LINEUP_PROBE.json team_trb_all_players/final_integrity_rebuild/ 2>/dev/null || true
          cp /tmp/treb-probe-save/PBPSTATS_GAME_LINEUP_SCHEMA_SUMMARY.json team_trb_all_players/final_integrity_rebuild/ 2>/dev/null || true
          git add team_trb_all_players/final_integrity_rebuild/PBPSTATS_GAME_LINEUP_PROBE.json team_trb_all_players/final_integrity_rebuild/PBPSTATS_GAME_LINEUP_SCHEMA_SUMMARY.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record PBPStats game-level lineup metric probe"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/treb-final-integrity-rebuild-20260812; then exit 0; fi
            git fetch origin agent/treb-final-integrity-rebuild-20260812
            git rebase origin/agent/treb-final-integrity-rebuild-20260812
          done
          exit 1
