name: TREB 21600270 independent-minute gate

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - team_trb_all_players/final_integrity_rebuild/GAME_21600270_MINUTE_GATE_CONTROL.json

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Download 2016-17 historical sources
        shell: bash
        run: |
          set -euo pipefail
          RAW=/tmp/trebraw-2016; mkdir -p "$RAW"
          python - <<'PY'
          import subprocess, tarfile, urllib.request
          from pathlib import Path
          year=2016; raw=Path('/tmp/trebraw-2016')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in [f'nbastats_{year}',f'nbastatsv3_{year}',f'pbpstats_{year}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Download independent CC0 PlayerStatistics source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cc0
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            -o /tmp/cc0/dataset.zip \
            'https://www.kaggle.com/api/v1/datasets/download/eoinamoore/historical-nba-data-and-player-box-scores'
          unzip -j /tmp/cc0/dataset.zip 'PlayerStatistics.csv' -d /tmp/cc0 || \
          unzip -j /tmp/cc0/dataset.zip '*/PlayerStatistics.csv' -d /tmp/cc0
          test -s /tmp/cc0/PlayerStatistics.csv
      - name: Resolve ambiguity and rerun locked Adams regression
        shell: bash
        run: |
          set -euo pipefail
          NBA=$(find /tmp/trebraw-2016 -name 'nbastats_2016.csv' -print -quit)
          V3=$(find /tmp/trebraw-2016 -name 'nbastatsv3_2016.csv' -print -quit)
          PBP=$(find /tmp/trebraw-2016 -name 'pbpstats_2016.csv' -print -quit)
          NBA="$NBA" V3="$V3" PBP="$PBP" CC0=/tmp/cc0/PlayerStatistics.csv python - <<'PY'
          import json, math, os, sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import production_treb_engine_v3 as engine
          import canary_v3_lineup_repair as ambiguity
          import resolve_ambiguous_lineups_from_minutes as minute_gate
          import build_exact_game_fact_layer as base

          GID=21600270; ADAMS=203500; OKC=1610612760
          nba=io.normalize_nba(pd.read_csv(os.environ['NBA'],low_memory=False))
          v3=engine.normalize_v3(pd.read_csv(os.environ['V3'],low_memory=False))
          pbp=io.normalize_pbp(pd.read_csv(os.environ['PBP'],low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}
          vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}
          pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}

          cc0=pd.read_csv(os.environ['CC0'],low_memory=False)
          cc0_gid=pd.to_numeric(cc0['gameId'],errors='coerce')
          cc0_pid=pd.to_numeric(cc0['personId'],errors='coerce')
          cc0_team=pd.to_numeric(cc0['playerteamId'],errors='coerce')
          cc0_min=pd.to_numeric(cc0['numMinutes'],errors='coerce')

          def official_for_game(gid):
              mask=cc0_gid.eq(gid) & cc0_pid.notna()
              official={}
              for idx in cc0.index[mask]:
                  pid=int(cc0_pid.loc[idx]); raw=cc0_min.loc[idx]
                  blank=bool(pd.isna(raw))
                  official[pid]={
                      'source_minutes':0.0 if blank else float(raw),
                      'source_blank_dnp':blank,
                      'player':f"{str(cc0.at[idx,'firstName'] or '').strip()} {str(cc0.at[idx,'lastName'] or '').strip()}".strip(),
                      'team_id':None if pd.isna(cc0_team.loc[idx]) else int(cc0_team.loc[idx]),
                  }
              return official

          # Validate the independent minute semantics on already-passing games from this season.
          baseline=[]
          for gid in sorted(set(ng)&set(vg)):
              if gid==GID: continue
              try:
                  lu=engine.reconstruct_game_lineups(ng[gid],vg[gid])
              except Exception:
                  continue
              official=official_for_game(gid)
              if not official: continue
              score=minute_gate.score_seconds({str(pid):sec for pid,sec in lu.seconds.items()},official)
              baseline.append({'game_id':gid,'gate_pass':score['gate_pass'],'violations':score['minute_rule_violations'],'missing_source_active':score['missing_source_active_players']})
              if len(baseline)>=20: break

          search=ambiguity.search_full_game_repairs(ng[GID],vg[GID],GID)
          official=official_for_game(GID)
          scored=[]
          for i,solution in enumerate(search.get('full_game_solutions',[]),1):
              score=minute_gate.score_seconds(solution.get('player_seconds',{}),official)
              scored.append({'solution_index':i,'repair_choices':solution.get('repair_choices',[]),'score':score})
          passing=[x for x in scored if x['score']['gate_pass']]
          unique=passing[0] if len(passing)==1 else None

          game_validation=None; adams=None
          repair_map=engine.legacy.core.STARTER_REPAIRS
          previous={}
          if unique is not None:
              for choice in unique['repair_choices']:
                  key=(int(choice['game_id']),int(choice['period']),int(choice['team_id']))
                  previous[key]=repair_map.get(key)
                  repair_map[key]=[int(x) for x in choice['starters']]
              try:
                  tr,pr,a=base.build_game(GID,ng[GID],vg[GID],pg[GID])
                  game_validation={'status':'PASS','team_rows':len(tr),'player_rows':len(pr),'unmatched_rebounds':int(a['join_audit'].get('unmatched_rebound_bearing_rows',0))}

                  gids=[]
                  for gid,g in ng.items():
                      cols=[c for c in ('PLAYER1_ID','PLAYER2_ID','PLAYER3_ID') if c in g.columns]
                      if any(pd.to_numeric(g[c],errors='coerce').eq(ADAMS).any() for c in cols): gids.append(gid)
                  sums={'team_oreb_on':0,'team_dreb_on':0,'opponent_oreb_on':0,'opponent_dreb_on':0,'seconds_on':0,'okc_oreb_universe':0}
                  failures=[]; successes=0
                  for gid in sorted(gids):
                      try:
                          tr,pr,a=base.build_game(gid,ng[gid],vg[gid],pg[gid]); successes+=1
                          for r in tr:
                              if r['team_id']==OKC: sums['okc_oreb_universe']+=int(r['team_oreb'])
                          for r in pr:
                              if r['player_id']==ADAMS and r['team_id']==OKC:
                                  for k in ('team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on','seconds_on'): sums[k]+=int(r[k])
                      except Exception as exc:
                          failures.append({'game_id':gid,'error':f'{type(exc).__name__}: {exc}'})
                  sums['team_rebounds_on']=sums['team_oreb_on']+sums['team_dreb_on']
                  sums['opponent_rebounds_on']=sums['opponent_oreb_on']+sums['opponent_dreb_on']
                  expected={'team_oreb_on':816,'team_dreb_on':1846,'team_rebounds_on':2662,'opponent_oreb_on':643,'opponent_dreb_on':1632,'opponent_rebounds_on':2275,'seconds_on':143368,'okc_oreb_universe':1277}
                  matches={k:sums[k]==v for k,v in expected.items()}
                  adams={'games':len(gids),'successful_games':successes,'failures':failures,'observed':sums,'expected':expected,'matches':matches,'status':'PASS' if not failures and all(matches.values()) else 'FAIL'}
              except Exception as exc:
                  game_validation={'status':'FAIL','error':f'{type(exc).__name__}: {exc}'}
              finally:
                  for key,value in previous.items():
                      if value is None: repair_map.pop(key,None)
                      else: repair_map[key]=value

          payload={
              'game_id':GID,
              'baseline_games_checked':len(baseline),
              'baseline_gate_passes':sum(x['gate_pass'] for x in baseline),
              'baseline_gate_failures':sum(not x['gate_pass'] for x in baseline),
              'search_complete':search.get('search_complete'),
              'states_explored':search.get('states_explored'),
              'full_game_solution_count':search.get('full_game_solution_count'),
              'minute_gate_passing_solution_count':len(passing),
              'unique_recommended_repair':None if unique is None else unique['repair_choices'],
              'game_validation':game_validation,
              'adams_regression':adams,
              'ranked_solutions':scored,
          }
          if len(baseline)>=10 and all(x['gate_pass'] for x in baseline) and unique is not None and game_validation and game_validation.get('status')=='PASS':
              payload['status']='UNIQUE_MINUTE_VALIDATED_REPAIR'
          else:
              payload['status']='NOT_AUTO_RESOLVED'
          Path('/tmp/GAME_21600270_MINUTE_GATE.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps({k:v for k,v in payload.items() if k!='ranked_solutions'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-21600270-minute-gate
          path: /tmp/GAME_21600270_MINUTE_GATE.json
          retention-days: 90
          if-no-files-found: error
