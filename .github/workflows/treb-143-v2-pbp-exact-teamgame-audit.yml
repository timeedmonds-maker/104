name: TREB 143 V2+PBP exact team-game audit

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-143-v2-pbp-exact-teamgame-audit.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: treb-143-v2-pbp-exact-teamgame-audit
  cancel-in-progress: false

jobs:
  audit:
    name: exact team-game ${{ matrix.year }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        year: [2001,2003,2004,2005,2009,2012,2015,2017,2018,2019,2020,2022,2023,2024]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1

      - name: Install exact reconstruction dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz

      - name: Download authoritative residual diagnostics and retained exact controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          y='${{ matrix.year }}'
          mkdir -p /tmp/state /tmp/control /tmp/src /tmp/out
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9255627136/zip > /tmp/state.zip
          unzip -q /tmp/state.zip -d /tmp/state
          aid=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31854913173/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name==\"TREB-fullcore-exact-${y}-31854913173\") | .id")
          test -n "$aid"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" > /tmp/control.zip
          unzip -q /tmp/control.zip -d /tmp/control

      - name: Download retained NBA Stats and PBP Stats season feeds
        shell: bash
        run: |
          set -euo pipefail
          y='${{ matrix.year }}'
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 2 \
            --output /tmp/list_data.txt \
            https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          python - "$y" <<'PY' > /tmp/urls.tsv
          import sys
          y=sys.argv[1]; vals={}
          for line in open('/tmp/list_data.txt',encoding='utf-8'):
              if '=' in line:
                  k,v=line.split('=',1); vals[k.strip()]=v.strip()
          for prefix in ('nbastats','pbpstats'):
              key=f'{prefix}_{y}'
              if key not in vals: raise SystemExit(f'MISSING_SOURCE_URL {key}')
              print(prefix,vals[key],sep='\t')
          PY
          while IFS=$'\t' read -r prefix url; do
            arc="/tmp/src/${prefix}_${y}.tar.xz"
            curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
              --output "$arc" "$url"
            tar -xJf "$arc" -C /tmp/src
          done < /tmp/urls.tsv
          test -s "/tmp/src/nbastats_${y}.csv"
          test -s "/tmp/src/pbpstats_${y}.csv"

      - name: Reconstruct target team-game counts and validate against retained exact controls
        shell: bash
        run: |
          set -euo pipefail
          y='${{ matrix.year }}'
          python - "$y" <<'PY'
          import csv,json,pathlib,sys,collections
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import production_treb_engine as eng
          import local_treb_rebuild as core
          import build_exact_game_fact_layer as exact

          year=int(sys.argv[1]); season=f'{year}-{(year+1)%100:02d}'
          STATE=pathlib.Path('/tmp/state'); CTRL=pathlib.Path('/tmp/control'); OUT=pathlib.Path('/tmp/out')
          diag=next(STATE.rglob('TREB_ZERO_SECOND_DIAGNOSTICS.csv'))
          targets={}; keysets=collections.defaultdict(set)
          with open(diag,newline='') as f:
            for r in csv.DictReader(f):
              if r.get('source')!='v3_roster_ledger' or str(r.get('season'))!=season: continue
              try:e=json.loads(r.get('error') or '{}')
              except:continue
              tid=int(float(r['team_id'])); pid=str(r['player_id']).removesuffix('.0')
              for rawgid in e.get('missing_team',[]):
                gid=int(float(rawgid)); targets[(tid,gid)]={'season':season,'team_id':tid,'game_id':gid}; keysets[(tid,gid)].add(pid)
          if not targets:
            raise SystemExit(f'NO_TARGETS {season}')
          for k,v in targets.items(): v['affected_player_keys']=len(keysets[k])

          nba=io.normalize_nba(pd.read_csv(f'/tmp/src/nbastats_{year}.csv',low_memory=False))
          pbp=io.normalize_pbp(pd.read_csv(f'/tmp/src/pbpstats_{year}.csv',low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}
          pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}

          def team_counts(gid):
            if gid not in ng or gid not in pg:
              return None,{'status':'SOURCE_GAME_MISSING','nba_present':gid in ng,'pbp_present':gid in pg}
            nba_game=ng[gid]; pbp_game=pg[gid]
            try:
              lineups=eng.reconstruct_game_lineups(nba_game)
              joined,audit=eng.join_pbp_rebounds(lineups,pbp_game)
              if int(audit.get('unmatched_rebound_bearing_rows',0))!=0:
                return None,{'status':'UNMATCHED_REBOUND_ROWS','audit':audit}
              joined=eng.classify_rebounds(joined)
              player_team=core._player_team(nba_game)
              team_abbr=exact._team_abbreviations(nba_game)
              teams=sorted(set(int(x) for x in player_team.values()))
              if len(teams)!=2 or any(t not in team_abbr for t in teams):
                return None,{'status':'TEAM_MAPPING_FAIL','teams':teams,'team_abbr':team_abbr}
              real=joined.IS_REAL_REBOUND.astype(bool); oreb=joined.IS_OREB.astype(bool)
              out={}
              for tid in teams:
                abbr=team_abbr[tid]
                team_offense=~joined.OPPONENT.astype(str).eq(abbr)
                team_defense=~team_offense
                out[tid]={
                  'team_oreb':int((team_offense & oreb).sum()),
                  'team_dreb':int((team_defense & real & ~oreb).sum()),
                  'opponent_oreb':int((team_defense & oreb).sum()),
                  'opponent_dreb':int((team_offense & real & ~oreb).sum()),
                }
              return out,{'status':'PASS','audit':audit,'repairs':lineups.repairs}
            except Exception as exc:
              return None,{'status':'RECONSTRUCTION_FAIL','error':f'{type(exc).__name__}: {exc}'}

          # Retained exact V3-backed team-game facts from the original fanout are controls.
          control_files=list(CTRL.rglob('team_game_treb.csv.gz')) + list(CTRL.rglob('team_game_treb.partial.csv.gz'))
          if not control_files: raise RuntimeError('NO_RETAINED_TEAM_GAME_CONTROL_FILE')
          frames=[]
          for p in control_files:
            try: frames.append(pd.read_csv(p,low_memory=False))
            except: pass
          cdf=pd.concat(frames,ignore_index=True).drop_duplicates(['game_id','team_id'],keep='last')
          cdf['game_id']=pd.to_numeric(cdf.game_id,errors='coerce').astype('Int64')
          cdf['team_id']=pd.to_numeric(cdf.team_id,errors='coerce').astype('Int64')
          target_gids={gid for _,gid in targets}
          eligible=sorted(set(int(x) for x in cdf.game_id.dropna().astype(int)) - target_gids)
          # Spread controls across the season, capped at 40 games.
          if len(eligible)>40:
            idx=[round(i*(len(eligible)-1)/39) for i in range(40)]; controls=[eligible[i] for i in sorted(set(idx))]
          else: controls=eligible
          control_checked=0; control_drift=[]; control_fail=[]
          for gid in controls:
            got,meta=team_counts(gid)
            if got is None:
              control_fail.append({'game_id':gid,**meta}); continue
            expected=cdf[cdf.game_id.eq(gid)]
            if len(expected)!=2:
              control_fail.append({'game_id':gid,'status':'CONTROL_EXPECTED_NOT_TWO_TEAMS','rows':len(expected)}); continue
            control_checked+=1
            for r in expected.itertuples(index=False):
              tid=int(r.team_id); exp=(int(r.team_oreb),int(r.team_dreb),int(r.opponent_oreb),int(r.opponent_dreb))
              val=got.get(tid); obs=None if val is None else (val['team_oreb'],val['team_dreb'],val['opponent_oreb'],val['opponent_dreb'])
              if obs!=exp: control_drift.append({'game_id':gid,'team_id':tid,'expected':exp,'observed':obs})

          validation_pass=(control_checked>=min(10,len(controls)) and len(control_drift)==0)
          rows=[]
          for (tid,gid),meta0 in sorted(targets.items(),key=lambda x:(x[0][1],x[0][0])):
            got,meta=team_counts(gid)
            row={**meta0,'validation_pass':validation_pass,'reconstruction_status':meta.get('status'),'source':'retained_shufinskiy_nbastats_plus_pbpstats_v2_exact_engine','rounded_percentage_backsolve_used':False,'model_used':False}
            if got is not None and tid in got and validation_pass:
              row.update(got[tid]); row['status']='PASS_EXACT'
            else:
              row.update({'team_oreb':'','team_dreb':'','opponent_oreb':'','opponent_dreb':''}); row['status']='REVIEW'
            row['detail']=json.dumps(meta,separators=(',',':'),default=str)
            rows.append(row)

          out=pd.DataFrame(rows)
          out.to_csv(OUT/f'TREB_143_V2_PBP_EXACT_{year}.csv',index=False)
          qa={
            'season':season,'target_team_games':len(rows),'pass_exact_games':int(out.status.eq('PASS_EXACT').sum()),
            'review_games':int(out.status.ne('PASS_EXACT').sum()),'affected_player_key_links':int(sum(r['affected_player_keys'] for r in rows)),
            'control_games_planned':len(controls),'control_games_checked':control_checked,'control_failures':len(control_fail),
            'control_count_drifts':len(control_drift),'validation_pass':validation_pass,
            'integrity':{'direct_integer_rebound_facts_only':True,'retained_nba_plus_pbp_feeds':True,'v3_not_required_for_team_totals':True,'rounded_rate_backsolve':False,'model':False,'promotion_performed':False},
            'control_drift_examples':control_drift[:10],'control_failure_examples':control_fail[:10]
          }
          (OUT/f'TREB_143_V2_PBP_QA_{year}.json').write_text(json.dumps(qa,indent=2,default=str)+'\n')
          print(json.dumps(qa,indent=2,default=str),flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-143-v2-pbp-${{ matrix.year }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn

  consolidate:
    name: consolidate 143 exact team-game audit
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: TREB-143-v2-pbp-*-${{ github.run_id }}
          path: /tmp/parts
          merge-multiple: true
      - name: Consolidate audit result
        run: |
          python - <<'PY'
          import json,pathlib
          import pandas as pd
          p=pathlib.Path('/tmp/parts'); out=pathlib.Path('/tmp/final'); out.mkdir(parents=True,exist_ok=True)
          files=sorted(p.glob('TREB_143_V2_PBP_EXACT_*.csv'))
          frames=[pd.read_csv(x,low_memory=False) for x in files]
          d=pd.concat(frames,ignore_index=True) if frames else pd.DataFrame()
          if len(d): d=d.sort_values(['season','game_id','team_id'],kind='stable')
          d.to_csv(out/'TREB_143_V2_PBP_EXACT_AUDIT.csv',index=False)
          qas=[]
          for q in sorted(p.glob('TREB_143_V2_PBP_QA_*.json')):
            try: qas.append(json.loads(q.read_text()))
            except: pass
          qa={
            'status':'PASS' if len(d)==143 and int(d.status.astype(str).eq('PASS_EXACT').sum())==143 else 'INCOMPLETE',
            'required_team_games':143,'returned_team_games':int(len(d)),
            'pass_exact_games':int(d.status.astype(str).eq('PASS_EXACT').sum()) if len(d) else 0,
            'review_games':int(d.status.astype(str).ne('PASS_EXACT').sum()) if len(d) else 143,
            'season_jobs_returned':len(files),'season_qas':qas,
            'integrity':{'direct_integer_rebound_facts_only':True,'rounded_rate_backsolve':False,'model':False,'promotion_performed':False}
          }
          (out/'TREB_143_V2_PBP_EXACT_QA.json').write_text(json.dumps(qa,indent=2)+'\n')
          print(json.dumps({k:qa[k] for k in ['status','required_team_games','returned_team_games','pass_exact_games','review_games','season_jobs_returned']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-143-v2-pbp-consolidated-${{ github.run_id }}
          path: /tmp/final
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
