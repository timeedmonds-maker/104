name: OREB missed-3 metric scan

on:
  push:
    branches: [agent/oreb-career-scatter]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan metric names
        run: |
          python - <<'PY'
          import gzip, json
          p='team_trb_all_players/impact_database/corrected_off/tenure_segment_on_off.jsonl.gz'
          metrics=set()
          with gzip.open(p,'rt',encoding='utf-8') as f:
              for line in f:
                  if line.strip():
                      m=json.loads(line).get('metric')
                      if m: metrics.add(str(m))
          for m in sorted(metrics):
              ml=m.lower()
              if ('reb' in ml or 'oreb' in ml) and ('3' in ml or 'three' in ml or 'miss' in ml):
                  print(m)
          PY
