name: TREB Windows main production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/treb-windows-main-production.yml
      - team_trb_all_players/impact_database/TREB_WINDOWS_MAIN_TRIGGER.txt

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: treb-validated-2016-recovery
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r team_trb_all_players/requirements.txt
      - name: Rebuild and verify authoritative V2 targets
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/build_roster_targets_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/roster_tenure_v2/roster_repair_v2_summary.json')
          d=json.loads(p.read_text())
          assert d['validated_player_team_season_rows']==14524, d
          assert d['safe_full_core_reuse_rows']==9647, d
          assert d['partial_player_team_season_rows']==4877, d
          assert d['game_bearing_partial_segments']==5199, d
          assert d['cross_team_overlaps']==0, d
          assert d['impossible_minute_rows']==0, d
          assert d['empty_played_tenures']==0, d
          print('V2_TARGET_GATE=PASS')
          PY
      - name: Download and extract locked 2016 source pair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tarfile, urllib.request
          raw=Path('team_trb_all_players/impact_database/local_raw')
          raw.mkdir(parents=True, exist_ok=True)
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={}
          for line in text.splitlines():
              if '=' in line:
                  k,v=line.split('=',1); urls[k.strip()]=v.strip()
          for kind in ('nbastats','pbpstats'):
              url=urls[f'{kind}_2016']
              arc=raw / url.rsplit('/',1)[-1]
              print('download', url, flush=True)
              urllib.request.urlretrieve(url, arc)
              with tarfile.open(arc, 'r:xz') as tf:
                  tf.extractall(raw)
          PY
      - name: Exact 2016 Adams regression gate
        run: python -u team_trb_all_players/run_local_2016_regression.py
      - name: Compile production code
        run: python -m py_compile team_trb_all_players/local_treb_rebuild.py team_trb_all_players/production_treb_engine.py team_trb_all_players/run_local_treb_production.py
      - uses: actions/upload-artifact@v4
        with:
          name: treb-v2-targets-windows-main-${{ github.sha }}
          path: |
            team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz
            team_trb_all_players/impact_database/roster_tenure_v2/wowy_partial_segments.jsonl.gz
            team_trb_all_players/impact_database/roster_tenure_v2/roster_repair_v2_summary.json
          retention-days: 30
          if-no-files-found: error

  reconstruct:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: [2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024]
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: treb-validated-2016-recovery
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r team_trb_all_players/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: treb-v2-targets-windows-main-${{ github.sha }}
          path: team_trb_all_players/impact_database/roster_tenure_v2
      - name: Download and verify season sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR=${{ matrix.year }} python - <<'PY'
          from pathlib import Path
          import hashlib, os, tarfile, urllib.request
          year=int(os.environ['YEAR'])
          raw=Path('team_trb_all_players/impact_database/local_raw')
          raw.mkdir(parents=True, exist_ok=True)
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={}
          for line in text.splitlines():
              if '=' in line:
                  k,v=line.split('=',1); urls[k.strip()]=v.strip()
          hashes=[]
          for kind in ('nbastats','pbpstats'):
              url=urls[f'{kind}_{year}']
              arc=raw / url.rsplit('/',1)[-1]
              print('download', url, flush=True)
              urllib.request.urlretrieve(url, arc)
              h=hashlib.sha256(arc.read_bytes()).hexdigest()
              hashes.append(f'{h}  {arc.name}')
              with tarfile.open(arc, 'r:xz') as tf:
                  tf.extractall(raw)
          (raw/'source_archives.sha256').write_text('\n'.join(hashes)+'\n')
          PY
      - name: Reconstruct season once
        id: production
        shell: bash
        run: |
          set -o pipefail
          y=${{ matrix.year }}
          python -u team_trb_all_players/run_local_treb_production.py --years "$y" 2>&1 | tee "treb-production-${y}.log"
      - name: Persist successful season branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          y=${{ matrix.year }}
          season="${y}-$(printf '%02d' $(((y+1)%100)))"
          out=team_trb_all_players/impact_database/final_local_rebuild
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "treb-prod-${y}"
          git add -f "$out/checkpoints/$season" "$out/locked_seasons/$season.json" "$out/master_manifest.json"
          git commit -m "Lock reconstructed ${season} partial tenures"
          git push --force origin "HEAD:refs/heads/treb-prod-${y}"
      - name: Upload durable season result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treb-season-windows-main-${{ matrix.year }}-${{ github.sha }}
          path: |
            treb-production-${{ matrix.year }}.log
            team_trb_all_players/impact_database/final_local_rebuild/**
            team_trb_all_players/impact_database/local_raw/source_archives.sha256
          if-no-files-found: warn
          retention-days: 90
