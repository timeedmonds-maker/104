name: TREB retained ON/OFF rebound accumulator audit

on:
  push:
    branches:
      - agent/treb-final-exact-assembly
    paths:
      - '.github/workflows/treb-retained-onoff-rebound-accumulator-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treb-retained-onoff-rebound-accumulator-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 0

      - name: Install audit readers
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow

      - name: Rebuild exact-key support only
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/treb_exact_support
          LOCK_PATH=team_trb_all_players/impact_database/final_local_rebuild/locked_seasons
          rm -rf /tmp/treb_locks "$OUT"
          mkdir -p /tmp/treb_locks "$OUT"
          for y in $(seq 2000 2025); do
            b="treb-final-safe-lock-${y}"
            season="$(printf '%d-%02d' "$y" "$(( (y + 1) % 100 ))")"
            git show "refs/remotes/origin/${b}:${LOCK_PATH}/${season}.json" > "/tmp/treb_locks/${season}.json"
          done
          python -u team_trb_all_players/finalize_treb_database.py \
            --locks-dir /tmp/treb_locks \
            --output-dir "$OUT"
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('/tmp/treb_exact_support/career_treb_detail.csv',low_memory=False)
          assert len(d)==5199, len(d)
          assert d.groupby(['season','team_id','player_id']).ngroups==4877
          print({'exact_support':'PASS','segments':5199,'exact_pts':4877})
          PY

      - name: Scan retained accumulator schemas and coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/treb_onoff_rebound_audit
          mkdir -p /tmp/treb_onoff_rebound_audit
          python -u team_trb_all_players/audit_retained_onoff_rebound_accumulators.py \
            --canonical team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz \
            --exact-detail /tmp/treb_exact_support/career_treb_detail.csv \
            --out /tmp/treb_onoff_rebound_audit

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: TREB-retained-onoff-rebound-accumulator-audit
          path: |
            /tmp/treb_onoff_rebound_audit/RETAINED_ONOFF_REBOUND_ACCUMULATOR_AUDIT.json
            /tmp/treb_onoff_rebound_audit/RETAINED_ONOFF_REBOUND_ACCUMULATOR_AUDIT.md
            /tmp/treb_onoff_rebound_audit/RETAINED_ONOFF_REBOUND_ACCUMULATOR_COVERAGE.json
            /tmp/treb_onoff_rebound_audit/RETAINED_ONOFF_REBOUND_ACCUMULATOR_FILES.json
          if-no-files-found: error
          retention-days: 30

# trigger 2026-08-14 retained accumulator audit
