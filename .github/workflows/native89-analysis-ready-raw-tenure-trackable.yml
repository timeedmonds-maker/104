name: Native89 obsolete fanout cancellation
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-analysis-ready-raw-tenure-trackable.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native89-analysis-ready-raw-tenure-fanout
  cancel-in-progress: true
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 2
