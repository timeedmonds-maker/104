name: TREB exact miss next rebound audit
on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths: [.github/workflows/treb-exact-miss-next-rebound-audit.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  MANIFEST: team_trb_all_players/final_integrity_rebuild/rebound_forensics/CHUNKED_REBOUND_MANIFEST.json
  SOURCE_RUN_ID: '31634201123'
  PYTHONUNBUFFERED: '1'
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path(os.environ['MANIFEST']).read_text())
          assert len(m['chunks'])==24 and m['target_games']==58
          x={'include':[{'chunk_id':c['chunk_id'],'year':int(c['year']),'games':','.join(map(str,c['game_ids']))} for c in m['chunks']]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps(x,separators=(',',':'))+'\n')
          PY
  audit:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy rapidfuzz
      - uses: actions/download-artifact@v4
        with:
          name: treb-residual-source-${{ matrix.year }}-${{ env.SOURCE_RUN_ID }}
          path: /tmp/source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - run: |
          python -u team_trb_all_players/rebound_exact_miss_next_rebound_audit.py \
            --year '${{ matrix.year }}' --games '${{ matrix.games }}' --chunk-id '${{ matrix.chunk_id }}' \
            --nba '/tmp/source/nbastats_${{ matrix.year }}.csv' \
            --v3 '/tmp/source/nbastatsv3_${{ matrix.year }}.csv' \
            --pbp '/tmp/source/pbpstats_${{ matrix.year }}.csv' \
            --output '/tmp/EXACT_MISS_NEXT_${{ matrix.chunk_id }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: treb-exact-miss-next-${{ matrix.chunk_id }}-${{ github.run_id }}
          path: /tmp/EXACT_MISS_NEXT_${{ matrix.chunk_id }}.json
          retention-days: 90
  aggregate:
    needs: [plan, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-exact-miss-next-*-${{ github.run_id }}
          path: /tmp/results
      - name: Aggregate strict controls and residual candidates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          paths=sorted(Path('/tmp/results').rglob('EXACT_MISS_NEXT_*.json'))
          assert len(paths)==24, [str(p) for p in paths]
          chunks=[json.loads(p.read_text()) for p in paths]
          strategies=list(chunks[0]['strategies'])
          totals={}
          wrong={}
          for s in strategies:
              keys=list(chunks[0]['strategies'][s])
              totals[s]={k:sum(int(c['strategies'][s][k]) for c in chunks) for k in keys}
              wrong[s]=[r for c in chunks for r in c['wrong_records'][s]]
          residual=[r for c in chunks for r in c['residual_rows']]
          assert len(residual)==77, len(residual)
          safe={s:(totals[s]['strategy_applicable_controls']>0 and totals[s]['identity_wrong']==0 and totals[s]['impact_wrong']==0) for s in strategies}
          safe_candidates={}
          full_games={}
          bygame={}
          for r in residual: bygame.setdefault(int(r['game_id']), []).append(r)
          for s in strategies:
              rows=[]
              if safe[s]:
                  for r in residual:
                      cand=r['strategies'].get(s)
                      if cand is not None and cand.get('kind') is not None:
                          rows.append({'game_id':r['game_id'],'pbp_index':r['pbp_index'],'period':r['period'],'start_time':r['start_time'],'end_time':r['end_time'],'description':r['description'],'previous_description':r['previous_description'],'anchor':r['anchor'],'candidate':cand,'method':s})
              safe_candidates[s]=rows
              ck={(int(x['game_id']),int(x['pbp_index'])) for x in rows}
              full_games[s]=sorted(g for g,rs in bygame.items() if all((g,int(r['pbp_index'])) in ck for r in rs))
          out={
              'status':'COMPLETE',
              'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
              'purpose':'Audit exact previous-miss anchored NBA rebound-sequence rules. No repair is promoted here.',
              'controls':totals,
              'safe_rules':safe,
              'wrong_records':wrong,
              'current_residual_rows':len(residual),
              'safe_candidate_counts':{s:len(v) for s,v in safe_candidates.items()},
              'fully_repairable_game_counts':{s:len(v) for s,v in full_games.items()},
              'fully_repairable_game_ids':full_games,
              'safe_candidates':safe_candidates,
              'residual_rows':residual,
          }
          Path('/tmp/EXACT_MISS_NEXT_REBOUND_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k not in {'wrong_records','safe_candidates','residual_rows'}},indent=2))
          PY
      - name: Persist durable checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-batched-game-facts-20260812
          git reset --hard origin/agent/treb-batched-game-facts-20260812
          D=team_trb_all_players/final_integrity_rebuild/rebound_forensics
          cp /tmp/EXACT_MISS_NEXT_REBOUND_SUMMARY.json "$D/"
          git add -f "$D/EXACT_MISS_NEXT_REBOUND_SUMMARY.json"
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact-miss next-rebound audit'
            git push origin HEAD:agent/treb-batched-game-facts-20260812
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: treb-exact-miss-next-rebound-summary-${{ github.run_id }}
          path: /tmp/EXACT_MISS_NEXT_REBOUND_SUMMARY.json
          retention-days: 90
