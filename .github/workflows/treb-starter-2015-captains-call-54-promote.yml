name: TREB promote 54-key 2015 captain-call starter overlay

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-starter-2015-captains-call-54-promote.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: treb-starter-2015-captains-call-54-promote
  cancel-in-progress: false

env:
  MATERIALITY_RUN: '31861419304'
  MATERIALITY_ARTIFACT: TREB-starter-materiality-failclosed-consolidated-31861419304
  BASELINE_RUN: '31854913173'
  BASELINE_ARTIFACT: TREB-fullcore-exact-2015-31854913173
  TARGETS: team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz
      - name: Download fail-closed materiality result
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MATERIALITY_ARTIFACT }}
          path: /tmp/materiality
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: ${{ env.MATERIALITY_RUN }}
      - name: Download retained 2015 exact baseline
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASELINE_ARTIFACT }}
          path: /tmp/baseline
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: ${{ env.BASELINE_RUN }}
      - name: Download retained full-season feeds
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          y=2015; mkdir -p /tmp/src /tmp/out
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 2 --output /tmp/list_data.txt https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          python - "$y" <<'PY' > /tmp/urls.tsv
          import sys
          y=sys.argv[1]; vals={}
          for line in open('/tmp/list_data.txt',encoding='utf-8'):
              if '=' in line:
                  k,v=line.split('=',1); vals[k.strip()]=v.strip()
          for prefix in ('nbastats','nbastatsv3','pbpstats'):
              key=f'{prefix}_{y}'
              if key not in vals: raise SystemExit(f'MISSING_SOURCE_URL {key}')
              print(prefix,vals[key],sep='\t')
          PY
          while IFS=$'\t' read -r prefix url; do
            arc="/tmp/src/${prefix}_${y}.tar.xz"
            curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 20 --output "$arc" "$url"
            tar -xJf "$arc" -C /tmp/src
          done < /tmp/urls.tsv
          for prefix in nbastats nbastatsv3 pbpstats; do test -s "/tmp/src/${prefix}_${y}.csv"; done
      - name: Materialize deterministic legal captain-call representatives
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import gzip, json, sys
          from pathlib import Path
          import pandas as pd

          sys.path.insert(0,'team_trb_all_players')
          import audit_ambiguous_starter_materiality as mat

          season='2015-16'; out=Path('/tmp/out'); out.mkdir(parents=True,exist_ok=True)
          keys=pd.read_csv('/tmp/materiality/STARTER_MATERIALITY_KEYS.csv',dtype={'player_id':str},low_memory=False)
          keys['player_id']=keys.player_id.map(mat.sid)
          keys['team_id']=pd.to_numeric(keys.team_id,errors='raise').astype('int64')
          scope=keys[(keys.season.astype(str)==season)&(keys.status.astype(str)=='AUDIT_UNRESOLVED')].copy()
          if len(scope)!=54: raise RuntimeError(f'2015 captain-call scope drift expected=54 got={len(scope)}')

          targets=mat.load_targets(Path('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz'),season)
          target_by_team={}; target_by_key={}
          for r in targets:
              target_by_team.setdefault(int(r['team_id']),[]).append(r)
              target_by_key[(int(r['team_id']),mat.sid(r['player_id']))]=r

          nba=mat.io.normalize_nba(pd.read_csv('/tmp/src/nbastats_2015.csv',low_memory=False))
          v3=mat.lineup_engine.normalize_v3(pd.read_csv('/tmp/src/nbastatsv3_2015.csv',low_memory=False))
          pbp=mat.io.normalize_pbp(pd.read_csv('/tmp/src/pbpstats_2015.csv',low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}
          vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}
          pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}
          baseline_team,baseline_player=mat.aggregate_baseline(pd.read_csv('/tmp/baseline/team_game_treb.csv.gz',low_memory=False),pd.read_csv('/tmp/baseline/player_game_treb_on.csv.gz',dtype={'player_id':str},low_memory=False))

          def gids(series):
              s=set()
              for v in series:
                  if pd.isna(v): continue
                  for x in str(v).split('|'):
                      if x.strip(): s.add(int(float(x)))
              return sorted(s)

          game_variants={}
          for gid in gids(scope.game_ids):
              variants,meta=mat.enumerate_game_variants(gid,ng[gid],vg[gid],pg[gid],12000,2500)
              if meta['capped'] or not meta['team_totals_invariant'] or not variants:
                  raise RuntimeError(f'unsafe 2015 captain-call game={gid}: {meta}')
              variants=sorted(variants,key=lambda v: json.dumps(v.get('choices',{}),sort_keys=True,separators=(',',':')))
              game_variants[gid]=variants[0]
              print(json.dumps({'event':'CAPTAINS_CALL_GAME_SELECTED','game_id':gid,'variant_count':len(variants),'policy':'lexicographically_smallest_legal_variant'}),flush=True)

          overlay=[]
          for tid,tkeys in scope.groupby('team_id',sort=True):
              tid=int(tid); tgids=gids(tkeys.game_ids)
              team_total=dict(baseline_team.get(tid,{f:0 for f in mat.TEAM_FIELDS}))
              addmap={}
              for gid in tgids:
                  v=game_variants[gid]
                  tr=[r for r in v['team_rows'] if int(r['team_id'])==tid]
                  if len(tr)!=1: raise RuntimeError(f'missing team row {tid} {gid}')
                  for f in mat.TEAM_FIELDS: team_total[f]=int(team_total.get(f,0))+int(tr[0][f])
                  for r in v['player_rows']:
                      if int(r['team_id'])!=tid: continue
                      pid=mat.sid(r['player_id']); prev=addmap.get(pid,{f:0 for f in mat.PLAYER_FIELDS})
                      for f in mat.PLAYER_FIELDS: prev[f]+=int(r[f])
                      addmap[pid]=prev
              for a in tkeys.itertuples(index=False):
                  pid=mat.sid(a.player_id); base=baseline_player.get((tid,pid),{f:0 for f in mat.PLAYER_FIELDS}); add=addmap.get(pid,{f:0 for f in mat.PLAYER_FIELDS})
                  p={f:int(base.get(f,0))+int(add.get(f,0)) for f in mat.PLAYER_FIELDS}
                  on,off,swing=mat.metric_values(team_total,p)
                  sec_on=int(p['seconds_on']); sec_off=int(team_total['game_seconds'])-sec_on
                  if sec_off<0: raise RuntimeError(f'negative off seconds {tid} {pid}')
                  overlay.append({'season':season,'team_id':tid,'player_id':pid,'player':getattr(a,'player',''),'direct_treb_on':on,'direct_treb_off':off,'direct_treb_swing':swing,'direct_minutes_on':sec_on/60.0,'direct_minutes_off':sec_off/60.0,'team_oreb_on':int(p['team_oreb_on']),'team_dreb_on':int(p['team_dreb_on']),'opponent_oreb_on':int(p['opponent_oreb_on']),'opponent_dreb_on':int(p['opponent_dreb_on']),'team_oreb_off':int(team_total['team_oreb'])-int(p['team_oreb_on']),'team_dreb_off':int(team_total['team_dreb'])-int(p['team_dreb_on']),'opponent_oreb_off':int(team_total['opponent_oreb'])-int(p['opponent_oreb_on']),'opponent_dreb_off':int(team_total['opponent_dreb'])-int(p['opponent_dreb_on']),'status':'PASS','source':'starter_2015_captains_call_deterministic_legal_variant','acceptance_basis':'CAPTAINS_CALL_2015_FAILCLOSED_IMMATERIAL_VARIANCE','representative_is_uniquely_true':False,'representative_policy':'lexicographically_smallest_legal_game_variant','game_ids':str(a.game_ids)})

          df=pd.DataFrame(overlay)
          if len(df)!=54 or df[['season','team_id','player_id']].duplicated().any(): raise RuntimeError('54-key overlay gate failed')
          df.to_csv(out/'starter_2015_captains_call_54_overlay.csv.gz',index=False,compression='gzip')
          gate={'status':'PASS','season':season,'expected_keys':54,'overlay_rows':len(df),'unique_keys':int(len(df.drop_duplicates(['season','team_id','player_id']))),'acceptance_basis':'narrow captain call after bounded factorized path proved inefficient; deterministic legal representative retained; not claimed uniquely true','greg_buckner_material_key_included':False,'global_60_second_gate_relaxed':False,'rounded_percentage_backsolve_used':False,'opponent_rebound_inference_used':False,'partial_tenure_whole_team_subtraction_used':False}
          (out/'gate.json').write_text(json.dumps(gate,indent=2)+'\n'); print(json.dumps(gate,indent=2),flush=True)
          PY
      - name: Upload retained 54-key captain-call overlay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TREB-starter-2015-captains-call-54-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
