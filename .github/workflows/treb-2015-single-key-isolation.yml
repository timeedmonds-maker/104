name: TREB 2015 single-key isolation recovery

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-2015-single-key-isolation.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: treb-2015-single-key-isolation
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: /home/runner/work/104/104/team_trb_all_players
  BASELINE_RUN: "31897074560"
  PLAN_RUN: "31875740731"
  HIST_SOURCE_RUN: "31871719056"
  EXACT_SEASON_RUN: "31854913173"
  TARGETS: team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas
      - uses: actions/download-artifact@v4
        with:
          name: TREB-official-v3-consolidated-${{ env.BASELINE_RUN }}
          path: /tmp/baseline
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: ${{ env.BASELINE_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: TREB-materiality-autopilot-plan-${{ env.PLAN_RUN }}
          path: /tmp/prereq/plan
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: ${{ env.PLAN_RUN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: TREB-auto-v3-historical-2015-*-${{ env.HIST_SOURCE_RUN }}
          path: /tmp/prereq/historical
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: ${{ env.HIST_SOURCE_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: TREB-fullcore-exact-2015-${{ env.EXACT_SEASON_RUN }}
          path: /tmp/prereq/exactseason
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: ${{ env.EXACT_SEASON_RUN }}
      - name: Download retained 2015 source trio once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prereq/src
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 --output /tmp/list_data.txt https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          python - <<'PY' > /tmp/urls.tsv
          vals={}
          for line in open('/tmp/list_data.txt'):
              if '=' in line:
                  k,v=line.split('=',1); vals[k.strip()]=v.strip()
          for p in ('nbastats','nbastatsv3','pbpstats'):
              k=f'{p}_2015'; assert k in vals,k; print(p,vals[k],sep='\t')
          PY
          while IFS=$'\t' read -r prefix url; do
            arc="/tmp/${prefix}_2015.tar.xz"
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 300 --output "$arc" "$url"
            tar -xJf "$arc" -C /tmp/prereq/src
          done < /tmp/urls.tsv
      - name: Build exact 18-key matrix and strategy ledger
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prereq/current
          cp /tmp/baseline/AUTONOMOUS_BLOCKER_MANIFEST.csv /tmp/prereq/current/
          cp /tmp/baseline/FULLCORE_TOTALREBOUNDPCT_AUTONOMOUS.csv.gz /tmp/prereq/current/
          cp /tmp/baseline/AUTONOMOUS_CONSOLIDATION_QA.json /tmp/prereq/current/
          python - <<'PY'
          import json,pandas as pd,pathlib
          b=pd.read_csv('/tmp/prereq/current/AUTONOMOUS_BLOCKER_MANIFEST.csv',dtype={'player_id':str})
          s=b[b.season.eq('2015-16')].copy()
          assert len(s)==18,len(s)
          gm={1610612739:21500721,1610612757:21500916,1610612761:21500916}
          inc=[]
          for i,r in enumerate(s.itertuples()):
              tid=int(r.team_id); assert tid in gm,tid
              inc.append({'idx':i,'team_id':tid,'player_id':str(r.player_id).removesuffix('.0'),'game_id':gm[tid]})
          pathlib.Path('/tmp/matrix.json').write_text(json.dumps({'include':inc},separators=(',',':')))
          ledger={
            'baseline_run':31897074560,'baseline_resolved':8395,'baseline_unresolved':1252,
            'scope':'2015-16 18 unresolved keys / 2 failed games',
            'strategy':'single-key isolation fanout with finite per-key runner timeout',
            'reason':'season-level v3 extended run 31897992909 timed out after 70 minutes after first game emitted 3 legal scenarios; isolate keys so a pathological key/game cannot suppress siblings',
            'previous_exhausted_or_limited':['season-wide expanded legal-scenario retry','SIGALRM per-game timeout in same process','70-minute season-level v3 extended retry'],
            'integrity':{'materiality_threshold_pp':0.01,'dimensions':['ON','OFF','SWING'],'minutes_spread_seconds':60,'empirical_model':False,'rounded_percentage_backsolve':False,'opponent_rebound_inference':False,'partial_tenure_whole_team_subtraction':False,'unsafe_global_event_order':False}
          }
          pathlib.Path('/tmp/prereq/STRATEGY_LEDGER.json').write_text(json.dumps(ledger,indent=2)+'\n')
          print(json.dumps({'keys':len(inc),'games':sorted(set(x['game_id'] for x in inc))},indent=2))
          PY
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-2015-single-key-prereq-${{ github.run_id }}
          path: /tmp/prereq
          retention-days: 90
          compression-level: 1

  recover:
    name: key-${{ matrix.idx }} team-${{ matrix.team_id }} player-${{ matrix.player_id }} game-${{ matrix.game_id }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz
      - uses: actions/download-artifact@v4
        with:
          name: TREB-2015-single-key-prereq-${{ github.run_id }}
          path: /tmp/prereq
      - name: Materialize one canonical full-core key only
        shell: bash
        env:
          TEAM_ID: ${{ matrix.team_id }}
          PLAYER_ID: ${{ matrix.player_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/out /tmp/prior
          cp -a /tmp/prereq/historical /tmp/prior/historical
          cp -a /tmp/prereq/exactseason /tmp/prior/exactseason
          python - <<'PY'
          import gzip,json,os
          tid=int(os.environ['TEAM_ID']); pid=os.environ['PLAYER_ID']
          selected=[]
          with gzip.open('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz','rt') as f:
              for line in f:
                  if not line.strip(): continue
                  r=json.loads(line)
                  if str(r['season'])=='2015-16' and int(r['team_id'])==tid and str(r['player_id']).removesuffix('.0')==pid:
                      assert bool(r.get('full_core_reuse')); selected.append(r)
          assert len(selected)==1,(tid,pid,len(selected))
          with gzip.open('/tmp/target.jsonl.gz','wt') as f: f.write(json.dumps(selected[0],separators=(',',':'))+'\n')
          print('SINGLE_KEY_GATE=PASS',tid,pid)
          PY
      - name: Finite single-key exact/legal-scenario recovery
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/residual_materiality_autopilot_v3.py \
            --year 2015 --targets /tmp/target.jsonl.gz --historical-dir /tmp/prior \
            --report /tmp/prereq/plan/GAME_GAP_FORENSIC_REPORT.json \
            --candidates /tmp/prereq/plan/GAME_GAP_CANDIDATE_REPAIRS.json \
            --nba /tmp/prereq/src/nbastats_2015.csv \
            --v3 /tmp/prereq/src/nbastatsv3_2015.csv \
            --pbp /tmp/prereq/src/pbpstats_2015.csv --out /tmp/out \
            | tee /tmp/out/SINGLE_KEY.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-2015-single-key-${{ matrix.idx }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn

  consolidate:
    needs: [prepare,recover]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      resolved: ${{ steps.merge.outputs.resolved }}
      unresolved: ${{ steps.merge.outputs.unresolved }}
      ready: ${{ steps.merge.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas
      - uses: actions/download-artifact@v4
        with:
          name: TREB-2015-single-key-prereq-${{ github.run_id }}
          path: /tmp/prereq
      - uses: actions/download-artifact@v4
        with:
          pattern: TREB-2015-single-key-*-${{ github.run_id }}
          path: /tmp/recovered
          merge-multiple: false
      - name: Cumulative fail-closed merge against latest 8395 baseline
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cumulative
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import gzip,json,pathlib,pandas as pd
          K=['season','team_id','player_id']
          base=pd.read_csv('/tmp/prereq/current/FULLCORE_TOTALREBOUNDPCT_AUTONOMOUS.csv.gz',dtype={'player_id':str})
          assert len(base)==8395,len(base)
          blocker=pd.read_csv('/tmp/prereq/current/AUTONOMOUS_BLOCKER_MANIFEST.csv',dtype={'player_id':str})
          blocker['player_id']=blocker.player_id.astype(str).str.replace(r'\.0$','',regex=True)
          blocker_keys=set(map(tuple,blocker[K].assign(team_id=lambda x:x.team_id.astype('int64')).itertuples(index=False,name=None)))
          adds=[]; accepted_paths=[]
          for p in pathlib.Path('/tmp/recovered').rglob('fresh_fullcore_2015.csv'):
              if p.stat().st_size==0: continue
              try: d=pd.read_csv(p,dtype={'player_id':str})
              except pd.errors.EmptyDataError: continue
              if d.empty: continue
              if 'status' in d.columns: d=d[d.status.astype(str).eq('PASS')].copy()
              for c in ['rounded_percentage_backsolve_used','opponent_rebound_inference_used','whole_team_subtraction_across_partial_tenure_used']:
                  if c in d.columns: assert not d[c].fillna(False).astype(bool).any(),(str(p),c)
              d['player_id']=d.player_id.astype(str).str.replace(r'\.0$','',regex=True)
              d['team_id']=pd.to_numeric(d.team_id,errors='raise').astype('int64')
              d=d.dropna(subset=['direct_treb_on','direct_treb_off'])
              d=d[d.apply(lambda r:(str(r.season),int(r.team_id),str(r.player_id)) in blocker_keys,axis=1)]
              if len(d):
                  x=d[K+['direct_treb_on','direct_treb_off']].copy(); x['source']='2015_SINGLE_KEY_ISOLATION'; x['status']='PASS'; adds.append(x); accepted_paths.append(str(p))
          add=pd.concat(adds,ignore_index=True).drop_duplicates(K) if adds else pd.DataFrame(columns=base.columns)
          allr=pd.concat([base,add],ignore_index=True,sort=False).drop_duplicates(K,keep='first')
          rows=[]
          with gzip.open('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz','rt') as f:
              for line in f:
                  if line.strip(): rows.append(json.loads(line))
          t=pd.DataFrame(rows); full=t[t.full_core_reuse.astype(bool)][K].copy(); full['season']=full.season.astype(str); full['team_id']=pd.to_numeric(full.team_id).astype('int64'); full['player_id']=full.player_id.astype(str).str.replace(r'\.0$','',regex=True)
          assert len(full)==9647
          chk=full.merge(allr[K],on=K,how='left',indicator=True)
          un=chk[chk._merge.eq('left_only')][K].copy()
          allr.to_csv('/tmp/cumulative/FULLCORE_TOTALREBOUNDPCT_AUTONOMOUS.csv.gz',index=False,compression='gzip')
          un.to_csv('/tmp/cumulative/AUTONOMOUS_BLOCKER_MANIFEST.csv',index=False)
          qa={'status':'PASS' if len(un)==0 else 'BLOCKED','full_core_target':9647,'resolved':int(len(allr)),'unresolved':int(len(un)),'baseline_resolved':8395,'new_single_key_rows':int(len(allr)-8395),'accepted_artifacts':accepted_paths,'strategy':'2015_single_key_isolation','materiality_threshold_pp':0.01,'materiality_dimensions':['ON','OFF','SWING'],'minutes_gate_seconds':60,'forbidden_inference_used':False}
          pathlib.Path('/tmp/cumulative/AUTONOMOUS_CONSOLIDATION_QA.json').write_text(json.dumps(qa,indent=2)+'\n')
          ledger=json.load(open('/tmp/prereq/STRATEGY_LEDGER.json')); ledger['result']=qa; pathlib.Path('/tmp/cumulative/STRATEGY_LEDGER.json').write_text(json.dumps(ledger,indent=2)+'\n')
          print('resolved='+str(len(allr))); print('unresolved='+str(len(un))); print('ready='+('true' if len(un)==0 else 'false'))
          PY
          cat /tmp/cumulative/AUTONOMOUS_CONSOLIDATION_QA.json
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-cumulative-single-key-${{ github.run_id }}
          path: /tmp/cumulative
          retention-days: 90
          compression-level: 1

  final_release:
    needs: consolidate
    if: needs.consolidate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy pyarrow duckdb
      - uses: actions/download-artifact@v4
        with:
          name: TREB-prepared-canonical-layers-31844978593
          path: /tmp/prep
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/104
          run-id: '31844978593'
      - uses: actions/download-artifact@v4
        with:
          name: TREB-cumulative-single-key-${{ github.run_id }}
          path: /tmp/cumulative
      - name: Assemble and hard validate final 90-metric release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final
          python team_trb_all_players/autonomous_finalize_exact_release.py --targets "$TARGETS" --native /tmp/prep/native_89_canonical.parquet --partial /tmp/prep/exact_partial_4877.parquet --fullcore /tmp/cumulative/FULLCORE_TOTALREBOUNDPCT_AUTONOMOUS.csv.gz --out /tmp/final
          python - <<'PY'
          import json
          q=json.load(open('/tmp/final/FINAL_QA.json'))
          assert q['status']=='PASS' and q['canonical_keys']==14524 and q['seasons']==26 and q['native_metrics']==89 and q['total_metrics']==90
          assert q['native_canonical_rows']==1292636 and q['partial_treb']==4877 and q['full_core_treb']==9647 and q['total_rebound_pct_rows']==14524
          assert q['duplicate_total_rebound_pct']==0 and q['missing_total_rebound_pct']==0 and q['steven_adams_career_total_rebound_pct_rows']==1
          assert 20460 <= q['steven_adams_career_minutes'] <= 20485 and 540 <= q['career_10000_min_total_rebound_pct_population'] <= 565
          assert not q['rounded_percentage_backsolve'] and not q['opponent_rebound_inference'] and not q['partial_tenure_whole_team_subtraction'] and not q['empirical_model_used']
          PY
          cd /tmp/final
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt ! -name TREB_final_database_2000-01_to_2025-26.zip -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          zip -q -9 TREB_final_database_2000-01_to_2025-26.zip $(find . -maxdepth 1 -type f ! -name TREB_final_database_2000-01_to_2025-26.zip -printf '%P\n' | sort)
          unzip -t TREB_final_database_2000-01_to_2025-26.zip > FINAL_ZIP_INTEGRITY.txt
          sha256sum TREB_final_database_2000-01_to_2025-26.zip | tee FINAL_ZIP_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-final-database-single-key-${{ github.run_id }}
          path: |
            /tmp/final/TREB_final_database_2000-01_to_2025-26.zip
            /tmp/final/FINAL_QA.json
            /tmp/final/FINAL_ZIP_SHA256.txt
            /tmp/final/FINAL_ZIP_INTEGRITY.txt
            /tmp/final/SHA256SUMS.txt
            /tmp/final/PROVENANCE.json
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
