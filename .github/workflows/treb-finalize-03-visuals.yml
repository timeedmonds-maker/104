name: TREB finalize 03 visuals

on:
  workflow_run:
    workflows: ['TREB finalize 02 database']
    types: [completed]

permissions:
  contents: write

env:
  OUT: team_trb_all_players/impact_database/corrected_off

jobs:
  visuals:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: treb-stage2-actions-live
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require checkpoint 02
        run: test -s "$OUT/FINALIZE_02_DONE"
      - name: Install visualization dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow matplotlib pillow requests
      - name: Self-test visualization tooling
        run: |
          python team_trb_all_players/build_funakistats_visual_pack.py --self-test
          python team_trb_all_players/funakistats_headshots.py --self-test
      - name: Build rankings and visuals
        run: python team_trb_all_players/build_funakistats_visual_pack.py --minutes-threshold 10000 --label-count 20
      - name: Validate outputs
        run: |
          test -s "$OUT/visual_pack/treb_career_impact_best_only_square.png"
          test -s "$OUT/visual_pack/treb_career_impact_best_only_portrait.png"
          test -s "$OUT/visual_pack/treb_career_impact_full_profile_square.png"
          test -s "$OUT/visual_pack/treb_career_impact_full_profile_portrait.png"
          test -s "$OUT/visual_pack/rankings/treb_top20_on_court.csv"
          test -s "$OUT/visual_pack/rankings/treb_top20_corrected_swing.csv"
      - name: Commit checkpoint
        run: |
          printf 'TREB_FINALIZE_03=1\n' > "$OUT/FINALIZE_03_DONE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT/visual_pack" "$OUT/FINALIZE_03_DONE"
          while IFS= read -r -d '' f; do git reset -- "$f"; done < <(find "$OUT/visual_pack" -type f -size +90M -print0)
          git commit -m 'TREB finalization checkpoint 03 [skip ci]' || true
          git pull --rebase origin treb-stage2-actions-live
          git push origin HEAD:treb-stage2-actions-live
