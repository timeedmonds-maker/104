name: TREB safe historical repair

on:
  push:
    branches: [treb-final-production-20260812]
    paths:
      - team_trb_all_players/impact_database/FINAL_SAFE_REPAIR_CONTROL.json
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: treb-final-safe-historical-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      years: ${{ steps.control.outputs.years }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r team_trb_all_players/requirements.txt
      - name: Read safe repair control
        id: control
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/FINAL_SAFE_REPAIR_CONTROL.json').read_text())
          years=[int(y) for y in d['years']]
          assert years and len(years)==len(set(years)), years
          assert all(2000 <= y <= 2024 for y in years), years
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('years='+json.dumps(years,separators=(',',':'))+'\n')
          print('SAFE_REPAIR_YEARS', years)
          PY
      - name: Rebuild and verify authoritative V2 targets
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/build_roster_targets_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/roster_tenure_v2/roster_repair_v2_summary.json').read_text())
          expected={'validated_player_team_season_rows':14524,'full_core_reuse_rows':9647,'partial_player_team_season_rows':4877,'wowy_game_bearing_segments':5199,'cross_team_overlap_pairs':0,'impossible_minute_rows':0,'empty_played_tenures':0}
          for k,v in expected.items(): assert int(d[k])==v,(k,d[k],v)
          assert int(d['positive_core_rows_original'])==14526
          assert int(d['excluded_stale_core_artifacts'])==2
          print('V2_TARGET_GATE=PASS')
          PY
      - name: Download locked 2016 source pair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tarfile, urllib.request
          raw=Path('team_trb_all_players/impact_database/local_raw'); raw.mkdir(parents=True,exist_ok=True)
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for kind in ('nbastats','pbpstats'):
              url=urls[f'{kind}_2016']; arc=raw/url.rsplit('/',1)[-1]
              urllib.request.urlretrieve(url,arc)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Exact 2016 Adams regression gate - unchanged engine
        run: python -u team_trb_all_players/run_local_2016_regression.py
      - name: Compile safe recovery layer
        run: python -m py_compile team_trb_all_players/local_treb_rebuild.py team_trb_all_players/production_treb_engine.py team_trb_all_players/production_treb_engine_recovered.py team_trb_all_players/production_treb_engine_tolerant.py team_trb_all_players/run_local_treb_production.py team_trb_all_players/run_local_treb_production_recovered.py team_trb_all_players/fill_missing_2009_pbp_game.py
      - uses: actions/upload-artifact@v4
        with:
          name: treb-safe-v2-targets-${{ github.sha }}
          path: |
            team_trb_all_players/impact_database/roster_tenure_v2/wowy_partial_segments.jsonl.gz
            team_trb_all_players/impact_database/roster_tenure_v2/roster_repair_v2_summary.json
          retention-days: 90
          if-no-files-found: error

  reconstruct:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: ${{ fromJSON(needs.preflight.outputs.years) }}
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r team_trb_all_players/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: treb-safe-v2-targets-${{ github.sha }}
          path: team_trb_all_players/impact_database/roster_tenure_v2
      - name: Download and verify season sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR=${{ matrix.year }} python - <<'PY'
          from pathlib import Path
          import hashlib, os, subprocess, tarfile, urllib.request
          year=int(os.environ['YEAR'])
          raw=Path('team_trb_all_players/impact_database/local_raw'); raw.mkdir(parents=True,exist_ok=True)
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          keys=[f'nbastats_{year}',f'pbpstats_{year}']
          if year==2009:
              keys.append('nbastatsv3_2009')
          hashes=[]
          for key in keys:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
              hashes.append(f'{hashlib.sha256(arc.read_bytes()).hexdigest()}  {arc.name}')
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          (raw/'source_archives.sha256').write_text('\n'.join(hashes)+'\n')
          PY
      - name: Fill audited 2009 PBP source gap from NBA Stats v3
        if: matrix.year == 2009
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/fill_missing_2009_pbp_game.py \
            --nba team_trb_all_players/impact_database/local_raw/nbastats_2009.csv \
            --pbp team_trb_all_players/impact_database/local_raw/pbpstats_2009.csv \
            --v3 team_trb_all_players/impact_database/local_raw/nbastatsv3_2009.csv \
            --audit team_trb_all_players/impact_database/final_local_rebuild/2009_source_gap_audit.json
      - name: Reconstruct season with evidence-only recovery
        shell: bash
        run: |
          set -euo pipefail
          y=${{ matrix.year }}
          python -u team_trb_all_players/run_local_treb_production_recovered.py --years "$y" --batch-size 50 --force 2>&1 | tee "treb-safe-repair-${y}.log"
      - name: Persist successful safe season lock branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          y=${{ matrix.year }}
          season="${y}-$(printf '%02d' $(((y+1)%100)))"
          out=team_trb_all_players/impact_database/final_local_rebuild
          test -f "$out/locked_seasons/$season.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "treb-final-safe-lock-${y}"
          git add -f "$out/checkpoints/$season" "$out/locked_seasons/$season.json" "$out/master_manifest.json"
          if [ -f "$out/2009_source_gap_audit.json" ]; then git add -f "$out/2009_source_gap_audit.json"; fi
          git commit -m "Final safe lock ${season} after evidence-only repair"
          git push --force origin "HEAD:refs/heads/treb-final-safe-lock-${y}"
      - name: Upload safe repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treb-safe-season-${{ matrix.year }}-${{ github.sha }}
          path: |
            treb-safe-repair-${{ matrix.year }}.log
            team_trb_all_players/impact_database/final_local_rebuild/**
          if-no-files-found: warn
          retention-days: 90

  status:
    needs: [preflight, reconstruct]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Gather durable safe lock status across all 25 historical seasons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p team_trb_all_players/impact_database/final_local_rebuild/locked_seasons
          for y in $(seq 2000 2024); do
            season="${y}-$(printf '%02d' $(((y+1)%100)))"
            branch="treb-final-safe-lock-${y}"
            if git fetch --quiet origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
              git show "origin/${branch}:team_trb_all_players/impact_database/final_local_rebuild/locked_seasons/${season}.json" > "team_trb_all_players/impact_database/final_local_rebuild/locked_seasons/${season}.json" 2>/dev/null || true
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('team_trb_all_players/impact_database/final_local_rebuild/locked_seasons')
          rows=[]
          for y in range(2000,2025):
              season=f'{y}-{(y+1)%100:02d}'; p=root/f'{season}.json'
              if p.exists():
                  d=json.loads(p.read_text()); rows.append({'year':y,'season':season,'locked':d.get('status')=='COMPLETE','targets':d.get('target_count'),'exceptions':len(d.get('exceptions',[])),'unmatched':len(d.get('unmatched_rebound_rows',[])),'repairs':len(d.get('repairs',[])),'code_commit':d.get('code_commit')})
              else: rows.append({'year':y,'season':season,'locked':False})
          complete=sum(bool(r['locked']) for r in rows)
          payload={'historical_years':25,'locked_complete':complete,'remaining':25-complete,'rows':rows}
          out=root.parent/'safe_repair_status.json'; out.write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY
      - name: Combine all safe historical locks if complete
        shell: bash
        run: |
          set -euo pipefail
          status=team_trb_all_players/impact_database/final_local_rebuild/safe_repair_status.json
          remaining=$(python -c "import json;print(json.load(open('$status'))['remaining'])")
          if [ "$remaining" != "0" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B treb-final-historical-safe-locks-20260812
          git add -f team_trb_all_players/impact_database/final_local_rebuild/locked_seasons team_trb_all_players/impact_database/final_local_rebuild/safe_repair_status.json
          git commit -m 'Combine all final safe historical TREB locks'
          git push --force origin HEAD:refs/heads/treb-final-historical-safe-locks-20260812
      - uses: actions/upload-artifact@v4
        with:
          name: treb-safe-repair-status-${{ github.sha }}
          path: team_trb_all_players/impact_database/final_local_rebuild/safe_repair_status.json
          retention-days: 90
          if-no-files-found: error
