name: Headshot 3PT Swing List

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  render:
    if: github.event.issue.title == 'render-headshot-3pt-swing-list-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pillow-avif-plugin requests

      - name: Render graphic
        run: |
          cat > /tmp/render.py <<'PY'
          import io, os, requests
          from PIL import Image, ImageDraw, ImageFont
          import pillow_avif

          players = [
            (1,1627750,'Jamal Murray',4.421957),
            (2,202331,'Paul George',3.560839),
            (3,203999,'Nikola Jokić',3.327061),
            (4,1628379,'Luke Kennard',3.185049),
            (5,201939,'Stephen Curry',3.156923),
            (6,202695,'Kawhi Leonard',2.975750),
            (7,202681,'Kyrie Irving',2.959188),
            (8,203954,'Joel Embiid',2.798739),
            (9,201142,'Kevin Durant',2.716807),
            (10,1629008,'Michael Porter Jr.',2.661839),
            (11,1630174,'Aaron Nesmith',2.647158),
            (12,1631260,'AJ Green',2.608743),
            (13,1630163,'LaMelo Ball',2.576754),
            (14,203994,'Jusuf Nurkić',2.536215),
            (15,1630178,'Tyrese Maxey',2.519183),
            (16,1630169,'Tyrese Haliburton',2.373862),
            (17,1629639,'Tyler Herro',2.353698),
            (18,203468,'CJ McCollum',2.344965),
            (19,1641706,'Brandon Miller',2.226628),
            (20,1630703,'Scoot Henderson',2.210929),
            (21,1631094,'Paolo Banchero',2.210135),
            (22,1627777,'Georges Niang',2.180776),
            (23,203500,'Steven Adams',2.165567),
            (24,1628384,'OG Anunoby',2.161761),
            (25,203484,'Kentavious Caldwell-Pope',2.129610),
          ]

          W,H = 1600,1600
          bg = (248,247,243)
          navy = (28,38,48)
          muted = (91,99,107)
          blue = (158,202,225)
          red = (157,55,55)
          lightline = (224,223,218)
          im = Image.new('RGB',(W,H),bg)
          d = ImageDraw.Draw(im)

          def font(size,bold=False):
              p = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
              return ImageFont.truetype(p,size)

          titlef=font(58,True); subf=font(26,False); rankf=font(28,True); namef=font(30,True); valf=font(30,True); footf=font(23,True)
          d.text((90,65),'BIGGEST TEAM 3PT% ON-OFF SWING',font=titlef,fill=navy)
          d.text((90,142),'2021-22 to 2025-26  |  3,500+ minutes (315 players)  |  percentage points',font=subf,fill=muted)
          d.line((90,200,1510,200),fill=lightline,width=2)

          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0','Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'})

          def get_headshot(pid):
              url=f'https://cdn.nba.com/headshots/nba/latest/1040x760/{pid}.png'
              r=session.get(url,timeout=25)
              r.raise_for_status()
              pic=Image.open(io.BytesIO(r.content)).convert('RGBA')
              # Crop to alpha foreground if available, then retain head/upper torso only.
              alpha=pic.getchannel('A')
              bbox=alpha.getbbox()
              if bbox:
                  pic=pic.crop(bbox)
              # less-aggressive lower crop: enough shoulders for recognisability, limited jersey
              w,h=pic.size
              pic=pic.crop((0,0,w,int(h*0.78)))
              # square transparent canvas, fit by height
              target=94
              scale=min(target/pic.height, target/pic.width)
              nw=max(1,int(pic.width*scale)); nh=max(1,int(pic.height*scale))
              pic=pic.resize((nw,nh),Image.Resampling.LANCZOS)
              canv=Image.new('RGBA',(100,100),(0,0,0,0))
              canv.alpha_composite(pic,((100-nw)//2,100-nh))
              return canv

          left=players[:13]; right=players[13:]
          colx=[90,825]
          row0=230; rowh=96

          for ci, group in enumerate([left,right]):
              x0=colx[ci]
              for j,(rank,pid,name,val) in enumerate(group):
                  y=row0+j*rowh
                  if j>0:
                      d.line((x0,y-7,x0+665,y-7),fill=lightline,width=1)
                  # rank
                  d.text((x0,y+27),f'{rank:>2}',font=rankf,fill=muted,anchor='lm')
                  # headshot
                  hs=get_headshot(pid)
                  im.paste(hs,(x0+50,y-2),hs)
                  # name + value
                  d.text((x0+165,y+31),name,font=namef,fill=navy,anchor='lm')
                  valtxt=f'+{val:.2f}'
                  d.text((x0+650,y+31),valtxt,font=valf,fill=navy,anchor='rm')
                  # subtle blue bar scaled to top value
                  bx=x0+165; by=y+70; maxw=485
                  d.rounded_rectangle((bx,by,bx+maxw,by+7),radius=4,fill=(232,236,238))
                  d.rounded_rectangle((bx,by,bx+maxw*(val/players[0][3]),by+7),radius=4,fill=blue)

          d.text((1510,1545),'@funakistats',font=footf,fill=red,anchor='rs')
          d.text((90,1545),'Team 3PT% ON minus OFF',font=footf,fill=muted,anchor='ls')

          out='/tmp/top25_team_3pt_swing_headshots.png'
          im.save(out,'PNG',optimize=True)
          print(out)
          PY
          python /tmp/render.py

      - uses: actions/upload-artifact@v4
        with:
          name: top25-team-3pt-swing-headshots
          path: /tmp/top25_team_3pt_swing_headshots.png
          retention-days: 7
