name: TREB static nba_data team recovery
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - '.github/workflows/treb-static-nbadata-team-recovery.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  gated-static-team-recovery:
    runs-on: ubuntu-24.04
    env:
      CURRENT_ARTIFACT_ID: 9275527991
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download authoritative checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CURRENT_ARTIFACT_ID}/zip" > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/current
      - name: Run static nba_data exact team rebound gate
        run: |
          python -u team_trb_all_players/treb_static_nbadata_team_exact.py --current-dir /tmp/current --out-dir /tmp/out
      - name: Upload durable gated result
        uses: actions/upload-artifact@v4
        with:
          name: TREB-static-nbadata-team-recovery-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
