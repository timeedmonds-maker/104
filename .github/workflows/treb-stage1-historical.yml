name: TREB Stage 1 roster tenure

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: treb-stage1-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-qa-roster-tenure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the same audited Stage 1 path used by Codespaces
        run: bash team_trb_all_players/run_stage1_manual_fallback.sh
