name: TREB Stage 1 historical transactions

on:
  push:
    branches:
      - treb-stage1-automation
    paths:
      - team_trb_all_players/import_archived_bref_transactions.py
      - .github/workflows/treb-stage1-historical.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-qa-2003-04:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Import archived Basketball-Reference 2003-04 transactions
        run: python team_trb_all_players/import_archived_bref_transactions.py 2003

      - name: Validate 2003-04 transaction archive
        run: |
          python - <<'PY'
          import gzip
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("team_trb_all_players/impact_database/historical_transactions/season_rows/2003-04.jsonl.gz")
          rows = [json.loads(line) for line in gzip.open(path, "rt", encoding="utf-8")]

          expected_counts = {
              "Claimed": 2,
              "Other": 28,
              "Released": 6,
              "Signings": 191,
              "Trades": 44,
              "Waived": 97,
          }

          assert len(rows) == 368, len(rows)
          assert dict(sorted(Counter(row["section"] for row in rows).items())) == expected_counts
          assert all(row.get("date_hint") for row in rows)
          assert all(row.get("source") == "Basketball-Reference via Internet Archive" for row in rows)

          def has_transaction(date, *needles):
              for row in rows:
                  text = " ".join(str(value) for value in row.get("cells", []))
                  if row.get("subsection") == date and all(needle in text for needle in needles):
                      return True
              return False

          assert has_transaction("December 1, 2003", "Jalen Rose", "Toronto Raptors")
          assert has_transaction("February 19, 2004", "Rasheed Wallace", "Detroit Pistons")
          assert has_transaction("June 29, 2004", "Tracy McGrady", "Houston Rockets")

          print("2003-04 QA PASSED: 368 transactions, 44 trades, exact dates present")
          PY

      - name: Commit generated historical archive outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team_trb_all_players/impact_database/historical_transactions
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Add validated 2003-04 historical transaction archive"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
