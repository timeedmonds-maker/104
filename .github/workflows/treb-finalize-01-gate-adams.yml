name: TREB finalize 01 gate and Adams

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/treb-finalize-01-gate-adams.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  OUT: team_trb_all_players/impact_database/corrected_off

jobs:
  gate_adams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: treb-stage2-actions-live
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify completed Stage2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json')
          d=json.loads(p.read_text())
          z=d.get('zero_minute_tail_report') or {}
          assert d.get('all_complete') is True
          assert int(d.get('complete_windows') or 0)==15206
          assert int(d.get('remaining_windows') or 0)==0
          assert int(d.get('failed_windows') or 0)==0
          assert int(z.get('total_excluded_zero_minute_windows') or 0)==221
          assert int(z.get('verified_positive_minute_windows') or 0)==0
          assert int(z.get('indeterminate_windows') or 0)==0
          print('STAGE2_GATE_OK')
          PY
      - name: Install lightweight dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas duckdb pyarrow
      - name: Run exact Steven Adams query
        run: python team_trb_all_players/query_steven_adams_treb.py
      - name: Commit checkpoint
        run: |
          printf 'TREB_FINALIZE_01=1\n' > "$OUT/FINALIZE_01_DONE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT/steven_adams_career_treb_query.json" "$OUT/FINALIZE_01_DONE"
          git commit -m 'TREB finalization checkpoint 01 [skip ci]'
          git pull --rebase origin treb-stage2-actions-live
          git push origin HEAD:treb-stage2-actions-live
