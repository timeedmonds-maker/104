name: TREB ambiguity minute resolution

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-ambiguity-minute-resolution.yml
      - team_trb_all_players/resolve_ambiguous_lineups_from_minutes.py
      - team_trb_all_players/final_integrity_rebuild/EXCLUDED_GAME_REPAIR_CANARY_RESULT.json
      - team_trb_all_players/final_integrity_rebuild/CC0_PLAYERSTATISTICS_PROBE.json
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve legal trials against independent minutes
        run: |
          python -u team_trb_all_players/resolve_ambiguous_lineups_from_minutes.py \
            --canary team_trb_all_players/final_integrity_rebuild/EXCLUDED_GAME_REPAIR_CANARY_RESULT.json \
            --cc0 team_trb_all_players/final_integrity_rebuild/CC0_PLAYERSTATISTICS_PROBE.json \
            --output /tmp/AMBIGUOUS_LINEUP_MINUTE_RESOLUTION.json
      - name: Commit resolution audit durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          mkdir -p team_trb_all_players/final_integrity_rebuild
          cp /tmp/AMBIGUOUS_LINEUP_MINUTE_RESOLUTION.json \
             team_trb_all_players/final_integrity_rebuild/AMBIGUOUS_LINEUP_MINUTE_RESOLUTION.json
          git add team_trb_all_players/final_integrity_rebuild/AMBIGUOUS_LINEUP_MINUTE_RESOLUTION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record independent-minute lineup resolution audit"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
