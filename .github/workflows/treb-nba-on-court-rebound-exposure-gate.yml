name: TREB classic PBP on-court rebound exposure gate

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-nba-on-court-rebound-exposure-gate.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: treb-nba-on-court-rebound-exposure-gate
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy nba-on-court requests
      - name: Download retained exact consensus and current blocker diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/consensus /tmp/reclose /tmp/out
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9252786257/zip > /tmp/consensus.zip
          unzip -q /tmp/consensus.zip -d /tmp/consensus
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9263563808/zip > /tmp/reclose.zip
          unzip -q /tmp/reclose.zip -d /tmp/reclose
      - name: Reconstruct rebound exposure from classic PBP only and enforce exact controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, pathlib, tarfile
          import numpy as np
          import pandas as pd
          import requests
          import nba_on_court as noc

          O=pathlib.Path('/tmp/out'); O.mkdir(exist_ok=True)
          missing=pd.read_csv('/tmp/reclose/MISSING_PLAYER_GAME_PRIMITIVES.csv')
          missing['game_id']=pd.to_numeric(missing.game_id).astype('int64')
          missing['team_id']=pd.to_numeric(missing.team_id).astype('int64')
          missing['player_id']=pd.to_numeric(missing.player_id).astype('int64')
          target_games=set(missing.game_id)

          cons=pd.read_csv('/tmp/consensus/PROMOTABLE_RETAINED_FACT_CONSENSUS.csv',low_memory=False)
          pc=cons[cons.player_id.notna() & cons.field.isin(['team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on'])].copy()
          pc['game_id']=pd.to_numeric(pc.game_id).astype('int64'); pc['team_id']=pd.to_numeric(pc.team_id).astype('int64'); pc['player_id']=pd.to_numeric(pc.player_id).astype('int64')
          piv=pc.pivot_table(index=['game_id','team_id','player_id'],columns='field',values='value',aggfunc='first').reset_index()
          piv=piv.dropna(subset=['team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on'])
          piv['team_reb_on']=(piv.team_oreb_on+piv.team_dreb_on).round().astype('int64')
          piv['opp_reb_on']=(piv.opponent_oreb_on+piv.opponent_dreb_on).round().astype('int64')

          def year_of(g):
              s=str(int(g)).zfill(10); return 2000+int(s[3:5])
          years=sorted({year_of(g) for g in target_games})
          sess=requests.Session(); sess.headers.update({'User-Agent':'TREB exact reconstruction/1.0'})
          txt=sess.get('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=30).text
          urls={}
          for line in txt.splitlines():
              if '=' in line:
                  k,v=line.split('=',1); urls[k.strip()]=v.strip()

          raw_by_year={}
          for y in years:
              u=urls.get(f'nbastats_{y}')
              if not u: continue
              r=sess.get(u,timeout=90); r.raise_for_status()
              with tarfile.open(fileobj=io.BytesIO(r.content),mode='r:xz') as tf:
                  f=tf.extractfile(f'nbastats_{y}.csv')
                  raw_by_year[y]=pd.read_csv(f,low_memory=False)
                  raw_by_year[y]['GAME_ID']=pd.to_numeric(raw_by_year[y].GAME_ID).astype('int64')

          def nonempty(x):
              return pd.notna(x) and str(x).strip() not in ('','nan','None')

          def reconstruct(g):
              y=year_of(g)
              if y not in raw_by_year: raise RuntimeError('NO_SEASON_SOURCE')
              game=raw_by_year[y][raw_by_year[y].GAME_ID==g].copy().sort_values('EVENTNUM').reset_index(drop=True)
              if game.empty: raise RuntimeError('GAME_ABSENT_CLASSIC_PBP')
              # Force fail-closed instead of live boxscore fallback if quarter starters are not inferable from retained PBP.
              lined=noc.players_on_court(game.copy(),retry=0)
              away_cols=[f'AWAY_PLAYER{i}' for i in range(1,6)]; home_cols=[f'HOME_PLAYER{i}' for i in range(1,6)]
              if any(c not in lined for c in away_cols+home_cols): raise RuntimeError('NO_LINEUP_COLUMNS')
              # PERSON1TYPE 5 = away, 4 = home in classic NBA PBP; establish IDs from repeated event evidence.
              away_ids=pd.to_numeric(game.loc[(pd.to_numeric(game.PERSON1TYPE,errors='coerce')==5),'PLAYER1_TEAM_ID'],errors='coerce').dropna()
              home_ids=pd.to_numeric(game.loc[(pd.to_numeric(game.PERSON1TYPE,errors='coerce')==4),'PLAYER1_TEAM_ID'],errors='coerce').dropna()
              away_ids=away_ids[away_ids>0]; home_ids=home_ids[home_ids>0]
              if away_ids.empty or home_ids.empty: raise RuntimeError('NO_TEAM_IDENTITY')
              away=int(away_ids.mode().iloc[0]); home=int(home_ids.mode().iloc[0])
              if away==home: raise RuntimeError('TEAM_IDENTITY_COLLISION')
              counts={}
              def bump(pid,tid,reb_tid):
                  try: p=int(float(pid))
                  except: return
                  if p<=0: return
                  k=(tid,p); a=counts.setdefault(k,[0,0])
                  if reb_tid==tid: a[0]+=1
                  else: a[1]+=1
              for _,r in lined[pd.to_numeric(lined.EVENTMSGTYPE,errors='coerce')==4].iterrows():
                  rt=pd.to_numeric(pd.Series([r.get('PLAYER1_TEAM_ID')]),errors='coerce').iloc[0]
                  reb_tid=int(rt) if pd.notna(rt) and rt>0 else None
                  if reb_tid is None:
                      h=nonempty(r.get('HOMEDESCRIPTION')); v=nonempty(r.get('VISITORDESCRIPTION'))
                      if h and not v: reb_tid=home
                      elif v and not h: reb_tid=away
                      else: raise RuntimeError(f'UNASSIGNED_REBOUND_EVENT:{r.get("EVENTNUM")}')
                  if reb_tid not in (away,home): raise RuntimeError(f'REBOUND_TEAM_OUTSIDE_GAME:{reb_tid}')
                  for c in away_cols: bump(r[c],away,reb_tid)
                  for c in home_cols: bump(r[c],home,reb_tid)
              return counts

          # Controls: three non-target games per affected season, compare every retained exact player-game primitive available.
          control_games=[]
          exact_games=set(piv.game_id)
          for y in years:
              cand=[g for g in sorted(exact_games) if year_of(g)==y and g not in target_games and y in raw_by_year and g in set(raw_by_year[y].GAME_ID)]
              control_games.extend(cand[:3])
          controls=[]; pass_n=0; mismatches=0; errors=0
          for g in control_games:
              try:
                  got=reconstruct(g)
                  rows=piv[piv.game_id==g]
                  for r in rows.itertuples(index=False):
                      k=(int(r.team_id),int(r.player_id))
                      if k not in got: continue
                      tr,op=got[k]; ok=(tr==int(r.team_reb_on) and op==int(r.opp_reb_on))
                      pass_n+=int(ok); mismatches+=int(not ok)
                      controls.append({'game_id':g,'team_id':k[0],'player_id':k[1],'calc_team_reb_on':tr,'calc_opp_reb_on':op,'exact_team_reb_on':int(r.team_reb_on),'exact_opp_reb_on':int(r.opp_reb_on),'match':ok})
              except Exception as e:
                  errors+=1; controls.append({'game_id':g,'error':f'{type(e).__name__}:{e}','match':False})
          pd.DataFrame(controls).to_csv(O/'CLASSIC_PBP_ONCOURT_CONTROLS.csv',index=False)
          gate=(pass_n>=100 and mismatches==0)
          recovered=[]; target_errors=[]
          if gate:
              for g in sorted(target_games):
                  try:
                      got=reconstruct(g)
                      for r in missing[missing.game_id==g].itertuples(index=False):
                          k=(int(r.team_id),int(r.player_id))
                          if k in got:
                              tr,op=got[k]
                              recovered.append({'game_id':g,'team_id':k[0],'player_id':k[1],'team_reb_on':tr,'opponent_reb_on':op,'source':'classic stats.nba.com PBP + nba-on-court deterministic lineups','control_gate':'PASS_ZERO_MISMATCH'})
                          else:
                              target_errors.append({'game_id':g,'team_id':k[0],'player_id':k[1],'error':'TARGET_PLAYER_NOT_RECONSTRUCTED'})
                  except Exception as e:
                      target_errors.append({'game_id':g,'error':f'{type(e).__name__}:{e}'})
          pd.DataFrame(recovered).to_csv(O/'RECOVERED_CLASSIC_PBP_PLAYER_REBOUND_EXPOSURE.csv',index=False)
          pd.DataFrame(target_errors).to_csv(O/'CLASSIC_PBP_TARGET_ERRORS.csv',index=False)
          qa={'status':'PASS' if gate else 'CONTROL_GATE_FAIL','affected_seasons':years,'target_missing_player_games':int(len(missing)),'target_games':len(target_games),'control_games_attempted':len(control_games),'control_player_game_passes':pass_n,'control_mismatches':mismatches,'control_game_errors':errors,'minimum_control_player_game_passes':100,'recovered_target_player_games':len(recovered),'target_errors':len(target_errors),'integrity':{'classic_pbp_only_for_lineups':True,'live_boxscore_fallback_disabled':True,'zero_control_mismatches_required':True,'raw_rebound_event_counts_only':True,'empirical_model_used':False,'rounded_percentage_backsolve_used':False,'opponent_rebound_inference_used':False,'partial_tenure_whole_team_subtraction_used':False}}
          (O/'CLASSIC_PBP_ONCOURT_RECOVERY_QA.json').write_text(json.dumps(qa,indent=2)+'\n')
          print(json.dumps(qa,indent=2),flush=True)
          if not gate: raise SystemExit('classic PBP on-court exact control gate failed')
          PY
      - name: Upload exact rebound exposure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TREB-classic-pbp-oncourt-exact-gate-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
