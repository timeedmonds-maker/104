name: TREB V12 Sabonis promotion regression
on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths: [.github/workflows/treb-v12-sabonis-promotion-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  MANIFEST: team_trb_all_players/final_integrity_rebuild/rebound_forensics/CHUNKED_REBOUND_MANIFEST.json
  SOURCE_RUN_ID: '31634201123'
  PYTHONUNBUFFERED: '1'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path(os.environ['MANIFEST']).read_text())
          assert len(m['chunks']) == 24 and m['target_games'] == 58
          x = {'include': [{'chunk_id': c['chunk_id'], 'year': int(c['year']), 'games': ','.join(map(str, c['game_ids']))} for c in m['chunks']]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps(x, separators=(',', ':')) + '\n')
          PY
  audit:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pandas numpy rapidfuzz
      - uses: actions/download-artifact@v4
        with:
          name: treb-residual-source-${{ matrix.year }}-${{ env.SOURCE_RUN_ID }}
          path: /tmp/source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - run: python -u team_trb_all_players/rebound_v12_regression.py --year '${{ matrix.year }}' --games '${{ matrix.games }}' --chunk-id '${{ matrix.chunk_id }}' --nba '/tmp/source/nbastats_${{ matrix.year }}.csv' --v3 '/tmp/source/nbastatsv3_${{ matrix.year }}.csv' --pbp '/tmp/source/pbpstats_${{ matrix.year }}.csv' --output '/tmp/V12REG_${{ matrix.chunk_id }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: treb-v12-reg-${{ matrix.chunk_id }}-${{ github.run_id }}
          path: /tmp/V12REG_${{ matrix.chunk_id }}.json
          retention-days: 90
  aggregate:
    needs: [plan, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-v12-reg-*-${{ github.run_id }}
          path: /tmp/results
      - name: Enforce Sabonis promotion and zero-regression gates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          ps = sorted(Path('/tmp/results').rglob('V12REG_*.json'))
          assert len(ps) == 24, [str(p) for p in ps]
          xs = [json.loads(p.read_text()) for p in ps]
          def agg(sec, name):
              return {k: sum(int(x[sec][name][k]) for x in xs) for k in ('applicable', 'correct', 'wrong')}
          interval = agg('lineup_controls', 'interval_invariant')
          named = agg('live_controls', 'resolved_named_player')
          counter = agg('live_controls', 'counter_credited_player')
          assert interval == {'applicable': 4682, 'correct': 4682, 'wrong': 0}, interval
          assert named == {'applicable': 5034, 'correct': 5034, 'wrong': 0}, named
          assert counter == {'applicable': 5163, 'correct': 5163, 'wrong': 0}, counter
          d = Path('team_trb_all_players/final_integrity_rebuild/rebound_forensics')
          prior = json.loads((d / 'V9_PROMOTION_REGRESSION.json').read_text())
          assert prior['status'] == 'PASS' and prior['v9_residual_rows'] == 15
          prior_rows = prior['residual_rows']
          prior_keys = {(int(r['game_id']), int(r['pbp_index'])) for r in prior_rows}
          targets = {(22201076, 529)}
          assert len(prior_rows) == 15 and len(prior_keys) == 15 and targets <= prior_keys
          residual = [r for x in xs for r in x['residual_rows']]
          after_keys = {(int(r['game_id']), int(r['pbp_index'])) for r in residual}
          expected = prior_keys - targets
          assert len(residual) == 14 and len(after_keys) == 14
          assert after_keys == expected, {'unexpected_added': sorted(after_keys - expected), 'unexpected_removed': sorted(expected - after_keys)}
          out = {
              'status': 'PASS',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'engine': 'production_rebound_v12',
              'prior_v9_residual_rows': 15,
              'promoted_v12_rows': 1,
              'v12_residual_rows': 14,
              'promoted_keys': [list(x) for x in sorted(targets)],
              'non_target_residual_delta_rows': 0,
              'lineup_interval_invariant_controls': interval,
              'named_player_live_controls': named,
              'counter_credited_player_live_controls': counter,
              'existing_control_regressions': 0,
              'residual_rows': residual,
          }
          Path('/tmp/V12_PROMOTION_REGRESSION.json').write_text(json.dumps(out, indent=2) + '\n')
          print(json.dumps({k: v for k, v in out.items() if k != 'residual_rows'}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: treb-v12-promotion-regression-${{ github.run_id }}
          path: /tmp/V12_PROMOTION_REGRESSION.json
          retention-days: 90
# trigger indexed workflow
