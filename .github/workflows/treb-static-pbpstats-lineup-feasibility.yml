name: TREB static PBPStats lineup feasibility
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - '.github/workflows/treb-static-pbpstats-lineup-feasibility.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CURRENT_ARTIFACT_ID: 9275527991
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download authoritative checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current /tmp/out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CURRENT_ARTIFACT_ID}/zip" > /tmp/current.zip
          unzip -q /tmp/current.zip -d /tmp/current
      - name: Restore proven GitHub large-file archive route
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('team_trb_all_players/treb_static_pbpstats_lineup_feasibility.py')
          s=p.read_text()
          old='https://raw.githubusercontent.com/shufinskiy/nba_data/main/datasets'
          new='https://github.com/shufinskiy/nba_data/raw/main/datasets'
          if old not in s:
              raise SystemExit('expected stale raw.githubusercontent archive route not found')
          p.write_text(s.replace(old,new))
          print('archive route corrected to GitHub large-file raw endpoint')
          PY
      - name: Probe exact lineup reconstruction feasibility
        run: python -u team_trb_all_players/treb_static_pbpstats_lineup_feasibility.py --current-dir /tmp/current --out-dir /tmp/out
      - name: Upload durable diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: TREB-static-pbpstats-lineup-feasibility-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
