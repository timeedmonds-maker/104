name: TREB modern lineup bridge 2024

on:
  push:
    branches: [treb-final-production-20260812]
    paths:
      - .github/workflows/treb-modern-lineup-bridge-2024.yml
      - team_trb_all_players/modern_cdn_lineups.py
      - team_trb_all_players/validate_modern_lineups_2024.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - run: python -m pip install -r team_trb_all_players/requirements.txt
      - name: Download 2024 legacy + CDN feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb2024lineups
          python - <<'PY'
          from pathlib import Path
          import subprocess,tarfile,urllib.request
          raw=Path('/tmp/treb2024lineups')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in ('nbastats_2024','cdnnba_2024'):
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Cross-validate modern CDN lineups against solved legacy engine
        shell: bash
        run: |
          set +e
          python -u team_trb_all_players/validate_modern_lineups_2024.py \
            --nba /tmp/treb2024lineups/nbastats_2024.csv \
            --cdn /tmp/treb2024lineups/cdnnba_2024.csv \
            --output /tmp/treb2024lineups/modern_lineup_bridge.json
          code=$?
          echo "validator_exit=$code"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-modern-lineup-bridge-${{ github.sha }}
          path: /tmp/treb2024lineups/modern_lineup_bridge.json
          retention-days: 90
          if-no-files-found: error
