name: Native89 segment sufficient-stat coverage
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-segment-sufficient-stat-coverage.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - name: Inspect exact zero-OREB denominator sources
        run: |
          python - <<'PY'
          import gzip,json,pathlib
          R=pathlib.Path('team_trb_all_players/impact_database/core_checkpoints')
          cases=[('2021-22','1610612752','1627863','Danuel House Jr.'),('2022-23','1610612738','1630551','Justin Champagnie')]
          out=[]
          for season,team,pid,name in cases:
            p=R/season/f'{team}.json.gz'
            with gzip.open(p,'rt',encoding='utf-8') as f:o=json.load(f)
            rd=o.get('rebound_derived') or []
            hits=[]
            for i,x in enumerate(rd):
              if not isinstance(x,dict):continue
              s=json.dumps(x,separators=(',',':'))
              if pid in s or name in s:
                hits.append({'index':i,'row':x})
            # Also print rebound result rows for all rebound metrics and this player.
            rr={}
            for k,v in (o.get('rebound_stat_results') or {}).items():
              if isinstance(v,list):
                h=[x for x in v if isinstance(x,dict) and (str(x.get('Name') or '')==name or pid in json.dumps(x))]
                if h:rr[k]=h
            # inspect all rebound_derived keys/schema plus nearby rows if no direct identity fields
            schema=[]
            for i,x in enumerate(rd[:10]):
              if isinstance(x,dict):schema.append({'index':i,'keys':list(x.keys()),'row':x})
            rec={'case':{'season':season,'team':team,'pid':pid,'name':name},'core_path':str(p),'rebound_stat_results':rr,'rebound_derived_direct_hits':hits,'rebound_derived_schema_sample':schema,'rebound_derived_len':len(rd)}
            out.append(rec)
            print(json.dumps(rec,indent=2))
          pathlib.Path('zero_oreb_denominator_sources.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native89-zero-oreb-denominator-${{ github.run_id }}
          path: zero_oreb_denominator_sources.json
          if-no-files-found: error
