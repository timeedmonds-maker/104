name: TREB counter order audit
on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths: [.github/workflows/treb-counter-order-audit.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: '1'
  MANIFEST: team_trb_all_players/final_integrity_rebuild/rebound_forensics/CHUNKED_REBOUND_MANIFEST.json
  SOURCE_RUN_ID: '31634201123'
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path(os.environ['MANIFEST']).read_text()); assert len(m['chunks'])==24 and m['target_games']==58
          x={'include':[{'chunk_id':c['chunk_id'],'year':int(c['year']),'games':','.join(map(str,c['game_ids']))} for c in m['chunks']]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(x,separators=(',',':'))+'\n')
          PY
  audit:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy rapidfuzz
      - uses: actions/download-artifact@v4
        with:
          name: treb-residual-source-${{ matrix.year }}-${{ env.SOURCE_RUN_ID }}
          path: /tmp/source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - run: |
          python -u team_trb_all_players/rebound_counter_order_audit.py \
            --year '${{ matrix.year }}' --games '${{ matrix.games }}' --chunk-id '${{ matrix.chunk_id }}' \
            --nba '/tmp/source/nbastats_${{ matrix.year }}.csv' \
            --v3 '/tmp/source/nbastatsv3_${{ matrix.year }}.csv' \
            --pbp '/tmp/source/pbpstats_${{ matrix.year }}.csv' \
            --output '/tmp/COUNTER_${{ matrix.chunk_id }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: treb-counter-audit-${{ matrix.chunk_id }}-${{ github.run_id }}
          path: /tmp/COUNTER_${{ matrix.chunk_id }}.json
          retention-days: 90
  aggregate:
    needs: [plan,audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-counter-audit-*-${{ github.run_id }}
          path: /tmp/results
      - name: Aggregate strategy truth table
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          chunks=[json.loads(p.read_text()) for p in sorted(Path('/tmp/results').rglob('COUNTER_*.json'))]; assert len(chunks)==24,len(chunks)
          names=sorted(chunks[0]['strategies']); totals={n:{'applicable':0,'correct':0,'wrong':0,'unresolved':0} for n in names}; mismatches={n:[] for n in names}
          for c in chunks:
              for n in names:
                  for k in totals[n]:totals[n][k]+=int(c['strategies'][n][k])
                  mismatches[n].extend(c['mismatches'][n])
          zero_wrong=[n for n,v in totals.items() if v['wrong']==0]
          best=sorted(names,key=lambda n:(totals[n]['wrong'],totals[n]['unresolved'],-totals[n]['correct']))
          out={'status':'COMPLETE','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'strategies':totals,'zero_wrong_strategies':zero_wrong,'best_order':best,'mismatches':mismatches}
          Path('/tmp/COUNTER_ORDER_AUDIT_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps({k:v for k,v in out.items() if k!='mismatches'},indent=2))
          PY
      - name: Persist checkpoint
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-batched-game-facts-20260812; git reset --hard origin/agent/treb-batched-game-facts-20260812
          D=team_trb_all_players/final_integrity_rebuild/rebound_forensics; cp /tmp/COUNTER_ORDER_AUDIT_SUMMARY.json "$D/"
          git add -f "$D/COUNTER_ORDER_AUDIT_SUMMARY.json"
          if ! git diff --cached --quiet; then git commit -m 'Persist rebound counter ordering audit'; git push origin HEAD:agent/treb-batched-game-facts-20260812; fi
      - uses: actions/upload-artifact@v4
        with:
          name: treb-counter-order-audit-summary-${{ github.run_id }}
          path: /tmp/COUNTER_ORDER_AUDIT_SUMMARY.json
          retention-days: 90
