# Relaunch final exact-count production release from the current durable state.
name: TREB final exact-count production release

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-final-exact-production-release.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  LOCK_PATH: team_trb_all_players/impact_database/final_local_rebuild/locked_seasons
  OUT: /tmp/treb_final_exact
  EXPECTED_DETAIL_ROWS: '14524'
  EXPECTED_CAREER_PLAYERS: '3122'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact-assembly branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install release readers
        run: python -m pip install --disable-pip-version-check pandas pyarrow

      - name: Recover 26 validated safe locks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/treb_locks "$OUT"
          mkdir -p /tmp/treb_locks "$OUT"
          for y in $(seq 2000 2025); do
            b="treb-final-safe-lock-${y}"
            season="$(printf '%d-%02d' "$y" "$(( (y + 1) % 100 ))")"
            git fetch --no-tags --depth=1 origin "refs/heads/${b}:refs/remotes/origin/${b}"
            git show "refs/remotes/origin/${b}:${LOCK_PATH}/${season}.json" > "/tmp/treb_locks/${season}.json"
          done
          test "$(find /tmp/treb_locks -maxdepth 1 -name '*.json' | wc -l)" -eq 26

      - name: Consolidate exact locked counts
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/finalize_treb_database.py \
            --locks-dir /tmp/treb_locks \
            --output-dir "$OUT"

      - name: Enforce exact-count and canonical release gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          import pandas as pd

          out=Path(os.environ['OUT'])
          detail=pd.read_csv(out/'career_treb_detail.csv', low_memory=False)
          career=pd.read_csv(out/'career_treb_summary.csv', low_memory=False)
          qa=json.loads((out/'qa_report.json').read_text())
          count_cols=[
            'team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on',
            'team_oreb_off','team_dreb_off','opponent_oreb_off','opponent_dreb_off'
          ]
          exp_rows=int(os.environ['EXPECTED_DETAIL_ROWS'])
          exp_players=int(os.environ['EXPECTED_CAREER_PLAYERS'])

          assert qa['status']=='PASS', qa
          assert qa['seasons_complete']==26, qa
          assert qa['first_season']=='2000-01' and qa['last_season']=='2025-26', qa
          assert qa['duplicate_tenure_keys']==0, qa
          assert qa['unexpected_exceptions']==0, qa
          assert qa['unmatched_rebound_rows']==0, qa
          assert qa['accepted_exclusion_ledger_exact_match'] is True, qa
          assert len(detail)==exp_rows, (len(detail),exp_rows)
          assert len(career)==exp_players, (len(career),exp_players)
          assert detail['player_id'].nunique()==exp_players, detail['player_id'].nunique()
          assert career['player_id'].nunique()==exp_players, career['player_id'].nunique()
          assert detail['season'].nunique()==26, detail['season'].nunique()

          for col in count_cols+['seconds_on','seconds_off','games_processed']:
            s=pd.to_numeric(detail[col],errors='raise')
            assert s.notna().all(), col
            assert (s>=0).all(), col
            delta=(s-s.round()).abs()
            assert float(delta.max()) < 1e-9, (col,float(delta.max()))

          # Rates must be derived only from the stored exact counts.
          def ratio(a,b):
            den=a+b
            return a/den.where(den.ne(0))
          calc={
            'treb_on': ratio(detail.team_oreb_on+detail.team_dreb_on, detail.opponent_oreb_on+detail.opponent_dreb_on),
            'treb_off': ratio(detail.team_oreb_off+detail.team_dreb_off, detail.opponent_oreb_off+detail.opponent_dreb_off),
            'oreb_pct_on': ratio(detail.team_oreb_on, detail.opponent_dreb_on),
            'oreb_pct_off': ratio(detail.team_oreb_off, detail.opponent_dreb_off),
            'dreb_pct_on': ratio(detail.team_dreb_on, detail.opponent_oreb_on),
            'dreb_pct_off': ratio(detail.team_dreb_off, detail.opponent_oreb_off),
          }
          for col,x in calc.items():
            y=pd.to_numeric(detail[col],errors='coerce')
            d=(x-y).abs().dropna()
            assert d.empty or float(d.max()) < 1e-12, (col,float(d.max()))

          detail.to_parquet(out/'career_treb_detail.parquet',index=False)
          career.to_parquet(out/'career_treb_summary.parquet',index=False)
          gate={
            'status':'PASS',
            'exact_count_only':True,
            'rounded_percentage_backsolve_used':False,
            'detail_rows':len(detail),
            'career_players':len(career),
            'seasons':detail.season.nunique(),
            'count_columns_integer_nonnegative':True,
            'rates_recomputed_from_exact_counts':True,
          }
          (out/'EXACT_COUNT_RELEASE_GATE.json').write_text(json.dumps(gate,indent=2)+'\n')
          print(json.dumps(gate,indent=2))
          PY

      - name: Record accepted V13 residual provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          residuals=[
            [21700032,4988],[21700042,7322],[21700494,7412],[21800689,1396],
            [21800689,1398],[22101023,256],[22200322,3388],[22200331,3717],
            [22200331,3912],[22200733,5955],[22201187,1569],[22201187,1573],
            [22400072,288]
          ]
          d={
            'status':'ACCEPTED_IMMATERIAL_CAPTAINS_CALL',
            'accepted_date':'2026-08-13',
            'scope':'exact V13 residual rebound-event keys only',
            'residual_rebound_events':len(residuals),
            'unique_games':len({x[0] for x in residuals}),
            'residual_keys':residuals,
            'structural_gates_relaxed':False,
            'generic_rebound_ordering_rule_introduced':False
          }
          Path(os.environ['OUT'],'captains_call_accepted_residuals.json').write_text(json.dumps(d,indent=2)+'\n')
          PY

      - name: Independent CSV Parquet SQLite validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          import pandas as pd
          out=Path(os.environ['OUT'])
          d_csv=pd.read_csv(out/'career_treb_detail.csv',low_memory=False)
          c_csv=pd.read_csv(out/'career_treb_summary.csv',low_memory=False)
          d_pq=pd.read_parquet(out/'career_treb_detail.parquet')
          c_pq=pd.read_parquet(out/'career_treb_summary.parquet')
          with sqlite3.connect(out/'treb_2000_01_to_2025_26.sqlite') as con:
            d_sql=pd.read_sql_query('select * from tenure_detail',con)
            c_sql=pd.read_sql_query('select * from career_summary',con)
          assert len(d_csv)==len(d_pq)==len(d_sql)==int(os.environ['EXPECTED_DETAIL_ROWS'])
          assert len(c_csv)==len(c_pq)==len(c_sql)==int(os.environ['EXPECTED_CAREER_PLAYERS'])
          cols=['team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on','team_oreb_off','team_dreb_off','opponent_oreb_off','opponent_dreb_off','seconds_on','seconds_off','games_processed']
          totals={}
          for col in cols:
            vals=[float(pd.to_numeric(x[col]).sum()) for x in (d_csv,d_pq,d_sql)]
            assert max(vals)-min(vals)<1e-6,(col,vals)
            totals[col]=vals[0]
          report={'status':'PASS','csv_parquet_sqlite_row_counts_identical':True,'count_and_second_totals_identical':True,'detail_rows':len(d_csv),'career_players':len(c_csv),'detail_totals':totals}
          (out/'reader_validation.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Package and hash final database
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUT"
          sha256sum \
            career_treb_detail.csv career_treb_summary.csv \
            career_treb_detail.parquet career_treb_summary.parquet \
            treb_2000_01_to_2025_26.sqlite accepted_exclusions.csv \
            season_lock_manifest.csv qa_report.json reader_validation.json \
            EXACT_COUNT_RELEASE_GATE.json captains_call_accepted_residuals.json README.txt \
            > SHA256SUMS.txt
          zip -9 -q -r /tmp/TREB_final_database_2000-01_to_2025-26.zip .
          sha256sum /tmp/TREB_final_database_2000-01_to_2025-26.zip > /tmp/TREB_final_database_2000-01_to_2025-26.zip.sha256

      - name: Write final build report
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['OUT']); z=Path('/tmp/TREB_final_database_2000-01_to_2025-26.zip')
          qa=json.loads((out/'qa_report.json').read_text()); gate=json.loads((out/'EXACT_COUNT_RELEASE_GATE.json').read_text()); reader=json.loads((out/'reader_validation.json').read_text())
          report={
            'status':'PASS','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'source_branch':os.environ['GITHUB_REF_NAME'],'source_commit':os.environ['GITHUB_SHA'],
            'seasons':26,'season_range':['2000-01','2025-26'],
            'tenure_detail_rows':qa['tenure_detail_rows'],'career_players':qa['career_players'],
            'exact_count_gate':gate['status'],'reader_validation':reader['status'],
            'rounded_percentage_backsolve_used':False,
            'captains_call_residual_rebounds_accepted':13,
            'package':z.name,'package_sha256':hashlib.sha256(z.read_bytes()).hexdigest()
          }
          (out/'FINAL_EXACT_PRODUCTION_BUILD_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Upload final exact database
        uses: actions/upload-artifact@v4
        with:
          name: TREB-final-exact-database-${{ github.run_id }}
          path: |
            /tmp/TREB_final_database_2000-01_to_2025-26.zip
            /tmp/TREB_final_database_2000-01_to_2025-26.zip.sha256
            /tmp/treb_final_exact/FINAL_EXACT_PRODUCTION_BUILD_REPORT.json
            /tmp/treb_final_exact/qa_report.json
            /tmp/treb_final_exact/EXACT_COUNT_RELEASE_GATE.json
            /tmp/treb_final_exact/reader_validation.json
          retention-days: 90

      - name: Persist release provenance
        shell: bash
        run: |
          set -euo pipefail
          D=team_trb_all_players/final_integrity_rebuild/final_exact_release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-final-exact-assembly
          git reset --hard origin/agent/treb-final-exact-assembly
          mkdir -p "$D"
          cp "$OUT/FINAL_EXACT_PRODUCTION_BUILD_REPORT.json" "$D/"
          cp "$OUT/qa_report.json" "$D/FINAL_QA_REPORT.json"
          cp "$OUT/EXACT_COUNT_RELEASE_GATE.json" "$D/"
          cp "$OUT/reader_validation.json" "$D/FINAL_READER_VALIDATION.json"
          cp "$OUT/captains_call_accepted_residuals.json" "$D/CAPTAINS_CALL_ACCEPTED_RESIDUALS.json"
          cp "$OUT/SHA256SUMS.txt" "$D/FINAL_SHA256SUMS.txt"
          git add -f "$D"
          git commit -m 'Persist exact-count final TREB release provenance'
          git push origin HEAD:agent/treb-final-exact-assembly
