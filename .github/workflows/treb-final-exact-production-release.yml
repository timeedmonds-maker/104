# Production release: 89 Stage2 metrics, exact-count overlay on validated partial tenures, direct Stage2 full-core values.
name: TREB final 89-metric exact production release

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-final-exact-production-release.yml]
  workflow_dispatch:

concurrency:
  group: treb-final-89-metric-production-release
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  LOCK_PATH: team_trb_all_players/impact_database/final_local_rebuild/locked_seasons
  OUT: /tmp/treb_final_exact
  STAGE2_SHA: 57ba237c36d75f7a3ef2cc998d91aa70a59b3c29
  EXPECTED_EXACT_SEGMENTS: '5199'
  EXPECTED_PARTIAL_ROWS: '4877'
  EXPECTED_FULL_CORE_ROWS: '9647'
  EXPECTED_DETAIL_ROWS: '14524'
  EXPECTED_CAREER_PLAYERS: '3122'
  EXPECTED_METRICS: '89'
  EXPECTED_STAGE2_WINDOWS: '15206'
  EXPECTED_STAGE2_METRIC_ROWS: '1353334'
  EXPECTED_PLAYER_TEAM_METRIC_ROWS: '1292636'
  EXPECTED_CAREER_METRIC_ROWS: '277858'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact-assembly branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install release readers
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow duckdb

      - name: Recover 26 validated safe locks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/treb_locks /tmp/treb_stage2 "$OUT"
          mkdir -p /tmp/treb_locks "$OUT"
          for y in $(seq 2000 2025); do
            b="treb-final-safe-lock-${y}"
            season="$(printf '%d-%02d' "$y" "$(( (y + 1) % 100 ))")"
            git fetch --no-tags --depth=1 origin "refs/heads/${b}:refs/remotes/origin/${b}"
            git show "refs/remotes/origin/${b}:${LOCK_PATH}/${season}.json" > "/tmp/treb_locks/${season}.json"
          done
          test "$(find /tmp/treb_locks -maxdepth 1 -name '*.json' | wc -l)" -eq 26

      - name: Consolidate exact locked partial rebound counts
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/finalize_treb_database.py \
            --locks-dir /tmp/treb_locks \
            --output-dir "$OUT"

      - name: Enforce exact partial rebound gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          out=Path(os.environ['OUT'])
          detail=pd.read_csv(out/'career_treb_detail.csv',low_memory=False)
          career=pd.read_csv(out/'career_treb_summary.csv',low_memory=False)
          qa=json.loads((out/'qa_report.json').read_text())
          assert qa['status']=='PASS' and qa['seasons_complete']==26, qa
          assert qa['duplicate_tenure_keys']==0 and qa['unexpected_exceptions']==0 and qa['unmatched_rebound_rows']==0, qa
          assert qa['accepted_exclusion_ledger_exact_match'] is True, qa
          assert len(detail)==int(os.environ['EXPECTED_EXACT_SEGMENTS']), len(detail)
          assert len(career)==qa['career_players'], (len(career),qa['career_players'])
          counts=['team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on','team_oreb_off','team_dreb_off','opponent_oreb_off','opponent_dreb_off']
          for col in counts+['seconds_on','seconds_off','games_processed']:
            s=pd.to_numeric(detail[col],errors='raise')
            assert s.notna().all() and (s>=0).all(), col
            assert float((s-s.round()).abs().max())<1e-9, col
          def ratio(a,b):
            den=a+b
            return a/den.where(den.ne(0))
          calc={
            'treb_on':ratio(detail.team_oreb_on+detail.team_dreb_on,detail.opponent_oreb_on+detail.opponent_dreb_on),
            'treb_off':ratio(detail.team_oreb_off+detail.team_dreb_off,detail.opponent_oreb_off+detail.opponent_dreb_off),
            'oreb_pct_on':ratio(detail.team_oreb_on,detail.opponent_dreb_on),'oreb_pct_off':ratio(detail.team_oreb_off,detail.opponent_dreb_off),
            'dreb_pct_on':ratio(detail.team_dreb_on,detail.opponent_oreb_on),'dreb_pct_off':ratio(detail.team_dreb_off,detail.opponent_oreb_off),
          }
          for col,x in calc.items():
            d=(x-pd.to_numeric(detail[col],errors='coerce')).abs().dropna()
            assert d.empty or float(d.max())<1e-12,(col,float(d.max()))
          detail.to_parquet(out/'career_treb_detail.parquet',index=False)
          career.to_parquet(out/'career_treb_summary.parquet',index=False)
          gate={
            'status':'PASS',
            'scope':'validated_partial_tenure_segments',
            'exact_count_segment_rows':len(detail),
            'exact_partial_career_support_players':len(career),
            'seasons':detail.season.nunique(),
            'rounded_percentage_backsolve_used':False,
            'rates_recomputed_from_exact_counts':True
          }
          (out/'EXACT_COUNT_RELEASE_GATE.json').write_text(json.dumps(gate,indent=2)+'\n')
          print(json.dumps(gate,indent=2))
          PY

      - name: Assemble all 89 established Stage2 metrics with exact partial rebound overlay
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin treb-stage2-actions-live
          git cat-file -e "${STAGE2_SHA}^{commit}"
          git worktree add --detach /tmp/treb_stage2 "$STAGE2_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/treb_stage2/team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json')
          d=json.loads(p.read_text())
          expected_windows=int(os.environ['EXPECTED_STAGE2_WINDOWS'])
          expected_rows=int(os.environ['EXPECTED_STAGE2_METRIC_ROWS'])
          assert d.get('all_complete') is True, d
          assert int(d.get('impact_windows_total') or -1)==expected_windows, d
          assert int(d.get('complete_windows') or -1)==expected_windows, d
          assert int(d.get('remaining_windows') or -1)==0, d
          assert int(d.get('failed_windows') or -1)==0, d
          assert int(d.get('metric_rows') or -1)==expected_rows, d
          # Compatibility only: the pinned finalizer predates impact_windows_total and
          # expects the equivalent legacy field impact_windows_requested.
          d['impact_windows_requested']=d['impact_windows_total']
          p.write_text(json.dumps(d,indent=2)+'\n')
          print(json.dumps({'status':'PASS','stage2_schema_compatibility':'impact_windows_requested <- impact_windows_total','windows':expected_windows,'metric_rows':expected_rows},indent=2))
          PY
          python -u /tmp/treb_stage2/team_trb_all_players/finalize_corrected_off_package.py
          python -u team_trb_all_players/finalize_treb_full_89_database.py \
            --stage2-export-dir /tmp/treb_stage2/team_trb_all_players/impact_database/corrected_off/final_export \
            --exact-dir "$OUT" \
            --stage2-sha "$STAGE2_SHA"

      - name: Enforce complete 89-metric release gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          q=json.loads((out/'ALL_89_METRICS_QA.json').read_text())
          assert q['status']=='PASS',q
          assert q['metric_count']==int(os.environ['EXPECTED_METRICS'])==89,q
          assert q['stage2_windows']==int(os.environ['EXPECTED_STAGE2_WINDOWS'])==15206,q
          assert q['stage2_source_metric_rows']==int(os.environ['EXPECTED_STAGE2_METRIC_ROWS'])==1353334,q
          assert q['canonical_player_team_season_rows']==int(os.environ['EXPECTED_DETAIL_ROWS'])==14524,q
          assert q['exact_count_segment_rows']==int(os.environ['EXPECTED_EXACT_SEGMENTS'])==5199,q
          assert q['exact_count_partial_player_team_rows']==int(os.environ['EXPECTED_PARTIAL_ROWS'])==4877,q
          assert q['full_core_stage2_direct_rows']==int(os.environ['EXPECTED_FULL_CORE_ROWS'])==9647,q
          assert q['player_team_season_metric_rows']==int(os.environ['EXPECTED_PLAYER_TEAM_METRIC_ROWS'])==1292636,q
          assert q['career_players']==int(os.environ['EXPECTED_CAREER_PLAYERS'])==3122,q
          assert q['career_metric_rows']==int(os.environ['EXPECTED_CAREER_METRIC_ROWS'])==277858,q
          assert set(q['exact_count_overlay_metrics'])=={'TotalReboundPct','OffReboundPct','DefReboundPct'},q
          assert q['exact_count_overlay_metric_rows']==4877*3,q
          assert q['stage2_direct_rebound_metric_rows']==9647*3,q
          assert q['all_89_metrics_present_for_every_canonical_key'] is True,q
          assert q['career_89_metrics_present_for_every_player'] is True,q
          assert q['rounded_percentage_backsolve_used'] is False,q
          print(json.dumps(q,indent=2))
          PY

      - name: Record accepted V13 residual provenance
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          residuals=[[21700032,4988],[21700042,7322],[21700494,7412],[21800689,1396],[21800689,1398],[22101023,256],[22200322,3388],[22200331,3717],[22200331,3912],[22200733,5955],[22201187,1569],[22201187,1573],[22400072,288]]
          d={'status':'ACCEPTED_IMMATERIAL_CAPTAINS_CALL','accepted_date':'2026-08-13','scope':'exact V13 residual rebound-event keys only','residual_rebound_events':13,'unique_games':len({x[0] for x in residuals}),'residual_keys':residuals,'structural_gates_relaxed':False,'generic_rebound_ordering_rule_introduced':False}
          Path(os.environ['OUT'],'captains_call_accepted_residuals.json').write_text(json.dumps(d,indent=2)+'\n')
          PY

      - name: Independent supporting exact and complete all-metric reader validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb,json,os,sqlite3
          from pathlib import Path
          import pandas as pd
          out=Path(os.environ['OUT'])
          qa=json.loads((out/'qa_report.json').read_text())
          d_csv=pd.read_csv(out/'career_treb_detail.csv',low_memory=False); d_pq=pd.read_parquet(out/'career_treb_detail.parquet')
          c_csv=pd.read_csv(out/'career_treb_summary.csv',low_memory=False); c_pq=pd.read_parquet(out/'career_treb_summary.parquet')
          with sqlite3.connect(out/'treb_2000_01_to_2025_26.sqlite') as con:
            d_sql=int(pd.read_sql_query('select count(*) n from tenure_detail',con).iloc[0,0]); c_sql=int(pd.read_sql_query('select count(*) n from career_summary',con).iloc[0,0])
          assert len(d_csv)==len(d_pq)==d_sql==int(os.environ['EXPECTED_EXACT_SEGMENTS'])
          assert len(c_csv)==len(c_pq)==c_sql==qa['career_players']
          m_csv=pd.read_csv(out/'all_metrics_player_team_season.csv.gz',compression='gzip',low_memory=False)
          m_pq=pd.read_parquet(out/'all_metrics_player_team_season.parquet')
          mc_csv=pd.read_csv(out/'all_metrics_career.csv.gz',compression='gzip',low_memory=False)
          mc_pq=pd.read_parquet(out/'all_metrics_career.parquet')
          assert len(m_csv)==len(m_pq)==int(os.environ['EXPECTED_PLAYER_TEAM_METRIC_ROWS'])
          assert len(mc_csv)==len(mc_pq)==int(os.environ['EXPECTED_CAREER_METRIC_ROWS'])
          assert m_csv.metric.nunique()==mc_csv.metric.nunique()==89
          con=duckdb.connect(str(out/'TREB_all_metrics.duckdb'),read_only=True)
          n1=con.execute('select count(*) from all_metrics_player_team_season').fetchone()[0]
          n2=con.execute('select count(*) from all_metrics_career').fetchone()[0]
          n3=con.execute('select count(*) from metric_dictionary').fetchone()[0]
          con.close()
          assert n1==len(m_csv) and n2==len(mc_csv) and n3==89,(n1,n2,n3)
          report={
            'status':'PASS',
            'supporting_exact_csv_parquet_sqlite_rows_identical':True,
            'all_metrics_csv_parquet_duckdb_rows_identical':True,
            'metric_count':89,
            'canonical_player_team_seasons':int(os.environ['EXPECTED_DETAIL_ROWS']),
            'player_team_metric_rows':len(m_csv),
            'career_players':int(os.environ['EXPECTED_CAREER_PLAYERS']),
            'career_metric_rows':len(mc_csv)
          }
          (out/'reader_validation.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Package and hash complete final database
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUT"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          zip -9 -q -r /tmp/TREB_final_database_2000-01_to_2025-26.zip .
          sha256sum /tmp/TREB_final_database_2000-01_to_2025-26.zip > /tmp/TREB_final_database_2000-01_to_2025-26.zip.sha256

      - name: Write final build report
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['OUT']); z=Path('/tmp/TREB_final_database_2000-01_to_2025-26.zip')
          support=json.loads((out/'qa_report.json').read_text())
          gate=json.loads((out/'EXACT_COUNT_RELEASE_GATE.json').read_text())
          all89=json.loads((out/'ALL_89_METRICS_QA.json').read_text())
          reader=json.loads((out/'reader_validation.json').read_text())
          report={
            'status':'PASS','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'source_branch':os.environ['GITHUB_REF_NAME'],'source_commit':os.environ['GITHUB_SHA'],
            'seasons':26,'season_range':['2000-01','2025-26'],
            'canonical_player_team_seasons':all89['canonical_player_team_season_rows'],
            'full_core_rows':all89['full_core_stage2_direct_rows'],
            'partial_player_team_season_rows':all89['exact_count_partial_player_team_rows'],
            'exact_partial_segments':all89['exact_count_segment_rows'],
            'career_players':all89['career_players'],'metric_count':all89['metric_count'],
            'player_team_metric_rows':all89['player_team_season_metric_rows'],
            'career_metric_rows':all89['career_metric_rows'],
            'stage2_source_metric_rows':all89['stage2_source_metric_rows'],
            'exact_partial_gate':gate['status'],'all_89_metric_gate':all89['status'],'reader_validation':reader['status'],
            'rounded_percentage_backsolve_used':False,
            'captains_call_residual_rebounds_accepted':13,
            'supporting_exact_lock_qa':support['status'],
            'package':z.name,'package_sha256':hashlib.sha256(z.read_bytes()).hexdigest()
          }
          (out/'FINAL_EXACT_PRODUCTION_BUILD_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Upload complete 89-metric database
        uses: actions/upload-artifact@v4
        with:
          name: TREB-final-89-metric-database-${{ github.run_id }}
          path: |
            /tmp/TREB_final_database_2000-01_to_2025-26.zip
            /tmp/TREB_final_database_2000-01_to_2025-26.zip.sha256
            /tmp/treb_final_exact/FINAL_EXACT_PRODUCTION_BUILD_REPORT.json
            /tmp/treb_final_exact/qa_report.json
            /tmp/treb_final_exact/EXACT_COUNT_RELEASE_GATE.json
            /tmp/treb_final_exact/ALL_89_METRICS_QA.json
            /tmp/treb_final_exact/reader_validation.json
          retention-days: 90

      - name: Persist release provenance
        shell: bash
        run: |
          set -euo pipefail
          D=team_trb_all_players/final_integrity_rebuild/final_exact_release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-final-exact-assembly
          git reset --hard origin/agent/treb-final-exact-assembly
          mkdir -p "$D"
          cp "$OUT/FINAL_EXACT_PRODUCTION_BUILD_REPORT.json" "$D/"
          cp "$OUT/qa_report.json" "$D/FINAL_QA_REPORT.json"
          cp "$OUT/EXACT_COUNT_RELEASE_GATE.json" "$D/"
          cp "$OUT/ALL_89_METRICS_QA.json" "$D/"
          cp "$OUT/reader_validation.json" "$D/FINAL_READER_VALIDATION.json"
          cp "$OUT/captains_call_accepted_residuals.json" "$D/CAPTAINS_CALL_ACCEPTED_RESIDUALS.json"
          cp "$OUT/SHA256SUMS.txt" "$D/FINAL_SHA256SUMS.txt"
          git add -f "$D"
          git commit -m 'Persist complete 89-metric TREB release provenance'
          git push origin HEAD:agent/treb-final-exact-assembly
