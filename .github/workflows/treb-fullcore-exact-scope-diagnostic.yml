name: TREB full-core exact scope diagnostic

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-fullcore-exact-scope-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Fetch durable source refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/treb-game-facts-*:refs/remotes/origin/treb-game-facts-*' \
            '+refs/heads/treb-stage2-actions-live:refs/remotes/origin/treb-stage2-actions-live' \
            '+refs/heads/treb-game-fact-repair-wave1:refs/remotes/origin/treb-game-fact-repair-wave1' \
            '+refs/heads/treb-fast-final-repair-wave:refs/remotes/origin/treb-fast-final-repair-wave'
      - name: Diagnose core scope and exact evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,io,json,subprocess
          from collections import defaultdict
          from pathlib import Path
          import pandas as pd

          STAGE='refs/remotes/origin/treb-stage2-actions-live'
          W1='refs/remotes/origin/treb-game-fact-repair-wave1'
          FF='refs/remotes/origin/treb-fast-final-repair-wave'
          def show(ref,path):
            p=subprocess.run(['git','show',f'{ref}:{path}'],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
            return p.stdout if p.returncode==0 else None
          def read_csv_gz(ref,path):
            b=show(ref,path)
            return None if b is None else pd.read_csv(io.BytesIO(b),compression='gzip',low_memory=False)
          def read_jsonl_gz(ref,path):
            b=show(ref,path); rows=[]
            if b is None:return rows
            with gzip.GzipFile(fileobj=io.BytesIO(b)) as f:
              for ln in f:
                if ln.strip(): rows.append(json.loads(ln))
            return rows
          def ids(x):
            s=str(x).strip(); return s[:-2] if s.endswith('.0') and s[:-2].isdigit() else s

          canon=read_jsonl_gz(STAGE,'team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz')
          full=[r for r in canon if bool(r.get('full_core_reuse'))]
          assert len(canon)==14524 and len(full)==9647,(len(canon),len(full))

          report={'canonical_rows':len(canon),'full_rows':len(full),'unique_players':len({ids(r['player_id']) for r in canon}),'seasons':{}}
          # Inspect core evidence availability all 26 seasons.
          for y in range(2000,2026):
            s=f'{y}-{(y+1)%100:02d}'
            d=read_csv_gz(STAGE,f'team_trb_all_players/impact_database/outputs/{s}/team_rebound_derived.csv.gz')
            m=read_csv_gz(STAGE,f'team_trb_all_players/impact_database/outputs/{s}/team_on_off_metrics.csv.gz')
            info={'full_rows':sum(1 for r in full if str(r['season'])==s)}
            if d is not None:
              info['derived_columns']=list(d.columns)
              for c in ['opponent_rebounds_exact','opponent_off_rebound_candidates','opponent_def_rebound_candidates']:
                if c in d.columns:
                  info[c+'_non_null']=int(d[c].notna().sum())
            if m is not None:
              info['metrics_rows']=len(m); info['metric_names']=sorted(set(m.metric.astype(str)))
            report['seasons'][s]=info

          # Build exact union for 2006-24: base successful + W1 recovered + fast-final recovered.
          exact_summary={}
          for y in range(2006,2025):
            s=f'{y}-{(y+1)%100:02d}'
            team_parts=[]; player_parts=[]
            refs=subprocess.check_output(['git','for-each-ref','--format=%(refname)','refs/remotes/origin/treb-game-facts-'+str(y)+'-batch-']).decode().splitlines()
            for ref in refs:
              # discover batch path
              names=subprocess.check_output(['git','ls-tree','-r','--name-only',ref]).decode().splitlines()
              for nm in names:
                if nm.endswith('/team_game_treb.csv.gz') and f'exact_game_fact_batches/{s}/' in nm:
                  x=read_csv_gz(ref,nm)
                  if x is not None and len(x): team_parts.append(x)
                elif nm.endswith('/player_game_treb_on.csv.gz') and f'exact_game_fact_batches/{s}/' in nm:
                  x=read_csv_gz(ref,nm)
                  if x is not None and len(x): player_parts.append(x)
            # Wave1 exact recovered games.
            for ref,base in [(W1,f'team_trb_all_players/final_integrity_rebuild/game_fact_repair_wave1/{y}'),(FF,f'team_trb_all_players/final_integrity_rebuild/fast_final_repair_wave/{y}')]:
              x=read_csv_gz(ref,base+'/team_game_treb.csv.gz'); p=read_csv_gz(ref,base+'/player_game_treb_on.csv.gz')
              if x is not None and len(x): team_parts.append(x)
              if p is not None and len(p): player_parts.append(p)
            if not team_parts: continue
            t=pd.concat(team_parts,ignore_index=True); p=pd.concat(player_parts,ignore_index=True)
            # Later overlays win by game/team/player key.
            t=t.drop_duplicates(['game_id','team_id'],keep='last')
            p=p.drop_duplicates(['game_id','team_id','player_id'],keep='last')
            exact_summary[s]={'team_game_rows':len(t),'games':int(t.game_id.nunique()),'player_game_rows':len(p)}

            # Core own-count comparison for full rows in this season.
            m=read_csv_gz(STAGE,f'team_trb_all_players/impact_database/outputs/{s}/team_on_off_metrics.csv.gz')
            if m is None: continue
            m=m[m.metric.astype(str).isin(['OffRebounds','DefRebounds'])].copy()
            m['pid']=m.subject_player_id.map(ids); m['team_id']=pd.to_numeric(m.team_id).astype(int)
            midx={(r.pid,int(r.team_id),str(r.metric)):r for _,r in m.iterrows()}
            tgrp=t.groupby('team_id')[['team_oreb','team_dreb','opponent_oreb','opponent_dreb','game_seconds']].sum()
            p['pid']=p.player_id.map(ids); p['team_id']=pd.to_numeric(p.team_id).astype(int)
            pgrp=p.groupby(['pid','team_id'])[['seconds_on','team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on']].sum()
            cmp=[]
            for r in full:
              if str(r['season'])!=s: continue
              pid=ids(r['player_id']); tid=int(r['team_id'])
              if tid not in tgrp.index or (pid,tid) not in pgrp.index: continue
              if (pid,tid,'OffRebounds') not in midx or (pid,tid,'DefRebounds') not in midx: continue
              og=midx[(pid,tid,'OffRebounds')]; dg=midx[(pid,tid,'DefRebounds')]; pg=pgrp.loc[(pid,tid)]; tg=tgrp.loc[tid]
              vals={
                'oreb_on_exact':int(pg.team_oreb_on),'oreb_off_exact':int(tg.team_oreb-pg.team_oreb_on),
                'dreb_on_exact':int(pg.team_dreb_on),'dreb_off_exact':int(tg.team_dreb-pg.team_dreb_on),
                'oreb_on_core':int(round(float(og['on']))),'oreb_off_core':int(round(float(og['off']))),
                'dreb_on_core':int(round(float(dg['on']))),'dreb_off_core':int(round(float(dg['off']))),
              }
              vals['match']=all(vals[a]==vals[b] for a,b in [('oreb_on_exact','oreb_on_core'),('oreb_off_exact','oreb_off_core'),('dreb_on_exact','dreb_on_core'),('dreb_off_exact','dreb_off_core')])
              cmp.append(vals)
            if cmp:
              exact_summary[s]['full_compared']=len(cmp); exact_summary[s]['full_exact_own_count_matches']=sum(x['match'] for x in cmp)
              exact_summary[s]['match_pct']=round(100*sum(x['match'] for x in cmp)/len(cmp),4)
          report['exact_game_fact_scope']=exact_summary
          Path('/tmp/FULLCORE_EXACT_SCOPE_DIAGNOSTIC.json').write_text(json.dumps(report,indent=2,default=str)+'\n')
          print(json.dumps(report,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-fullcore-exact-scope-${{ github.run_id }}
          path: /tmp/FULLCORE_EXACT_SCOPE_DIAGNOSTIC.json
          retention-days: 90
      - name: Persist diagnostic
        shell: bash
        run: |
          set -euo pipefail
          D=team_trb_all_players/final_integrity_rebuild/final_exact_release
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/treb-final-exact-assembly
          git reset --hard origin/agent/treb-final-exact-assembly
          mkdir -p "$D"; cp /tmp/FULLCORE_EXACT_SCOPE_DIAGNOSTIC.json "$D/"
          git add -f "$D/FULLCORE_EXACT_SCOPE_DIAGNOSTIC.json"
          git commit -m 'Persist full-core exact scope diagnostic'
          git push origin HEAD:agent/treb-final-exact-assembly
