name: Render top25 oncourt missed3 OREB
on:
  push:
    paths:
      - 'scripts/render_top25_oncourt_missed3_oreb.py'
      - '.github/workflows/render_top25_oncourt_missed3_oreb.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow requests
      - run: python scripts/render_top25_oncourt_missed3_oreb.py
      - name: Commit outputs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add outputs/top25_oncourt_3pt_miss_oreb.png outputs/top25_oncourt_3pt_miss_oreb_7200.png
          git diff --cached --quiet || git commit -m 'Render top25 oncourt missed3 OREB graphic'
          git push