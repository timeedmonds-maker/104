name: TREB 272 missing primitives exact fanout

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-272-missing-primitives-fanout.yml

permissions:
  contents: read
  actions: read

env:
  CLOSURE_ARTIFACT_ID: '9258172940'

jobs:
  recover:
    name: exact missing primitives ${{ matrix.year }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 22
      matrix:
        year: [2000,2001,2004,2006,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reconstruction dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz
      - name: Download closure diagnostics and retained season feeds
        timeout-minutes: 14
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          y='${{ matrix.year }}'
          mkdir -p /tmp/closure /tmp/src /tmp/out
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/${CLOSURE_ARTIFACT_ID}/zip > /tmp/closure.zip
          unzip -q /tmp/closure.zip -d /tmp/closure
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/list_data.txt https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          python - "$y" <<'PY' > /tmp/urls.tsv
          import sys
          y=sys.argv[1]; vals={}
          for line in open('/tmp/list_data.txt',encoding='utf-8'):
            if '=' in line:
              k,v=line.split('=',1); vals[k.strip()]=v.strip()
          for p in ('nbastats','nbastatsv3','pbpstats'):
            k=f'{p}_{y}'
            if k not in vals: raise SystemExit(f'MISSING_SOURCE_URL {k}')
            print(p,vals[k],sep='\t')
          PY
          while IFS=$'\t' read -r p url; do
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 -o "/tmp/src/${p}_${y}.tar.xz" "$url"
            tar -xJf "/tmp/src/${p}_${y}.tar.xz" -C /tmp/src
            test -s "/tmp/src/${p}_${y}.csv"
          done < /tmp/urls.tsv
      - name: Reconstruct only required missing games
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          y='${{ matrix.year }}'
          python - "$y" <<'PY'
          import csv,json,pathlib,sys,collections
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import build_exact_game_fact_layer as base
          import production_treb_engine_v3 as v3eng
          import run_local_treb_production as io
          y=int(sys.argv[1]); season=f'{y}-{(y+1)%100:02d}'
          C=pathlib.Path('/tmp/closure'); O=pathlib.Path('/tmp/out')
          dp=next(C.rglob('TREB_PBP_CONSENSUS_DIAGNOSTICS.csv'))
          rows=[]
          for r in csv.DictReader(open(dp,newline='')):
            if r.get('status')!='BLOCKED' or r.get('season')!=season: continue
            try: detail=json.loads(r.get('detail') or '{}')
            except: detail={}
            rows.append((r,detail))
          if not rows: raise SystemExit(f'NO_BLOCKED_ROWS {season}')
          def gid(x): return int(float(x))
          def pid(x): return str(x).strip().removesuffix('.0')
          need_player=collections.defaultdict(set); need_team=set()
          for r,d in rows:
            tid=int(float(r['team_id'])); p=pid(r['player_id'])
            for g in d.get('missing_player',[]): need_player[gid(g)].add((tid,p))
            for g in d.get('missing_team',[]): need_team.add((gid(g),tid))
          need_games=set(need_player)|{g for g,_ in need_team}
          nba=io.normalize_nba(pd.read_csv(f'/tmp/src/nbastats_{y}.csv',low_memory=False))
          v3=v3eng.normalize_v3(pd.read_csv(f'/tmp/src/nbastatsv3_{y}.csv',low_memory=False))
          pbp=io.normalize_pbp(pd.read_csv(f'/tmp/src/pbpstats_{y}.csv',low_memory=False))
          ng={int(g):f.copy() for g,f in nba[nba.GAME_ID.isin(need_games)].groupby('GAME_ID',sort=False)}
          vg={int(g):f.copy() for g,f in v3[v3.gameId.isin(need_games)].groupby('gameId',sort=False)}
          pg={int(g):f.copy() for g,f in pbp[pbp.GAMEID.isin(need_games)].groupby('GAMEID',sort=False)}
          player_out=[]; team_out=[]; failures=[]
          for g in sorted(need_games):
            if g not in ng or g not in vg or g not in pg:
              failures.append({'season':season,'game_id':g,'status':'SOURCE_SET_GAP','nba':g in ng,'v3':g in vg,'pbp':g in pg}); continue
            try:
              tr,pr,a=base.build_game(g,ng[g],vg[g],pg[g])
            except Exception as e:
              failures.append({'season':season,'game_id':g,'status':'RECONSTRUCTION_FAIL','error':f'{type(e).__name__}: {e}'}); continue
            for z in tr:
              if (g,int(z['team_id'])) in need_team:
                z={**z,'season':season,'provenance':'exact retained nba+v3+pbp game reconstruction'}; team_out.append(z)
            wanted=need_player.get(g,set())
            for z in pr:
              k=(int(z['team_id']),pid(z['player_id']))
              if k in wanted:
                z={**z,'season':season,'player_id':pid(z['player_id']),'provenance':'exact retained nba+v3+pbp game reconstruction'}; player_out.append(z)
          if player_out:
            pd.DataFrame(player_out).to_csv(O/f'PLAYER_PRIMITIVES_{y}.csv.gz',index=False,compression='gzip')
          if team_out:
            pd.DataFrame(team_out).to_csv(O/f'TEAM_PRIMITIVES_{y}.csv.gz',index=False,compression='gzip')
          (O/f'FAILURES_{y}.json').write_text(json.dumps(failures,indent=2)+'\n')
          req_player=sum(len(v) for v in need_player.values()); req_team=len(need_team)
          got_player={(int(r['game_id']),int(r['team_id']),pid(r['player_id'])) for r in player_out}
          want_player={(g,t,p) for g,v in need_player.items() for t,p in v}
          got_team={(int(r['game_id']),int(r['team_id'])) for r in team_out}
          qa={'season':season,'required_games':len(need_games),'required_player_primitives':req_player,'recovered_player_primitives':len(got_player & want_player),'required_team_primitives':req_team,'recovered_team_primitives':len(got_team & need_team),'failures':len(failures),'integrity':{'exact_retained_nba_v3_pbp_only':True,'empirical_model_used':False,'rounded_percentage_backsolve_used':False,'opponent_rebound_inference_used':False,'promotion_performed':False}}
          (O/f'QA_{y}.json').write_text(json.dumps(qa,indent=2)+'\n'); print(json.dumps(qa,indent=2),flush=True)
          PY
      - name: Upload season exact primitive checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TREB-missing-primitives-${{ matrix.year }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn

  consolidate:
    needs: recover
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TREB-missing-primitives-*-${{ github.run_id }}
          path: /tmp/all
          merge-multiple: true
      - name: Consolidate recovered exact primitives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final
          python - <<'PY'
          import pathlib,json,csv,gzip
          import pandas as pd
          P=pathlib.Path('/tmp/all'); O=pathlib.Path('/tmp/final')
          pfiles=list(P.glob('PLAYER_PRIMITIVES_*.csv.gz')); tfiles=list(P.glob('TEAM_PRIMITIVES_*.csv.gz'))
          ps=pd.concat([pd.read_csv(x,low_memory=False) for x in pfiles],ignore_index=True) if pfiles else pd.DataFrame()
          ts=pd.concat([pd.read_csv(x,low_memory=False) for x in tfiles],ignore_index=True) if tfiles else pd.DataFrame()
          if len(ps):
            ps['player_id']=ps.player_id.astype(str).str.replace(r'\.0$','',regex=True)
            ps=ps.drop_duplicates(['season','game_id','team_id','player_id'])
            ps.to_csv(O/'RECOVERED_EXACT_PLAYER_GAME_PRIMITIVES.csv.gz',index=False,compression='gzip')
          if len(ts):
            ts=ts.drop_duplicates(['season','game_id','team_id'])
            ts.to_csv(O/'RECOVERED_EXACT_TEAM_GAME_PRIMITIVES.csv.gz',index=False,compression='gzip')
          q=[]
          for f in P.glob('QA_*.json'):
            try:q.append(json.loads(f.read_text()))
            except:pass
          qa={'status':'PASS','season_jobs':len(q),'required_player_primitives':sum(x['required_player_primitives'] for x in q),'recovered_player_primitives':int(len(ps)),'required_team_primitives':sum(x['required_team_primitives'] for x in q),'recovered_team_primitives':int(len(ts)),'season_failures':sum(x['failures'] for x in q),'next':'union recovered exact primitives with cumulative exact state and rerun closure on only the 272 BLOCKED keys','integrity':{'exact_retained_nba_v3_pbp_only':True,'empirical_model_used':False,'rounded_percentage_backsolve_used':False,'opponent_rebound_inference_used':False,'promotion_performed':False}}
          (O/'TREB_MISSING_PRIMITIVES_FANOUT_QA.json').write_text(json.dumps(qa,indent=2)+'\n'); print(json.dumps(qa,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-missing-primitives-consolidated-${{ github.run_id }}
          path: /tmp/final
          retention-days: 90
          compression-level: 1
          if-no-files-found: error
