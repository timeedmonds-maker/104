name: TREB 723 current residual fail-closed materiality gate

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-723-current-materiality-gate.yml]

permissions:
  actions: read
  contents: read

concurrency:
  group: treb-723-current-materiality-gate
  cancel-in-progress: false

env:
  CURRENT_ARTIFACT_ID: '9274148774'
  TENURE_ARTIFACT_ID: '9259414397'
  CONSENSUS_ARTIFACT_ID: '9252786257'
  PBP_ARTIFACT_ID: '9258020958'
  RECOVERED_OLD_ARTIFACT_ID: '9258644772'
  RECOVERED_MID_ARTIFACT_ID: '9260106595'
  RECOVERED_NEW_ARTIFACT_ID: '9260439871'
  THRESHOLD_PP: '0.01'
  MINUTES_GATE_SECONDS: '60'

jobs:
  audit:
    name: fresh materiality ${{ matrix.year }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix:
        year: [2000,2001,2003,2004,2005,2006,2009,2012,2015,2017,2018,2019,2020,2021,2022,2023,2024]
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/treb-final-exact-assembly, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz
      - name: Download current exact/materiality evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          for d in current tenure consensus pbp recovered_old recovered_mid recovered_new out; do mkdir -p /tmp/$d; done
          for spec in current:$CURRENT_ARTIFACT_ID tenure:$TENURE_ARTIFACT_ID consensus:$CONSENSUS_ARTIFACT_ID pbp:$PBP_ARTIFACT_ID recovered_old:$RECOVERED_OLD_ARTIFACT_ID recovered_mid:$RECOVERED_MID_ARTIFACT_ID recovered_new:$RECOVERED_NEW_ARTIFACT_ID; do
            d=${spec%%:*};a=${spec##*:};gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${a}/zip" >/tmp/$d.zip;unzip -q /tmp/$d.zip -d /tmp/$d
          done
      - name: Download retained full-season source feeds
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail;y='${{ matrix.year }}';mkdir -p /tmp/src
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/list_data.txt https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          python - "$y" <<'PY' >/tmp/urls.tsv
          import sys
          y=sys.argv[1];v={}
          for line in open('/tmp/list_data.txt',encoding='utf-8'):
            if '=' in line:k,x=line.split('=',1);v[k.strip()]=x.strip()
          for p in ('nbastats','nbastatsv3','pbpstats'):
            k=f'{p}_{y}';print(p,v[k],sep='\t')
          PY
          while IFS=$'\t' read -r p url; do curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 -o /tmp/src/${p}_${y}.tar.xz "$url";tar -xJf /tmp/src/${p}_${y}.tar.xz -C /tmp/src;done </tmp/urls.tsv
      - name: Enumerate all coherent retained-source scenarios with current shared facts
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail;y='${{ matrix.year }}'
          PYTHONPATH=team_trb_all_players python -u team_trb_all_players/audit_current_residual_materiality_with_current_shared.py --year "$y" --current-dir /tmp/current --tenure-dir /tmp/tenure --consensus-dir /tmp/consensus --pbp-dir /tmp/pbp --recovered-old-dir /tmp/recovered_old --recovered-mid-dir /tmp/recovered_mid --recovered-new-dir /tmp/recovered_new --targets team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz --ledger team_trb_all_players/impact_database/roster_tenure_v3/player_game_roster_ledger.csv.gz --nba /tmp/src/nbastats_${y}.csv --v3 /tmp/src/nbastatsv3_${y}.csv --pbp /tmp/src/pbpstats_${y}.csv --threshold-pp "$THRESHOLD_PP" --minutes-gate-seconds "$MINUTES_GATE_SECONDS" --max-enumeration-nodes 10000 --max-game-variants 5000 --max-key-states 200000 --output-dir /tmp/out
      - name: Upload current residual materiality checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'TREB-723-materiality-${{ matrix.year }}-${{ github.run_id }}', path: /tmp/out, retention-days: 90, compression-level: 1, if-no-files-found: warn}

  consolidate:
    name: consolidate fresh 723-key materiality gate
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {pattern: 'TREB-723-materiality-*-${{ github.run_id }}', path: /tmp/seasons, merge-multiple: false}
      - name: Download authoritative current state
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          mkdir -p /tmp/current /tmp/final;gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CURRENT_ARTIFACT_ID}/zip" >/tmp/current.zip;unzip -q /tmp/current.zip -d /tmp/current
      - name: Build fail-closed current gate
        shell: bash
        run: |
          python - <<'PY'
          import csv,json,pathlib
          import pandas as pd
          R=pathlib.Path('/tmp/seasons');C=pathlib.Path('/tmp/current');O=pathlib.Path('/tmp/final')
          def pid(x):return str(x).strip().removesuffix('.0')
          def tid(x):return str(int(float(x)))
          def key(r):return(str(r['season']),tid(r['team_id']),pid(r['player_id']))
          current=list(csv.DictReader(open(next(C.rglob('AUTONOMOUS_BLOCKER_MANIFEST.csv')),newline='')))
          assert len(current)==723,len(current);ck={key(r) for r in current};assert len(ck)==723
          parts=[pd.read_csv(p,low_memory=False) for p in R.rglob('MATERIALITY_AUDIT_*.csv')];aud=pd.concat(parts,ignore_index=True,sort=False) if parts else pd.DataFrame()
          if len(aud):
            aud['team_id']=pd.to_numeric(aud.team_id,errors='raise').astype('int64').astype(str);aud['player_id']=aud.player_id.map(pid);aud['season']=aud.season.astype(str);aud=aud.drop_duplicates(['season','team_id','player_id'],keep='last')
          ak=set(zip(aud.season,aud.team_id,aud.player_id)) if len(aud) else set();missing=ck-ak
          if missing:
            aud=pd.concat([aud,pd.DataFrame([{'season':s,'team_id':t,'player_id':p,'threshold_pp':0.01,'minutes_gate_seconds':60.0,'status':'AUDIT_UNRESOLVED','accepted_immaterial':False,'reason':'SEASON_AUDIT_JOB_MISSING_OR_FAILED_FAIL_CLOSED'} for s,t,p in sorted(missing)])],ignore_index=True,sort=False)
          assert len(aud)==723,len(aud);assert set(zip(aud.season.astype(str),aud.team_id.astype(str),aud.player_id.map(pid)))==ck
          ap=[pd.read_csv(p,low_memory=False) for p in R.rglob('MATERIALITY_ACCEPTED_*.csv')];acc=pd.concat(ap,ignore_index=True,sort=False) if ap else pd.DataFrame()
          if len(acc):
            acc['team_id']=pd.to_numeric(acc.team_id,errors='raise').astype('int64').astype(str);acc['player_id']=acc.player_id.map(pid);acc['season']=acc.season.astype(str);acc=acc.drop_duplicates(['season','team_id','player_id'],keep='last');acc=acc[[key(r._asdict()) in ck for r in acc.itertuples(index=False)]].copy()
          statuses={(str(r.season),str(r.team_id),pid(r.player_id)):str(r.status) for r in aud.itertuples(index=False)};accepted=set(zip(acc.season,acc.team_id,acc.player_id)) if len(acc) else set();expected={k for k,v in statuses.items() if v=='ACCEPT_IMMATERIAL'};assert accepted==expected,(len(accepted),len(expected))
          remain=[r for r in current if key(r) not in accepted];counts=pd.Series(list(statuses.values())).value_counts().to_dict();aud.to_csv(O/'TREB_723_MATERIALITY_AUDIT.csv',index=False)
          if len(acc):acc.to_csv(O/'TREB_723_NEW_MATERIALITY_ACCEPTED.csv',index=False)
          else:pd.DataFrame(columns=['season','team_id','player_id','metric','on','off_corrected','on_minus_off_corrected']).to_csv(O/'TREB_723_NEW_MATERIALITY_ACCEPTED.csv',index=False)
          with open(O/'TREB_POST_723_MATERIALITY_BLOCKER_MANIFEST.csv','w',newline='') as f:w=csv.DictWriter(f,fieldnames=current[0].keys());w.writeheader();w.writerows(remain)
          maxr=pd.to_numeric(aud.get('max_range_pp'),errors='coerce').max() if 'max_range_pp' in aud else None
          qa={'status':'PASS','starting_exact_full_core':8920,'prior_materiality_accepted':4,'starting_production_resolved':8924,'starting_residual':723,'threshold_pp':0.01,'minutes_gate_seconds':60.0,'new_materiality_accepted':len(accepted),'production_resolved_full_core':8924+len(accepted),'ending_residual':len(remain),'complete_accounting':8924+len(accepted)+len(remain)==9647,'status_counts':{str(k):int(v) for k,v in counts.items()},'max_observed_range_pp':None if pd.isna(maxr) else float(maxr),'integrity':{'uses_current_cumulative_shared_exact_facts':True,'fail_closed_on_missing_season_job':True,'fail_closed_on_source_gap':True,'fail_closed_on_enumeration_cap':True,'fail_closed_without_exact_tenure_identity':True,'empirical_model_used':False,'rounded_percentage_backsolve_used':False,'opponent_rebound_inference_used':False,'partial_tenure_whole_team_subtraction_used':False}}
          assert qa['complete_accounting'];(O/'TREB_723_MATERIALITY_GATE.json').write_text(json.dumps(qa,indent=2)+'\n');print(json.dumps(qa,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'TREB-723-materiality-gate-${{ github.run_id }}', path: /tmp/final, retention-days: 90, compression-level: 1, if-no-files-found: error}
