name: TREB current validation minutes source locator
on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - 'team_trb_all_players/treb_current_validation_minutes_source_locator.py'
      - '.github/workflows/treb-current-validation-minutes-source-locator.yml'
concurrency:
  group: treb-current-validation-minutes-source-locator
  cancel-in-progress: true
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate independent exact per-game minutes sources
        run: |
          set -euo pipefail
          PROOF='team_trb_all_players/treb_recovery_status/artifacts/treb-current-schedule-audited-tail/TREB-current-schedule-audited-tail-32194579857/TREB_CURRENT_40_SCHEDULE_AUDITED_TENURE_PROOF.csv'
          test -f "$PROOF"
          python team_trb_all_players/treb_current_validation_minutes_source_locator.py \
            --repo-root . --proof "$PROOF" --out-dir out
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-current-19-minutes-source-locator-${{ github.run_id }}
          path: out/
          retention-days: 30
