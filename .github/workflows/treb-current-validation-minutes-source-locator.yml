name: TREB current validation minutes source locator
on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - 'team_trb_all_players/treb_current_validation_minutes_source_locator.py'
      - '.github/workflows/treb-current-validation-minutes-source-locator.yml'
permissions:
  contents: write
concurrency:
  group: treb-current-validation-minutes-source-locator
  cancel-in-progress: true
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate independent exact per-game minutes sources
        run: |
          set -euo pipefail
          PROOF='team_trb_all_players/treb_recovery_status/artifacts/treb-current-schedule-audited-tail/TREB-current-schedule-audited-tail-32194579857/TREB_CURRENT_40_SCHEDULE_AUDITED_TENURE_PROOF.csv'
          test -f "$PROOF"
          python team_trb_all_players/treb_current_validation_minutes_source_locator.py \
            --repo-root . --proof "$PROOF" --out-dir out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-current-19-minutes-source-locator-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist exact minutes locator evidence to production branch
        if: always()
        run: |
          set -euo pipefail
          DEST="team_trb_all_players/treb_recovery_status/artifacts/treb-current-19-minutes-source-locator/TREB-current-19-minutes-source-locator-${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          if [ -d out ]; then cp -a out/. "$DEST/"; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Persist TREB current 19 minutes locator ${GITHUB_RUN_ID}"
            git pull --rebase origin agent/treb-final-exact-assembly
            git push origin HEAD:agent/treb-final-exact-assembly
          fi
# autonomous retrigger 2026-08-20
