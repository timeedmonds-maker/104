name: TREB Adams rebound classifier audit batched

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - team_trb_all_players/final_integrity_rebuild/ADAMS_REBOUND_CLASSIFIER_BATCHED_CONTROL.json

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz requests urllib3
      - name: Download 2016-17 local sources
        shell: bash
        run: |
          set -euo pipefail
          RAW=/tmp/trebraw-2016; mkdir -p "$RAW"
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          y=2016; raw=Path('/tmp/trebraw-2016')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in [f'nbastats_{y}',f'nbastatsv3_{y}',f'pbpstats_{y}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Compare shard against PBP Stats lineup truth
        shell: bash
        run: |
          set -euo pipefail
          NBA=$(find /tmp/trebraw-2016 -name 'nbastats_2016.csv' -print -quit)
          V3=$(find /tmp/trebraw-2016 -name 'nbastatsv3_2016.csv' -print -quit)
          PBP=$(find /tmp/trebraw-2016 -name 'pbpstats_2016.csv' -print -quit)
          NBA="$NBA" V3="$V3" PBP="$PBP" SHARD='${{ matrix.shard }}' python - <<'PY'
          import json,os,re,sys,time
          from pathlib import Path
          import pandas as pd
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import production_treb_engine as rebound_engine
          import production_treb_engine_v3 as lineup_engine
          import local_treb_rebuild as core

          TEAM=1610612760; ADAMS=203500; API='https://api.pbpstats.com/get-game-stats'; shard=int(os.environ['SHARD']); nshard=8
          repair_key=(21600270,5,TEAM); repair=[201566,201627,203460,203506,203924]
          prev=core.STARTER_REPAIRS.get(repair_key); core.STARTER_REPAIRS[repair_key]=repair
          nba=io.normalize_nba(pd.read_csv(os.environ['NBA'],low_memory=False)); v3=lineup_engine.normalize_v3(pd.read_csv(os.environ['V3'],low_memory=False)); pbp=io.normalize_pbp(pd.read_csv(os.environ['PBP'],low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}; vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}; pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}
          all_ids=sorted(int(g) for g in pbp.loc[pbp.OPPONENT.astype(str).eq('OKC'),'GAMEID'].unique()); gids=all_ids[shard::nshard]
          sess=requests.Session(); retry=Retry(total=6,connect=6,read=6,status=6,backoff_factor=.8,status_forcelist=[429,500,502,503,504],allowed_methods=['GET']); sess.mount('https://',HTTPAdapter(max_retries=retry))
          def fetch(gid,typ):
              r=sess.get(API,params={'GameId':f'{gid:010d}','Type':typ},timeout=60); r.raise_for_status(); return r.json()
          def side(d):
              if int(d['home_team_id'])==TEAM:return 'Home'
              if int(d['away_team_id'])==TEAM:return 'Away'
              raise RuntimeError('OKC absent')
          def rowmap(d,s): return {str(r['EntityId']):r for r in d['stats'][s]['FullGame']}
          def n(r,k): return int(round(float(r.get(k,0) or 0)))
          def secs(v):
              s=str(v or '0:00')
              if ':' in s:
                  a,b=s.split(':',1); return int(a)*60+int(round(float(b)))
              return int(round(float(s)*60))
          def aggregate(j,mode):
              real=j.IS_REAL_REBOUND.astype(bool); on=j.LINEUP.map(lambda x:ADAMS in x); okc_off=~j.OPPONENT.astype(str).eq('OKC'); okc_def=~okc_off
              if mode=='current': off=j.IS_OREB.astype(bool); unresolved=0
              elif mode=='real_first':
                  rn=real.astype(int).groupby([j[c] for c in core.POSSESSION_ID],dropna=False).cumsum(); po=j.groupby(core.POSSESSION_ID,dropna=False).OFFENSIVEREBOUNDS.transform('first'); off=real & rn.le(po); unresolved=0
              elif mode=='description_counter':
                  off=pd.Series(False,index=j.index); resolved=pd.Series(False,index=j.index); last={}
                  for idx,row in j.iterrows():
                      if not bool(real.loc[idx]): continue
                      m=re.search(r'\(Off:(\d+) Def:(\d+)\)',str(row.DESCRIPTION),re.I); pid=int(row.NBA_PLAYER1_ID) if pd.notna(row.NBA_PLAYER1_ID) else 0
                      if not m or pid<=0: continue
                      o,d=map(int,m.groups()); po,pd_=last.get(pid,(0,0)); do=o-po; dd=d-pd_
                      if do==1 and dd==0: off.loc[idx]=True; resolved.loc[idx]=True
                      elif dd==1 and do==0: off.loc[idx]=False; resolved.loc[idx]=True
                      last[pid]=(o,d)
                  unresolved=int((on&real&~resolved).sum())
              else: raise ValueError(mode)
              return {'team_oreb_on':int((on&okc_off&real&off).sum()),'team_dreb_on':int((on&okc_def&real&~off).sum()),'opponent_oreb_on':int((on&okc_def&real&off).sum()),'opponent_dreb_on':int((on&okc_off&real&~off).sum()),'description_unresolved_real_on':unresolved}

          games=[]; failures=[]; universe=0
          for i,gid in enumerate(gids,1):
              try:
                  lu=lineup_engine.reconstruct_game_lineups(ng[gid],vg[gid]); joined,audit=rebound_engine.join_pbp_rebounds(lu,pg[gid])
                  if audit.get('unmatched_rebound_bearing_rows',0): raise RuntimeError(f'unmatched={audit["unmatched_rebound_bearing_rows"]}')
                  joined=rebound_engine.classify_rebounds(joined); poss=pg[gid].drop_duplicates(core.POSSESSION_ID); game_universe=int(poss.loc[~poss.OPPONENT.astype(str).eq('OKC'),'OFFENSIVEREBOUNDS'].sum()); universe+=game_universe
                  local={m:aggregate(joined,m) for m in ('current','real_first','description_counter')}
                  for m in local: local[m]['seconds_on']=int(lu.seconds.get(ADAMS,0))
                  line=fetch(gid,'Lineup'); opp=fetch(gid,'LineupOpponent'); s=side(line); lm=rowmap(line,s); om=rowmap(opp,s)
                  if set(lm)!=set(om): raise RuntimeError('Lineup/LineupOpponent entity mismatch')
                  truth={'seconds_on':0,'team_oreb_on':0,'team_dreb_on':0,'opponent_oreb_on':0,'opponent_dreb_on':0}
                  for eid,r in lm.items():
                      if str(ADAMS) not in eid.split('-'): continue
                      o=om[eid]; truth['seconds_on']+=secs(r.get('Minutes')); truth['team_oreb_on']+=n(r,'OffRebounds'); truth['team_dreb_on']+=n(r,'DefRebounds'); truth['opponent_oreb_on']+=n(o,'OffRebounds'); truth['opponent_dreb_on']+=n(o,'DefRebounds')
                  games.append({'game_id':gid,'truth':truth,'local':local,'okc_oreb_universe':game_universe,'join_audit':audit})
                  print(f'ADAMS_SHARD shard={shard} {i}/{len(gids)} game={gid}',flush=True); time.sleep(.08)
              except Exception as exc: failures.append({'game_id':gid,'error':f'{type(exc).__name__}: {exc}'})
          out={'shard':shard,'all_okc_games':len(all_ids),'assigned_games':len(gids),'games_compared':len(games),'failures':failures,'okc_oreb_universe':universe,'games':games}
          Path(f'/tmp/ADAMS_CLASSIFIER_SHARD_{shard}.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps({k:v for k,v in out.items() if k!='games'},indent=2))
          if prev is None: core.STARTER_REPAIRS.pop(repair_key,None)
          else: core.STARTER_REPAIRS[repair_key]=prev
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-adams-classifier-shard-${{ matrix.shard }}
          path: /tmp/ADAMS_CLASSIFIER_SHARD_${{ matrix.shard }}.json
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-adams-classifier-shard-*
          path: /tmp/shards
          merge-multiple: true
      - name: Aggregate all 82 games
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          shards=[json.loads(p.read_text()) for p in sorted(Path('/tmp/shards').glob('ADAMS_CLASSIFIER_SHARD_*.json'))]; games=[g for s in shards for g in s.get('games',[])]; failures=[f for s in shards for f in s.get('failures',[])]
          keys=['seconds_on','team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on']; locked={'seconds_on':143368,'team_oreb_on':816,'team_dreb_on':1846,'opponent_oreb_on':643,'opponent_dreb_on':1632}
          truth={k:sum(int(g['truth'][k]) for g in games) for k in keys}
          def diff(obs,ref): return {k:int(obs[k]-ref[k]) for k in ref}
          methods={}
          for m in ('current','real_first','description_counter'):
              obs={k:sum(int(g['local'][m][k]) for g in games) for k in keys}; exact=0; sae={k:0 for k in keys}; unresolved=sum(int(g['local'][m].get('description_unresolved_real_on',0)) for g in games)
              for g in games:
                  ds=diff({k:int(g['local'][m][k]) for k in keys},g['truth'])
                  if all(v==0 for v in ds.values()): exact+=1
                  for k,v in ds.items(): sae[k]+=abs(v)
              methods[m]={'observed':obs,'diff_vs_api_truth':diff(obs,truth),'exact_games':exact,'sum_abs_game_error':sae,'description_unresolved_real_on':unresolved}
          out={'shards_found':len(shards),'games_compared':len(games),'unique_game_ids':len({g['game_id'] for g in games}),'failures':failures,'okc_oreb_universe':sum(int(s.get('okc_oreb_universe',0)) for s in shards),'api_truth':truth,'locked':locked,'api_truth_diff_vs_locked':diff(truth,locked),'methods':methods,'explicit_test_repair':{'game_id':21600270,'period':5,'team_id':1610612760,'starters':[201566,201627,203460,203506,203924]}}
          out['status']='COMPLETE' if len(shards)==8 and len(games)==82 and len({g['game_id'] for g in games})==82 and not failures else 'INCOMPLETE'
          Path('/tmp/ADAMS_REBOUND_CLASSIFIER_BATCHED_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: treb-adams-rebound-classifier-batched-summary
          path: /tmp/ADAMS_REBOUND_CLASSIFIER_BATCHED_SUMMARY.json
          retention-days: 90
