name: Export TREB core analysis package

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - team_trb_all_players/export_core_database.py
      - .github/workflows/export-treb-core.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: treb-core-export
  cancel-in-progress: true

jobs:
  export:
    if: github.event_name != 'issue_comment' || (github.event.issue.number == 9 && github.event.comment.body == '/export-treb-core')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Report export start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/9/comments \
            -f body="TREB_CORE_EXPORT_STARTED run_id=${GITHUB_RUN_ID} source_sha=${GITHUB_SHA}"

      - name: Check out completed database
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install analytical dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow duckdb

      - name: Build analysis-ready package
        run: python team_trb_all_players/export_core_database.py

      - name: Upload complete core package
        uses: actions/upload-artifact@v4
        with:
          name: TREB-core-analysis-${{ github.run_id }}
          path: team_trb_all_players/impact_database/analysis_export/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Report export completion
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/9/comments \
            -f body="TREB_CORE_EXPORT_COMPLETE run_id=${GITHUB_RUN_ID} artifact=TREB-core-analysis-${GITHUB_RUN_ID} source_sha=${GITHUB_SHA}"

      - name: Report export failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/9/comments \
            -f body="TREB_CORE_EXPORT_FAILED run_id=${GITHUB_RUN_ID} source_sha=${GITHUB_SHA}"
