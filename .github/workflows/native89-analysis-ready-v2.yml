name: Native89 corrected analysis-ready v2
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-analysis-ready-v2.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - name: Build corrected self-contained release
        run: |
          python - <<'PY'
          import gzip,json,csv,pathlib,collections,zipfile,hashlib,shutil,math,os
          root=pathlib.Path('team_trb_all_players/impact_database')
          src=root/'corrected_off/tenure_segment_on_off.jsonl.gz'
          out=pathlib.Path('native89_v2'); rawdir=out/'raw_components'; rawdir.mkdir(parents=True,exist_ok=True)
          rows=[]
          with gzip.open(src,'rt') as f:
            for line in f:
              if line.strip(): rows.append(json.loads(line))
          metrics=sorted({str(r['metric']) for r in rows}); seasons=sorted({str(r['season']) for r in rows})
          assert len(metrics)==89 and len(seasons)==26 and seasons[0]=='2000-01' and seasons[-1]=='2025-26'
          # Preserve every native value and add identity/exposure fields directly.
          fields=['season','player_id','player_name','team_id','team_abbr','tenure_start','tenure_end','query_start_date','query_end_date','metric','on_court_minutes','off_court_minutes','on','corrected_off','swing','complete','tenure_confidence','boundary_resolution','collection_source']
          with gzip.open(out/'native_89_metrics_LONG_WITH_EXPOSURES.csv.gz','wt',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields);w.writeheader()
            for r in rows:
              w.writerow({'season':r.get('season'),'player_id':r.get('player_id'),'player_name':r.get('player'),'team_id':r.get('team_id'),'team_abbr':r.get('team_abbr'),'tenure_start':r.get('tenure_start'),'tenure_end':r.get('tenure_end'),'query_start_date':r.get('query_start_date'),'query_end_date':r.get('query_end_date'),'metric':r.get('metric'),'on_court_minutes':r.get('minutes_on'),'off_court_minutes':r.get('minutes_off'),'on':r.get('on'),'corrected_off':r.get('off_corrected'),'swing':r.get('on_minus_off_corrected'),'complete':r.get('complete'),'tenure_confidence':r.get('tenure_confidence'),'boundary_resolution':r.get('boundary_resolution'),'collection_source':r.get('collection_source')})
          # Unique tenure exposure/identity table.
          exp={}
          for r in rows:
            k=(str(r['season']),str(r['player_id']),str(r['team_id']),str(r.get('query_start_date')),str(r.get('query_end_date')))
            exp.setdefault(k,{'season':r['season'],'player_id':r['player_id'],'player_name':r.get('player'),'team_id':r['team_id'],'team_abbr':r.get('team_abbr'),'tenure_start':r.get('tenure_start'),'tenure_end':r.get('tenure_end'),'query_start_date':r.get('query_start_date'),'query_end_date':r.get('query_end_date'),'on_court_minutes':r.get('minutes_on'),'off_court_minutes':r.get('minutes_off'),'tenure_confidence':r.get('tenure_confidence'),'boundary_resolution':r.get('boundary_resolution')})
          ef=list(exp.values())
          with gzip.open(out/'TENURE_EXPOSURES.csv.gz','wt',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(ef[0]));w.writeheader();w.writerows(ef)
          # Metric index per segment for acceptance sufficient-stat reconstruction.
          sm=collections.defaultdict(dict)
          for r in rows:
            k=(str(r['season']),str(r['player_id']),str(r['team_id']),str(r.get('query_start_date')),str(r.get('query_end_date')))
            sm[k][str(r['metric'])]=r
          needed=['Pts per 100 Possessions','Pts per 100 Possessions - Defense','Seconds Per Possession - Offense','Seconds Per Possession - Defense']
          # Exact exposure reconstruction for ratings: possessions = seconds / seconds-per-possession.
          netseg=[]
          for k,d in sm.items():
            if not all(x in d for x in needed): continue
            o,dv,spo,spd=[d[x] for x in needed]
            mon=float(o['minutes_on']); mof=float(o['minutes_off'])
            vals=[o.get('on'),o.get('off_corrected'),dv.get('on'),dv.get('off_corrected'),spo.get('on'),spo.get('off_corrected'),spd.get('on'),spd.get('off_corrected')]
            if any(v is None for v in vals): continue
            ort_on,ort_off,drt_on,drt_off,spo_on,spo_off,spd_on,spd_off=map(float,vals)
            if min(spo_on,spo_off,spd_on,spd_off)<=0: continue
            op_on=mon*60/spo_on; op_off=mof*60/spo_off; dp_on=mon*60/spd_on; dp_off=mof*60/spd_off
            netseg.append({'season':k[0],'player_id':k[1],'player_name':o.get('player'),'team_id':k[2],'query_start_date':k[3],'query_end_date':k[4],'on_court_minutes':mon,'off_court_minutes':mof,'on_offensive_possessions':op_on,'off_offensive_possessions':op_off,'on_defensive_possessions':dp_on,'off_defensive_possessions':dp_off,'on_team_points':ort_on*op_on/100,'off_team_points':ort_off*op_off/100,'on_opponent_points':drt_on*dp_on/100,'off_opponent_points':drt_off*dp_off/100})
          with gzip.open(out/'NET_RATING_SUFFICIENT_STATS_BY_TENURE.csv.gz','wt',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(netseg[0]));w.writeheader();w.writerows(netseg)
          # Bundle durable raw pbpstats accumulators for every season. These are the underlying count/exposure layer retained in production.
          pts_rows={}
          onoff_rows={}
          for season in seasons:
            sdir=root/'outputs'/season
            for fn in ['player_team_totals.csv.gz','team_on_off_metrics.csv.gz']:
              p=sdir/fn
              assert p.exists(),p
              shutil.copy2(p,rawdir/f'{season}__{fn}')
            tr=sdir/'team_rebound_derived.csv.gz'
            if tr.exists(): shutil.copy2(tr,rawdir/f'{season}__team_rebound_derived.csv.gz')
            with gzip.open(sdir/'player_team_totals.csv.gz','rt',newline='') as f:
              for r in csv.DictReader(f):
                pid=str(r.get('EntityId') or r.get('RowId') or r.get('player_id') or '')
                tid=str(r.get('team_id') or r.get('TeamId') or '')
                if pid: pts_rows[(season,pid,tid)]=r
            with gzip.open(sdir/'team_on_off_metrics.csv.gz','rt',newline='') as f:
              rd=csv.DictReader(f)
              for r in rd:
                pid=str(r.get('player_id') or r.get('EntityId') or r.get('RowId') or '')
                tid=str(r.get('team_id') or r.get('TeamId') or '')
                if pid: onoff_rows[(season,pid,tid)]=r
          # OREB ON sufficient stats at player-team-season grain: pbpstats personal OREB% exposes the same rebound-opportunity denominator.
          orebpts=[]
          for k,r in pts_rows.items():
            try:
              orebs=float(r.get('OffRebounds') or 0); pct=float(r.get('OffFGReboundPct') or 0)
              denom=(orebs/pct) if orebs>0 and pct>0 else None
            except: denom=None
            tm=onoff_rows.get(k)
            if not tm or not denom or denom<=0: continue
            rv=tm.get('on_OReb_pct') or tm.get('on_OReb%') or tm.get('on_oreb_pct')
            if rv in (None,''): continue
            rate=float(rv); rate=rate/100 if rate>1.5 else rate
            orebpts.append({'season':k[0],'player_id':k[1],'player_name':r.get('Name'),'team_id':k[2],'on_court_seconds':float(r.get('SecondsPlayed') or 0),'oreb_opportunities_on':denom,'team_orebounds_on':rate*denom,'oreb_pct_on':rate})
          with gzip.open(out/'OREB_ON_SUFFICIENT_STATS_BY_PLAYER_TEAM_SEASON.csv.gz','wt',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(orebpts[0]));w.writeheader();w.writerows(orebpts)
          # Acceptance test: 2021-22..2025-26, aggregate components first, one row/player, 2000+ ON minutes.
          sel=set(['2021-22','2022-23','2023-24','2024-25','2025-26'])
          oreba=collections.defaultdict(lambda:collections.Counter()); names={}
          for r in orebpts:
            if r['season'] not in sel: continue
            pid=r['player_id']; names[pid]=r['player_name']; a=oreba[pid]; a['seconds']+=r['on_court_seconds']; a['oreb']+=r['team_orebounds_on']; a['opp']+=r['oreb_opportunities_on']
          neta=collections.defaultdict(lambda:collections.Counter())
          for r in netseg:
            if r['season'] not in sel: continue
            pid=r['player_id']; names[pid]=r['player_name']; a=neta[pid]
            for x in ['on_court_minutes','on_offensive_possessions','off_offensive_possessions','on_defensive_possessions','off_defensive_possessions','on_team_points','off_team_points','on_opponent_points','off_opponent_points']: a[x]+=float(r[x])
          acc=[]
          for pid in sorted(set(oreba)&set(neta)):
            o=oreba[pid]; n=neta[pid]; mins=o['seconds']/60
            if mins<2000: continue
            if min(o['opp'],n['on_offensive_possessions'],n['off_offensive_possessions'],n['on_defensive_possessions'],n['off_defensive_possessions'])<=0: continue
            orebr=100*o['oreb']/o['opp']
            ort_on=100*n['on_team_points']/n['on_offensive_possessions']; drt_on=100*n['on_opponent_points']/n['on_defensive_possessions']; nr_on=ort_on-drt_on
            ort_off=100*n['off_team_points']/n['off_offensive_possessions']; drt_off=100*n['off_opponent_points']/n['off_defensive_possessions']; nr_off=ort_off-drt_off
            acc.append({'player_id':pid,'player_name':names.get(pid),'on_court_minutes':mins,'oreb_pct_on':orebr,'net_rating_on':nr_on,'net_rating_corrected_off':nr_off,'net_rating_swing':nr_on-nr_off})
          assert acc,'acceptance table empty'
          assert all(r['player_name'] and r['on_court_minutes']>=2000 for r in acc)
          with open(out/'ACCEPTANCE_2021-22_to_2025-26_MIN2000.csv','w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(acc[0]));w.writeheader();w.writerows(acc)
          # QA: native values untouched by export; names/minutes populated; no simple averaging used in acceptance.
          missing_names=sum(not r.get('player') for r in rows); missing_minutes=sum(r.get('minutes_on') is None or r.get('minutes_off') is None for r in rows)
          qa={'status':'PASS','native_metric_rows':len(rows),'native_metrics':len(metrics),'seasons':len(seasons),'missing_player_names':missing_names,'missing_on_or_off_minutes':missing_minutes,'tenure_exposure_rows':len(ef),'net_rating_sufficient_stat_rows':len(netseg),'oreb_on_sufficient_stat_rows':len(orebpts),'acceptance_players':len(acc),'acceptance_period':'2021-22 through 2025-26','acceptance_min_on_minutes':2000,'swing_calculated_after_aggregation':True,'rate_averaging_used':False,'treb_included':False,'native_values_modified':False,'raw_pbpstats_files_bundled':True,'source_extra_raw_cache_available':False}
          assert missing_names==0 and missing_minutes==0
          (out/'FINAL_QA.json').write_text(json.dumps(qa,indent=2)+'\n')
          (out/'README_FIRST.txt').write_text('Corrected Native 89 analysis-ready release. Includes player names, ON/OFF minutes, corrected tenure keys, full retained per-season pbpstats raw accumulator files, Net Rating sufficient statistics reconstructed from offensive/defensive possession exposure, OREB ON sufficient statistics at player-team-season grain, and the requested 2021-22..2025-26 2000-minute acceptance table. Rates in the acceptance output are recalculated after summing components; they are not averaged. TotalReboundPct is intentionally excluded. The original Stage2 network source_extra cache was not committed, so raw corrected-OFF event accumulators for every one of the 89 metrics do not exist durably at tenure-segment grain; raw season accumulator sources are bundled verbatim rather than fabricated.\n')
          z=pathlib.Path('NBA_native_89_metrics_ANALYSIS_READY_V2_2000-01_to_2025-26.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as q:
            for p in out.rglob('*'):
              if p.is_file():q.write(p,p.relative_to(out))
          h=hashlib.sha256(z.read_bytes()).hexdigest(); pathlib.Path(str(z)+'.sha256').write_text(h+'  '+z.name+'\n')
          print(json.dumps({**qa,'zip':z.name,'sha256':h,'zip_bytes':z.stat().st_size},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NBA-native-89-analysis-ready-v2-${{ github.run_id }}
          path: |
            NBA_native_89_metrics_ANALYSIS_READY_V2_2000-01_to_2025-26.zip
            NBA_native_89_metrics_ANALYSIS_READY_V2_2000-01_to_2025-26.zip.sha256
          retention-days: 90
          if-no-files-found: error