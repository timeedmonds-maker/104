name: Native89 corrected analysis-ready v2
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-analysis-ready-v2.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - name: Probe exact PBP Stats WOWY raw team payload
        run: |
          python - <<'PY'
          import requests,json
          url='https://api.pbpstats.com/get-wowy-stats/nba'
          params={'Season':'2021-22','SeasonType':'Regular Season','TeamId':'1610612737','0Exactly1OnFloor':'1629027'}
          r=requests.get(url,params=params,timeout=60,headers={'User-Agent':'Mozilla/5.0'})
          print('STATUS',r.status_code,'URL',r.url)
          r.raise_for_status(); d=r.json()
          print('TOP_KEYS',list(d)[:20])
          print('JSON_PREFIX',json.dumps(d)[:12000])
          PY
