name: Native89 corrected analysis-ready v2
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-analysis-ready-v2.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - name: Inspect Stage2 source_extra payloads
        run: |
          python - <<'PY'
          import gzip,json,pathlib
          p=pathlib.Path('team_trb_all_players/impact_database/corrected_off/tenure_segment_on_off.jsonl.gz')
          wanted={'OReb%','Pts per 100 Possessions','Pts per 100 Possessions - Defense','Seconds Per Possession - Offense','Seconds Per Possession - Defense'}
          seen=set()
          with gzip.open(p,'rt') as f:
            for line in f:
              r=json.loads(line)
              m=str(r.get('metric'))
              if r.get('season')=='2021-22' and m in wanted and m not in seen:
                print('METRIC',m)
                print('ROW',json.dumps({k:r.get(k) for k in ['season','player_id','player','team_id','query_start_date','query_end_date','minutes_on','minutes_off','on','off_corrected','source_extra','collection_source']},sort_keys=True))
                seen.add(m)
                if seen==wanted: break
          assert seen==wanted,(seen,wanted)
          PY
