name: Native89 corrected analysis-ready v2
on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/native89-analysis-ready-v2.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
      - name: Inspect exact native schemas and metric universe
        run: |
          python - <<'PY'
          import gzip,json,csv,pathlib
          root=pathlib.Path('team_trb_all_players/impact_database')
          src=root/'corrected_off/tenure_segment_on_off.jsonl.gz'
          rows=[]
          with gzip.open(src,'rt') as f:
            for line in f:
              if line.strip(): rows.append(json.loads(line))
          metrics=sorted({str(r['metric']) for r in rows})
          seasons=sorted({str(r['season']) for r in rows})
          print('METRIC_COUNT',len(metrics))
          print('METRICS_BEGIN')
          for m in metrics: print(m)
          print('METRICS_END')
          print('TENURE_KEYS',sorted(rows[0].keys()))
          for season in ['2021-22','2025-26']:
            sdir=root/'outputs'/season
            for fn in ['player_team_totals.csv.gz','team_on_off_metrics.csv.gz','team_rebound_derived.csv.gz']:
              p=sdir/fn
              print('FILE',season,fn,'EXISTS',p.exists())
              if p.exists():
                with gzip.open(p,'rt',newline='') as f:
                  rd=csv.DictReader(f)
                  print('COLUMNS',season,fn,rd.fieldnames)
                  sample=next(rd,None)
                  if sample: print('SAMPLE_KEYS_NONEMPTY',[(k,v) for k,v in sample.items() if v not in (None,'')][:25])
          assert len(metrics)==89 and len(seasons)==26
          PY
