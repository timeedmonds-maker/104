name: TREB promote direct team repairs
on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths: [.github/workflows/treb-promote-direct-team-repairs.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build promoted finite evidence from passed gates
        run: |
          python team_trb_all_players/promote_direct_team_rebound_repairs.py \
            --direct team_trb_all_players/final_integrity_rebuild/rebound_forensics/DIRECT_TEAM_IDENTITY_SUMMARY.json \
            --prefix team_trb_all_players/final_integrity_rebuild/rebound_forensics/BRACKET_TEAM_PREFIX_SUMMARY.json \
            --output /tmp/DIRECT_TEAM_REBOUND_REPAIRS.json
          python -m py_compile team_trb_all_players/production_rebound_v5.py
      - name: Persist evidence with branch-race retry
        run: |
          set -euo pipefail
          D=team_trb_all_players/final_integrity_rebuild/rebound_forensics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/treb-batched-game-facts-20260812
            git reset --hard origin/agent/treb-batched-game-facts-20260812
            cp /tmp/DIRECT_TEAM_REBOUND_REPAIRS.json "$D/"
            git add -f "$D/DIRECT_TEAM_REBOUND_REPAIRS.json"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Promote 50 exact bracket-team rebound repairs'
            if git push origin HEAD:agent/treb-batched-game-facts-20260812; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: treb-direct-team-promoted-evidence-${{ github.run_id }}
          path: /tmp/DIRECT_TEAM_REBOUND_REPAIRS.json
          retention-days: 90
