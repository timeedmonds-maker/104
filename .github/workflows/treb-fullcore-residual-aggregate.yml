name: TREB full-core residual aggregate
on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-fullcore-residual-aggregate.yml]
permissions:
  actions: read
  contents: write
env:
  BASE_RUN: '31854913173'
  RETRY_RUN: '31858682346'
  OUT: team_trb_all_players/impact_database/fullcore_residual_aggregate
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Reassert authoritative V2 invariants
        run: |
          python - <<'PY'
          import gzip,json
          p='team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz'
          rows=[json.loads(x) for x in gzip.open(p,'rt') if x.strip()]
          keys={(str(r['season']),str(r['player_id']).removesuffix('.0'),int(r['team_id'])) for r in rows}
          full=[r for r in rows if bool(r.get('full_core_reuse'))]
          partial=[r for r in rows if not bool(r.get('full_core_reuse'))]
          assert len(rows)==len(keys)==14524
          assert len(full)==9647 and len(partial)==4877
          print('V2_INVARIANTS=PASS 14524/9647/4877')
          PY
      - name: Download base and retry artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/retry
          gh run download "$BASE_RUN" -R "$GITHUB_REPOSITORY" -D /tmp/base || true
          gh run download "$RETRY_RUN" -R "$GITHUB_REPOSITORY" -D /tmp/retry
      - name: Aggregate best available season outputs and residual evidence
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python - <<'PY'
          import json,re
          from pathlib import Path
          import pandas as pd

          retry_years={2000,2004,2005,2007,2008,2011,2012,2018,2020,2022,2024}
          roots={'base':Path('/tmp/base'),'retry':Path('/tmp/retry')}
          out=Path('team_trb_all_players/impact_database/fullcore_residual_aggregate')

          def find_year(root, year, fn):
              hits=[]
              for p in root.rglob(fn):
                  # artifact directory names and/or file name carry year
                  if str(year) in str(p): hits.append(p)
              return sorted(hits)

          season_rows=[]; fail_rows=[]; gates=[]; missing=[]
          for y in range(2000,2025):
              source='retry' if y in retry_years else 'base'
              root=roots[source]
              csvs=find_year(root,y,f'fresh_fullcore_{y}.csv')
              if not csvs:
                  # fallback exact filename search; file itself always carries year
                  csvs=list(root.rglob(f'fresh_fullcore_{y}.csv'))
              if not csvs:
                  missing.append({'year':y,'source':source,'reason':'fresh_fullcore_csv_missing'})
                  continue
              p=csvs[-1]
              df=pd.read_csv(p,dtype={'player_id':str})
              df['artifact_source']=source
              season_rows.append(df)
              gate_hits=list(p.parent.glob('season_gate.json'))
              if gate_hits:
                  g=json.loads(gate_hits[0].read_text()); g['artifact_source']=source; gates.append(g)
              gf=list(p.parent.glob('game_failures.json'))
              if gf:
                  for r in json.loads(gf[0].read_text()):
                      r=dict(r); r['year']=y; r['season']=f'{y}-{(y+1)%100:02d}'; r['artifact_source']=source; fail_rows.append(r)

          assert not missing, missing
          all_df=pd.concat(season_rows,ignore_index=True)
          all_df['player_id']=all_df.player_id.astype(str).str.replace(r'\.0$','',regex=True)
          keys=list(zip(all_df.season.astype(str),all_df.player_id,all_df.team_id.astype(int)))
          assert len(keys)==len(set(keys)), 'duplicate full-core keys across chosen season outputs'
          assert len(all_df)==9647, f'expected 9647 full-core rows, got {len(all_df)}'
          passmask=all_df.status.astype(str).eq('PASS')
          passed=all_df[passmask].copy(); residual=all_df[~passmask].copy()

          passed.to_csv(out/'FULLCORE_EXACT_PASS_ROWS.csv.gz',index=False,compression='gzip')
          residual.to_csv(out/'FULLCORE_RESIDUAL_KEYS.csv',index=False)
          pd.DataFrame(fail_rows).to_csv(out/'FAILED_GAMES_EVIDENCE.csv',index=False)
          (out/'SEASON_GATES.json').write_text(json.dumps(gates,indent=2)+'\n')

          by_status=residual.status.astype(str).value_counts().to_dict()
          seasons={}
          for season,g in all_df.groupby('season'):
              seasons[season]={
                  'rows':len(g),
                  'pass_rows':int(g.status.astype(str).eq('PASS').sum()),
                  'failure_rows':int(~g.status.astype(str).eq('PASS')).sum(),
                  'source':str(g.artifact_source.iloc[0]),
              }
          summary={
              'status':'PASS',
              'authoritative_v2':{'all':14524,'full_core':9647,'partial_exact':4877,'exact_segments':5199},
              'fullcore_rows':len(all_df),
              'exact_pass_rows':len(passed),
              'residual_rows':len(residual),
              'residual_by_status':by_status,
              'failed_game_evidence_rows':len(fail_rows),
              'seasons':seasons,
              'no_percentage_backsolve':bool(all(~all_df.rounded_percentage_backsolve_used.astype(bool))) if 'rounded_percentage_backsolve_used' in all_df else None,
              'no_opponent_rebound_inference':bool(all(~all_df.opponent_rebound_inference_used.astype(bool))) if 'opponent_rebound_inference_used' in all_df else None,
              'no_partial_tenure_team_subtraction':bool(all(~all_df.whole_team_subtraction_across_partial_tenure_used.astype(bool))) if 'whole_team_subtraction_across_partial_tenure_used' in all_df else None,
          }
          assert summary['no_percentage_backsolve'] is True
          assert summary['no_opponent_rebound_inference'] is True
          assert summary['no_partial_tenure_team_subtraction'] is True
          (out/'SUMMARY.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps({k:v for k,v in summary.items() if k!='seasons'},indent=2))
          PY
      - name: Persist residual checkpoint
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT"
          git commit -m 'Persist full-core exact residual aggregate' || true
          git push origin HEAD:agent/treb-final-exact-assembly
      - uses: actions/upload-artifact@v4
        with:
          name: TREB-fullcore-residual-aggregate-${{ github.run_id }}
          path: ${{ env.OUT }}
          retention-days: 90
