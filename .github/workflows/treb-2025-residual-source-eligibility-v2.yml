name: TREB 2025-26 residual source eligibility staged diagnostic v2

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-2025-residual-source-eligibility-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: treb-2025-residual-source-eligibility-v2
  cancel-in-progress: false

jobs:
  staged-source-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r team_trb_all_players/requirements.txt

      - name: Stage 1 - acquire authoritative residual manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/residual progress
          curl --fail --location --retry 4 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" -o work/residual.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9242191393/zip"
          unzip -q work/residual.zip -d work/residual
          python - <<'PY'
          import json,pathlib,time
          p=next(pathlib.Path('work/residual').rglob('TREB_RESIDUAL_1751_MANIFEST.csv.gz'))
          pathlib.Path('progress/stage_1.json').write_text(json.dumps({'stage':1,'name':'acquire_residual_manifest','status':'PASS','manifest':str(p),'ts':time.time()},indent=2))
          print('STAGE1_GATE=PASS')
          PY
      - name: Upload Stage 1 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: TREB-2025-source-eligibility-v2-stage-1-${{ github.run_id }}
          path: progress/stage_1.json
          retention-days: 90

      - name: Stage 2 - verify 409 keys and authoritative target membership
        shell: bash
        run: |
          set -euo pipefail
          python -u team_trb_all_players/build_roster_targets_v2.py
          python - <<'PY'
          import csv,gzip,json,pathlib,time
          m=next(pathlib.Path('work/residual').rglob('TREB_RESIDUAL_1751_MANIFEST.csv.gz'))
          with gzip.open(m,'rt',encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          modern=[r for r in rows if str(r.get('season','')).replace('_','-')=='2025-26']
          keys={(int(float(r['player_id'])),int(float(r['team_id']))) for r in modern}
          assert len(keys)==409, len(keys)
          tp=pathlib.Path('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz')
          target_rows=[]
          with gzip.open(tp,'rt',encoding='utf-8') as f:
              for line in f:
                  if line.strip():
                      r=json.loads(line)
                      if r.get('season')=='2025-26': target_rows.append(r)
          target_keys={(int(r['player_id']),int(r['team_id'])) for r in target_rows}
          inside=keys & target_keys; outside=keys-target_keys
          out={'stage':2,'name':'target_membership','status':'PASS','residual_keys':409,'target_keys_2025_26':len(target_keys),'in_target_universe':len(inside),'outside_target_universe':len(outside),'outside_keys':[{'player_id':p,'team_id':t} for p,t in sorted(outside)],'ts':time.time()}
          pathlib.Path('work/stage_2_target_membership.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          pathlib.Path('progress/stage_2.json').write_text(json.dumps({k:v for k,v in out.items() if k!='outside_keys'},indent=2,sort_keys=True))
          print('STAGE2_GATE=PASS in_target=',len(inside),'outside_target=',len(outside))
          PY
      - name: Upload Stage 2 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: TREB-2025-source-eligibility-v2-stage-2-${{ github.run_id }}
          path: |
            progress/stage_2.json
            work/stage_2_target_membership.json
          retention-days: 90

      - name: Stage 3 - partition eligibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,json,pathlib,time,collections
          m=next(pathlib.Path('work/residual').rglob('TREB_RESIDUAL_1751_MANIFEST.csv.gz'))
          with gzip.open(m,'rt',encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          keys={(int(float(r['player_id'])),int(float(r['team_id']))) for r in rows if str(r.get('season','')).replace('_','-')=='2025-26'}
          tp=pathlib.Path('team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz')
          classes={}
          with gzip.open(tp,'rt',encoding='utf-8') as f:
              for line in f:
                  if not line.strip(): continue
                  r=json.loads(line)
                  if r.get('season')!='2025-26': continue
                  k=(int(r['player_id']),int(r['team_id']))
                  txt=' '.join(str(r.get(x,'')) for x in ('target_type','tenure_type','scope','classification','reuse_type')).lower()
                  if 'partial' in txt or r.get('is_partial') is True or r.get('full_core_reuse') is False: classes[k]='PARTIAL'
                  elif 'full' in txt or 'core' in txt or r.get('full_core_reuse') is True: classes[k]='FULL_CORE'
                  else: classes[k]='TARGET_UNLABELED'
          c=collections.Counter(classes.get(k,'OUTSIDE_TARGET') for k in keys)
          out={'stage':3,'name':'eligibility_partition','status':'PASS','counts':dict(c),'total':sum(c.values()),'ts':time.time()}
          pathlib.Path('work/stage_3_eligibility_partition.json').write_text(json.dumps(out,indent=2,sort_keys=True)); pathlib.Path('progress/stage_3.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print('STAGE3_GATE=PASS counts=',dict(c))
          PY
      - name: Upload Stage 3 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: TREB-2025-source-eligibility-v2-stage-3-${{ github.run_id }}
          path: |
            progress/stage_3.json
            work/stage_3_eligibility_partition.json
          retention-days: 90

      - name: Stage 4 - inspect static CDN source coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source
          python - <<'PY'
          from pathlib import Path
          import urllib.request,subprocess,tarfile
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          arc=Path('work/source/cdnnba_2025.tar.xz')
          subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--output',str(arc),urls['cdnnba_2025']],check=True)
          with tarfile.open(arc,'r:xz') as tf: tf.extractall('work/source')
          PY
          python - <<'PY'
          import csv,gzip,json,pathlib,time
          m=next(pathlib.Path('work/residual').rglob('TREB_RESIDUAL_1751_MANIFEST.csv.gz'))
          with gzip.open(m,'rt',encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          keys={(int(float(r['player_id'])),int(float(r['team_id']))) for r in rows if str(r.get('season','')).replace('_','-')=='2025-26'}
          csvp=next(pathlib.Path('work/source').rglob('cdnnba_2025.csv'))
          with open(csvp,'rt',encoding='utf-8',newline='') as f:
              reader=csv.DictReader(f); fields=reader.fieldnames or []; low={x.lower():x for x in fields}
              pid_col=next((low[x] for x in ('player_id','person_id','playerid','personid') if x in low),None); tid_col=next((low[x] for x in ('team_id','teamid') if x in low),None)
              pairs=set(); players=set(); teams=set(); n=0
              for r in reader:
                  n+=1
                  try:
                      if pid_col and r.get(pid_col) not in ('',None): players.add(int(float(r[pid_col])))
                  except: pass
                  try:
                      if tid_col and r.get(tid_col) not in ('',None): teams.add(int(float(r[tid_col])))
                  except: pass
                  if pid_col and tid_col:
                      try: pairs.add((int(float(r[pid_col])),int(float(r[tid_col]))))
                      except: pass
          pair_present=keys & pairs if pid_col and tid_col else set(); player_only={k for k in keys if k[0] in players and k not in pairs} if pid_col and tid_col else set(); team_only={k for k in keys if k[1] in teams and k[0] not in players} if pid_col and tid_col else set(); neither=keys-pair_present-player_only-team_only
          out={'stage':4,'name':'static_cdn_source_coverage','status':'PASS','csv_rows':n,'columns':fields,'player_id_column':pid_col,'team_id_column':tid_col,'pair_present':len(pair_present),'player_present_without_pair':len(player_only),'team_present_without_player':len(team_only),'neither_or_schema_unavailable':len(neither),'ts':time.time()}
          pathlib.Path('work/stage_4_source_coverage.json').write_text(json.dumps(out,indent=2,sort_keys=True)); pathlib.Path('progress/stage_4.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print('STAGE4_GATE=PASS pair_present=',len(pair_present),'player_only=',len(player_only),'team_only=',len(team_only),'neither=',len(neither))
          PY
      - name: Upload Stage 4 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: TREB-2025-source-eligibility-v2-stage-4-${{ github.run_id }}
          path: |
            progress/stage_4.json
            work/stage_4_source_coverage.json
          retention-days: 90

      - name: Stage 5 - derive recovery classes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,time,hashlib
          stages=[json.loads(p.read_text()) for p in sorted(pathlib.Path('progress').glob('stage_[1-4].json'))]
          s2=json.loads(pathlib.Path('work/stage_2_target_membership.json').read_text()); s3=json.loads(pathlib.Path('work/stage_3_eligibility_partition.json').read_text()); s4=json.loads(pathlib.Path('work/stage_4_source_coverage.json').read_text())
          classes=[]
          if s2['outside_target_universe']: classes.append({'class':'OUTSIDE_AUTHORITATIVE_TARGET_UNIVERSE','count':s2['outside_target_universe'],'next':'audit canonical-key/target-universe mismatch only'})
          for k,v in s3['counts'].items():
              if k!='OUTSIDE_TARGET' and v: classes.append({'class':k,'count':v,'next':'route only this eligibility class to matching deterministic reconstruction path'})
          final={'gate':'PASS','authoritative_residual_keys':409,'stages':stages,'recovery_classes':classes,'source_coverage':s4,'ts':time.time()}
          data=json.dumps(final,indent=2,sort_keys=True).encode(); pathlib.Path('work/final_source_eligibility_diagnostic.json').write_bytes(data); pathlib.Path('work/final_source_eligibility_diagnostic.sha256').write_text(hashlib.sha256(data).hexdigest()+'  final_source_eligibility_diagnostic.json\n'); pathlib.Path('progress/stage_5.json').write_text(json.dumps({'stage':5,'name':'derive_recovery_classes','status':'PASS','classes':classes,'ts':time.time()},indent=2,sort_keys=True))
          print('STAGE5_GATE=PASS classes=',classes)
          PY
      - name: Upload Stage 5 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: TREB-2025-source-eligibility-v2-stage-5-${{ github.run_id }}
          path: |
            progress/stage_5.json
            work/final_source_eligibility_diagnostic.json
            work/final_source_eligibility_diagnostic.sha256
          retention-days: 90
      - name: Upload final staged diagnostic
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-2025-source-eligibility-v2-final-${{ github.run_id }}
          path: |
            progress/
            work/stage_2_target_membership.json
            work/stage_3_eligibility_partition.json
            work/stage_4_source_coverage.json
            work/final_source_eligibility_diagnostic.json
            work/final_source_eligibility_diagnostic.sha256
          retention-days: 90
          if-no-files-found: warn
