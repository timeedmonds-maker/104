name: TREB 2019 V3+shotdetail bridge canary
on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-2019-v3-shotdetail-bridge-canary.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Download 2019 V3, shotdetail, legacy and pbp controls
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          raw=Path('/tmp/treb2019bridge'); raw.mkdir(parents=True,exist_ok=True)
          txt=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in txt.splitlines() if '=' in x}
          for key in ('nbastatsv3_2019','shotdetail_2019','nbastats_2019','pbpstats_2019'):
            url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
            subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--output',str(arc),url],check=True)
            with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Audit target and control semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          raw=Path('/tmp/treb2019bridge')
          v3=pd.read_csv(raw/'nbastatsv3_2019.csv',low_memory=False)
          shot=pd.read_csv(raw/'shotdetail_2019.csv',low_memory=False)
          nba=pd.read_csv(raw/'nbastats_2019.csv',low_memory=False)
          pbp=pd.read_csv(raw/'pbpstats_2019.csv',low_memory=False)
          targets=[21901316,21901317,21901318]
          def gidcol(df,cands):
            for c in cands:
              if c in df.columns:return c
            raise KeyError(cands)
          vg=gidcol(v3,['gameId','GAME_ID','GAMEID']); sg=gidcol(shot,['GAME_ID','gameId','GAMEID']); ng=gidcol(nba,['GAME_ID','gameId','GAMEID']); pg=gidcol(pbp,['GAMEID','GAME_ID','gameId'])
          vgid=pd.to_numeric(v3[vg],errors='coerce'); sgid=pd.to_numeric(shot[sg],errors='coerce'); ngid=pd.to_numeric(nba[ng],errors='coerce'); pgid=pd.to_numeric(pbp[pg],errors='coerce')
          allv=set(vgid.dropna().astype('int64')); alls=set(sgid.dropna().astype('int64')); alln=set(ngid.dropna().astype('int64')); allp=set(pgid.dropna().astype('int64'))
          controls=sorted((allv&alls&alln&allp)-set(targets),key=lambda x:min(abs(x-t) for t in targets))[:20]
          assert len(controls)>=10
          def v3_game(g): return v3[vgid.eq(g)].copy()
          def shot_game(g): return shot[sgid.eq(g)].copy()
          def positive_teams(series):
            x=pd.to_numeric(series,errors='coerce').dropna().astype('int64')
            return sorted(x[x.gt(0)].unique().tolist())
          def describe_v3(g):
            d=v3_game(g); out={'rows':len(d)}
            out['teams']=positive_teams(d.teamId) if 'teamId' in d else []
            out['periods']=sorted(pd.to_numeric(d.period,errors='coerce').dropna().astype('int64').unique().tolist()) if 'period' in d else []
            mask=pd.Series(False,index=d.index)
            for c in ['actionType','subType','description']:
              if c in d: mask=mask|d[c].astype(str).str.contains('rebound',case=False,na=False)
            r=d[mask].copy(); out['rebound_rows']=len(r)
            rt=pd.to_numeric(r.teamId,errors='coerce') if 'teamId' in r else pd.Series(dtype=float)
            out['rebound_positive_team_rows']=int(rt.fillna(0).gt(0).sum())
            out['rebound_neutral_team_rows']=int(rt.fillna(0).eq(0).sum())
            sm=pd.Series(False,index=d.index)
            for c in ['actionType','subType','description']:
              if c in d: sm=sm|d[c].astype(str).str.contains('substitut|substitution',case=False,na=False,regex=True)
            out['substitution_rows']=int(sm.sum())
            return out
          def describe_shot(g):
            d=shot_game(g); out={'rows':len(d)}
            out['teams']=positive_teams(d.TEAM_ID) if 'TEAM_ID' in d else []
            if 'SHOT_MADE_FLAG' in d:
              x=pd.to_numeric(d.SHOT_MADE_FLAG,errors='coerce'); out['missed_shots']=int(x.eq(0).sum()); out['made_shots']=int(x.eq(1).sum())
            return out
          rec=[]
          for g in controls+targets:
            item={'game_id':int(g),'role':'TARGET' if g in targets else 'CONTROL','v3':describe_v3(g),'shotdetail':describe_shot(g),'legacy_rows':int(ngid.eq(g).sum()),'pbp_rows':int(pgid.eq(g).sum())}
            item['bridge_structural_ready']=(len(item['v3']['teams'])==2 and item['v3']['rows']>0 and item['v3']['rebound_rows']>0 and item['v3']['substitution_rows']>0 and item['shotdetail']['rows']>0 and len(item['shotdetail']['teams'])==2)
            rec.append(item)
          ctrl=[x for x in rec if x['role']=='CONTROL']; tar=[x for x in rec if x['role']=='TARGET']
          report={'status':'PASS','neutral_team_id_zero_is_nonteam_event':True,'controls':len(ctrl),'targets':len(tar),'control_structural_ready':sum(x['bridge_structural_ready'] for x in ctrl),'target_structural_ready':sum(x['bridge_structural_ready'] for x in tar),'production_promotion_allowed':False,'records':rec}
          out=Path('team_trb_all_players/impact_database/2019_v3_shotdetail_bridge'); out.mkdir(parents=True,exist_ok=True)
          (out/'STRUCTURAL_CANARY.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k!='records'},indent=2))
          assert report['control_structural_ready']==len(ctrl), report
          assert report['target_structural_ready']==len(tar), report
          PY
      - name: Reassert immutable V2 and persist
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json
          p='team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz'
          r=[json.loads(x) for x in gzip.open(p,'rt') if x.strip()]
          keys={(str(x['season']),str(x['player_id']).removesuffix('.0'),int(x['team_id'])) for x in r}
          assert len(r)==14524 and len(keys)==14524
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team_trb_all_players/impact_database/2019_v3_shotdetail_bridge
          git commit -m 'Persist corrected 2019 V3+shotdetail structural canary' || true
          git push origin HEAD:agent/treb-final-exact-assembly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-2019-v3-shotdetail-bridge-${{ github.run_id }}
          path: team_trb_all_players/impact_database/2019_v3_shotdetail_bridge
          retention-days: 90
