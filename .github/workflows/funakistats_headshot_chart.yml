name: Funakistats headshot chart
on:
  push:
    branches:
      - agent/funakistats-headshot-chart
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy matplotlib pillow requests
      - name: Build chart
        run: |
          cat > /tmp/build_chart.py <<'PY'
          import os, math, requests
          import pandas as pd, numpy as np
          import matplotlib.pyplot as plt
          import matplotlib.image as mpimg
          from matplotlib.offsetbox import OffsetImage, AnnotationBbox
          from PIL import Image
          from io import BytesIO

          data = [
          (1627750,'Jamal Murray',9064,39.8624,4.4220),(1631260,'AJ Green',4812,39.4904,2.6087),(1631157,'Ryan Rollins',3335,39.2380,2.1792),(202695,'Kawhi Leonard',7268,39.1283,2.9758),(1631212,'Peyton Watson',4904,38.8459,1.2391),(201142,'Kevin Durant',11576,38.7407,2.7168),(202681,'Kyrie Irving',7166,38.7355,2.9592),(203999,'Nikola Jokic',12355,38.6991,3.3271),(202331,'Paul George',7932,38.6053,3.5608),(1628379,'Luke Kennard',7345,38.6013,3.1850),(200782,'P.J. Tucker',4445,38.4954,1.6267),(201939,'Stephen Curry',10076,38.3456,3.1569),(1627826,'Ivica Zubac',9862,38.2723,1.9712),(1627777,'Georges Niang',6776,38.0897,2.1808),(1630174,'Aaron Nesmith',6819,38.0136,2.6472),(203507,'Giannis Antetokounmpo',10123,37.9398,0.8692),(1626164,'Devin Booker',11568,37.9093,1.8861),(1631096,'Chet Holmgren',5287,37.8790,0.6634),(1629008,'Michael Porter Jr.',8910,37.8549,2.6618),(1627752,'Taurean Prince',7152,37.8461,0.7602),(1626157,'Karl-Anthony Towns',10232,37.8446,1.7522),(1626172,'Kevon Looney',6288,37.7931,1.6023),(201144,'Mike Conley',8968,37.7923,1.5799),(1628960,'Grayson Allen',9289,37.7787,1.3958),(1630573,'Sam Hauser',6598,37.7679,1.1900),(1630198,'Isaiah Joe',6560,37.7565,1.3440),(203954,'Joel Embiid',7665,37.7430,2.7987),(203952,'Andrew Wiggins',9298,37.7373,1.4960),(1629636,'Darius Garland',10356,37.7274,2.0390),(201143,'Al Horford',8258,37.7078,1.5599)
          ]
          df = pd.DataFrame(data, columns=['player_id','player','minutes_on','team_3pt_on_pct','team_3pt_swing_pp'])
          os.makedirs('headshots', exist_ok=True)

          for _, r in df.iterrows():
              pid = int(r.player_id)
              url = f'https://cdn.nba.com/headshots/nba/latest/1040x760/{pid}.png'
              resp = requests.get(url, timeout=30, headers={'User-Agent':'Mozilla/5.0'})
              resp.raise_for_status()
              im = Image.open(BytesIO(resp.content)).convert('RGBA')
              alpha = np.asarray(im.getchannel('A'))
              ys, xs = np.where(alpha > 10)
              x0,x1,y0,y1 = xs.min(),xs.max()+1,ys.min(),ys.max()+1
              fg_h = y1-y0
              cut_y1 = int(y0 + fg_h*0.60)
              cx = (x0+x1)//2
              crop_h = max(cut_y1-y0,1)
              crop_w = int(crop_h*0.95)
              cx0 = max(0, cx-crop_w//2); cx1 = min(im.width, cx0+crop_w)
              crop = im.crop((cx0,y0,cx1,cut_y1))
              crop.save(f'headshots/{pid}.png')

          fig = plt.figure(figsize=(12,12), dpi=300, facecolor='white')
          ax = fig.add_axes([0.115,0.15,0.82,0.69], facecolor='white')
          x=df.team_3pt_swing_pp.values; y=df.team_3pt_on_pct.values
          xmin=math.floor((x.min()-.35)*2)/2; xmax=math.ceil((x.max()+.35)*2)/2
          ymin=math.floor((y.min()-.30)*2)/2; ymax=math.ceil((y.max()+.30)*2)/2
          xmid=np.median(x); ymid=np.median(y)
          ax.axvspan(xmin,xmid,ymin=(ymid-ymin)/(ymax-ymin),ymax=1,color='#f4dfbf',alpha=.55,zorder=0)
          ax.axvspan(xmid,xmax,ymin=(ymid-ymin)/(ymax-ymin),ymax=1,color='#dfeede',alpha=.65,zorder=0)
          ax.axvspan(xmin,xmid,ymin=0,ymax=(ymid-ymin)/(ymax-ymin),color='#f0d7d7',alpha=.55,zorder=0)
          ax.axvspan(xmid,xmax,ymin=0,ymax=(ymid-ymin)/(ymax-ymin),color='#e4e5ec',alpha=.65,zorder=0)
          ax.grid(True,color='#9ba0a6',linewidth=.6,alpha=.25,zorder=1)
          ax.axvline(xmid,color='#6f747a',lw=.9,alpha=.45,zorder=2); ax.axhline(ymid,color='#6f747a',lw=.9,alpha=.45,zorder=2)
          ax.scatter(x,y,s=8,color='#222',zorder=3)

          for _,r in df.iterrows():
              arr=mpimg.imread(f'headshots/{int(r.player_id)}.png')
              oi=OffsetImage(arr,zoom=0.105)
              ab=AnnotationBbox(oi,(r.team_3pt_swing_pp,r.team_3pt_on_pct),frameon=False,pad=0,box_alignment=(0.5,0.5),zorder=5)
              ax.add_artist(ab)

          lasts=df.player.str.split().str[-1]; counts=lasts.value_counts()
          for _,r in df.iterrows():
              s=r.player.split()[-1]; label=r.player if counts[s]>1 else s
              ax.annotate(label,(r.team_3pt_swing_pp,r.team_3pt_on_pct),xytext=(0,-26),textcoords='offset points',ha='center',va='top',fontsize=5.8,fontweight='bold',zorder=6)

          ax.set_xlim(xmin,xmax); ax.set_ylim(ymin,ymax)
          xt=np.arange(math.ceil(xmin*2)/2,xmax+.001,.5); yt=np.arange(math.ceil(ymin*2)/2,ymax+.001,.5)
          ax.set_xticks(xt); ax.set_yticks(yt)
          ax.set_xticklabels([f'{v:+.1f}' if v>0 else f'{v:.1f}' for v in xt],fontsize=8)
          ax.set_yticklabels([f'{v:.1f}%' for v in yt],fontsize=8)
          ax.set_xlabel('TEAM 3PT% ON–OFF SWING (PERCENTAGE POINTS)',fontsize=9.5,alpha=.55,labelpad=10,fontweight='bold')
          ax.set_ylabel('TEAM 3PT% WHILE PLAYER IS ON COURT',fontsize=9.5,alpha=.55,labelpad=10,fontweight='bold')
          for sp in ax.spines.values(): sp.set_visible(False)
          fig.text(.115,.925,'LEADERS IN TEAM 3PT% IMPACT',fontsize=23,fontweight='black',ha='left')
          fig.text(.115,.888,'Last 5 seasons • 2021–22 to 2025–26 • Minimum 3,000 on-court minutes • Top 30 by Team 3PT% while on court',fontsize=8.7,ha='left',alpha=.68)
          fig.text(.115,.073,'Career aggregate across the five-season window. Native 3PT% ON and corrected-OFF weighted by corresponding minutes; swing calculated last.',fontsize=6.5,alpha=.58)
          fig.text(.885,.073,'@funakistats',fontsize=8.5,fontweight='bold',ha='right',color='#d5483f',alpha=.55)
          out='funakistats_team_3pt_headshots_last5_top30_EMBEDDED.png'
          fig.savefig(out,dpi=300,bbox_inches='tight',pad_inches=.10,facecolor='white')
          plt.close(fig)
          df.to_csv('funakistats_team_3pt_headshots_last5_top30.csv',index=False)
          print(out)
          PY
          python /tmp/build_chart.py
      - uses: actions/upload-artifact@v4
        with:
          name: funakistats-team-3pt-headshot-chart
          path: |
            funakistats_team_3pt_headshots_last5_top30_EMBEDDED.png
            funakistats_team_3pt_headshots_last5_top30.csv
          retention-days: 7
