name: TREB 2004 post-horn diagnostic

on:
  push:
    branches: [treb-solved-engine-recovery-20260812]
    paths:
      - .github/workflows/treb-2004-posthorn-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: treb-2004-posthorn-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r team_trb_all_players/requirements.txt
          python -m pip install remotezip
      - name: Inspect pbpstats corrected archive remotely
        run: |
          python -u - <<'PY'
          from remotezip import RemoteZip
          import json
          url='https://pbpstats.s3.amazonaws.com/data.zip'
          games=['0020400826','0020400965']
          print('OPEN',url,flush=True)
          with RemoteZip(url) as z:
              infos=z.infolist()
              print('MEMBERS',len(infos),flush=True)
              for game in games:
                  hits=[i for i in infos if game in i.filename]
                  print('\nGAME',game,'HITS',[(h.filename,h.file_size) for h in hits],flush=True)
                  for h in hits:
                      if h.file_size > 5_000_000: continue
                      b=z.read(h.filename)
                      print('FILE',h.filename,'BYTES',len(b),flush=True)
                      text=b.decode('utf-8','replace')
                      if len(text)<=20000:
                          print(text,flush=True)
                      else:
                          print(text[:10000],flush=True)
                          print('...TAIL...',text[-5000:],flush=True)
              # show likely override paths for 2004 game IDs even if filenames do not contain leading-zero form
              for needle in ('20400826','20400965'):
                  hits=[i for i in infos if needle in i.filename]
                  print('\nSHORTID',needle,'HITS',[(h.filename,h.file_size) for h in hits],flush=True)
              print('\nTOP_PATHS', [i.filename for i in infos[:100]], flush=True)
          PY
