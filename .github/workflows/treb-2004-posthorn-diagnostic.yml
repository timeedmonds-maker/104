name: TREB 2004 post-horn diagnostic

on:
  push:
    branches: [treb-solved-engine-recovery-20260812]
    paths:
      - .github/workflows/treb-2004-posthorn-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: treb-2004-posthorn-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r team_trb_all_players/requirements.txt
      - name: Download 2004 NBA Stats source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tarfile, urllib.request
          raw=Path('team_trb_all_players/impact_database/local_raw'); raw.mkdir(parents=True, exist_ok=True)
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls=dict(line.split('=',1) for line in text.splitlines() if '=' in line)
          url=urls['nbastats_2004'].strip(); arc=raw/url.rsplit('/',1)[-1]
          urllib.request.urlretrieve(url, arc)
          with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Inspect retained core granularity and probe official endpoints
        run: |
          python -u - <<'PY'
          import gzip, json, urllib.request, urllib.error
          from pathlib import Path
          import pandas as pd

          print('PLAYER_TEAM_TOTALS')
          p='team_trb_all_players/impact_database/outputs/2004-05/player_team_totals.csv.gz'
          d=pd.read_csv(p)
          print('columns',list(d.columns))
          print('shape',d.shape)
          print(d[d.astype(str).apply(lambda r: r.str.contains('2754',regex=False).any(),axis=1)].head(10).to_string(index=False))

          game='0020400965'
          urls=[
            f'https://cdn.nba.com/static/json/liveData/boxscore/boxscore_{game}.json',
            f'https://data.nba.net/prod/v1/2004/{game}_boxscore.json',
            f'https://data.nba.com/data/v2015/json/mobile_teams/nba/2004/scores/gamedetail/{game}_gamedetail.json',
          ]
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
            'Referer':'https://www.nba.com/',
            'Origin':'https://www.nba.com',
            'Accept':'application/json, text/plain, */*',
          }
          for u in urls:
            print('\nPROBE',u)
            try:
              req=urllib.request.Request(u,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r:
                b=r.read(); print('status',r.status,'bytes',len(b),'type',r.headers.get('content-type')); print(b[:1000].decode('utf-8','replace'))
            except Exception as e: print('ERROR',repr(e))

          print('\nSTATS_API')
          u=('https://stats.nba.com/stats/boxscoretraditionalv2?'
             'EndPeriod=10&EndRange=28800&GameID=0020400965&RangeType=0&StartPeriod=1&StartRange=0')
          try:
            req=urllib.request.Request(u,headers=headers)
            with urllib.request.urlopen(req,timeout=20) as r:
              b=r.read(); print('status',r.status,'bytes',len(b)); print(b[:4000].decode('utf-8','replace'))
          except Exception as e: print('ERROR',repr(e))
          PY
