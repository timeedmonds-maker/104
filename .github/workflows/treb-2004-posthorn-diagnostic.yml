name: TREB 2004 post-horn diagnostic

on:
  push:
    branches: [treb-solved-engine-recovery-20260812]
    paths:
      - .github/workflows/treb-2004-posthorn-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: treb-2004-posthorn-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: team_trb_all_players/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r team_trb_all_players/requirements.txt
      - name: Download 2004 NBA Stats source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tarfile, urllib.request
          raw=Path('team_trb_all_players/impact_database/local_raw'); raw.mkdir(parents=True, exist_ok=True)
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls=dict(line.split('=',1) for line in text.splitlines() if '=' in line)
          url=urls['nbastats_2004'].strip(); arc=raw/url.rsplit('/',1)[-1]
          urllib.request.urlretrieve(url, arc)
          with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Pinpoint affected lineup transition
        run: |
          python -u - <<'PY'
          import sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import local_treb_rebuild as core

          GAME=20400826; BOS=1610612738
          core.STARTER_REPAIRS[(GAME,1,BOS)] = [952,1711,1718,1729,2753]
          nba=pd.read_csv(Path('team_trb_all_players/impact_database/local_raw/nbastats_2004.csv'), low_memory=False)
          nums=['GAME_ID','EVENTNUM','EVENTMSGTYPE','EVENTMSGACTIONTYPE','PERIOD','PLAYER1_ID','PLAYER2_ID','PLAYER3_ID','PLAYER1_TEAM_ID','PLAYER2_TEAM_ID','PLAYER3_TEAM_ID','PERSON1TYPE','PERSON2TYPE','PERSON3TYPE']
          for c in nums: nba[c]=pd.to_numeric(nba[c],errors='coerce').fillna(0).astype('int64')
          g=nba[nba.GAME_ID.eq(GAME)].copy()
          res=core.reconstruct_game_lineups(g)
          p2t=core._player_team(g)
          names={}
          for n in (1,2,3):
              for pid,name in zip(g[f'PLAYER{n}_ID'],g[f'PLAYER{n}_NAME']):
                  if int(pid)>0 and pd.notna(name): names[int(pid)]=str(name)
          affected={1718,1729,1711,2754,2556}
          print('AFFECTED',[(p,names.get(p)) for p in sorted(affected)])
          print('EVENT617',g[g.EVENTNUM.eq(617)][['EVENTNUM','PCTIMESTRING','EVENTMSGTYPE','EVENTMSGACTIONTYPE','PLAYER1_ID','PLAYER1_NAME','NEUTRALDESCRIPTION']].to_dict('records'))
          p5=res.events[res.events.PERIOD.eq(5)].sort_values(['ELAPSED','EVENTNUM'])
          last=None
          for _,r in p5.iterrows():
              lineup=tuple(r.LINEUP)
              bos=tuple(sorted(p for p in lineup if p2t.get(int(p))==BOS))
              if bos!=last or int(r.EVENTNUM) in (598,602,603,604,606,607,609,610,611,612,613,614,615,617):
                  print('P5',int(r.EVENTNUM),r.PCTIMESTRING,'elapsed',int(r.ELAPSED),'type',int(r.EVENTMSGTYPE),'BOS',[(p,names.get(p)) for p in bos], 'MATCH_AFFECTED',set(bos)==affected)
                  last=bos
          print('P5_SOURCE_SUBS')
          print(g[(g.PERIOD.eq(5)) & (g.EVENTMSGTYPE.eq(8))][['EVENTNUM','PCTIMESTRING','PLAYER1_ID','PLAYER1_NAME','PLAYER2_ID','PLAYER2_NAME']].to_string(index=False))
          print('GAME_SECONDS_AFFECTED',[(p,names.get(p),res.seconds.get(p,0)) for p in sorted(affected)])
          PY
