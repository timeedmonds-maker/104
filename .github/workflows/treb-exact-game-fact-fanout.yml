name: TREB exact game facts - historical fanout

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - team_trb_all_players/final_integrity_rebuild/GAME_FACT_FANOUT_CONTROL.json

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build remaining batch matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          ctl=json.loads(Path('team_trb_all_players/final_integrity_rebuild/GAME_FACT_FANOUT_CONTROL.json').read_text())
          start=int(ctl['start_year']); end=int(ctl['end_year']); size=int(ctl.get('batch_size',100))
          # Regular-season game counts sufficient to determine the number of 100-game slices.
          # A slight over-count is harmless (an empty terminal slice persists as PASS); under-count is not allowed.
          special={2011:990, 2019:1059, 2020:1080}
          include=[]
          for year in range(start,end+1):
              games=special.get(year,1230)
              batches=(games+size-1)//size
              for batch in range(batches):
                  include.append({'year':year,'batch':batch,'size':size})
          if len(include)>256:
              raise SystemExit(f'matrix too large: {len(include)}')
          matrix=json.dumps({'include':include},separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('matrix='+matrix+'\n')
          print(f'FANOUT_TASKS={len(include)} years={start}-{end} batch_size={size}')
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Resolve batch
        id: ctl
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; BATCH='${{ matrix.batch }}'; SIZE='${{ matrix.size }}'
          NEXT=$((YEAR+1)); SEASON="${YEAR}-$(printf '%02d' $((NEXT%100)))"
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
      - name: Download season sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ steps.ctl.outputs.year }}'; RAW="/tmp/trebraw-${YEAR}"; mkdir -p "$RAW"
          python - <<'PY'
          import subprocess, tarfile, urllib.request
          from pathlib import Path
          year=int('${{ steps.ctl.outputs.year }}'); raw=Path(f'/tmp/trebraw-{year}')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in [f'nbastats_{year}',f'nbastatsv3_{year}',f'pbpstats_{year}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Build exact batch
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ steps.ctl.outputs.year }}'; BATCH='${{ steps.ctl.outputs.batch }}'; SIZE='${{ steps.ctl.outputs.size }}'; SEASON='${{ steps.ctl.outputs.season }}'
          RAW="/tmp/trebraw-${YEAR}"; OUT="/tmp/treb-batch-${YEAR}-${BATCH}"; mkdir -p "$OUT"
          NBA=$(find "$RAW" -name "nbastats_${YEAR}.csv" -print -quit)
          V3=$(find "$RAW" -name "nbastatsv3_${YEAR}.csv" -print -quit)
          PBP=$(find "$RAW" -name "pbpstats_${YEAR}.csv" -print -quit)
          python -u team_trb_all_players/build_exact_game_fact_batch.py --season "$SEASON" --nba "$NBA" --v3 "$V3" --pbp "$PBP" --output-dir "$OUT" --batch-index "$BATCH" --batch-size "$SIZE" 2>&1 | tee "$OUT/build.log"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
      - name: Persist batch durably
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ steps.ctl.outputs.year }}'; BATCH='${{ steps.ctl.outputs.batch }}'; SEASON='${{ steps.ctl.outputs.season }}'; OUT="/tmp/treb-batch-${YEAR}-${BATCH}"
          [ -f "$OUT/qa.json" ] || exit 0
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BR="treb-game-facts-${YEAR}-batch-$(printf '%03d' "$BATCH")"
          git checkout -B "$BR" "${{ github.sha }}"
          DEST="team_trb_all_players/impact_database/exact_game_fact_batches/${SEASON}/batch_$(printf '%03d' "$BATCH")"
          rm -rf "$DEST"; mkdir -p "$DEST"; cp "$OUT"/* "$DEST"/
          git add -f "$DEST"; git commit -m "Persist exact TREB batch ${SEASON} ${BATCH}"; git push --force origin HEAD:"$BR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-fanout-${{ matrix.year }}-${{ matrix.batch }}
          path: /tmp/treb-batch-${{ matrix.year }}-${{ matrix.batch }}/**
          retention-days: 90
          if-no-files-found: warn
