name: TREB Stage2 continuous guardian

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: treb-stage2-public-actions
  cancel-in-progress: false

jobs:
  collect:
    name: Continuous Stage2 collector from durable head
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Check out current durable Stage2 head
        uses: actions/checkout@v4
        with:
          ref: treb-stage2-actions-live
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Restore endpoint cache
        uses: actions/cache@v4
        with:
          path: .treb_stage2_netcache_v4
          key: treb-stage2-continuous-${{ github.run_id }}
          restore-keys: |
            treb-stage2-continuous-
            treb-stage2-netcache-v5-
            treb-stage2-netcache-v4-

      - name: Validate current durable baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json')
          d=json.loads(p.read_text())
          complete=int(d.get('complete_windows') or 0)
          remaining=int(d.get('remaining_windows') or 0)
          total=int(d.get('impact_windows_total') or 0)
          assert total == 15427, d
          assert complete >= 13610, d
          print(f'GUARDIAN_BASELINE={complete}/{total} remaining={remaining}')
          PY
          python team_trb_all_players/run_corrected_off_batch_public_resilient.py --self-test

      - name: Collect continuously and checkpoint every iteration
        env:
          TREB_STAGE2_NET_CACHE: ${{ github.workspace }}/.treb_stage2_netcache_v4
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          started=$(date +%s)
          max_runtime=$((5*60*60+10*60))
          iteration=0

          while true; do
            iteration=$((iteration+1))
            git fetch origin treb-stage2-actions-live
            git reset --hard origin/treb-stage2-actions-live

            read -r before remaining total <<<"$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json').read_text())
          print(int(d.get('complete_windows') or 0), int(d.get('remaining_windows') or 0), int(d.get('impact_windows_total') or 0))
          PY
          )"

            echo "GUARDIAN_ITERATION=$iteration baseline=$before/$total remaining=$remaining"
            if [ "$remaining" -eq 0 ]; then
              echo 'STAGE2_COLLECTION_COMPLETE=1'
              break
            fi

            set +e
            python team_trb_all_players/run_corrected_off_batch_public_resilient.py \
              --batch-size 50 \
              --workers 1 \
              --request-interval 1.0
            rc=$?
            set -e

            python - "$iteration" "$before" "$rc" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          iteration=int(sys.argv[1]); before=int(sys.argv[2]); rc=int(sys.argv[3])
          src=Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json')
          d=json.loads(src.read_text())
          status={
            'generated_utc': datetime.now(timezone.utc).isoformat(),
            'runner': 'ubuntu-latest',
            'workflow': 'TREB Stage2 continuous guardian',
            'run_id': os.environ.get('GITHUB_RUN_ID'),
            'iteration': iteration,
            'complete_windows': int(d.get('complete_windows') or 0),
            'remaining_windows': int(d.get('remaining_windows') or 0),
            'added_this_iteration': int(d.get('complete_windows') or 0)-before,
            'collector_rc': rc,
            'batch_successes': int(d.get('batch_successes') or 0),
            'batch_requested': int(d.get('batch_requested') or 0),
            'selection_mode': d.get('selection_mode'),
            'batch_elapsed_seconds': d.get('batch_elapsed_seconds'),
            'transient_http_failure_rate': d.get('transient_http_failure_rate'),
            'network_counters': d.get('network_counters'),
            'all_complete': bool(d.get('all_complete')),
          }
          Path('team_trb_all_players/impact_database/actions_stage2_status.json').write_text(json.dumps(status, indent=2), encoding='utf-8')
          print(json.dumps(status, indent=2))
          PY

            after=$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json').read_text())
          print(int(d.get('complete_windows') or 0))
          PY
          )

            git add team_trb_all_players/impact_database/corrected_off \
                    team_trb_all_players/impact_database/actions_stage2_status.json
            if ! git diff --cached --quiet; then
              git commit -m "TREB guardian iteration $iteration: $before to $after [skip ci]"
              git pull --rebase origin treb-stage2-actions-live
              git push origin HEAD:treb-stage2-actions-live
            fi

            if [ "$after" -le "$before" ]; then
              echo "NO_PROGRESS iteration=$iteration before=$before after=$after rc=$rc"
              sleep 30
            fi

            elapsed=$(( $(date +%s) - started ))
            if [ "$elapsed" -ge "$max_runtime" ]; then
              echo "GUARDIAN_HANDOFF_REQUIRED=1 elapsed_seconds=$elapsed"
              break
            fi
          done

      - name: Print final guardian state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json').read_text())
          print(json.dumps({k:d.get(k) for k in ['complete_windows','impact_windows_total','remaining_windows','failed_windows','all_complete']}, indent=2))
          PY
