name: TREB residual unmatched rebound exact-identity diagnostics

on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths:
      - team_trb_all_players/final_integrity_rebuild/UNMATCHED_EXACT_IDENTITY_CONTROL.json

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  diagnose:
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix:
        year: [2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Fetch wave-1 residuals
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin treb-game-fact-repair-wave1
          git show origin/treb-game-fact-repair-wave1:team_trb_all_players/final_integrity_rebuild/game_fact_repair_wave1/${{ matrix.year }}/residual_failures.json > /tmp/residual.json
      - name: Download season sources
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"; mkdir -p "$RAW"
          python - <<'PY'
          import subprocess,tarfile,urllib.request
          from pathlib import Path
          y=int('${{ matrix.year }}'); raw=Path(f'/tmp/trebraw-{y}')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt',timeout=60).read().decode()
          urls={x.split('=',1)[0].strip():x.split('=',1)[1].strip() for x in text.splitlines() if '=' in x}
          for key in [f'nbastats_{y}',f'nbastatsv3_{y}',f'pbpstats_{y}']:
              url=urls[key]; arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','6','--retry-all-errors','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Diagnose exact event identities
        shell: bash
        run: |
          set -euo pipefail
          YEAR='${{ matrix.year }}'; RAW="/tmp/trebraw-${YEAR}"
          NBA=$(find "$RAW" -name "nbastats_${YEAR}.csv" -print -quit)
          V3=$(find "$RAW" -name "nbastatsv3_${YEAR}.csv" -print -quit)
          PBP=$(find "$RAW" -name "pbpstats_${YEAR}.csv" -print -quit)
          NBA="$NBA" V3="$V3" PBP="$PBP" YEAR="$YEAR" python - <<'PY'
          import json,os,re,sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'team_trb_all_players')
          import run_local_treb_production as io
          import production_treb_engine as rebound
          import production_treb_engine_v3 as lineup
          import local_treb_rebuild as core

          year=int(os.environ['YEAR']); residual=json.loads(Path('/tmp/residual.json').read_text())
          targets=sorted({int(r['game_id']) for r in residual if 'unmatched PBP rebound rows' in str(r.get('error',''))})
          nba=io.normalize_nba(pd.read_csv(os.environ['NBA'],low_memory=False)); v3=lineup.normalize_v3(pd.read_csv(os.environ['V3'],low_memory=False)); pbp=io.normalize_pbp(pd.read_csv(os.environ['PBP'],low_memory=False))
          ng={int(g):f.copy() for g,f in nba.groupby('GAME_ID',sort=False)}; vg={int(g):f.copy() for g,f in v3.groupby('gameId',sort=False)}; pg={int(g):f.copy() for g,f in pbp.groupby('GAMEID',sort=False)}

          counter_re=re.compile(r'\(off:(\d+) def:(\d+)\)',re.I)
          def namekey(s):
              s=core.normalize_description(s)
              return s.split(' rebound',1)[0].strip()
          games=[]
          for i,gid in enumerate(targets,1):
              rec={'game_id':gid}
              try:
                  lu=lineup.reconstruct_game_lineups(ng[gid],vg[gid])
                  matched,audit=rebound.join_pbp_rebounds(lu,pg[gid])
                  used={int(x) for x in matched.NBA_INDEX.dropna().astype(int)}
                  ordered=pg[gid].copy(); ordered['PREV_PBP_DESCRIPTION']=ordered.groupby(core.POSSESSION_ID,dropna=False).DESCRIPTION.shift(1)
                  rb=ordered[ordered.DESCRIPTION.fillna('').str.contains('rebound',case=False)].copy()
                  rb['DESCRIPTION_NORM']=rb.DESCRIPTION.map(core.normalize_description)
                  rb['START_ELAPSED']=[core.elapsed_seconds(int(p),c) for p,c in zip(rb.PERIOD,rb.STARTTIME)]
                  rb['END_ELAPSED']=[core.elapsed_seconds(int(p),c) for p,c in zip(rb.PERIOD,rb.ENDTIME)]
                  # Reproduce current match status to isolate only genuinely unmatched rows.
                  nbaev=lu.events.copy()
                  items=[]; claimed_new=set()
                  for ridx,row in rb.iterrows():
                      cand=nbaev[(nbaev.PERIOD.eq(row.PERIOD))&(nbaev.ELAPSED.gt(row.START_ELAPSED-5))&(nbaev.ELAPSED.lt(row.END_ELAPSED+5))]
                      scored=[(core._distance(row.DESCRIPTION_NORM,d),int(pos)) for pos,d in zip(cand.index,cand.DESCRIPTION_NORM)]
                      acceptable=[x for x in scored if x[0]<.2]
                      if acceptable: continue
                      rebnba=nbaev[(nbaev.PERIOD.eq(row.PERIOD))&nbaev.EVENTMSGTYPE.eq(4)].copy()
                      rebnba=rebnba[~rebnba.index.isin(used|claimed_new)]
                      exact=rebnba[rebnba.DESCRIPTION_NORM.eq(row.DESCRIPTION_NORM)]
                      method=None; chosen=None; candidate_count=0
                      if len(exact)==1:
                          method='UNIQUE_EXACT_DESCRIPTION'; chosen=int(exact.index[0]); candidate_count=1
                      else:
                          m=counter_re.search(row.DESCRIPTION_NORM); nk=namekey(row.DESCRIPTION_NORM)
                          if m:
                              o,d=m.groups(); key=f'(off:{o} def:{d})'
                              cmask=rebnba.DESCRIPTION_NORM.str.contains(re.escape(key),regex=True)&rebnba.DESCRIPTION_NORM.map(namekey).eq(nk)
                              counter=rebnba[cmask]
                              if len(counter)==1:
                                  method='UNIQUE_NAME_COUNTER'; chosen=int(counter.index[0]); candidate_count=1
                              else:
                                  candidate_count=len(counter)
                          elif len(exact)>1:
                              candidate_count=len(exact)
                      if chosen is not None: claimed_new.add(chosen)
                      items.append({'pbp_index':int(ridx),'period':int(row.PERIOD),'start_time':str(row.STARTTIME),'end_time':str(row.ENDTIME),'description':str(row.DESCRIPTION),'method':method,'nba_index':chosen,'nba_event_num':None if chosen is None else int(nbaev.loc[chosen,'EVENTNUM']),'nba_description':None if chosen is None else str(nbaev.loc[chosen,'DESCRIPTION_NORM']),'candidate_count':int(candidate_count)})
                  methods={}
                  for x in items: methods[x['method'] or 'UNRESOLVED']=methods.get(x['method'] or 'UNRESOLVED',0)+1
                  rec.update({'reported_unmatched':int(audit.get('unmatched_rebound_bearing_rows',0)),'diagnosed_unmatched_rows':len(items),'unique_identity_rows':sum(x['method'] is not None for x in items),'all_unmatched_uniquely_identified':bool(items and all(x['method'] is not None for x in items)),'method_counts':methods,'rows':items})
              except Exception as exc:
                  rec['diagnostic_error']=f'{type(exc).__name__}: {exc}'
              games.append(rec); print(f'UNMATCHED_ID year={year} {i}/{len(targets)} game={gid} unique={rec.get("unique_identity_rows")} total={rec.get("diagnosed_unmatched_rows")}',flush=True)
          out={'year':year,'target_games':len(targets),'games_all_unmatched_uniquely_identified':sum(bool(g.get('all_unmatched_uniquely_identified')) for g in games),'unique_identity_rows':sum(int(g.get('unique_identity_rows',0)) for g in games),'unmatched_rows':sum(int(g.get('diagnosed_unmatched_rows',0)) for g in games),'diagnostic_errors':sum('diagnostic_error' in g for g in games),'games':games}
          Path(f'/tmp/UNMATCHED_EXACT_IDENTITY_{year}.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps({k:v for k,v in out.items() if k!='games'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-unmatched-exact-identity-${{ matrix.year }}
          path: /tmp/UNMATCHED_EXACT_IDENTITY_${{ matrix.year }}.json
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: diagnose
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-unmatched-exact-identity-*
          path: /tmp/diag
          merge-multiple: true
      - name: Aggregate and persist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ss=[json.loads(p.read_text()) for p in sorted(Path('/tmp/diag').glob('UNMATCHED_EXACT_IDENTITY_*.json'))]
          out={'seasons_found':len(ss),'target_games':sum(x['target_games'] for x in ss),'games_all_unmatched_uniquely_identified':sum(x['games_all_unmatched_uniquely_identified'] for x in ss),'unique_identity_rows':sum(x['unique_identity_rows'] for x in ss),'unmatched_rows':sum(x['unmatched_rows'] for x in ss),'diagnostic_errors':sum(x['diagnostic_errors'] for x in ss),'season_summaries':[{k:v for k,v in x.items() if k!='games'} for x in ss]}
          out['status']='COMPLETE' if len(ss)==19 else 'INCOMPLETE_MATRIX'
          Path('/tmp/UNMATCHED_EXACT_IDENTITY_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BR=treb-unmatched-exact-identity-diagnostics; git checkout -B "$BR" "${{ github.sha }}"
          DEST=team_trb_all_players/final_integrity_rebuild/unmatched_exact_identity_diagnostics; rm -rf "$DEST"; mkdir -p "$DEST/seasons"
          cp /tmp/UNMATCHED_EXACT_IDENTITY_SUMMARY.json "$DEST"/; cp /tmp/diag/UNMATCHED_EXACT_IDENTITY_*.json "$DEST/seasons"/
          git add -f "$DEST"; git commit -m 'Persist unmatched rebound exact-identity diagnostics'; git push --force origin HEAD:"$BR"
      - uses: actions/upload-artifact@v4
        with:
          name: treb-unmatched-exact-identity-summary
          path: /tmp/UNMATCHED_EXACT_IDENTITY_SUMMARY.json
          retention-days: 90
