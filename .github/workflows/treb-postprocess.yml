name: TREB final database and visualization postprocess

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treb-postprocess
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out authoritative completed Stage2 state
        uses: actions/checkout@v4
        with:
          ref: treb-stage2-actions-live
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require exact completed Stage2 before post-processing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json')
          d=json.loads(p.read_text())
          total=int(d.get('impact_windows_total') or 0)
          complete=int(d.get('complete_windows') or 0)
          remaining=int(d.get('remaining_windows') or 0)
          failed=int(d.get('failed_windows') or 0)
          z=d.get('zero_minute_tail_report') or {}
          excluded=int(z.get('total_excluded_zero_minute_windows') or 0)
          original_total=total+excluded
          assert d.get('all_complete') is True, d
          assert complete == total and remaining == 0 and failed == 0, d
          assert excluded == 221 and original_total == 15427, d
          assert int(z.get('verified_positive_minute_windows') or 0) == 0, d
          assert int(z.get('indeterminate_windows') or 0) == 0, d
          print(f'POSTPROCESS_GATE material={complete}/{total} excluded_zero_minute={excluded} original={original_total} remaining={remaining} failed={failed}')
          PY

      - name: Install database and visualization dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow duckdb matplotlib pillow requests

      - name: Self-test all finalization and publication tooling
        run: |
          python team_trb_all_players/finalize_corrected_off_package_extended.py --self-test
          python team_trb_all_players/build_funakistats_visual_pack.py --self-test
          python team_trb_all_players/funakistats_headshots.py --self-test
          python team_trb_all_players/funakistats_publication_provenance.py --self-test
          python team_trb_all_players/finalize_funakistats_visual_pack.py --self-test

      - name: Build and validate final corrected database
        run: |
          python team_trb_all_players/finalize_corrected_off_package_extended.py
          test -s team_trb_all_players/impact_database/corrected_off/TREB_corrected_off_final.zip
          test -s team_trb_all_players/impact_database/corrected_off/final_export/player_season_corrected_on_off.parquet
          test -s team_trb_all_players/impact_database/corrected_off/final_export/career_total_rebound_pct.parquet
          test -s team_trb_all_players/impact_database/corrected_off/final_export/player_season_total_rebound_pct.parquet

      - name: Build agreed @funakistats visualization and ranking pack
        run: |
          python team_trb_all_players/build_funakistats_visual_pack.py \
            --minutes-threshold 10000 \
            --label-count 20
          test -s team_trb_all_players/impact_database/corrected_off/visual_pack/treb_career_impact_best_only_square.png
          test -s team_trb_all_players/impact_database/corrected_off/visual_pack/treb_career_impact_best_only_portrait.png
          test -s team_trb_all_players/impact_database/corrected_off/visual_pack/treb_career_impact_full_profile_square.png
          test -s team_trb_all_players/impact_database/corrected_off/visual_pack/treb_career_impact_full_profile_portrait.png
          test -s team_trb_all_players/impact_database/corrected_off/visual_pack/rankings/treb_top20_on_court.csv
          test -s team_trb_all_players/impact_database/corrected_off/visual_pack/rankings/treb_top20_corrected_swing.csv
          test -s team_trb_all_players/impact_database/corrected_off/visual_pack/rankings/all_metrics_top20_corrected_swing.csv.gz

      - name: Apply existing @funakistats publication provenance guard
        run: |
          set -euo pipefail
          root='team_trb_all_players/impact_database/corrected_off/visual_pack'
          for stem in \
            treb_career_impact_best_only_square \
            treb_career_impact_best_only_portrait \
            treb_career_impact_full_profile_square \
            treb_career_impact_full_profile_portrait
          do
            python team_trb_all_players/funakistats_publication_provenance.py \
              --png "$root/$stem.png" \
              --manifest "$root/${stem}_publication_provenance.json"
          done
          python team_trb_all_players/finalize_funakistats_visual_pack.py
          test -s "$root/X_READY"
          grep -q 'X_READY=1' "$root/X_READY"
          test -s team_trb_all_players/impact_database/corrected_off/project_completion_status.json

      - name: Upload complete database and visualization package
        uses: actions/upload-artifact@v4
        with:
          name: TREB-final-database-and-funakistats-visuals
          retention-days: 90
          compression-level: 0
          path: |
            team_trb_all_players/impact_database/corrected_off/TREB_corrected_off_final.zip
            team_trb_all_players/impact_database/corrected_off/final_export
            team_trb_all_players/impact_database/corrected_off/visual_pack
            team_trb_all_players/impact_database/corrected_off/project_completion_status.json

      - name: Commit durable final outputs and completion status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team_trb_all_players/impact_database/corrected_off
          while IFS= read -r -d '' f; do
            echo "Leaving >90MB file in Actions artifact rather than Git: $f"
            git reset -- "$f"
          done < <(find team_trb_all_players/impact_database/corrected_off -type f -size +90M -print0)
          if ! git diff --cached --quiet; then
            git commit -m 'Complete TREB database and @funakistats publication pack [skip ci]'
            git pull --rebase origin treb-stage2-actions-live
            git push origin HEAD:treb-stage2-actions-live
          fi
