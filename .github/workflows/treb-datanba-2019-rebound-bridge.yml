name: TREB data.nba 2019 rebound bridge

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-datanba-2019-rebound-bridge.yml
      - team_trb_all_players/validate_datanba_2019_rebound_bridge.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Download 2019 legacy and data.nba archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d2019
          for kind in nbastats datanba; do
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              -o "/tmp/d2019/${kind}_2019.tar.xz" \
              "https://github.com/shufinskiy/nba_data/raw/main/datasets/${kind}_2019.tar.xz"
            tar -xJf "/tmp/d2019/${kind}_2019.tar.xz" -C /tmp/d2019
          done
          test -s /tmp/d2019/nbastats_2019.csv
          test -s /tmp/d2019/datanba_2019.csv
      - name: Validate compact event rebound semantics
        run: |
          python -u team_trb_all_players/validate_datanba_2019_rebound_bridge.py \
            --legacy /tmp/d2019/nbastats_2019.csv \
            --datanba /tmp/d2019/datanba_2019.csv \
            --output /tmp/DATANBA_2019_REBOUND_BRIDGE_VALIDATION.json
      - name: Commit validation evidence durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          mkdir -p team_trb_all_players/final_integrity_rebuild
          cp /tmp/DATANBA_2019_REBOUND_BRIDGE_VALIDATION.json \
             team_trb_all_players/final_integrity_rebuild/DATANBA_2019_REBOUND_BRIDGE_VALIDATION.json
          git add team_trb_all_players/final_integrity_rebuild/DATANBA_2019_REBOUND_BRIDGE_VALIDATION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record data.nba 2019 rebound bridge validation"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
