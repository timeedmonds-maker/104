name: TREB V5 source only audit
on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths: [.github/workflows/treb-v5-source-only-audit.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  MANIFEST: team_trb_all_players/final_integrity_rebuild/rebound_forensics/CHUNKED_REBOUND_MANIFEST.json
  SOURCE_RUN_ID: '31634201123'
  PYTHONUNBUFFERED: '1'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {matrix: '${{ steps.p.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path(os.environ['MANIFEST']).read_text());assert len(m['chunks'])==24 and m['target_games']==58
          x={'include':[{'chunk_id':c['chunk_id'],'year':int(c['year']),'games':','.join(map(str,c['game_ids']))} for c in m['chunks']]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(x,separators=(',',':'))+'\n')
          PY
  audit:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy rapidfuzz
      - uses: actions/download-artifact@v4
        with:
          name: treb-residual-source-${{ matrix.year }}-${{ env.SOURCE_RUN_ID }}
          path: /tmp/source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - run: |
          python -u team_trb_all_players/rebound_v5_source_only_audit.py \
            --year '${{ matrix.year }}' --games '${{ matrix.games }}' --chunk-id '${{ matrix.chunk_id }}' \
            --nba '/tmp/source/nbastats_${{ matrix.year }}.csv' --v3 '/tmp/source/nbastatsv3_${{ matrix.year }}.csv' --pbp '/tmp/source/pbpstats_${{ matrix.year }}.csv' \
            --output '/tmp/V5_SOURCE_${{ matrix.chunk_id }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: treb-v5-source-${{ matrix.chunk_id }}-${{ github.run_id }}
          path: /tmp/V5_SOURCE_${{ matrix.chunk_id }}.json
          retention-days: 90
  aggregate:
    needs: [plan,audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-v5-source-*-${{ github.run_id }}
          path: /tmp/results
      - name: Aggregate and gate each strategy independently
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          ps=sorted(Path('/tmp/results').rglob('V5_SOURCE_*.json'));assert len(ps)==24,[str(p) for p in ps]
          xs=[json.loads(p.read_text()) for p in ps]
          lnames=list(xs[0]['lineup_controls']);rnames=list(xs[0]['live_controls'])
          def agg(section,names):
            return {s:{k:sum(int(x[section][s][k]) for x in xs) for k in ('applicable','correct','wrong')} for s in names}
          lc=agg('lineup_controls',lnames);rc=agg('live_controls',rnames)
          lsafe={s:(v['applicable']>0 and v['wrong']==0) for s,v in lc.items()};rsafe={s:(v['applicable']>0 and v['wrong']==0) for s,v in rc.items()}
          residual=[r for x in xs for r in x['residual_rows']];assert len(residual)==27,len(residual)
          lwrong={s:[r for x in xs for r in x['lineup_wrong_records'][s]] for s in lnames};rwrong={s:[r for x in xs for r in x['live_wrong_records'][s]] for s in rnames}
          candidates=[]
          for r in residual:
            safe_lineups=[]
            for s in lnames:
              p=r['lineup_predictions'].get(s)
              if lsafe[s] and p is not None:safe_lineups.append((s,tuple(int(v) for v in p)))
            lus={p for _,p in safe_lineups}
            safe_live=[s for s in rnames if rsafe[s] and r['live_predictions'].get(s) is True]
            if len(lus)==1 and safe_live:
              lu=next(iter(lus));candidates.append({**{k:r[k] for k in ('game_id','pbp_index','period','start_time','end_time','description','pbp_is_oreb','resolved_player_id')},'lineup':list(lu),'lineup_methods':[s for s,p in safe_lineups if p==lu],'live':True,'live_methods':safe_live})
          out={'status':'COMPLETE','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'purpose':'Validate lineup and live status only for the 27 V5 source-only rows. OREB/DREB remains PBP Stats authoritative. No repair promoted.','lineup_controls':lc,'lineup_safe':lsafe,'live_controls':rc,'live_safe':rsafe,'current_residual_rows':len(residual),'repair_candidate_rows':len(candidates),'candidate_game_ids':sorted({int(r['game_id']) for r in candidates}),'repair_candidates':candidates,'lineup_wrong_records':lwrong,'live_wrong_records':rwrong,'residual_rows':residual}
          Path('/tmp/V5_SOURCE_ONLY_SUMMARY.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps({k:v for k,v in out.items() if k not in {'repair_candidates','lineup_wrong_records','live_wrong_records','residual_rows'}},indent=2))
          PY
      - name: Persist with branch-race retry
        run: |
          set -euo pipefail;D=team_trb_all_players/final_integrity_rebuild/rebound_forensics
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5;do
            git fetch origin agent/treb-batched-game-facts-20260812;git reset --hard origin/agent/treb-batched-game-facts-20260812
            cp /tmp/V5_SOURCE_ONLY_SUMMARY.json "$D/";git add -f "$D/V5_SOURCE_ONLY_SUMMARY.json"
            if git diff --cached --quiet;then exit 0;fi
            git commit -m 'Persist V5 source-only lineup and live audit';if git push origin HEAD:agent/treb-batched-game-facts-20260812;then exit 0;fi;sleep $((attempt*2))
          done;exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: treb-v5-source-only-summary-${{ github.run_id }}
          path: /tmp/V5_SOURCE_ONLY_SUMMARY.json
          retention-days: 90
