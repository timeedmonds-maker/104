name: TREB full-core timeout retry

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-fullcore-timeout-retry.yml

permissions:
  contents: read
  actions: read

env:
  TARGETS: team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz

jobs:
  retry:
    name: exact full-core timeout retry ${{ matrix.year }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        # Only years whose prior fanout job was terminated by the 40-minute reconstruction-step timeout.
        year: [2000,2004,2005,2007,2008,2011,2012,2018,2020,2022,2024]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz
      - name: Reassert authoritative V2 invariants
        shell: bash
        run: |
          python - <<'PY'
          import gzip,json
          p='team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz'
          rows=[json.loads(x) for x in gzip.open(p,'rt') if x.strip()]
          keys={(str(r['season']),str(r['player_id']).removesuffix('.0'),int(r['team_id'])) for r in rows}
          full=[r for r in rows if bool(r.get('full_core_reuse'))]
          partial=[r for r in rows if not bool(r.get('full_core_reuse'))]
          assert len(rows)==14524 and len(keys)==14524
          assert len(full)==9647 and len(partial)==4877
          print('V2_INVARIANTS=PASS 14524/9647/4877')
          PY
      - name: Download retained historical sources
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          y='${{ matrix.year }}'; mkdir -p /tmp/src /tmp/out
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 2 --output /tmp/list_data.txt https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          python - "$y" <<'PY' > /tmp/urls.tsv
          import sys
          y=sys.argv[1]; vals={}
          for line in open('/tmp/list_data.txt',encoding='utf-8'):
              if '=' in line:
                  k,v=line.split('=',1); vals[k.strip()]=v.strip()
          for prefix in ('nbastats','nbastatsv3','pbpstats'):
              key=f'{prefix}_{y}'; assert key in vals,key
              print(prefix,vals[key],sep='\t')
          PY
          while IFS=$'\t' read -r prefix url; do
            arc="/tmp/src/${prefix}_${y}.tar.xz"
            curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 20 --output "$arc" "$url"
            tar -xJf "$arc" -C /tmp/src
          done < /tmp/urls.tsv
      - name: Reconstruct exact season with evidence-based timeout repair
        timeout-minutes: 58
        shell: bash
        run: |
          set -euo pipefail
          y='${{ matrix.year }}'
          python -u team_trb_all_players/rebuild_fullcore_treb_fanout.py \
            --year "$y" --targets "$TARGETS" \
            --nba "/tmp/src/nbastats_${y}.csv" \
            --v3 "/tmp/src/nbastatsv3_${y}.csv" \
            --pbp "/tmp/src/pbpstats_${y}.csv" \
            --output-dir /tmp/out
      - name: Assert fail-closed semantics
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/out/season_gate.json')
          if p.exists():
              g=json.loads(p.read_text())
              assert g.get('rounded_percentage_backsolve_used') is False
              assert g.get('opponent_rebound_inference_used') is False
              assert g.get('whole_team_subtraction_across_partial_tenure_used') is False
              print(json.dumps(g,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-fullcore-timeout-retry-${{ matrix.year }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 90
          compression-level: 1
          if-no-files-found: warn
