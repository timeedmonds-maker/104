name: TREB current 2015 single-shard materiality

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-current-2015-materiality-shards.yml]

permissions:
  actions: read
  contents: read

concurrency:
  group: treb-current-2015-materiality-shards
  cancel-in-progress: false

env:
  CURRENT_ARTIFACT_ID: '9274527295'
  TENURE_ARTIFACT_ID: '9259414397'
  CONSENSUS_ARTIFACT_ID: '9252786257'
  PBP_ARTIFACT_ID: '9258020958'
  RECOVERED_OLD_ARTIFACT_ID: '9258644772'
  RECOVERED_MID_ARTIFACT_ID: '9260106595'
  RECOVERED_NEW_ARTIFACT_ID: '9260439871'

jobs:
  audit:
    name: 2015 materiality shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0,1,2,3,4]
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/treb-final-exact-assembly, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas numpy rapidfuzz
      - name: Download exact state and evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          for d in current shard tenure consensus pbp recovered_old recovered_mid recovered_new out; do mkdir -p /tmp/$d; done
          for spec in current:$CURRENT_ARTIFACT_ID tenure:$TENURE_ARTIFACT_ID consensus:$CONSENSUS_ARTIFACT_ID pbp:$PBP_ARTIFACT_ID recovered_old:$RECOVERED_OLD_ARTIFACT_ID recovered_mid:$RECOVERED_MID_ARTIFACT_ID recovered_new:$RECOVERED_NEW_ARTIFACT_ID; do
            d=${spec%%:*};a=${spec##*:};gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${a}/zip" >/tmp/$d.zip;unzip -q /tmp/$d.zip -d /tmp/$d
          done
          cp -a /tmp/current/. /tmp/shard/
      - name: Keep only this 2015 residual shard
        shell: bash
        run: |
          SHARD='${{ matrix.shard }}' python - <<'PY'
          import csv,os,pathlib
          p=next(pathlib.Path('/tmp/shard').rglob('AUTONOMOUS_BLOCKER_MANIFEST.csv'))
          rows=list(csv.DictReader(open(p,newline=''))); fields=list(rows[0])
          rows=[r for r in rows if str(r['season'])=='2015-16']
          rows=sorted(rows,key=lambda r:(int(float(r['team_id'])),int(float(r['player_id']))))
          s=int(os.environ['SHARD']); keep=[r for i,r in enumerate(rows) if i%5==s]
          with open(p,'w',newline='') as f:w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(keep)
          print('SHARD_KEYS',s,len(keep),[(r['team_id'],r['player_id']) for r in keep])
          PY
      - name: Download retained 2015 exact source feeds
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail; y=2015; mkdir -p /tmp/src
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/list_data.txt https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
          python - <<'PY' >/tmp/urls.tsv
          v={}
          for line in open('/tmp/list_data.txt'):
            if '=' in line:k,x=line.split('=',1);v[k.strip()]=x.strip()
          for p in ('nbastats','nbastatsv3','pbpstats'):print(p,v[f'{p}_2015'],sep='\t')
          PY
          while IFS=$'\t' read -r p url; do curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 -o /tmp/src/${p}_2015.tar.xz "$url"; tar -xJf /tmp/src/${p}_2015.tar.xz -C /tmp/src; done </tmp/urls.tsv
      - name: Enumerate shard fail closed
        timeout-minutes: 30
        shell: bash
        run: |
          PYTHONPATH=team_trb_all_players python -u team_trb_all_players/audit_current_residual_materiality_with_current_shared.py --year 2015 --current-dir /tmp/shard --tenure-dir /tmp/tenure --consensus-dir /tmp/consensus --pbp-dir /tmp/pbp --recovered-old-dir /tmp/recovered_old --recovered-mid-dir /tmp/recovered_mid --recovered-new-dir /tmp/recovered_new --targets team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz --ledger team_trb_all_players/impact_database/roster_tenure_v3/player_game_roster_ledger.csv.gz --nba /tmp/src/nbastats_2015.csv --v3 /tmp/src/nbastatsv3_2015.csv --pbp /tmp/src/pbpstats_2015.csv --threshold-pp 0.01 --minutes-gate-seconds 60 --max-enumeration-nodes 50000 --max-game-variants 10000 --max-key-states 500000 --output-dir /tmp/out
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'TREB-current-2015-materiality-${{ matrix.shard }}-${{ github.run_id }}', path: /tmp/out, retention-days: 90, compression-level: 1, if-no-files-found: warn}
