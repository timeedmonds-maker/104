name: TREB v14 full autonomous build

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: treb-v14-autovalidate-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - name: Check out authoritative TREB work branch
        uses: actions/checkout@v4
        with:
          ref: treb-laptop-run
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Stage 1 dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run v14 Stage 1 and continue automatically into Stage 2
        run: bash team_trb_all_players/run_treb_laptop_v14_fast.sh
      - name: Verify final corrected-OFF package
        run: |
          test -s team_trb_all_players/impact_database/corrected_off/TREB_corrected_off_final.zip
          echo "TREB_FINAL_PACKAGE_READY=1"
