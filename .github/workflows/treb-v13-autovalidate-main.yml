name: TREB v14 autonomous Stage1 validator

on:
  push:
    branches: [main]
    paths:
      - 'team_trb_all_players/treb_v13_autovalidate_trigger.txt'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: treb-v14-autovalidate-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out authoritative TREB work branch
        uses: actions/checkout@v4
        with:
          ref: treb-laptop-run
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Stage1 dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run v14 Stage1 exact-ready validation
        id: stage1
        continue-on-error: true
        env:
          TREB_STAGE1_ONLY: '1'
          TREB_NO_PUSH: '1'
        run: bash team_trb_all_players/run_treb_laptop_v14_fast.sh
      - name: Persist result to authoritative work branch
        if: always()
        env:
          OUTCOME: ${{ steps.stage1.outcome }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('team_trb_all_players/impact_database')
          rt=root/'roster_tenure'
          def load(path):
              try: return json.loads(path.read_text())
              except Exception: return {}
          consistency=load(rt/'tenure_consistency_summary.json')
          queue=load(rt/'tenure_review_queue_summary.json')
          checkpoint=load(root/'stage1_checkpoint_status.json')
          overlaps=consistency.get('strict_cross_team_overlap_count')
          review=(consistency.get('confidence_counts') or {}).get('review')
          exact=(overlaps == 0 and review == 0 and consistency.get('strict_same_team_overlap_count') == 0 and consistency.get('invalid_interval_count') == 0 and consistency.get('duplicate_window_count') == 0 and consistency.get('resolved_game_count_inconsistency_count') == 0 and consistency.get('remaining_same_day_unresolved_count',0) == 0 and bool(queue.get('stage1_exact_ready')) and int(queue.get('review_queue_windows') or 0) == 0)
          payload={
            'generated_utc': datetime.now(timezone.utc).isoformat(),
            'state': 'passed' if os.environ['OUTCOME']=='success' and exact else 'failed',
            'workflow_outcome': os.environ['OUTCOME'],
            'trigger_commit': os.environ['TESTED_SHA'],
            'strict_cross_team_overlap_count': overlaps,
            'strict_same_team_overlap_count': consistency.get('strict_same_team_overlap_count'),
            'review_windows': review,
            'invalid_interval_count': consistency.get('invalid_interval_count'),
            'duplicate_window_count': consistency.get('duplicate_window_count'),
            'resolved_game_count_inconsistency_count': consistency.get('resolved_game_count_inconsistency_count'),
            'remaining_same_day_unresolved_count': consistency.get('remaining_same_day_unresolved_count'),
            'review_queue_windows': queue.get('review_queue_windows'),
            'stage1_exact_ready': exact,
            'last_completed_phase': checkpoint.get('last_completed_phase'),
          }
          (root/'v14_stage1_validation_status.json').write_text(json.dumps(payload,indent=2))
          print(json.dumps(payload,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team_trb_all_players/impact_database/v14_stage1_validation_status.json team_trb_all_players/impact_database/stage1_checkpoint_status.json team_trb_all_players/impact_database/roster_tenure
          if ! git diff --cached --quiet; then
            git commit -m 'Record autonomous TREB v14 Stage1 validation [skip ci]'
            git pull --rebase origin treb-laptop-run
            git push origin HEAD:treb-laptop-run
          fi
      - name: Fail unless exact-ready
        if: steps.stage1.outcome != 'success'
        run: exit 1
