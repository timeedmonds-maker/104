name: TREB 2025-26 rebound semantic gate

on:
  push:
    branches: [treb-final-production-20260812]
    paths:
      - team_trb_all_players/validate_2025_rebound_semantics.py
      - .github/workflows/treb-2025-rebound-semantics.yml

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Download 2025 source pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/treb2025
          python - <<'PY'
          from pathlib import Path
          import subprocess, tarfile, urllib.request
          raw=Path('/tmp/treb2025')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          for key in ('nbastatsv3_2025','cdnnba_2025'):
              url=urls[key]
              arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Validate rebound semantics
        run: |
          python -u team_trb_all_players/validate_2025_rebound_semantics.py \
            --cdn /tmp/treb2025/cdnnba_2025.csv \
            --nba /tmp/treb2025/nbastatsv3_2025.csv \
            --output /tmp/treb2025/rebound_semantics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-2025-rebound-semantics-${{ github.sha }}
          path: /tmp/treb2025/rebound_semantics.json
          retention-days: 90
          if-no-files-found: warn
