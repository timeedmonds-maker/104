name: TREB salvage invariant team-total gate

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-team-invariant-gate-salvage.yml]

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: '31991529231'

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: 'TREB-team-invariant-*-31991529231'
          path: /tmp/seasons
          merge-multiple: false
          run-id: '31991529231'
          github-token: '${{ github.token }}'
      - name: Apply zero-mismatch gate robustly
        shell: bash
        run: |
          mkdir -p /tmp/final
          python - <<'PY'
          import pandas as pd,pathlib,json,gzip,csv
          from pandas.errors import EmptyDataError
          R=pathlib.Path('/tmp/seasons');O=pathlib.Path('/tmp/final')
          def read_nonempty(pattern):
            out=[]
            for p in R.rglob(pattern):
              if p.stat().st_size==0: continue
              try:
                d=pd.read_csv(p,low_memory=False)
              except EmptyDataError:
                continue
              if len(d): out.append(d)
            return out
          cps=read_nonempty('TEAM_INVARIANT_CONTROLS.csv');controls=pd.concat(cps,ignore_index=True,sort=False) if cps else pd.DataFrame()
          if len(controls):
            cflag=controls['computed'].astype(str).str.lower().isin(['true','1']);computed=controls[cflag].copy();mflag=computed['match'].astype(str).str.lower().isin(['true','1']);mism=computed[~mflag].copy()
          else: computed=controls.copy();mism=controls.copy()
          tps=read_nonempty('TEAM_INVARIANT_TARGET_CANDIDATES.csv');targets=pd.concat(tps,ignore_index=True,sort=False) if tps else pd.DataFrame(columns=['season','game_id','team_id','team_oreb','team_dreb','opponent_oreb','opponent_dreb','provenance'])
          before=len(targets);gate_pass=len(computed)>=50 and len(mism)==0
          if not gate_pass: targets=targets.iloc[0:0].copy()
          if len(targets):
            targets['game_id']=targets.game_id.astype(str).str.replace(r'\.0$','',regex=True).str.zfill(10);targets['team_id']=pd.to_numeric(targets.team_id,errors='raise').astype('int64').astype(str)
            for _,g in targets.groupby(['game_id','team_id']):
              if len(g[['team_oreb','team_dreb','opponent_oreb','opponent_dreb']].drop_duplicates())!=1: raise SystemExit('CONFLICT_TARGET_CANDIDATE')
            targets=targets.drop_duplicates(['game_id','team_id'])
          fields=['season','game_id','team_id','team_oreb','team_dreb','opponent_oreb','opponent_dreb','provenance']
          with gzip.open(O/'RECOVERED_RESIDUAL_SHARED_TEAM_GAME_PRIMITIVES.csv.gz','wt',encoding='utf-8',newline='') as f:w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(targets[fields].to_dict('records'))
          controls.to_csv(O/'TEAM_INVARIANT_ALL_CONTROLS.csv',index=False);mism.to_csv(O/'TEAM_INVARIANT_MISMATCHES.csv',index=False)
          qa={'status':'PASS' if gate_pass else 'FAIL_CLOSED','minimum_computed_controls':50,'computed_exact_controls':int(len(computed)),'control_mismatches':int(len(mism)),'candidate_team_facts_before_gate':int(before),'promoted_team_facts_after_gate':int(len(targets)),'integrity':{'zero_control_mismatches_required':True,'lineup_reconstruction_used':False,'event_identity_inference_used':False,'opponent_rebound_inference_used':False,'empirical_model_used':False,'rounded_percentage_backsolve_used':False}}
          (O/'TEAM_INVARIANT_GLOBAL_GATE.json').write_text(json.dumps(qa,indent=2)+'\n');print(json.dumps(qa,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'TREB-team-invariant-gated-salvage-${{ github.run_id }}', path: /tmp/final, retention-days: 90, compression-level: 1, if-no-files-found: error}
