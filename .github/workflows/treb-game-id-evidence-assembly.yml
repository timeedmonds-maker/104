name: TREB game ID evidence assembly

on:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths:
      - .github/workflows/treb-game-id-evidence-assembly.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas requests
      - name: Assemble game-ID evidence bundles from authoritative blockers and retained artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/game_evidence/artifacts /tmp/game_evidence/out
          python - <<'PY'
          import json, os, io, zipfile, urllib.request, re
          from pathlib import Path
          import pandas as pd

          repo='timeedmonds-maker/104'
          tok=os.environ['GH_TOKEN']
          base=f'https://api.github.com/repos/{repo}'
          hdr={'Authorization':f'Bearer {tok}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'treb-game-evidence'}
          AUTHORITATIVE_BLOCKER_ARTIFACT=9249887970

          def api(path):
              req=urllib.request.Request(base+path,headers=hdr)
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          def getbytes(url):
              req=urllib.request.Request(url,headers=hdr)
              with urllib.request.urlopen(req,timeout=180) as r:return r.read()
          def extract_artifact(aid,name=''):
              b=getbytes(base+f'/actions/artifacts/{aid}/zip')
              z=zipfile.ZipFile(io.BytesIO(b))
              d=Path('/tmp/game_evidence/artifacts')/str(aid)
              d.mkdir(parents=True,exist_ok=True)
              z.extractall(d)
              return {'id':aid,'name':name,'dir':str(d),'files':z.namelist()}

          # Seed from the exact retained V3 blocker artifact. No heuristic discovery.
          seed=extract_artifact(AUTHORITATIVE_BLOCKER_ARTIFACT,'TREB-autonomous-residual-v3-blockers-31895030855')
          blocker_path=Path(seed['dir'])/'AUTONOMOUS_BLOCKER_MANIFEST.csv'
          if not blocker_path.exists():
              raise SystemExit(f'Authoritative blocker manifest missing from artifact {AUTHORITATIVE_BLOCKER_ARTIFACT}')
          block=pd.read_csv(blocker_path,dtype=str,low_memory=False)
          cols={str(c).strip().lower():c for c in block.columns}
          if not {'season','team_id','player_id'}.issubset(cols):
              raise SystemExit(f'Authoritative blocker schema unexpected: {list(block.columns)}')
          block=block[[cols['season'],cols['team_id'],cols['player_id']]].copy()
          block.columns=['season','team_id','player_id']
          block=block.drop_duplicates()
          if len(block)!=1252:
              raise SystemExit(f'Fail closed: authoritative blocker key count {len(block)} != 1252')

          # Download broad retained evidence universe, always preserving the authoritative seed.
          arts=[]
          for page in range(1,31):
              xs=api(f'/actions/artifacts?per_page=100&page={page}').get('artifacts',[])
              if not xs: break
              arts.extend([a for a in xs if not a.get('expired')])
          candidate=[a for a in arts if a['id']!=AUTHORITATIVE_BLOCKER_ARTIFACT and any(k in a.get('name','').lower() for k in ['fullcore','exact','histor','materiality','pbp','nba','v3','treb','source','rebound','lineup','residual'])]
          chosen=sorted(candidate,key=lambda x:x.get('created_at',''),reverse=True)[:260]
          extracted=[seed]
          for a in chosen:
              try: extracted.append(extract_artifact(a['id'],a.get('name','')))
              except Exception as e: extracted.append({'id':a['id'],'name':a.get('name',''),'error':repr(e)})

          # Inspect retained tabular facts and map exact game IDs to blocker keys whenever schemas permit.
          fact_files=[]
          file_frames={}
          game_ids=set()
          key_games={}
          blocker_keys=set(map(tuple,block[['season','team_id','player_id']].astype(str).itertuples(index=False,name=None)))

          def norm_season(v):
              s=str(v).strip()
              if re.fullmatch(r'\d{4}',s): return s
              return s

          def inspect_df(fp,df):
              cmap={str(c).strip().lower():c for c in df.columns}
              gid_col=next((cmap[x] for x in ['game_id','gameid'] if x in cmap),None)
              if gid_col is None:return
              vals=pd.to_numeric(df[gid_col],errors='coerce').dropna().astype('int64').unique().tolist()
              if not vals:return
              game_ids.update(int(x) for x in vals)
              rec={'file':str(fp),'rows':int(len(df)),'game_id_col':gid_col,'game_count':len(vals),'columns':list(df.columns)[:120]}
              fact_files.append(rec)
              file_frames[str(fp)]=(df,cmap,gid_col)

              # Strongest join: season+team+player+game all explicit.
              if {'season','team_id','player_id'}.issubset(cmap):
                  sub=df[[cmap['season'],cmap['team_id'],cmap['player_id'],gid_col]].copy()
                  sub.columns=['season','team_id','player_id','game_id']
                  sub=sub.dropna(subset=['game_id'])
                  sub['game_id']=pd.to_numeric(sub['game_id'],errors='coerce')
                  sub=sub.dropna(subset=['game_id'])
                  for r in sub.itertuples(index=False):
                      k=(str(r.season),str(r.team_id),str(r.player_id))
                      if k in blocker_keys:key_games.setdefault(k,set()).add(int(r.game_id))

          for root in Path('/tmp/game_evidence/artifacts').glob('*'):
              for fp in root.rglob('*'):
                  if not fp.is_file(): continue
                  try:
                      n=fp.name.lower()
                      if n.endswith('.csv'):
                          inspect_df(fp,pd.read_csv(fp,dtype=str,low_memory=False))
                      elif n.endswith('.csv.gz'):
                          inspect_df(fp,pd.read_csv(fp,dtype=str,low_memory=False,compression='gzip'))
                      elif n.endswith('.jsonl'):
                          rows=[json.loads(x) for x in fp.read_text(errors='ignore').splitlines() if x.strip()]
                          if rows:inspect_df(fp,pd.DataFrame(rows))
                  except Exception: pass

          # Per-game evidence bundles across all retained files.
          bundles=[]
          for gid in sorted(game_ids):
              files=[]
              for f in fact_files:
                  df,cmap,gcol=file_frames[f['file']]
                  try:
                      mask=pd.to_numeric(df[gcol],errors='coerce').eq(gid)
                      if mask.any(): files.append({'file':f['file'],'matching_rows':int(mask.sum()),'columns':f['columns']})
                  except Exception: pass
              bundles.append({'game_id':gid,'evidence_file_count':len(files),'files':files})

          key_map=[]
          for r in block.itertuples(index=False):
              k=(str(r.season),str(r.team_id),str(r.player_id))
              gids=sorted(key_games.get(k,set()))
              key_map.append({'season':k[0],'team_id':k[1],'player_id':k[2],'game_ids':gids,'game_id_count':len(gids)})

          summary={
              'authoritative_blocker_artifact':AUTHORITATIVE_BLOCKER_ARTIFACT,
              'blocker_manifest':str(blocker_path),
              'blocker_keys':len(block),
              'blocker_seasons':sorted(block.season.astype(str).unique().tolist()),
              'downloaded_candidate_artifacts':len(chosen),
              'successfully_extracted_artifacts':sum('dir' in x for x in extracted),
              'game_fact_files':len(fact_files),
              'distinct_retained_game_ids':len(game_ids),
              'games_with_multi_file_evidence':sum(x['evidence_file_count']>=2 for x in bundles),
              'blocker_keys_with_explicit_game_id_links':sum(x['game_id_count']>0 for x in key_map),
              'distinct_game_ids_linked_to_blocker_keys':len({g for x in key_map for g in x['game_ids']})
          }
          out=Path('/tmp/game_evidence/out')
          (out/'GAME_ID_EVIDENCE_SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (out/'GAME_ID_EVIDENCE_BUNDLES.json').write_text(json.dumps(bundles,indent=2,sort_keys=True)+'\n')
          (out/'BLOCKER_KEY_GAME_MAP.json').write_text(json.dumps(key_map,indent=2,sort_keys=True)+'\n')
          (out/'DOWNLOADED_ARTIFACTS.json').write_text(json.dumps(extracted,indent=2,sort_keys=True)+'\n')
          block.to_csv(out/'BLOCKER_KEYS.csv',index=False)
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-game-id-evidence-${{ github.run_id }}
          path: /tmp/game_evidence/out
          retention-days: 90
          compression-level: 1
