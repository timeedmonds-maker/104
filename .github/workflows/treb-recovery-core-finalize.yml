name: TREB recovery - core final database

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/treb-recovery-core-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treb-recovery-core-finalize
  cancel-in-progress: false

jobs:
  core-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out completed Stage2 state
        uses: actions/checkout@v4
        with:
          ref: treb-stage2-actions-live
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch legacy-core validation to audit rather than discard corrected rows
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('team_trb_all_players/finalize_corrected_off_package.py')
          s = p.read_text()
          old = '''    missing_core = int(merged.core_on.isna().sum())\n    if missing_core:\n        raise RuntimeError(f"corrected rows missing matching original core ON values: {missing_core}")\n    single = merged[(merged.segment_count == 1) & merged.on.notna() & merged.core_on.notna()].copy()\n'''
          new = '''    # The completed tenure-corrected Stage2 rows are authoritative. The older full-season\n    # core is used only as an overlapping validation reference; some corrected tenure rows\n    # legitimately have no one-to-one legacy-core key. Preserve and audit those rows rather\n    # than discarding valid corrected data.\n    merged["legacy_core_match"] = merged.core_on.notna()\n    missing_core = int((~merged.legacy_core_match).sum())\n    single = merged[(merged.segment_count == 1) & merged.on.notna() & merged.core_on.notna()].copy()\n'''
          if old not in s:
              raise SystemExit('expected legacy-core validation block not found')
          p.write_text(s.replace(old, new, 1))
          print('PATCHED_LEGACY_CORE_VALIDATION=1')
          PY

      - name: Install core database dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow duckdb matplotlib pillow requests

      - name: Verify completed Stage2 gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('team_trb_all_players/impact_database/corrected_off/corrected_off_collection_summary.json').read_text())
          assert d.get('all_complete') is True, d
          assert int(d.get('complete_windows') or 0)==15206, d
          assert int(d.get('remaining_windows') or 0)==0, d
          assert int(d.get('failed_windows') or 0)==0, d
          print('STAGE2_GATE=PASS complete=15206 remaining=0')
          PY

      - name: Build corrected final database and career TREB tables
        run: |
          python team_trb_all_players/finalize_corrected_off_package_extended.py
          test -s team_trb_all_players/impact_database/corrected_off/TREB_corrected_off_final.zip
          test -s team_trb_all_players/impact_database/corrected_off/final_export/career_total_rebound_pct.parquet
          test -s team_trb_all_players/impact_database/corrected_off/final_export/player_season_total_rebound_pct.parquet
          echo CORE_FINAL_DATABASE_READY=1

      - name: Calculate Steven Adams exact career TREB result
        run: |
          python team_trb_all_players/query_steven_adams_treb.py
          test -s team_trb_all_players/impact_database/corrected_off/steven_adams_career_treb_query.json
          cat team_trb_all_players/impact_database/corrected_off/steven_adams_career_treb_query.json

      - name: Commit durable core outputs and validation patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team_trb_all_players/finalize_corrected_off_package.py
          git add team_trb_all_players/impact_database/corrected_off
          while IFS= read -r -d '' f; do
            echo "Leaving >90MB file out of Git: $f"
            git reset -- "$f"
          done < <(find team_trb_all_players/impact_database/corrected_off -type f -size +90M -print0)
          git commit -m 'Finalize TREB core database with audited legacy-core unmatched rows [skip ci]' || true
          git pull --rebase origin treb-stage2-actions-live
          git push origin HEAD:treb-stage2-actions-live
