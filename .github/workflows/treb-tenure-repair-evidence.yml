name: TREB targeted tenure repair evidence

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-tenure-repair-evidence.yml
      - team_trb_all_players/extract_tenure_repair_evidence.py
      - team_trb_all_players/final_integrity_rebuild/DEFINITE_TENURE_BOUNDARY_FAILURES.json
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Materialize authoritative solved-engine V2 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p team_trb_all_players/impact_database/roster_tenure_v2
          git show 0249c24df836f31931e955999b9b9f0eee3bb77f:team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz \
            > team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz
      - name: Download CC0 PlayerStatistics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cc0
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/cc0/dataset.zip 'https://www.kaggle.com/api/v1/datasets/download/eoinamoore/historical-nba-data-and-player-box-scores'
          unzip -j /tmp/cc0/dataset.zip 'PlayerStatistics.csv' -d /tmp/cc0 || unzip -j /tmp/cc0/dataset.zip '*/PlayerStatistics.csv' -d /tmp/cc0
      - name: Extract compact repair evidence
        shell: bash
        run: |
          set -o pipefail
          python -u team_trb_all_players/extract_tenure_repair_evidence.py \
            --playerstatistics /tmp/cc0/PlayerStatistics.csv \
            --output /tmp/TENURE_REPAIR_EVIDENCE.json 2>&1 | tee /tmp/tenure-evidence.log
      - name: Commit evidence durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          cp /tmp/TENURE_REPAIR_EVIDENCE.json team_trb_all_players/final_integrity_rebuild/TENURE_REPAIR_EVIDENCE.json
          git add team_trb_all_players/final_integrity_rebuild/TENURE_REPAIR_EVIDENCE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record evidence for 30 targeted tenure repairs"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
