name: TREB final integrity exclusion repair canary

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-final-integrity-exclusion-repair-canary.yml
      - team_trb_all_players/canary_v3_lineup_repair.py
      - team_trb_all_players/production_treb_engine_v3.py
      - team_trb_all_players/final_integrity_rebuild/EXCLUDED_GAME_REPAIR_TARGETS.json
      - team_trb_all_players/final_integrity_rebuild/legacy_starter_repair_evidence.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  canary:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: [2002, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Download source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trebraw
          python - <<'PY'
          import os, subprocess, tarfile, urllib.request
          from pathlib import Path
          year=int('${{ matrix.year }}')
          raw=Path('/tmp/trebraw')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          keys=[f'nbastats_{year}',f'nbastatsv3_{year}']
          if year>=2020: keys.append(f'cdnnba_{year}')
          for key in keys:
              url=urls[key]
              arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Run lineup recovery canary
        run: |
          python -u team_trb_all_players/canary_v3_lineup_repair.py \
            --year ${{ matrix.year }} \
            --raw /tmp/trebraw \
            --output /tmp/treb-canary-${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-final-integrity-canary-${{ matrix.year }}
          path: /tmp/treb-canary-${{ matrix.year }}.json
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: canary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-integrity-rebuild-20260812
          fetch-depth: 0
      - name: Download same-run canary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/treb-canaries
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --dir /tmp/treb-canaries
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('/tmp/treb-canaries').rglob('treb-canary-*.json'))
          years=[]; games=[]; counts={}
          for p in files:
              d=json.loads(p.read_text())
              years.append(d['year']); games.extend(d['games'])
              for k,v in d.get('status_counts',{}).items(): counts[k]=counts.get(k,0)+int(v)
          payload={
              'status':'CANARY_COMPLETE' if len(games)==40 else 'CANARY_INCOMPLETE',
              'years':sorted(years),
              'years_found':len(years),
              'games_expected':40,
              'games_found':len(games),
              'status_counts':counts,
              'games':sorted(games,key=lambda x:x['game_id']),
              'policy':'No game may remain excluded from final target windows. FAIL/V3_ONLY_REQUIRED/SOURCE_MISSING rows remain blockers.'
          }
          out=Path('/tmp/EXCLUDED_GAME_REPAIR_CANARY_RESULT.json')
          out.write_text(json.dumps(payload,indent=2,default=str)+'\n')
          print(json.dumps({k:v for k,v in payload.items() if k!='games'},indent=2))
          PY
      - name: Commit aggregate result durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          cp /tmp/EXCLUDED_GAME_REPAIR_CANARY_RESULT.json team_trb_all_players/final_integrity_rebuild/EXCLUDED_GAME_REPAIR_CANARY_RESULT.json
          git add team_trb_all_players/final_integrity_rebuild/EXCLUDED_GAME_REPAIR_CANARY_RESULT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record 40-game exclusion repair canary result"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
