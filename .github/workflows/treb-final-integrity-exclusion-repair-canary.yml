name: TREB final integrity exclusion repair canary

on:
  push:
    branches: [agent/treb-final-integrity-rebuild-20260812]
    paths:
      - .github/workflows/treb-final-integrity-exclusion-repair-canary.yml
      - team_trb_all_players/canary_v3_lineup_repair.py
      - team_trb_all_players/production_treb_engine_v3.py
      - team_trb_all_players/final_integrity_rebuild/EXCLUDED_GAME_REPAIR_TARGETS.json
      - team_trb_all_players/final_integrity_rebuild/legacy_starter_repair_evidence.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: treb-final-integrity-exclusion-repair-canary
  cancel-in-progress: true

jobs:
  canary:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: [2002, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy rapidfuzz
      - name: Download source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trebraw
          python - <<'PY'
          import subprocess, tarfile, urllib.request
          from pathlib import Path
          year=int('${{ matrix.year }}')
          raw=Path('/tmp/trebraw')
          text=urllib.request.urlopen('https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt').read().decode()
          urls={line.split('=',1)[0].strip():line.split('=',1)[1].strip() for line in text.splitlines() if '=' in line}
          keys=[f'nbastats_{year}',f'nbastatsv3_{year}']
          if year>=2020: keys.append(f'cdnnba_{year}')
          for key in keys:
              url=urls[key]
              arc=raw/url.rsplit('/',1)[-1]
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-all-errors','--retry-delay','2','--output',str(arc),url],check=True)
              with tarfile.open(arc,'r:xz') as tf: tf.extractall(raw)
          PY
      - name: Run lineup recovery canary
        run: |
          python -u team_trb_all_players/canary_v3_lineup_repair.py \
            --year ${{ matrix.year }} \
            --raw /tmp/trebraw \
            --output /tmp/treb-canary-${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treb-final-integrity-canary-${{ matrix.year }}
          path: /tmp/treb-canary-${{ matrix.year }}.json
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: canary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: treb-final-integrity-canary-*
          path: /tmp/canaries
          merge-multiple: true
      - name: Aggregate canary evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('/tmp/canaries').glob('treb-canary-*.json'))
          payload={'source_files':[p.name for p in files],'games':[],'status_counts':{},'repair_search_summary':{}}
          for p in files:
              d=json.loads(p.read_text())
              payload['games'].extend(d.get('games',[]))
          payload['games'].sort(key=lambda r:int(r['game_id']))
          for r in payload['games']:
              s=r.get('status','UNKNOWN')
              payload['status_counts'][s]=payload['status_counts'].get(s,0)+1
              search=r.get('repair_search')
              if isinstance(search,dict):
                  payload['repair_search_summary'][str(r['game_id'])]={
                      'method':search.get('method'),
                      'states_explored':search.get('states_explored'),
                      'full_game_solution_count':search.get('full_game_solution_count'),
                      'terminal_failure_count':search.get('terminal_failure_count'),
                      'search_complete':search.get('search_complete'),
                      'queue_remaining_at_stop':search.get('queue_remaining_at_stop'),
                  }
          Path('/tmp/EXCLUDED_GAME_REPAIR_CANARY_RESULT.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps({k:v for k,v in payload.items() if k!='games'},indent=2))
          PY
      - name: Commit aggregate result durably
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/treb-final-integrity-rebuild-20260812
          mkdir -p team_trb_all_players/final_integrity_rebuild
          cp /tmp/EXCLUDED_GAME_REPAIR_CANARY_RESULT.json \
             team_trb_all_players/final_integrity_rebuild/EXCLUDED_GAME_REPAIR_CANARY_RESULT.json
          git add team_trb_all_players/final_integrity_rebuild/EXCLUDED_GAME_REPAIR_CANARY_RESULT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record dynamic excluded-game repair canary"
          git push origin HEAD:agent/treb-final-integrity-rebuild-20260812
