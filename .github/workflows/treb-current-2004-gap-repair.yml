name: TREB current 2004 direct residual elimination

on:
  workflow_dispatch:
  push:
    branches: [agent/treb-final-exact-assembly]
    paths: [.github/workflows/treb-current-2004-gap-repair.yml]

permissions:
  actions: read
  contents: write

env:
  CURRENT_ARTIFACT_ID: '9275527991'
  TENURE_ARTIFACT_ID: '9259414397'
  CONSENSUS_ARTIFACT_ID: '9252786257'
  PBP_ARTIFACT_ID: '9258020958'
  RECOVERED_OLD_ARTIFACT_ID: '9258644772'
  RECOVERED_MID_ARTIFACT_ID: '9260106595'
  RECOVERED_NEW_ARTIFACT_ID: '9260439871'
  MATERIALITY_ARTIFACT_ID: '9262341403'
  MATERIALITY_2015_ARTIFACT_ID: '9267705324'
  STATIC_SHA: 'e829d4678be1e075f99e5d41a1c5f97089be446b'

jobs:
  eliminate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/treb-final-exact-assembly
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q pandas numpy rapidfuzz

      - name: Download controlling 563 checkpoint and retained exact layers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for d in current current_aug tenure consensus pbp recovered_old recovered_mid recovered_new materiality materiality2015 shared recovery out src; do mkdir -p /tmp/$d; done
          get(){
            local d="$1" a="$2" ok=0
            for n in 1 2 3 4 5; do
              rm -rf "/tmp/${d:?}"/* "/tmp/$d.zip"
              if curl --fail --location --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${a}/zip" -o "/tmp/$d.zip" \
                && unzip -tq "/tmp/$d.zip" >/dev/null 2>&1; then
                unzip -q "/tmp/$d.zip" -d "/tmp/$d"; ok=1; break
              fi
              sleep $((n*4))
            done
            test "$ok" -eq 1
          }
          get current "$CURRENT_ARTIFACT_ID"
          get tenure "$TENURE_ARTIFACT_ID"
          get consensus "$CONSENSUS_ARTIFACT_ID"
          get pbp "$PBP_ARTIFACT_ID"
          get recovered_old "$RECOVERED_OLD_ARTIFACT_ID"
          get recovered_mid "$RECOVERED_MID_ARTIFACT_ID"
          get recovered_new "$RECOVERED_NEW_ARTIFACT_ID"
          get materiality "$MATERIALITY_ARTIFACT_ID"
          get materiality2015 "$MATERIALITY_2015_ARTIFACT_ID"
          cp -a /tmp/current/. /tmp/current_aug/
          test "$(($(wc -l < "$(find /tmp/current -name AUTONOMOUS_BLOCKER_MANIFEST.csv -print -quit)")-1))" -eq 563
          find /tmp/current -type f \( -name 'RECOVERED_RESIDUAL_SHARED_TEAM_GAME_PRIMITIVES.csv.gz' -o -name 'RECOVERED_RESIDUAL_SHARED_PLAYER_GAME_PRIMITIVES.csv.gz' \) -exec cp {} /tmp/shared/ \;

      - name: Fetch pinned historical 2004 NBA and PBP archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nba_data
          git clone --filter=blob:none --no-checkout https://github.com/shufinskiy/nba_data.git /tmp/nba_data
          cd /tmp/nba_data
          git fetch --no-tags origin "$STATIC_SHA"
          for p in nbastats pbpstats; do
            git show "$STATIC_SHA:datasets/${p}_2004.tar.xz" > "/tmp/src/${p}_2004.tar.xz"
            test -s "/tmp/src/${p}_2004.tar.xz"
            tar -xJf "/tmp/src/${p}_2004.tar.xz" -C /tmp/src
          done
          test -s /tmp/src/nbastats_2004.csv
          test -s /tmp/src/pbpstats_2004.csv

      - name: Recover exact 2004 residual primitives
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=team_trb_all_players python -u team_trb_all_players/recover_residual_v2_unique_rebound_adjudication.py \
            --year 2004 \
            --current-dir /tmp/current \
            --materiality-dir /tmp/materiality \
            --materiality-2015-dir /tmp/materiality2015 \
            --nba /tmp/src/nbastats_2004.csv \
            --pbp /tmp/src/pbpstats_2004.csv \
            --timeout-seconds 180 \
            --output-dir /tmp/recovery
          cp /tmp/recovery/RECOVERED_RESIDUAL_SHARED_*_GAME_PRIMITIVES.csv.gz /tmp/shared/

      - name: Reclose current production residual immediately
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,pathlib
          C=pathlib.Path('/tmp/current_aug'); p=next(C.rglob('AUTONOMOUS_BLOCKER_MANIFEST.csv')); rows=list(csv.DictReader(open(p))); fields=list(rows[0]);
          def k(r): return (str(r['season']),str(int(float(r['team_id']))),str(r['player_id']).strip().removesuffix('.0'))
          seen={k(r) for r in rows}
          for root in [pathlib.Path('/tmp/materiality'),pathlib.Path('/tmp/materiality2015')]:
            for q in root.rglob('*MATERIALITY_ACCEPTED*.csv'):
              try:
                for r in csv.DictReader(open(q)):
                  if r.get('season') and r.get('team_id') and r.get('player_id') and k(r) not in seen:
                    x=k(r); rows.append({'season':x[0],'team_id':x[1],'player_id':x[2]}); seen.add(x)
              except Exception: pass
          with open(p,'w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          PYTHONPATH=team_trb_all_players python -u team_trb_all_players/reclose_residual_shared_games.py \
            --current-dir /tmp/current_aug \
            --tenure-dir /tmp/tenure \
            --consensus-dir /tmp/consensus \
            --pbp-dir /tmp/pbp \
            --recovered-old-dir /tmp/recovered_old \
            --recovered-mid-dir /tmp/recovered_mid \
            --recovered-new-dir /tmp/recovered_new \
            --shared-dir /tmp/shared \
            --materiality-dir /tmp/materiality \
            --materiality-2015-dir /tmp/materiality2015 \
            --targets team_trb_all_players/impact_database/roster_tenure_v2/player_team_season_targets.jsonl.gz \
            --ledger team_trb_all_players/impact_database/roster_tenure_v3/player_game_roster_ledger.csv.gz \
            --minutes-gate-seconds 60 \
            --output-dir /tmp/out
          python - <<'PY'
          import json,pathlib
          q=json.loads(next(pathlib.Path('/tmp/out').rglob('TREB_SHARED_GAME_RECLOSURE_QA.json')).read_text())
          print(json.dumps(q,indent=2))
          if q.get('status')!='PASS': raise SystemExit('reclosure QA failed')
          if int(q.get('ending_residual',999999)) >= 563: raise SystemExit('no production residual reduction')
          PY

      - name: Persist lower residual checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,pathlib
          S=pathlib.Path('/tmp/shared'); O=pathlib.Path('/tmp/out')
          for name,ks,vs in [
            ('RECOVERED_RESIDUAL_SHARED_TEAM_GAME_PRIMITIVES.csv.gz',['game_id','team_id'],['team_oreb','team_dreb','opponent_oreb','opponent_dreb']),
            ('RECOVERED_RESIDUAL_SHARED_PLAYER_GAME_PRIMITIVES.csv.gz',['game_id','team_id','player_id'],['seconds_on','team_oreb_on','team_dreb_on','opponent_oreb_on','opponent_dreb_on'])]:
            rows={}; fields=None
            for p in S.rglob(name):
              with gzip.open(p,'rt',encoding='utf-8',newline='') as f:
                rd=csv.DictReader(f); fields=fields or rd.fieldnames
                for r in rd:
                  q=tuple(str(r[z]).strip().removesuffix('.0') for z in ks); vals=tuple(float(r[z]) for z in vs)
                  if q in rows and tuple(float(rows[q][z]) for z in vs)!=vals: raise SystemExit(f'CONFLICT {name} {q}')
                  rows[q]=r
            with gzip.open(O/name,'wt',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows[q] for q in sorted(rows))
          PY
          DEST='team_trb_all_players/treb_recovery_inputs/direct_residual_reduction_2004'
          rm -rf "$DEST"; mkdir -p "$DEST"
          cp /tmp/out/TREB_SHARED_GAME_RECLOSURE_QA.json "$DEST/"
          cp /tmp/out/AUTONOMOUS_BLOCKER_MANIFEST.csv "$DEST/"
          cp /tmp/out/TREB_CUMULATIVE_EXACT_PROMOTED.csv "$DEST/"
          cp /tmp/out/RECOVERED_RESIDUAL_SHARED_PLAYER_GAME_PRIMITIVES.csv.gz "$DEST/"
          cp /tmp/out/RECOVERED_RESIDUAL_SHARED_TEAM_GAME_PRIMITIVES.csv.gz "$DEST/"
          cp /tmp/recovery/UNIQUE_REBOUND_ADJUDICATION_QA.json "$DEST/"
          cp /tmp/recovery/UNIQUE_REBOUND_ADJUDICATION_DIAGNOSTICS.csv "$DEST/"
          git config user.name 'TREB automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$DEST"
          git commit -m 'TREB: reduce residual with exact 2004 recovery'
          git pull --rebase origin agent/treb-final-exact-assembly
          git push origin HEAD:agent/treb-final-exact-assembly

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TREB-current-2004-direct-elimination-${{ github.run_id }}
          path: |
            /tmp/recovery
            /tmp/out
          retention-days: 90
          compression-level: 1
