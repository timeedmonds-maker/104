name: Team TREB self-start

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/team-treb-self-start.yml'
  repository_dispatch:
    types: [continue-team-treb-self-start]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

env:
  PYTHONUNBUFFERED: '1'
  STATUS_COMMENT_ID: '5161464311'

concurrency:
  group: team-treb-self-start-arm-v1
  cancel-in-progress: false

jobs:
  impact_core:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - name: Announce ownership
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const id = Number(process.env.STATUS_COMMENT_ID);
            const { data: c } = await github.rest.issues.getComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: id});
            const m = (c.body || '').match(/Core player\/team on-off layer:\s*\*\*(\d+)\/780\*\*/);
            const count = m ? m[1] : '279';
            const body = `**NBA historical player-impact database build**\n\nCore player/team on-off layer: **${count}/780** team-seasons.\n\nTeammate interaction layer: **disabled — not part of this build**.\n\nExecution: **GitHub Actions**. ARM hosted runner started. Updated: ${new Date().toISOString()}.`;
            await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: id, body});

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate collector
        run: |
          python -m py_compile \
            team_trb_all_players/impact_database_build.py \
            team_trb_all_players/impact_database_build_fixed.py \
            team_trb_all_players/impact_database_actions_chunk.py

      - name: Run bounded two-worker chunk
        id: chunk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMPACT_DB_CORE_WORKERS: '2'
          IMPACT_DB_CORE_COMMIT_EVERY: '6'
          IMPACT_DB_HEARTBEAT_SECONDS: '120'
          IMPACT_DB_WATCHDOG_SECONDS: '1200'
          IMPACT_DB_RUN_SECONDS: '15000'
          TEAM_TRB_STATUS_COMMENT_ID: '5161464311'
        run: |
          set +e
          python team_trb_all_players/impact_database_actions_chunk.py
          rc=$?
          echo "runner_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Push final checkpoints
        if: always()
        run: |
          set -euo pipefail
          git add -A -- team_trb_all_players/impact_database
          if ! git diff --cached --quiet; then git commit -m "Impact database progress: self-start checkpoint"; fi
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

      - name: Determine state
        id: state
        if: always()
        run: |
          count=$(python - <<'PY'
          import sys
          sys.path.insert(0, 'team_trb_all_players')
          import impact_database_build as base
          print(base.completed_count('core'))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ge 780 ]; then echo "complete=true" >> "$GITHUB_OUTPUT"; else echo "complete=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          CORE_COUNT: ${{ steps.state.outputs.count }}
          COMPLETE: ${{ steps.state.outputs.complete }}
          EXIT_CODE: ${{ steps.chunk.outputs.runner_exit_code }}
        with:
          github-token: ${{ github.token }}
          script: |
            const complete = process.env.COMPLETE === 'true';
            const tail = complete ? 'Core build complete.' : `Chunk ended with code ${process.env.EXIT_CODE || 'unknown'}; continuation queued.`;
            const body = `**NBA historical player-impact database build**\n\nCore player/team on-off layer: **${process.env.CORE_COUNT}/780** team-seasons.\n\nTeammate interaction layer: **disabled — not part of this build**.\n\nExecution: **GitHub Actions**. ${tail} Updated: ${new Date().toISOString()}.`;
            await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: Number(process.env.STATUS_COMMENT_ID), body});
            if (!complete) {
              await new Promise(r => setTimeout(r, 30000));
              await github.rest.repos.createDispatchEvent({owner: context.repo.owner, repo: context.repo.repo, event_type: 'continue-team-treb-self-start', client_payload: {previous_run_id: String(context.runId), core_complete: process.env.CORE_COUNT || 'unknown'}});
            }
