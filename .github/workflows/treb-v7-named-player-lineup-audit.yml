name: TREB V7 named-player lineup audit
on:
  push:
    branches: [agent/treb-batched-game-facts-20260812]
    paths: [.github/workflows/treb-v7-named-player-lineup-audit.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  MANIFEST: team_trb_all_players/final_integrity_rebuild/rebound_forensics/CHUNKED_REBOUND_MANIFEST.json
  SOURCE_RUN_ID: '31634201123'
  PYTHONUNBUFFERED: '1'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {matrix: '${{ steps.p.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path(os.environ['MANIFEST']).read_text());x={'include':[{'chunk_id':c['chunk_id'],'year':int(c['year']),'games':','.join(map(str,c['game_ids']))} for c in m['chunks']]};assert len(x['include'])==24
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(x,separators=(',',':'))+'\n')
          PY
  audit:
    needs: plan
    strategy: {fail-fast: false, max-parallel: 20, matrix: '${{ fromJSON(needs.plan.outputs.matrix) }}'}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy rapidfuzz
      - uses: actions/download-artifact@v4
        with: {name: 'treb-residual-source-${{ matrix.year }}-${{ env.SOURCE_RUN_ID }}', path: /tmp/source, github-token: '${{ github.token }}', run-id: '${{ env.SOURCE_RUN_ID }}'}
      - run: |
          python -u team_trb_all_players/rebound_v7_named_player_lineup_audit.py --year '${{ matrix.year }}' --games '${{ matrix.games }}' --chunk-id '${{ matrix.chunk_id }}' --nba '/tmp/source/nbastats_${{ matrix.year }}.csv' --v3 '/tmp/source/nbastatsv3_${{ matrix.year }}.csv' --pbp '/tmp/source/pbpstats_${{ matrix.year }}.csv' --output '/tmp/V7_${{ matrix.chunk_id }}.json'
      - uses: actions/upload-artifact@v4
        with: {name: 'treb-v7-${{ matrix.chunk_id }}-${{ github.run_id }}', path: '/tmp/V7_${{ matrix.chunk_id }}.json', retention-days: 90}
  aggregate:
    needs: [plan,audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: 'treb-v7-*-${{ github.run_id }}', path: /tmp/results}
      - run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          ps=sorted(Path('/tmp/results').rglob('V7_*.json'));assert len(ps)==24;xs=[json.loads(p.read_text()) for p in ps];ctl={k:sum(int(x['controls'][k]) for x in xs) for k in ('applicable','correct','wrong')};res=sum(int(x['current_v6_residual_rows']) for x in xs);cand=[r for x in xs for r in x['repair_candidates']];wrong=[r for x in xs for r in x['wrong_records']];assert res==20
          out={'status':'COMPLETE','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'method':'unique_interval_lineup_containing_resolved_named_rebounder','controls':ctl,'safe_rule':ctl['applicable']>0 and ctl['wrong']==0,'current_v6_residual_rows':res,'repair_candidate_rows':len(cand),'wrong_records':wrong,'repair_candidates':cand};Path('/tmp/V7_NAMED_PLAYER_LINEUP_AUDIT.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps({k:v for k,v in out.items() if k not in {'wrong_records','repair_candidates'}},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'treb-v7-named-player-lineup-audit-${{ github.run_id }}', path: /tmp/V7_NAMED_PLAYER_LINEUP_AUDIT.json, retention-days: 90}
      - name: Persist durable result
        run: |
          set -euo pipefail;D=team_trb_all_players/final_integrity_rebuild/rebound_forensics;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5;do git fetch origin agent/treb-batched-game-facts-20260812;git reset --hard origin/agent/treb-batched-game-facts-20260812;cp /tmp/V7_NAMED_PLAYER_LINEUP_AUDIT.json "$D/";git add -f "$D/V7_NAMED_PLAYER_LINEUP_AUDIT.json";if git diff --cached --quiet;then exit 0;fi;git commit -m 'Persist V7 named-player lineup audit';if git push origin HEAD:agent/treb-batched-game-facts-20260812;then exit 0;fi;sleep $((attempt*2));done;exit 1
